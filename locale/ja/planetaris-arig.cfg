[technology-description]
planet-discovery-arig=広大な砂漠が広がる灼熱の惑星です。価値のある資源は地下か砂の中にしかありません。絶え間ない砂嵐のためロボットは使い物にならず、地表の大部分は適切な基礎がなければ建設に向きません。（警告: この惑星では、研究するまで貨物の投下が封じられています。）
planetaris-cactus-wood=サボテンから木材を作ります。
planetaris-sand-sifting=アリグの砂をふるい分けて基本資源を得ます。
planetaris-raw-diamond-production=ダイヤモンド原石を圧縮で作れるようになります。
planetaris-compression=素材を圧縮して新しい素材を作ります。
planetaris-glass=ガラスを作れるようになります。
planetaris-heavy-glass=重ガラスを作れるようになります。
planetaris-cactus-plastic-production=アリグの自生植物からプラスチックを生産できるようになります。
planetaris-compression-science=圧縮についてさらに研究できるようになります。
planetaris-arig-rocket-part=アリグのロケットレシピを解放します。
planetaris-advanced-sand-sifting=方解石と、より多くの純粋な砂をふるい分けで得られるようになります。
planetaris-sandstone-foundation=アリグの砂の上に建設できるようになります。
planetaris-simulating-unit=シミュレーションユニットを作れるようになります。
planetaris-big-chest=アイテムと物流システムのための、より大きな保管庫です。
planetaris-Logistics-4=より速いベルトです。
planetaris-automation-4=より速い組立機です。
planetaris-arig-roboport=アリグに防塵ロボットステーションを建設できるようになります。
planetaris-advanced-solar-panel=通常のソーラーパネルの2倍の効率があります。
planetaris-supported-solar-panel=液体の上や不安定な地表に建設できるよう特化したソーラーパネルと小型電柱です。
planetaris-water-harvesting=大気中の水分から水を作り出せる機械です。
