[tips-and-tricks-item-description]
arig-briefing=[planet=arig]は、広大な砂漠が広がる灼熱の惑星です。価値のある資源は、地下か、[entity=offshore-pump]で汲み上げる[tile=arig-sand]の中にしかありません。絶え間ない砂嵐のため[entity=roboport]は使い物にならず、地表の大部分は[item=planetaris-sandstone-foundation]がなければ建設に向きません。\n基本資源は、[entity=planetaris-sifter]で[fluid=planetaris-sand]をふるい分けて得られます。\n不要なアイテムは、[tile=arig-sand]に直接入れて捨てられます。\nこの惑星では、適切な技術を研究するまで貨物の投下が封じられています（[item=construction-robot]を除く）。
arig-exploring=砂の上を歩くのはとても大変なことがあります。サボテンを食べると速く動けることを覚えておきましょう。ただし、トゲには気をつけてください。
rail-support-deep-sand= [technology=rail-support-foundations]を研究すると、[tile=arig-deep-sand]の上に線路支柱を建設できるようになります。

[factoriopedia-description]
condensing-cactus=\n[entity=planetaris-cactus-plant]を収穫すると、[fluid=water]が1500（毎秒115）凝縮されます。

