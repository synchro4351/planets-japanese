[technology-description]
s6x-voidcraft=エネルギーとちょっとした魔法を使って、無からアイテムを召喚します。あるいは十分に発達した科学技術かもしれませんが、本当のところは誰にもわかりません。
s6x-electric-voidworks=ヴォイドワークスで、電気エネルギーをヴォイドクラフトに使えるようになります。
s6x-void-science-pack=ヴォイドクラフトの技の研究ができるようになります。
s6x-esoteric-science-pack=ヴォイドクラフトのより深い神秘の研究ができるようになります。
s6x-celestial-science-pack=ヴォイドクラフトで宇宙の果てを探究できるようになります。
s6x-void-science-pack-vc=もちろん、ヴォイドクラフトそのものを使って、その本質をさらに掘り下げる実験を行うこともできます。
s6x-esoteric-science-pack-vc=ヴォイドクラフトそのものを使って、そのより深い神秘を研究します。
s6x-celestial-science-pack-vc=この高度な秘術学パックを召喚できるのは、最も強力なヴォイドクラフト施設だけです。
s6x-entropic-conjuration=ヴォイドクラフトに内在する混沌を利用して…何かを召喚します。
s6x-entropic-conjuration-adv=より強力な混沌の力を呼び出し、さらに珍しい物質を召喚します。
s6x-industrial-voidcraft=より安定した形のヴォイドクラフトで、さまざまな有用な工業製品を召喚します。
s6x-crystal-fabrication=人工のヴォイドの欠片を作る錬金術の工程と、ヴォイドからより確実に欠片を召喚する方法です。
s6x-voidgems=精製して凝縮したヴォイドの欠片です。
