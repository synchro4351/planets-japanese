[mod-setting-description]
s6x-voidcraft-science=サイエンスパックを直接ヴォイドクラフトできるようにします。
s6x-voidtronics-ratio=以前のバージョンの Voidcraft では28:1の比率でしたが、ゲームバランスのためには24:1のほうがよいと判断されました。
s6x-max-vc-coherence=以前のバージョンの Voidcraft では1レシピあたり1000のコヒーレンス注入液しか使えませんでしたが、新しいレシピの一部はそれ以上を必要とするため、上限を5000に引き上げました。ただし、これで工場が壊れてしまう場合は元に戻せます。
s6x-vc-recipe-signals=信号が大量に増えすぎないよう、Voidcraft が信号GUIに表示するレシピを制限します。
s6x-old-prismatic-carbonization=廃止された「プリズマ炭化」のレシピを復活させます。どうしても戻したい場合にどうぞ。
s6x-old-entropic-conjuration=以前のエントロピー召喚のレシピを復活させます。
s6x-old-void-rocket-parts=以前のヴォイドクラフトのロケット工学のレシピを復活させます。
s6x-old-prismorphing=Voidcraft 2.8 以前のプリズモーフィングのレシピを復活させます。
s6x-old-void-crystal=Voidcraft 2.10 以前のヴォイドの欠片のレシピを復活させます。
s6x-prismorph-in-chemical-plant=本来はプリズミキサーが必要な場合でも、化学プラントでプリズモーフィングできるようにします。
s6x-restore-prism-catalyze=プリズマ触媒作用を再び有効にします。プリズマ触媒作用は Space Age、Iridescent Industry、pHactorio を使っている場合は無効になり、将来のバージョンで廃止される予定です。
s6x-auto-module-categories=使用できるモジュールカテゴリの一覧を自動で生成して適用します。場合によってはMODの互換性が改善します。必要な場合のみ有効にしてください。
s6x-no-random-rune=速度と効率のルーンをヴォイドクラフトするときに、ランダムな副産物を出さないようにします。
s6x-voidworks-no-scrap=Voidcraft 2.0 以降、ヴォイドワークスのレシピはほかの多くのレシピと同じように廃材を出します。
s6x-no-voidcraft-in-space=宇宙でヴォイドクラフトの建物を建設できないようにします。Space Age でのみ有効です。Arcanyx を使っていてヴォイドクラフトがアルカニクスに限定されている場合は、そちらが優先されます。
s6x-no-resource-depletion=採掘機とポンプジャックが資源を枯渇させなくなります。地面から出てくるだけで、ほとんどヴォイドクラフトのようなものです。
s6x-wood-raw-fish=Space Age なしの場合と同じように、木材のヴォイドクラフトで生魚が出ることがあるようにします。
s6x-coh-catalyst-reliability=百分率で表します。100にすると必ず触媒が戻ってきます。以前のバージョンの Voidcraft はこの動作でした。
s6x-void-pure-reliability=百分率で表します。100にすると、ランダムな結果として破れたヴォイド小瓶ができることはなくなります。
s6x-primordial-voidforge-changes=原初のヴォイドフォージを、速度5でルーンを使える以前の構成に戻します。
s6x-orichalcum-fragments=Iridescent Industry や Scrappy Industry を使っていなくても、オリハルコンの破片を有効にします。
s6x-make-in-foundry=ヴォイドクラフト設備とルーンを鋳造炉で作れるようにします。
s6x-voidforge-simple=シンプルで安価なヴォイドクラフト設備であるヴォイド小屋を有効にします。以前は Void Block のワールドでしか使えませんでした。
s6x-void-beacon-support=ルーンに専用のヴォイドビーコンが必要か、通常のビーコンに入れられるか、ビーコンにまったく対応しないかを決めます。
s6x-vc-empowered-void-fuel=ヴォイド燃料の強力版である強化ヴォイド燃料を追加します。以前は Arcanyx の一部で、Arcanyx がないとあまり役に立ちません。
s6x-vc-petrochem-restore=ほかのヴォイドクラフトのレシピと比べてやや強すぎた、以前の石油化学のヴォイドクラフトのレシピを復活させます。
s6x-old-fulgoran-scrap=Scrappy Industry を使っていない場合のフルゴラの廃材のレシピを復活させます。Scrappy Industry がない場合、この設定は効果がありません。
s6x-vc-trigger-techs=鉱石のないマップで Voidcraft を使いたい場合のために、ウランの採掘を不要にします。
s6x-allow-all-productivity=材料を使わないヴォイドクラフトのレシピでも、生産性のルーンを使えるようにします。バランスが崩れる可能性があります。

