[item-description]
s6x-voidcraft-speed-module=ヴォイドワークスの速度を上げますが、消費電力が大幅に増えます。
s6x-voidcraft-eff-module=ヴォイドワークスの消費電力を減らします。
s6x-voidcraft-prod-module=ヴォイドクラフトの1サイクルあたりの製品を増やします。材料を使わないレシピでは役に立ちません。
s6x-dangerous-eggs=この卵はすでに孵化し始めています！
s6x-coherence-catalyst=使用後、コヒーレンス触媒は不活性になり、炉に入れて再活性化する必要があります。
s6x-coherence-catalyst-sa=使用後、コヒーレンス触媒は不活性になり、20秒間は再使用できません。
s6x-coherence-catalyst-expended=このコヒーレンス触媒は不活性になっています。炉に入れて再活性化する必要があります。
s6x-coherence-catalyst-expended-sa=このコヒーレンス触媒は不活性になっています。再び使えるようになるまで20秒かかります。
void-pure-container-full=このヴォイド小瓶には無形のヴォイドが入っています。すみやかに使用するか、安全に処分する必要があります。
void-pure-container-rupture=このヴォイド小瓶は破れていて、今にも爆発しそうです。安全に処分する必要があります。それも急いで！
gleba-wood=普通の木材と同じですが、グレバ産です。普通の木材に変わります。あまり深く考えないでください。

