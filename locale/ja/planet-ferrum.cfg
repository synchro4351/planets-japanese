[recipe-description]
ferrum-lubricant-pyrolysis=熱分解によって、潤滑油のような複雑な炭化水素を構成元素に分解できます。
ferrum-coal-agglomeration=基本的な炭素原子を、より複雑な化合物に再び結合させます。
ferrum-rare-earth-separation=溶液を循環させ、含まれていたものを少しずつ取り出します。
ferrum-solvent-extraction=無駄は多いですが、粘土のレアアース成分の大半を1サイクルで回収します。
ferrum-lubricant-reclamation=潤滑油を構成要素の酸と油に分離します。
ferrum-atmospheric-condensation=フェルムの死んだ大気から水と溶存塩を絞り出します。
ferrum-holmium-separation=溶液にしてしまえば、ホルミウムもほかのレアアースと変わりません。
ferrum-rare-earth-micronutrients=レアアースは高濃度では生物に有毒ですが、少量なら植物の成長を促すのに役立ちます。
ferrum-copper-cementation=溶液中で鉄が銅に覆われながら固体の形を失い、まるで板が変成したかのように見えます。
ferrum-crude-agglomeration=触媒なしで炭素を結合させると、酸の大半が無駄になります。
ferrum-crude-molten-iron=燃料を燃やして板を溶かすこともできますが、代償を伴います。
ferrum-molten-iron=重油が熱を運び、わずかな炭素を残します。
