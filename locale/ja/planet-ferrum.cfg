ferrum-frame-ore=内部の動脈が破裂し、ロボットフレームが採掘できるほど密に積み重なったものです。
ferrum-gear-ore=内部の動脈が破裂し、鉄の歯車が採掘できるほど密に積み重なったものです。
ferrum-clay-ore=大気中のイオンによって長い年月をかけて惑星の地表に錆びついた、レアアースを豊富に含む堆積物です。
ferrum-lubricant=内部の潤滑油の動脈が破裂し、フェルムの地表に漏れ出しています。
