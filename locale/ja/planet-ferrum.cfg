[item-description]
ferrum-clay=イオン吸着型粘土の浸出は、レアアース金属の最も一般的な出発点のひとつです。
ferrum-concentrated-clay=粉砕、研削、電磁分離を組み合わせて、粘土のレアアース濃度を大幅に高めたものです。
ferrum-rare-earth-oxide=レアアースの溶液を数百段の沈殿工程で個々の元素に分離し、有用な高純度酸化物にしたものです。
ferrum-rare-earth-magnet=ついにレアアース酸化物を合金にして、さまざまな民生用途に適した強力な磁石を作れるようになりました。
ferrum-robotics-science-pack=研究所で研究に使います。
ferrum-fabricator=ロボットステーションを内蔵した実験的な組立機です。ドッキングしたロボットを活用して自身の能力を高められます。
ferrum-infuser=実験的な高圧含浸室です。ベルトで通過する固体アイテムに液体をすばやく反応させます。
ferrum-overclock-robot=実験的な物流ロボットです。ロボットステーションを離れるとき、周囲のビーコンネットワークに電磁波を放ち、一時的にその効果を増幅します。
