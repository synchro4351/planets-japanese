[technology-description]
planet-discovery-ferrum=フェルムの現在の軌道を突き止めます。
ferrum-contact=フェルムの地表との接続を確立します。
ferrum-fabricator=レアアースの処理には、高い適応性と精度が求められます。
ferrum-lubricant-reclamation=複雑な化学物質は、基本的な構成要素に分解できます。
ferrum-hydrocarbons=基本的な炭化水素を操作し、抽出し、組み合わせる方法です。
ferrum-rare-earth-processing=レアアース金属の生産を完成させるために必要な技術革新です。
ferrum-electrolysis=フェルムを居住可能にしているのと同じ大気中のイオンが、電解質の貴重な供給源になるかもしれません。
ferrum-robotics-science-pack=惑星は死んでいますが、フェルムのロボットから学べることはたくさんあります。
ferrum-frontline-robotics=ロボットは、飛び込んでいく炎の中で生き延びる必要があります。
ferrum-overclock-robots=発進時に近くのビーコンをオーバークロックする実験的なロボットです。
ferrum-deionizing-belts=フェルムの帯電した塵からベルトを守り、地表に建設できるようにします。
ferrum-advanced-rare-earth-processing=レアアース金属の最適化によって、フェルムでもほかの場所でも生産を強化できます。
ferrum-adaptive-chemistry=最初のファブリケーターが、地表で無人の化学処理を行えることを証明します。
ferrum-infusion-chemistry=ベルトの上で反応を起こせるようになります。
