rabbasca-underground-briefing=__ENTITY__rabbasca-warp-stabilizer__の概要
rabbasca-underground-automation=地下の自動化
rabbasca-manifest-anomaly=アノマリーの実体化
rabbasca-upgrade-placements=安定装置のアップグレードの配置
rabbasca-fuel-management=燃料の管理

[tips-and-tricks-item-description]
rabbasca-underground-briefing=ラバスカのアーカイブには、ワープ技術の実現に役立つ[space-location=rabbasca-underground]の情報が収められています。[entity=rabbasca-warp-stabilizer]は[entity=rabbasca-warp-anomaly]を除去するため、頻繁に場所を移ります。これらの場所を自分で訪れることはできず、宇宙プラットフォームによる補給もできませんが、[recipe=rabbasca-locate-stabilizer]で位置を特定すれば、[entity=rabbasca-warp-pylon]による遠隔管理が可能になります。\n\n工場は[tile=rabbasca-underground-rubble-powered]の上に集中して建てましょう。安定装置が場所を移ると、その外にあるものはすべて置き去りになります（例外: 一部がはみ出した[entity=offshore-pump]）。\nこの床は[item=harene-ears-core]を備えた機械にも適しており、発電用の資源が手に入るまでのつなぎになります。さらに研究しない限り、採掘可能な資源は安全圏の外にしか出現しないため、採掘拠点を積極的に管理する必要があります。\n場所ごとに大気が異なり、気体や液体を無限に得られます。どれが得られるかは、現在の惑星に応じた特別な技術（例: [technology=rabbasca-stabilizer-on-aquilo]）で示されます。\n\n安定装置は劣化しており、取り残されないよう積極的な保守が必要です。[item=rabbasca-powerspike]を解放して本来の性能に近づければ、最終的には[item=rabbasca-warpfield-science-pack]を生産する完全自動の地下工場も可能になります。\nもし取り残されてしまった場合は、[recipe=rabbasca-abandon-stabilizer]で安定装置を放棄すれば、新しい安定装置を探して一からやり直せます。ただし、その前に工場を安全な場所へワープさせておきましょう。
rabbasca-underground-automation=[entity=rabbasca-warp-stabilizer]は周囲の環境と安定化の進捗のデータを物流グループに出力し、[entity=constant-combinator]や物流チェストなどから参照できます。\n初期設定では、グループ名は「[item=rabbasca-warp-trace] Warpfield stabilizer readings」です。これにより、現在の地下の状態や、床が完全に安定してワープが安全かどうかに応じた細かな自動化ができます。\n\n出力される信号の一覧:\n- [任意の惑星の信号] = 現在訪れている惑星。数値は安定化の進捗（%）です。\n- [entity=rabbasca-warp-anomaly] = 採掘されずに残っているアノマリーの数（0なら安定化は100%）\n- [entity=rabbasca-stability-pylon] = 現在[tile=rabbasca-underground-rubble-powered]を供給して「いない」数\n- [item=rabbasca-warp-trace] = 安定装置の燃料バッファの充填率（%）\n- [item=rabbasca-powerspike] = この安定装置が生成した数\n- [item=rabbasca-progress-powerspike] = 次の[item=rabbasca-powerspike]が生成されるまでの残りの進捗\n- [recipe=rabbasca-hunt-relicaries] = 次のワープで[entity=rabbasca-relicary]を発見する確率（%）。この値は発見に成功したときにのみ減少します\n- [recipe=rabbasca-hunt-anomalies] = 次のワープでの[entity=rabbasca-warp-anomaly]の平均資源産出量（%）。ワープ後に100%に戻ります。
rabbasca-manifest-anomaly=[entity=rabbasca-warp-stabilizer]は[entity=rabbasca-warp-anomaly]を修復するため、場所から場所へワープします。どの場所でも新たなアノマリーが見つかります。\n\n場所が変わると、アノマリーは一定の確率で移動先固有の資源として実体化します。確率は、アノマリーに残っている資源の量と、現在の場所の安定度に比例します。\n\n安定化は[item=rabbasca-warp-anomaly]の量を減らすことで進むため、新しい資源を効率よく見つけるにはうまくバランスをとることが重要です。\n\n[recipe=rabbasca-amplify-anomaly]でも資源を実体化させられます。製作するたびに、製作機の位置にある仮想の[item=rabbasca-warp-anomaly]の量が1増えます。実体化の確率は[item=rabbasca-warp-anomaly]と同じように計算されますが、これは安定化の進捗に影響しないため、安定化100%のときに確率が常に最大になります。\n\n[color=yellow]例[/color]: [entity=rabbasca-warp-stabilizer]が[planet=fulgora]へワープします。そこでは[entity=rabbasca-holmium-ore]が基本確率[color=green]6%[/color]で実体化します。安定化は[color=yellow]75%[/color]です。\n 1) あるアノマリーには、採掘されていない[item=rabbasca-warp-anomaly]が[color=cyan]69[/color]残っています。\n    ワープ完了後、そのアノマリーが[entity=rabbasca-holmium-ore]の鉱床になる確率は[color=green]0.06[/color] * [color=cyan]69[/color] * [color=yellow]0.75[/color] = 310.5%（確定）です。この鉱床の資源量は[color=cyan]69[/color] * [color=yellow]0.75[/color]倍になります。\n 2) [entity=rabbasca-warp-pylon]がこの場所で[recipe=rabbasca-amplify-anomaly]を[color=cyan]14[/color]回製作しました。\n    ワープ完了後、その位置に[entity=rabbasca-holmium-ore]の鉱床が実体化する確率は[color=green]0.06[/color] * [color=cyan]14[/color] * [color=yellow]0.75[/color] = 63%です。この鉱床の資源量は[color=cyan]14[/color] * [color=yellow]0.75[/color]倍になります。
rabbasca-upgrade-placements=[entity=rabbasca-collector-pylon]と[entity=rabbasca-stability-pylon]は通常の建物と同じように設置します。一度設置すると解体できませんが、設置後に移動はできます。\n[entity=rabbasca-collector-pylon]は採掘するものがなくなると、自動で[entity=rabbasca-warp-anomaly]へ移動します。\n[entity=rabbasca-stability-pylon]は[recipe=rabbasca-relocate-floorthing]を製作すると、自身の[entity=entity-ghost]の位置へ移設されます。\n\nどちらの建物も[virtual-signal=rabbasca-warp-inventory]へ送れますが、[entity=rabbasca-warp-stabilizer]が破壊されると削除されるため、次の安定装置では使えません。
rabbasca-fuel-management=[item=rabbasca-warp-anomaly]は[entity=rabbasca-collector-pylon]によって[entity=rabbasca-anomaly-storage]に回収されます。これは[item=rabbasca-warp-cell]の主な動力源です。[item=rabbasca-warp-cell-recharging]を開いて接続先を割り当てると、[entity=rabbasca-warp-stabilizer]の燃料バッファを消費して充電されるようになります。\n稼働中の[item=rabbasca-warp-cell]が多いほど、[recipe=rabbasca-warp-trace]による燃料生産を追いつかせるために多くの[item=rabbasca-warp-anomaly]が必要になります。\n停電を防ぐには、燃料モードを[img=virtual-signal.signal-moon]に設定します。これにより[entity=rabbasca-warp-stabilizer]の燃料バッファから[item=rabbasca-warp-cell]への転送が一時停止します。\n各セルの腐敗バーは充電量を、耐久値バーは現在の接続先の燃料バッファを示します（バーが非表示: バッファは満タン）。

