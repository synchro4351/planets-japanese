[technology-description]
rabbasca-underground=古代の[entity=rabbasca-warp-stabilizer]を探し出して安定化の力を取り戻し、それを使ってラバスカの技術をさらに学びます。
rabbasca-archives=[entity=rabbasca-relicary]を探し出して知識を取り出します。何かに役立てられるかもしれません。
rabbasca-anomaly-studies-floor=[tile=rabbasca-underground-rubble-powered]の上に資源を実体化させ、ワープのたびに範囲を広げ直さなくても済むようにします。
rabbasca-ufo=[entity=rabbasca-ufo]の艦隊を編成し、どこからでも戦場へワープさせます。
rabbasca-ufo-control-groups=[entity=rabbasca-ufo]にコントロールグループを割り当て、艦隊を管理しやすくします。
rabbasca-knowledge-efficiency=パターンが見え始めました。意味がわかってきた...ような気がします。待って...今の聞こえましたか？\n\n（[recipe=rabbasca-restored-knowledge]の生産性の上限は非常に高いです）
rabbasca-insanity=混沌とした知識があなたの正気をむしばんでいます。現実ではないとわかっているものが見え始めました。それとも現実なのでしょうか？これを逆に利用できるかもしれません...
rabbasca-supercharged-module=[item=rabbasca-powerspike]を使って、とんでもなく強力なモジュールを作ります。
rabbasca-warp-trace-productivity=アノマリーの変換工程を改良します。生産性はレシピのすべての成果物に影響します。
rabbasca-inhibit-imagination=アイデアが多すぎて、大量の[item=rabbasca-imaginary-science-pack]を急いで処分したいときに...\n[img=virtual-signal.signal-alert] この研究は研究の生産性を「下げ」ます

