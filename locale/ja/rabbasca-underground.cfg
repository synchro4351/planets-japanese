[entity-description]
rabbasca-warp-stabilizer=ラバスカの工学の真の傑作です。[entity=rabbasca-warp-anomaly]を積極的に探し出して除去し、[item=rabbasca-warp-cell]の燃料に変換します。\nさまざまな惑星の核の近くで稼働し、地下工場を過酷な環境から守ります。
rabbasca-warp-anomaly=これを採掘するとワープフィールドの安定化が進みます。\n[entity=rabbasca-warp-stabilizer]が場所を移るとき、各アノマリーは低い確率で移動先固有の一時的な資源として実体化します（[tip=rabbasca-manifest-anomaly]を参照）。\nアノマリーは[tile=rabbasca-underground-rubble-powered]の上には出現しません。
rabbasca-relicary=過去の隠し倉庫で、強力な技術の解放に役立つ設計図が収められています。[item=rabbasca-powershard]と引き換えに、はるかに多くの設計図を取り出せます。[recipe=rabbasca-hunt-relicaries]で位置を特定する必要があります。
rabbasca-relicary-remote=最も近い[entity=rabbasca-relicary]に接続します。[tile=rabbasca-underground-rubble-powered]の安全圏から出ずに知識を集められます。
rabbasca-stability-pylon=床に[tile=rabbasca-underground-rubble-powered]を維持し、ほかの場所へワープできる範囲を広げます。稼働には[item=rabbasca-warp-cell]が必要です。\n製作していない間は耐久値が減り続け、最終的に1になります。耐久値が10を下回ると保守ができなくなり、床は[tile=rabbasca-underground-rubble]に戻ります。 \n\n[color=red][img=virtual-signal.signal-alert][tile=rabbasca-underground-rubble-powered]で完全に覆われていない建物は、ワープ時にすべて破壊されます！これには[entity=rabbasca-warp-stabilizer]や[entity=rabbasca-stability-pylon]自身も含まれます！[/color]
rabbasca-anomaly-storage=[entity=rabbasca-collector-pylon]は抽出した[item=rabbasca-warp-anomaly]をこのコンテナに保管します。
rabbasca-remote-access-chest=開発中です。近くのチェストや機械に向けると、そのインベントリにアクセスできます。
rabbasca-collector-pylon=[entity=rabbasca-warp-anomaly]を修復します。アノマリーの間を自動でワープして移動し、抽出した[item=rabbasca-warp-anomaly]を[entity=rabbasca-anomaly-storage]に保管します。
rabbasca-hellvent=脳を外注しましょう。アイデアがアイデアを生む、空想の再帰です。\n使わなければ失われます。

