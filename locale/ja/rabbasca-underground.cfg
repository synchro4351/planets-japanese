rabbasca-insanity-where-looking=有効: 精神錯乱の効果はプレイヤーが見ている場所で発生します。シングルプレイや身内のマルチプレイにおすすめです。\n\n無効: 精神錯乱の効果は影響を受けたキャラクターの近くでのみ発生します。荒らし行為に悪用されるおそれがあるため、大規模な公開サーバーにおすすめです。 \n\n（注: 精神錯乱の効果は、地下の契約書に署名したプレイヤーにのみ影響します）

