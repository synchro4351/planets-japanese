[item-description]
rabbasca-warp-cell=接続先の消費者へ継続的に電力を生み出します。発電量は鮮度に比例します。完全に腐敗すると接続が切れ、このセルは[item=rabbasca-warp-cell-recharging]に戻ります。\n\n鮮度の半分と引き換えに、いつでも再接続できます。鮮度は[entity=rabbasca-warp-stabilizer]の燃料バッファを消費して回復します。
rabbasca-warp-cell-recharging=消費者に接続すると[item=rabbasca-warp-cell]になります。このとき[entity=rabbasca-warp-stabilizer]の燃料を少し消費し、充電量（鮮度）が5%回復します。[entity=rabbasca-warp-stabilizer]に保管すると充電を維持できます。
rabbasca-warp-trace=局所的なワープフィールドの存在を示す、はかない兆候です。最大1スタックまで[entity=rabbasca-warp-stabilizer]内で停滞状態に保たれます。安定装置はこれを使って、内部に保管された[item=rabbasca-warp-cell]を自動で充電します。
rabbasca-powerspike=[entity=rabbasca-warp-stabilizer]のアップグレードに変えられる装置です。[recipe=rabbasca-warp-trace]の製作時に生成されます。新しいパワースパイクほど生成に時間がかかります。
rabbasca-powerspike-weak=この状態では使用できません。
rabbasca-obscure-theories=情報が混沌と入り乱れています。いたるところに数式が書きなぐられています。ある数式が何度も何度も出てきます。「[img=fluid.beta-carotene]=[img=virtual-signal.signal-heart]!」「[img=fluid.beta-carotene]=[img=virtual-signal.signal-heart]!」「[img=fluid.beta-carotene]=[img=virtual-signal.signal-heart]!!!」...\nあなたは呆然と見つめます。これに意味があるのか、それとも自分が少しずつ正気を失っているのか、わかりません...
rabbasca-restored-knowledge=ほんの一瞬、すべてが理解できたように思えます。しかし次の瞬間にはすべて消えてしまいます。これ以上この分野に深入りすべきではないと感じます...
rabbasca-sanity-loss=「これは貴重な知見だ。何がまずいっていうんだ？」
rabbasca-underground-worker-agreement=安全対策、警告、法の抜け穴がたくさん書かれています。\nこんな契約書は見たことがありませんが、[planet=rabbasca-underground]を見るには必要です。法律上のたわごとを飛ばすと、重要なのは以下の部分のようです。\n\n1) [planet=rabbasca-underground]は特別な取り扱いが必要です。便宜のため[tip=rabbasca-underground-briefing]を添付します。\n412) 電力が供給された[entity=rabbasca-stability-pylon]で覆われていない財産は、ワープ時に置き去りになることを了承します。\n691) 長期間不在にする場合、システムが完全に自立していない限り、すべての[item=rabbasca-warp-cell]を[img=virtual-signal.signal-moon]休止状態にすることが義務付けられます。\n708) [item=rabbasca-powerspike]を不適切に扱うと、安定装置が最適でない状態になりうることを了承します。\n1338) この契約書には、[planet=rabbasca-underground]の場所をすでに知っている場合のみ署名できます。インベントリから[color=yellow]返金不可の誠意の保証金として[item=rabbasca-warp-core]を1個[/color]いただきます。\n\n__CONTROL_LEFT_CLICK__ [shortcut=rabbasca-underground-worker-agreement]
rabbasca-rampant-imagination=奇妙な知識のせいで頭が痛みます。
rabbasca-psychosis=影の中に何かが潜んでいます。あなたには見えるのです...\n\n[entity=character]の精神をかき乱し、ときおり[item=rabbasca-rampant-imagination]を、おそらくほかのものも生み出します。

