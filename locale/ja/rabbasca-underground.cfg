[recipe-description]
rabbasca-locate-stabilizer=保管庫に[space-location=rabbasca-underground]を探させ、その近くに[entity=rabbasca-warp-pylon]を設置させます。何度か試す必要があるかもしれませんが、失敗した場合はパイロンが返却されます。\nすでに安定装置の位置が判明している場合、成功すると追加の[entity=rabbasca-warp-pylon]がその隣に設置されます。\n[color=#33aaff][img=virtual-signal.signal-info]このレシピは成功すると選択が解除されます。[/color]
rabbasca-amplify-anomaly=製作機の位置を不安定にし、その下に資源の鉱床が実体化する確率を上げます（[tip=rabbasca-manifest-anomaly]を参照）。これにより[tile=rabbasca-underground-rubble-powered]の上に資源を出現させ、恒久的な採掘場を作れます。
rabbasca-abandon-stabilizer=この安定装置を放棄します。安定装置の燃料が尽きた場合の最後の手段になるかもしれません。放棄したあとは[entity=rabbasca-vault-crafter]で新しい安定装置を発見できます。\n[color=red][img=virtual-signal.signal-alert] 安定装置の周囲にあるものは、工場も含めてすべて破壊されます！[/color]\n[color=#33aaff][img=virtual-signal.signal-info][entity=rabbasca-warp-stabilizer]は燃料切れでもレシピを製作できます[/color]
rabbasca-warp-cell=[color=#33aaff][img=virtual-signal.signal-info][entity=rabbasca-warp-stabilizer]で製作する場合、このレシピは燃料を消費しません。[/color]\n[color=#33aaff][img=virtual-signal.signal-info][entity=rabbasca-warp-stabilizer]のコントロールパネルで「燃料の合成」を有効にすると、燃料切れのときに自動でこのレシピに切り替わります。[/color]
rabbasca-stabilizer-warp-sequence=次の場所へワープし、[color=yellow][tile=rabbasca-underground-rubble-powered]の上にないものはすべて置き去りにします[/color]（例外: [entity=rabbasca-collector-pylon]）。残ったアノマリーは一定の確率で資源として実体化します。ワープ中は[item=rabbasca-warp-trace]の停滞状態が一時停止します。\n[color=#33aaff][img=virtual-signal.signal-info][entity=rabbasca-warp-stabilizer]が[tile=rabbasca-underground-rubble-powered]で完全に覆われていない場合、このレシピは製作されません[/color]\n[color=#33aaff][img=virtual-signal.signal-info][entity=rabbasca-warp-stabilizer]のコントロールパネルで「自動操縦」を有効にすると、安定化が100%に達したときに自動でこのレシピに切り替わります[/color]
rabbasca-floor-stability-work=耐久値の減少を防ぎます。
rabbasca-warp-cell-recharging=[color=#33aaff][img=virtual-signal.signal-info]これを製作すると、成果物は[entity=rabbasca-warp-stabilizer]のセル保管庫に直接入ります[/color]
rabbasca-stabilizer-recharge=このレシピの製作中、すべての[item=rabbasca-warp-cell-recharging]と[item=rabbasca-warp-cell]が安定装置の燃料インベントリへワープします。\n\n[color=#33aaff][img=virtual-signal.signal-info]このレシピの影響を受けなかったセルは、__CONTROL__open-item__で開いて登録し直す必要があります[/color]
rabbasca-underground=[entity=rabbasca-warp-stabilizer]を探し出し、ラバスカのワープ技術の秘密を解き明かします。
rabbasca-hunt-relicaries=今後のワープで[entity=rabbasca-relicary]を発見する確率を0.4%上げます。確率はワープをまたいで持ち越され、発見するとリセットされます。現在の確率は[entity=rabbasca-warp-stabilizer]または[entity=constant-combinator]の読み取り値で確認できます。
rabbasca-hunt-anomalies=次のワープで[entity=rabbasca-warp-anomaly]の資源産出量を3%増やします。ワープ後、産出量は100%に戻ります。次のワープの産出量は[entity=rabbasca-warp-stabilizer]または[entity=constant-combinator]の読み取り値で確認できます。
rabbasca-plastic-from-petroleum-gas=過酷な環境のおかげで、[item=coal]なしでプラスチックを作れます。
rabbasca-warpfield-science-pack-wi-download=この保管庫から、選択した品質の[item=rabbasca-warpfield-science-pack]を最大100個取り出します。取り出せる量は、以前に[recipe=rabbasca-warpfield-science-pack-wi-upload]でアップロードした量までです。
rabbasca-warpfield-science-pack-wi-upload=材料を[entity=rabbasca-vault-crafter]のネットワークへアップロードし、[recipe=rabbasca-warpfield-science-pack-wi-download]で取り出せるようにします。最低10個の材料が必要で、一度に最大100個までアップロードできます。
rabbasca-relocate-floorthing=[entity=rabbasca-stability-pylon]は解体できませんが、このレシピを製作すると[virtual-signal=signal-ghost][entity=rabbasca-stability-pylon]の位置へ移設しようとします。
rabbasca-summon-ufo=[entity=rabbasca-ufo]艦隊に支援を要請します。コントロールグループのないすべての[entity=rabbasca-ufo]が、どこからでも近くへワープしようとします。\nワープには燃料の50%を消費します。運転手が乗っている場合や、ワーポトロンのインベントリにアイテムがある場合はワープできません（武器に装填した弾薬は可）。
rabbasca-summon-ufo-with-filter=[entity=rabbasca-ufo]艦隊に支援を要請します。[item=__1__]内のいずれかの信号と一致するコントロールグループを持つすべての[entity=rabbasca-ufo]が、どこからでも近くへワープしようとします。\nワープには燃料の50%を消費します。運転手が乗っている場合や、ワーポトロンのインベントリにアイテムがある場合はワープできません（武器に装填した弾薬は可）。
rabbasca-powershard=[item=rabbasca-powerspike]を一時的に弱め、[entity=rabbasca-relicary]用の追加の燃料を得ます。
rabbasca-restored-knowledge-2=ラバスカの知識の危険を克服しました。慎重に読み解くと得られる成果は減りますが、精神への負担ははるかに軽くなります。
rabbasca-psychosis=[entity=character]が__ITEM__rabbasca-psychosis__の影響を受けている間だけ製作でき、成果物はその品質を引き継ぎます。\n__ITEM__rabbasca-psychosis__の影響を受けている間、[entity=character]は自動でこのレシピを製作キューに入れます。
rabbasca-hellvent=[entity=character]が__ITEM__rabbasca-psychosis__の影響を受けている間だけ製作でき、成果物はその品質を引き継ぎます。
rabbasca-hellvent-refreshing=__ENTITY__rabbasca-hellvent__を準備し、[recipe=rabbasca-contained-imagination-refresh]を1回製作できるようにします。
rabbasca-contained-imagination-refresh=アイデアをそこそこ新鮮に保ちます。\n[recipe=rabbasca-hellvent-refreshing]による準備が必要です。使用する[item=ice]の品質で、このレシピの品質が決まります。

