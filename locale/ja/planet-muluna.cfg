[entity-description]
muluna-telescope-combinator-no-quality=宇宙を見つめ、望遠鏡周辺の情報を収集します。\n惑星上では：軌道上のすべての宇宙プラットフォームのインデックス\nプラットフォーム上では：\n[img=virtual-signal.signal-I]：宇宙プラットフォームのインデックス\n[img=virtual-signal.signal-X]：宇宙接続上にいる場合の現在位置\n[img=virtual-signal.signal-L]：宇宙接続上にいる場合の宇宙接続の全長\nまた、プラットフォーム周囲のすべてのアステロイドについて信号を出力します。[entity=muluna-telescope]のサブコンポーネントです。
muluna-burner-roboport=電気ではなく燃料と酸化剤をロボットに補給するロボットステーションです。大気がなくてもロボットが飛べます。\n関連: [entity=muluna-burner-roboport-roboport]
muluna-burner-roboport-roboport=[entity=muluna-burner-roboport]のロボットステーション部分
[entity-factoriopedia-description]
muluna-telescope-combinator=宇宙を見つめ、望遠鏡周辺の情報を収集します。\n惑星上では：\n[img=quality.normal]：軌道上のすべての宇宙プラットフォームのインデックス\n[img=quality.uncommon]：軌道上のすべての宇宙プラットフォームの状態\n      [font=default-bold]1[/font]：スターターパック待ち\n      [font=default-bold]2[/font]：物流システムにスターターパックを要求済み\n      [font=default-bold]3[/font]：スターターパックが輸送中\n      [font=default-bold]4[/font]：経路に沿って移動中\n      [font=default-bold]5[/font]：出発準備完了のため、搬入を受け付けない\n      [font=default-bold]6[/font]：スケジュールに停留所がない\n      [font=default-bold]7[/font]：経路がない\n      [font=default-bold]8[/font]：停留所で待機中\n      [font=default-bold]9[/font]：一時停止中\n[img=quality.rare]：各プラットフォームが出発可能か(可能=2、不可能=1)\nプラットフォーム上では：\n[img=virtual-signal.signal-I]：宇宙プラットフォームのインデックス\n[img=virtual-signal.signal-X]：宇宙接続上にいる場合の現在位置\n[img=virtual-signal.signal-L]：宇宙接続上にいる場合の宇宙接続の全長\nまた、プラットフォーム周囲のすべてのアステロイドについて信号を出力します。[entity=muluna-telescope]のサブコンポーネントです。
muluna-telescope-combinator-no-quality=宇宙を見つめ、望遠鏡周辺の情報を収集します。\n惑星上では：軌道上のすべての宇宙プラットフォームのインデックス\nプラットフォーム上では：\n[img=virtual-signal.signal-I]：宇宙プラットフォームのインデックス\n[img=virtual-signal.signal-X]：宇宙接続上にいる場合の現在位置\n[img=virtual-signal.signal-L]：宇宙接続上にいる場合の宇宙接続の全長\nまた、プラットフォーム周囲のすべてのアステロイドについて信号を出力します。[entity=muluna-telescope]のサブコンポーネントです。
