[technology-description]
promethium-crushing=プロメチウムはヴォイドコアの優れた素材ですが、いくらかの加工が必要です。
promethium-void-culture=鉄バクテリアと銅バクテリアは、プロメチウムを変化させられるよう変異させることができそうです。
void-crystals=培養物だけではまともなヴォイド結晶を作れませんが、適切な基部とアクィロの極寒の気温を利用すれば、きれいな結晶を育てられるはずです。
void-core-chunk=結晶はコアにする前に適切に処理する必要があります。
void-core-base=破片は高温に加熱するだけで組み立てられます。ただし、基部のひび割れを防ぐためにゆっくりと焼きなましする必要があります。結晶化プレートも焼きなましが必要なので、これは簡単なはずです…よね？
void-core-activation=最終工程です。コアを起動するには強力な電磁場さえあれば十分です。
voidp-void-science-pack=おしまい！今のところは…
crystalization-plating=リチウム-ホルミウム合金は結晶を育てる優れた基盤になります。ただし、制御された焼きなましが必要で、室温のフルオロケトンが戻ってくるため、扱う温度がもう1つ増えます。
void-control-unit=プロメチウムを研究すると、この古代の忘れられた技術がもたらされます。「ただのアセットの差し替えじゃん」ってどういう意味ですか？
void-data-disk=物質をデータとして保存します。最大512メガタイロン。
void-conversion-1=物質をヴォイドに変える方法を研究します。
void-conversion-2=物質をヴォイドに変える方法を研究します、その2。
void-conversion-3=物質をヴォイドに変える方法を研究します、三部作完結編。
void-pylon=パイロンは物質をデータに変えることができます。これを「ディープラーニング」と呼ぶ人もいます…
void-data-learning=ヴォイドパイロンがアイテムを空のヴォイドデータディスクに書き込みます。
void-synthesis=ヴォイド組立機がデータディスクをもとにヴォイドからアイテムを作ります。
void-disk-refining=ヴォイド組立機がヴォイドデータディスクをレジェンドまでの高い品質に精錬します。
void-quality=オラトルにある調律済みヴォイドパイロンが、レジェンドのヴォイドデータディスクをヴォイドのディスクに変えます。
void-synthesis-productivity=すべてのヴォイド合成レシピの生産性です。
