[mod-setting-description]
disable-new-music=このMODで追加される新しい宇宙の音楽を無効にします。気に入ってもらえなくて悲しいです :(
voidp-learnable-scope=ヴォイドデータディスクが作られるアイテムです。サイエンスパック: 3つ以上の技術で使われ、30個以下のレシピで材料になる研究所の投入物。ほかのMODは mod-data のリスト「voidp-learnable-items」にアイテムを追加できます。
voidp-final-quality=レジェンドより上のヴォイド品質と、オラトルでのディスクの昇華です。セーブデータでオフにすると、ヴォイドのアイテムは削除されるか、別の品質に変わります。
[quality-name]
voidp-void=ヴォイド
[quality-description]
voidp-void=レジェンドより上の品質です。オラトルでレジェンドのヴォイドデータディスクを昇華させることでしか作れません。この品質のサイエンスパックは10倍の研究量になります。
