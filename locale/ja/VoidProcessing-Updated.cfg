[recipe-description]
promethium-crushing=プロメチウムを扱いやすい塊に粉砕します。
void-core-inert-rebuild=ヴォイドコアの構造を新品の状態に修復します。この工程は無重力環境でのみ可能です。
void-pylon-tuned=パイロンを調律してオラトルの声を聞けるようにします (そして、宇宙の場所限定のレシピを作りにくくしているゲームエンジンを呪います)。
void-learning=ディスクはレシピの品質になります。空のディスクは常にノーマル品質です。
void-disk-refining=50 %: ディスクの品質が1段階上がります (レジェンドまで)。40 %: 変化なし。10 %: 消失。レジェンドのディスクはここではそれ以上上がりません。
void-disk-ascension=オラトルにある調律済みヴォイドパイロンで行います。25 %: レジェンドのディスクがヴォイドのディスクになり、それ以外の場合は消失します。
void-synthesis=ディスクと同じ品質でアイテムを作ります。99 %のクラフトでディスクが戻ってきます。
