[entity-description]
rabbasca-vault-warp-spawner-inactive=大量の防衛部隊をワープで呼び出すラバスカの防衛機構です。現在は休眠中です。近くに脅威を検知すると、ハッキング可能な[entity=rabbasca-vault-warp-spawner]に変化します。

[item-name]
rabbasca-core-extraction-protocol=コア抽出プロトコル

[item-description]
rabbasca-warp-core=何らかのアノマリーを内包しています。封じ込めはやや不安定で、一定時間が経つか投げると破綻します。そのときコアは爆発し、範囲内のユニットを近くのランダムな場所へワープさせます。建物はワープする代わりに追加のダメージを受けます。

