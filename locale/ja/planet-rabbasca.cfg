rabbasca-deconstruct-captured-pylons=確保したパイロンに自動で解体マークを付ける
rabbasca-enable-new-vault-progression=新しいハレニック溶岩の解放方法を使う
rabbasca-warp-core-spoils=[item=rabbasca-warp-core]を不安定にする
