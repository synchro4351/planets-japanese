rabbasca-core-extraction-protocol=コア抽出プロトコル
rabbasca-kr-coke-carotenoid=カロテノイドからコークスを作成

[recipe-description]
rabbasca-core-extraction-protocol=保管庫の自爆を起動し、そのコアを露出させます。\n[color=yellow]警告: コアは非常に不安定で、広範囲に破壊をもたらす可能性が高いです。ラバスカの防衛機構は最大警戒態勢になります。\n続行する前に適切な対策をとってください！[/color]

[technology-name]
rabbasca-explosives=__FLUID__energetic-residue__から__ITEM__explosives__

[technology-description]
rabbasca-unhealthy-fluids-alt=巨大な爆発なら[planet=rabbasca]の地殻に穴を開け、その下の溶岩にアクセスできるかもしれません。[recipe=rabbasca-core-extraction-protocol]が役に立つかもしれません...
rabbasca-document-forging-one=[entity=rabbascan-scrap]から[item=vault-access-key]のサンプルを採取し、自分で製作する方法を学びます。
rabbascan-vault-access=[entity=rabbascan-scrap]から[item=vault-access-key]を入手して保管庫をハッキングし、その資源を抽出します。

