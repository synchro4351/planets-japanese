[mod-setting-description]
rabbasca-deconstruct-captured-pylons=有効にすると、__ENTITY__rabbasca-vault-warp-spawner__のハッキングに成功したあと、できあがった__ENTITY__rabbasca-warp-pylon__に解体マークが付きます。
rabbasca-enable-new-vault-progression=ハレニック溶岩の新しい解放方法で、戦闘ではなく製作によって解放します。以前の方法は多くの混乱を招き、ほかの戦闘系MODとの互換性の問題も起きていました。詳しくは「不健康的な液体」の技術を確認してください。
rabbasca-warp-core-spoils=無効にすると[item=rabbasca-warp-core]が劣化しなくなり、時間が経っても勝手に爆発しなくなります。投げたときの挙動は変わりません。
rabbasca-hard-science=[item=athletic-science-pack]の材料に[item=exoskeleton-equipment]を加えて製作を難しくします。そのぶんパックの生産数がわずかに増えます。
rabbasca-map-dark-mode=ラバスカのマップ表示がまぶしすぎますか？これで一日中いつでもマップを見られます！（マップ表示のタイルの色を変えるだけで、ワールドの見た目には影響しません）
rabbasca-expand-athletic-science-usage=太陽系の外縁より先の技術の研究に、アスレチックサイエンスパックを追加します。

[rabbasca-extra]
warp-inventory-nodebug=[virtual-signal=rabbasca-warp-inventory] ワープ・インベントリ
no-enemies-mode-ignored=敵なしモードが検出されました。[planet=rabbasca]の保管庫の防衛機構は常に有効です。[tip=rabbasca-vaults]を確認してください。

