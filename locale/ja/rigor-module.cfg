[mod-setting-description]
rigor-module-compatibility-mode=互換モードでは、精度モジュールを使えるようにするには、MODがレシピを明示的にホワイトリストへ登録する必要があります。このMODがほかのMODとの互換性の問題を起こしている場合にのみ、互換モードを有効にすることをおすすめします。
rigor-module-compatibility-mode-include-vanilla=互換モードで、バニラのFactorio（Space Ageを含む）の対象となるすべてのレシピをホワイトリストに入れるかどうかです。互換モードが有効なときのみ適用されます。
rigor-module-multiplayer-wait-ticks=この設定は現在使われていません。
rigor-module-disable-rigor-effect=[img=utility/warning_icon]警告[img=utility/warning_icon] 内容を理解している場合のみ使ってください！\nこの設定は、このMODを削除する前や、エンティティが消えてしまう設定変更をする前に、セーブデータを整合させるためにのみ使ってください。
[tips-and-tricks-item-name]
rigor-module-mod-tip-1=精度
rigor-module-mod-tip-2=精度の確率
[tips-and-tricks-item-description]
rigor-module-list=[item=rigor-module] 精度モジュール \n[item=rigor-module-2] 精度モジュール2 \n[item=rigor-module-3] 精度モジュール3
rigor-module-mod-tip-1=精度は[tooltip=精度モジュール,tips-and-tricks-item-description.rigor-module-list]がもたらす新しいモジュール効果です。精度は、レシピが最も価値の高い生産物を出す確率を高めます。精度が影響するのは確率で出る生産物だけで、1つのレシピにつき1種類の生産物にしか影響しません。また、[recipe=scrap-recycling]を除き、リサイクルのレシピには影響しません。\nレシピが精度の影響を受けるかどうか（またどのように受けるか）は、そのレシピのFactoriopediaの項目で確認できます。
rigor-module-mod-tip-2=精度は、レシピが指定された生産物を出すオッズを高めます。\n確率を'p'とすると、オッズ = 'p/(1-p)'です。\n確率'p'と精度'r'に対して、確率は'rp/(rp - p + 1)'の式で補正されます。\nレシピは精度に対する「感度」を持つこともあります。感度が'1'より大きいと精度はオッズをより大きく、'1'より小さいとより小さく補正します（感度's'のとき、実効の精度は'r*s'です）。感度が負の場合、精度はオッズを高める代わりに下げます（'p'ではなく'1 - p'を補正します）。
