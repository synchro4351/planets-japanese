[virtual-signal-description]
rbp-book-layer1=ブループリントブック内で使うスロット番号を指定します。
rbp-book-layer2=ブループリントブックの中にあるブループリントブック内で使うスロット番号を指定します。
rbp-book-layer3=ブループリントブックの中にあるブループリントブックの中にある…ブック内で使うスロット番号を指定します (わかりますよね)。
rbp-book-layer4=入れ子のブックの第4階層のスロット番号です。
rbp-book-layer5=入れ子のブックの第5階層のスロット番号です。
rbp-book-layer6=入れ子のブックの第6階層のスロット番号です。この信号を頻繁に使っているなら、あなたは再帰ブループリントの再帰マスターです！
rbp-command=Blueprint Automated Deployment チェスト用のコマンドです。コマンドの説明はヒントとコツにあります。
rbp-cancel=該当する計画アイテムを使うとき、解体またはアップグレードをキャンセルします。
rbp-enviroment=パラメトリック解体 (コマンド11) を使うとき、「木と岩のみ」のフィルターを設定します。
rbp-invert-filter=パラメトリック解体でブラックリストを使います。
rbp-rotate-bp=展開時にブループリントを回転させます。(1->時計回りに90°、2->180°、3->反時計回りに90°)
rbp-superforce=ブループリントの展開や解体のときに超強制モードを使います。
rbp-quality=パラメトリック解体 (コマンド11) の解体フィルターに「すべての品質」を使います。
rbp-center=受け取った「X」と「Y」の信号を、左上の角ではなく範囲の中央として解釈します。
rbp-absolute=受け取った「X」と「Y」の信号を、オフセットではなく絶対座標として解釈します。
rbp-wait=制御信号が連続して与えられているとき、コマンドをすぐに繰り返しません。詳しくはヒントとコツを参照してください。
rbp-library=マップのブループリントライブラリで使うスロット番号を指定します。
[recursive-blueprints]
wip-note=開発中です。このエンティティの動作は近いうちに変わる可能性があります。
filter-lable-tooltip=信号/数値ボタンを押すと、フィルターのビットマップ用の計算機GUIが開きます。
counter-settings=カウンターの設定
counter-settings-tooltip=各カウンターの信号の設定です。カウンターの信号を出力に表示するかどうかはフィルターで決まります。
reset-scanner-counters-settings=出力の設定をデフォルトに戻します。
heading_label-counters=カウンター
heading_label-filters=フィルター
counter-negative-checkbox=選んだカウンター信号の負の値を出力信号に加えます。
counter-name-blank=空白[img=info]
counter-name-uncharted=未探索のチャンク
counter-name-cliffs=崖
counter-name-targets=砲撃目標
counter-name-water=水タイル
counter-name-resources=天然資源
counter-name-buildings=建物
counter-name-ghosts=ゴースト
counter-name-items_on_ground=地面のアイテム
counter-name-trees_and_rocks=木と岩
counter-name-to_be_deconstructed=解体予定
counter-name-plants=植物
counter-tooltip-blank=ほかの信号を変えずに再スキャンを発動させるのに使えます。
counter-tooltip-uncharted=マップ上で見えていないチャンクの数です。
counter-tooltip-cliffs=崖の数です。(取り除くのに必要な爆薬のおおよその量を見積もれます)
counter-tooltip-targets=砲撃目標の数です。(取り除くのに必要な砲弾の数を見積もれます)
counter-tooltip-water=水タイルの数です。
counter-tooltip-resources=天然資源の採掘地点の数です。
counter-tooltip-buildings=建物の数です。(スキャンしているスキャナーと同じ勢力の建物だけを数えます)
counter-tooltip-ghosts=ゴーストの数です。(スキャンしているスキャナーと同じ勢力のゴーストだけを数えます)
counter-tooltip-items_on_ground=地面にあるアイテムの数です。
counter-tooltip-trees_and_rocks=木 (植物を除く)、岩、魚の数です。
counter-tooltip-to_be_deconstructed=解体対象になっている建物の数です。(スキャンしているスキャナーと同じ勢力の建物だけを数えます)
counter-tooltip-plants=栽培できる植物です。
library-limit=__1__がブループリントライブラリからブループリントをコピーしようとしていますが、MOD設定で禁止されています！
