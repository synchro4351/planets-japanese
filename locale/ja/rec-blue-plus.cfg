[tips-and-tricks-item-name]
recursive-pb-common=再帰ブループリント+
recursive-bp-offset-tool=オフセット計算ツール
[tips-and-tricks-item-description]
recursive-pb-common=BR+ MODは、ブループリントを自動で使うための2つの装置で構成されています。\nどの装置も論理信号で制御します。\n\n[font=default-bold]全装置に共通の信号[/font]\nデフォルトでは、[img=virtual-signal.signal-X]信号と[img=virtual-signal.signal-Y]信号の値は、この装置から横方向と縦方向に何タイル離れるかを示します (正の方向は右と下)。[virtual-signal=rbp-absolute]>0 の信号がある場合、これらの信号は絶対座標として解釈されます。\n以降のヒントでは、この3つの信号の組み合わせを[color=yellow]座標[/color]と表します。\n\n[img=virtual-signal.signal-W]信号と[img=virtual-signal.signal-H]信号の値は、範囲の幅と高さを決めます。\n範囲の位置は、[color=yellow]座標[/color]が範囲の角を指すか中央を指すかの2通りで決められます。\nどちらを使うかは[virtual-signal=rbp-center]信号で選びます: >0 なら中央、<0 なら角、=0 ならMOD設定 (マップ) の「[font=default-bold]__1__[/font]」で決まります。\n範囲の角を選んだ場合、幅と高さは実質的に[color=yellow]座標[/color]からのオフセットを示すため、負の値も使えます。\n範囲の中央を選んだ場合、幅と高さの負の値は意味を持たないため、数値の符号は無視されます。\n以降のヒントでは、この6つの信号の組み合わせを[color=yellow]範囲[/color]と表します。
recursive-pb-scanner=指定した[color=yellow]範囲[/color]にあるオブジェクトの数を数え、結果を論理ネットワークの信号として出力します。\n建物とそのゴーストのように、同じ信号で示されるオブジェクトのカテゴリがあるため、[img=virtual-signal.signal-F]信号でスキャン用のフィルターを指定する必要があります。フィルターの具体的な値は、スキャナー本体でフィルター信号のボタンをクリックすると確認できます。\nスキャンは常時行われるわけではなく、入力信号が変化したときだけ実行されます。
[rbp-tnt-description-parts]
tool-area-viewer=[font=default-bold]目視での確認[/font]\n[color=yellow]座標[/color]や[color=yellow]範囲[/color]を示す信号を装置に送ったあと、それらの信号がどこを指しているか確認できます。確認するには、「BADチェスト範囲インジケーター」ツールで確認したい装置を1つ以上選択してください。
deployer-intro=このバージョンはバニラの信号だけで制御します。
deployer-control=[img=virtual-signal.signal-0]信号は「インベントリ内のアイテムを使う」という意味です。動作はインベントリにあるアイテムによって変わります。\n(以前は[img=item.construction-robot]信号を使っていましたが、仮想信号、つまり[font=default-bold]アイテム[/font]信号ではないものに置き換えられました。古いブループリントを使う場合は、マップ設定で制御信号を変更してください)
deployer-plans=指定した[color=yellow]範囲[/color]に解体計画/アップグレード計画を使います。デプロイヤーが自分自身を解体対象にすることはありません。\n[img=virtual-signal.signal-0]<0 の場合、解体計画/アップグレード計画を「キャンセル」モードで使います。
deployer-book=動作は選んだアイテムによって変わります。\n[img=virtual-signal.signal-0]<0 の場合、数値の符号は無視され、解体計画/アップグレード計画は「キャンセル」モードで使われます。
deployer-misc=[font=default-bold]追加コマンド[/font]\n[img=item.deconstruction-planner]信号は独立したコマンドとして使います:\n-1 = 指定した[color=yellow]範囲[/color]にフィルターなしの解体計画を使います。デプロイヤーが自分自身を解体対象にすることはありません。\n-2 = デプロイヤーを解体対象にします。\n-3 = 指定した[color=yellow]範囲[/color]の解体指示をキャンセルします。\n次の4つのコマンドは、アイテム信号を使って解体計画のフィルターを設定します:\n-4 = 解体、ホワイトリストフィルター。\n-5 = 解体、ブラックリストフィルター。\n-6 = 解体のキャンセル、ホワイトリストフィルター。\n-7 = 解体のキャンセル、ブラックリストフィルター。\nアイテム信号に加えて、次のフィルターも使えます: [img=virtual-signal.signal-T] = 木、[img=virtual-signal.signal-R] = 岩、[img=virtual-signal.signal-C] = 崖。
deployer-copy=[font=default-bold]ブループリントのコピー/削除[/font]
blueprint-item=指定した[color=yellow]座標[/color]にブループリントを展開します。建設モードは「強制」です。障害物に構わず置けるものを置き、水には埋め立て材を加え、邪魔になる木や石や岩は解体対象にします。\nブループリントの中心を変えるには、グリッドサイズを有効にし (1x1 推奨)、絶対基準点を設定してください。\n追加パラメーター:\n__1__信号でブループリントを回転させます。1 -> 時計回りに90°、2 -> 180°、3 -> 反時計回りに90°。\n__2__>0 - 「超強制」建設モードを使います (「強制」に加えて、邪魔になる味方の建物も解体対象にします)。
book-navigation=__1__信号は、ブック内で使うスロットの番号を示します。選んだスロットにブックがある場合は、__2__信号が示すスロットが選ばれます。そこにもブックがある場合は、次の選択に__3__信号を使い、同様に__4__信号まで続きます。
action-copy-bp=__1__ ブループリントまたはブループリントブックをデプロイヤーのインベントリにコピーします。\n元のブループリントは、デプロイヤーチェストと同じ回路ネットワーク上のチェスト (または手持ちの内容を読み取るインサータ) に入っている必要があります。ネットワーク上に複数のブループリントがある場合は、ワイヤーの経由数が最も少ないものがコピーされます。
action-delete-bp=__1__ ブループリントまたはブループリントブックをデプロイヤーのインベントリから削除します。\n(ほかのアイテムは削除しないので、この専用装置をゴミ箱として使おうとしないでください！)
action-debug=[font=default-bold]デバッグ[/font]\n[img=virtual-signal.signal-L]信号はデバッグメッセージの表示に使います (MOD設定で発動条件を有効にする必要があります)。発動するたびに、発動したデプロイヤーの位置、ブループリントの名前、ブループリントを適用した場所 ([color=yellow]座標[/color]が指定されている場合) がチャットに表示されます。\n[color=yellow][font=default-bold]注意[/font][/color]: メッセージが非常に速く表示されると、チャットで一部が省略されることがあります。
deployer2-intro=このバージョンは独自の信号で制御します。\n\n[font=default-bold]制御信号[/font]\n制御には__1__信号を使います。動作と追加パラメーターは信号の値によって変わります。動作に影響する信号は括弧内に示します。
deployer2-timings=[font=default-bold]時間信号[/font]\nこの装置は毎tickコマンドを実行します。コマンド信号はパルスで与えることを想定しています。何らかの理由で制御コマンドを連続信号で与える場合は、コマンドの繰り返し間隔を設定する__1__信号 (任意) を使ってください。内部タイマーは__1__信号または__2__信号が変化したときにリセットされます。ほかの信号の変化は無視されます。
deployer2-navigation=[font=default-bold]ブループリントブックのナビゲーション信号[/font]\n__1__信号は「入れ子のブループリントブック内のナビゲーション」を意味します。
deployer2-library=__1__信号は、マップのブループリントライブラリのスロット番号を示します。(現在はコマンド#1、#2、#102で使われます)
deployer2-wires=[font=default-bold]ワイヤーの使い方[/font]\nデフォルトでは、デプロイヤーの両方のワイヤーがまとめて1つの入力として働きます。\n[color=yellow]2W[/color]の印は入力ワイヤーの分割を示します。[color=yellow]2W[/color]の印があるコマンドは、入力をメインと追加に分けます。__1__信号を受け取ったワイヤーが[color=yellow]メイン[/color]になります。両方のワイヤーからこの信号を受け取った場合、そのコマンドは無視されます。\nメインのワイヤーは、ほかのコマンドと同じようにコマンドとパラメーターを読み取ります。\n追加のワイヤーは、[color=yellow]2W[/color]の印があるコマンドだけが使います。通常は離れた場所の信号の読み書きに使います。
deployer2-com-header=[font=default-bold]コマンド一覧[/font]
deployer2-com1=[font=default-bold][[color=red]1[/color]][/font] - インベントリ内のアイテムを使います。動作はインベントリにあるアイテムによって変わります。
deployer2-com1-plans=指定した[color=yellow]範囲[/color]に解体計画/アップグレード計画を使います。
deployer2-com1-book=動作は選んだアイテムによって変わります。
deployer2-com2=[font=default-bold][[color=red]2[/color]][/font] - [font=default-bold][[color=red]1[/color]][/font]と同じですが、アイテムがブループリントだった場合はパラメーター化を適用します (パラメーター信号を指定した信号に置き換え、指定した数値をほかの数値に置き換えます)。
deployer2-com2-signals=[font=default-bold]パラメーターの置き換え:[/font] 数字の信号 ([img=virtual-signal.signal-0]から[img=virtual-signal.signal-9]まで) は、どの信号を変更するかを示します。数字の信号の値は、存在する信号のうちどれ (値が一致するもの) を対応するパラメーターの代わりに貼り付けるかを示します。例外: 1から9の値は対応する数字の信号を、10は[img=virtual-signal.signal-0]信号を貼り付けます。\nたとえば[img=item.parameter-1]を[img=item.iron-gear-wheel]に置き換えるには、[img=item.iron-gear-wheel]=11 と [img=virtual-signal.signal-1]=11 の信号が必要です。
deployer2-com2-numbers=[font=default-bold]数値の置き換え:[/font] 文字の信号のペア ([img=virtual-signal.signal-A]-[img=virtual-signal.signal-K]、[img=virtual-signal.signal-B]-[img=virtual-signal.signal-L]、以下同様に[img=virtual-signal.signal-J]-[img=virtual-signal.signal-T]まで) は、どの数値を探してどの数値に置き換えるかを示します。\nたとえば「5001」を「10」に置き換えるには、[img=virtual-signal.signal-A]=5001 と [img=virtual-signal.signal-K]=10 の信号が必要です。
deployer2-com2-info=[font=default-bold]注:[/font] このパラメーター化は、レシピ、数式のパラメーター構成要素や、タレットのフィルター/優先度には対応していません。何かが完全におかしくなった場合は、チャットにエラーメッセージが表示されます。そのような場合はMODの作者に知らせてください。
deployer2-com10=[font=default-bold][[color=red]10[/color]][/font] - 指定した[color=yellow]範囲[/color]にフィルターなしの解体計画を使います (__1__)
deployer2-com11=[font=default-bold][[color=red]11[/color]][/font] - 指定した[color=yellow]範囲[/color]にフィルター (アイテム信号) 付きの解体計画を使います (__1__)\n__2__>0 - 木と岩のみのモード。この場合、アイテム信号は無視されます。\n__3__>0 - 指定したアイテムを「すべての品質」としてフィルターに追加します。
deployer2-com20=[font=default-bold][[color=red]20[/color]][/font] - 指定した[color=yellow]範囲[/color]にフィルターなしのアップグレード計画を使います (__1__)
deployer2-com30=[font=default-bold][[color=red]30[/color]][/font] - 指定した[color=yellow]座標[/color]にある定数コンビネータから信号を読み取ります ([color=yellow]2W[/color] __1__)\n__2__ - 読み取るセクションを選びます (0の場合はすべて読み取ります)。\n__3__>0 - 指定したセクションがオフになっていても、その信号を読み取ります。
deployer2-com31=[font=default-bold][[color=red]31[/color]][/font] - 指定した[color=yellow]座標[/color]にある定数コンビネータに信号を書き込みます ([color=yellow]2W[/color] __1__)\n__2__>0 - 選んだセクションを無効の状態で保存します。
deployer2-com32=[font=default-bold][[color=red]32[/color]][/font] - 指定した[color=yellow]座標[/color]にある定数コンビネータをオン/オフします (__1__)
deployer2-com33=[font=default-bold][[color=red]33[/color]][/font] - 指定した[color=yellow]座標[/color]にある定数コンビネータをクリアします。
deployer2-com34=[font=default-bold][[color=red]34[/color]][/font] - 指定した[color=yellow]座標[/color]にある論理ワイヤーから信号を読み取ります ([color=yellow]2W[/color] __1__)\n__1__ - 読み取るワイヤーを決めます: 1 - 赤、2 - 緑、3 - 両方。
deployer2-com40=[font=default-bold][[color=red]40[/color]][/font] - 出力信号をクリアします。
deployer2-com41=[font=default-bold][[color=red]41[/color]][/font] - デプロイヤーの入出力状態をリセットします。
deployer2-com100=[font=default-bold][[color=red]100[/color]][/font] - ブループリントまたはブループリントブックをBADチェストのインベントリにコピーします (ワイヤー検索) (__1__)\n__2__>0 - BADチェストのインベントリの現在の (空でない) 内容を置き換えることを許可します。\n[font=default-bold]注:[/font] 元のブループリントは、BADチェストと同じ回路ネットワーク上のチェスト (または手持ちの内容を読み取るインサータ) に入っている必要があります。ネットワーク上に複数のブループリントがある場合は、ワイヤーの経由数が最も少ないものがコピーされます。
deployer2-com101=[font=default-bold][[color=red]101[/color]][/font] - ブループリントまたはブループリントブックをBADチェストのインベントリにコピーします (座標検索) (__1__)\n[font=default-bold]注:[/font] 元のブループリントは、指定した[color=yellow]座標[/color]にあるチェストに入っている必要があります。BADチェストは自分自身からコピーすることもでき、その場合はブループリントブックの中身を取り出せます。
deployer2-com102=[font=default-bold][[color=red]102[/color]][/font] - ブループリントライブラリからブループリントまたはブループリントブックをBADチェストのインベントリにコピーします (__1__)\n
deployer2-com120-head=[font=default-bold][[color=red]120[/color]][/font] -
offset-tool0=このツールは、ツールで選択した範囲を指定する信号の値を計算します。ツールのパラメーターはMODのオプション (プレイヤー) にあります。\n使うには、ツール (ショートカットバーにあります) を持って次の手順に従ってください:
offset-tool1=1. 基準点の選択: __CONTROL__select-for-cancel-deconstruct__を押したまま、[entity=blueprint-deployer2]、[entity=recursive-blueprints-scanner]、または任意の建物を選択します。
offset-tool2=2. オフセットの測定: __CONTROL__select-for-blueprint__を押したまま、目的の[color=yellow]範囲[/color]を選択します。計算されたオフセット値がチャットに表示されます。そのまま使うか、次の手順に進んでください。
offset-tool3=3. 定数コンビネータへの書き込み: __CONTROL__reverse-select__または__CONTROL__deselect__を押したまま、最後の測定結果を書き込みたい[entity=constant-combinator]を選択します。書き込みは最初のセクションにだけ行われ、必要な信号の既存の値は上書きされます。
offset-tool4=注: 基準点と最後の測定結果はプレイヤーごとに保存されるので、上の手順の合間にツールを「手放して」もかまいません。
[mod-name]
rec-blue-plus=再帰ブループリント+
[mod-description]
rec-blue-plus=ブループリントを自動化して、自己拡張する工場を作ります。\nRecursive Blueprints のフォークに小さな新機能を加えたものです。
[controls]
give-rbp-tool=オフセット計算ツール
give-rbp-area-viewer=BADチェスト範囲インジケーター
[shortcut-name]
give-rbp-tool=オフセット計算ツール
give-rbp-area-viewer=BADチェスト範囲インジケーター
[entity-name]
blueprint-deployer=ブループリントデプロイヤー
blueprint-deployer2=B.A.D.チェスト
recursive-blueprints-scanner=範囲スキャナー
[item-description]
blueprint-deployer=[font=default-bold][color=yellow]注意:[/color] この装置は非推奨です！ 古いブループリントとの互換性のためだけにMODから完全には削除されていません。[/font]\n入れたブループリントを自動で建設します。
blueprint-deployer2=(Blueprint Automated Deployment) 入れたブループリントを自動で建設します。
recursive-blueprints-scanner=範囲内のオブジェクトの数を数えます。
rbp-tool=選択した範囲の大きさと、選択したオブジェクトからのオフセットを計算します。\n左クリック - 範囲を選択します。\nShift+左クリック - 基準点にするオブジェクトを選択します。\n右クリック - 最後のデータを定数コンビネータに書き込みます。
rbp-area-viewer=BADチェストで現在選択されている範囲を表示します。
[mod-setting-name]
recursive-blueprints-area=範囲のX,Y位置
recursive-blueprints-logging=デプロイヤーのログ
recursive-blueprints-deployer-deploy-signal=デプロイヤーの展開信号
recursive-blueprints-tool-area=オフセットツール: 範囲のX,Y位置
recursive-blueprints-tool-coordinates=オフセットツール: 基準点
recursive-blueprints-limit-library=ブループリントライブラリからのコピーを禁止
recursive-blueprints-alerts-interval=通知の最小間隔
[mod-setting-description]
recursive-blueprints-area=デフォルトで、受け取った座標 (X信号とY信号) を範囲の「角」と「中央」のどちらとして解釈するかです (スキャナー、解体計画、アップグレード計画)。
recursive-blueprints-logging=デバッグメッセージを表示する条件です。
recursive-blueprints-deployer-deploy-signal=「両方」を選んだ場合は「0」信号が優先されます。\n入れ子のナビゲーションと統一するため、また、デプロイヤーの制御にアイテム信号を使わずに済むよう、建設ロボットの信号の代わりに「0」(ゼロ) 信号を使ってください。
recursive-blueprints-tool-area=範囲のどの点を計算しますか？
recursive-blueprints-tool-coordinates=どの座標を使いますか？\n相対座標の場合は、基準点となる建物を選ぶ必要があります (Shift+左クリックで選択)。
recursive-blueprints-limit-library=ブループリントライブラリに対するコマンド#2と#102の動作を制限します。これらのコマンドはライブラリからブループリント/ブックをアイテムにコピーする必要があり、その際にテキストへのエクスポート/インポート機能を使います。大きなブループリントやブックでは、これらのコマンドを使うとラグが発生することがあります。そのようなラグの原因を探すときはチェックを入れてください。
recursive-blueprints-alerts-interval=このMODのエラーメッセージはチャットに送られます。スパムを避けるため、同じ種類のメッセージは指定したtick数の間は表示されません。
