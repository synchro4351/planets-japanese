nulla-science-research-productivity=研究の生産性にMODのサイエンスパックを要求
[mod-setting-description]
nulla-vanila-science=ヌラで作るサイエンスパックが、一部のバニラの研究に必要になります。
nulla-science-promethium=プロメチウムの研究は、ヌラの後でなければ研究できなくなります。
