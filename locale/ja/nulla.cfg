[space-location-name]
nulla=ヌラ
[space-location-description]
nulla=巨大氷惑星アクイロを回る小さな衛星で、濃い炭素の大気に覆われています。地表には核クレーターと、原因不明のまま消えた文明の廃墟が刻まれています。戦争はあなたが来るずっと前に終わっていますが、その遺産は今も残っています。自律型の戦闘ドローンが地表を巡回し続け、見知らぬ電波に反応するのです。遠い恒星の光はかすかですが、この衛星は永遠の氷に閉ざされない程度の熱を保っています。しかし、腐食性の大気のせいで通常のインサータは役に立ちません。
