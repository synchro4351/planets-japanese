[mod-setting-description]
athos-earthquakes=地震がときどき石を地面に噴き上げます。石はベルトの上にも落ちて詰まらせることがあります。建物にダメージはありません。地面に落ちた石は30秒後に自動で片付けられます。
athos-earthquake-stone-deconstruction=有効にすると、地震で生じた石が地面に落ちたときに自動で解体マークが付きます。
athos-masochism=地震で生じた石が30秒後に自動で片付けられなくなります。また、新しく生成されるチャンクがすべて石の層で覆われるようになります。警告: きわめて面倒なうえ、セーブファイルが非常に大きくなります。
