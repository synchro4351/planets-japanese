[entity-description]
rotund-friend=[color=yellow][entity=unit-05]: とってもかわいいんです。飛び回るときの小さな音が大好きです。あなたの設計を使って、少しだけ効率を良くしました。大事にしてくださいね！[/color]
gantry=[entity=gantry] ガントリーは、内部に停めたエンティティをアップグレードできます。\n\n エンティティをアップグレードするには、まずガントリーの製作インベントリを開いて目標の品質を選びます。この品質は、アップグレードしたい車両より1段階高いものにしてください（たとえば、通常品質の機関車を高品質にするには<高品質>のレシピを選びます）。\n\n 次に、必要な材料をガントリーに供給します。アップグレード中に車両を動かすと、材料が無駄になることがあります。

