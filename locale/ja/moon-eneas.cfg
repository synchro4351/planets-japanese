[unit-05]
msg-1=こんにちは、小さな人！
msg-2=ごきげんよう。
msg-3=ユニット6と7はどうなったのでしょう..
msg-4=私があげた友だちを大事にしていますか？
msg-5=ピポパ。退屈です。
msg-6=すみません、何か言いましたか？

[dialogue]
first=あなたが近づくと、ユニット-05が目を覚まします。

[dialogue.tech.circuit-network]
line-01=[color=green][通信受信][/color]
line-02=[color=yellow][img=entity/unit-05]: ここではあまりやることがありません。私ひとりで、一日中考えごとをしているだけです。かなり退屈です。 [/color]
line-03=[color=yellow][img=entity/unit-05]: 小さな子たちを送ります。これでやっとまた役に立てるでしょう。[/color]
line-04=[color=red][img=entity/unit-05-dummy] 友だちを展開中。[/color]

[dialogue.tech.research-speed-1]
line-01=[color=green][通信受信][/color]
line-02=[color=yellow][img=entity/unit-05]: なに.. この音は何でしょう？あなたの研究所から出ているのでしょうか？ [/color]
line-03=[color=yellow][img=entity/unit-05]: うっとりする音です。少し刺激が強すぎるかもしれません。かもしれません..[/color]
line-04=[color=red][img=entity/unit-05-dummy] HDSFJGPGSADA。[/color]

[dialogue.tech.lamp]
line-01=[color=green][通信受信][/color]
line-02=[color=yellow][img=entity/unit-05]: 世界はときどき、とても暗くて寂しいものです。[/color]
line-03=[color=yellow][img=entity/unit-05]: あなたはどうかわかりませんが、私はひとりが好きではありません。あなたには友だちが必要だと思います。[/color]
line-04=[color=red][img=entity/unit-05-dummy] 友だちを展開中。[/color]

[dialogue.tech.personal-roboport-equipment]
line-01=[color=green][通信受信][/color]
line-02=[color=yellow][img=entity/unit-05]: 友だちにはいろいろな形や大きさがあるんです。[/color]
line-03=[color=red][img=entity/unit-05-dummy] 友だちを展開中。[/color]

[dialogue.tech.personal-roboport-mk2-equipment]
line-01=[color=green][通信受信][/color]
line-02=[color=yellow][img=entity/unit-05]: 教えてください。友だちは多すぎるということがあると思いますか？修辞的な質問です。[/color]
line-03=[color=red][img=entity/unit-05-dummy] 友だちを展開中。[/color]

[dialogue.tech.engineer-roboport]
line-01=[color=green][通信受信][/color]
line-02=[color=yellow][img=entity/unit-05]: 友だちの在庫が少なくなってきたようです。これで最後です。[/color]
line-03=[color=red][img=entity/unit-05-dummy] 友だちを展開中。[/color]

[dialogue.tech.discover-artifact]
line-01=[color=green][通信受信][/color]
line-02=[color=yellow][img=entity/unit-05]: すみません、今のは私です。私の船体は最近かなり脆くて。完全な事故です。 [/color]
line-03=[color=red][img=entity/unit-05-dummy] ゴミ投棄プロトコルを確認中。[/color]
line-04=[color=gray]Informatronページがアンロックされました！[/color]
line-05=[color=gray]プレイ中の方へ、可能ならInformatronを見てください。[/color]

[dialogue.tech.tinker-tech-basic]
line-03=[color=yellow][img=entity/unit-05]: なんてもったいない！小さな人、やり方を教えてあげましょう。[/color]

[dialogue.tech.upgrade-tech-basic]
line-01=[color=green][通信受信][/color]
line-02=[color=yellow][img=entity/unit-05]: すばらしいことを思いつきました！あなたの工場の作り方を見ていたのですが、それが.. なかなか興味深いのです。 [/color]
line-03=[color=red][img=entity/unit-05-dummy]: 興味深いほど非効率です！直しましょう。[/color]
line-04=[color=yellow][img=entity/unit-05]: 必要なものはすべてアーティファクトの中に入っています。こうやって建物に使ってください。 [/color]
line-05=[color=gray]新しいアップグレードレシピが解放されました。アーティファクトのタブで確認できます。 [/color]

[dialogue.tech.artifact-analysis-advanced]
line-03=[color=yellow][img=entity/unit-05]: 損傷したアーティファクトは、開けようとするとばらばらに崩れてしまいます。でも、ある程度の品質まで改良すれば中身にアクセスできるはずです。 [/color]
line-04=[color=yellow][img=entity/unit-05]: このコアはすばらしいです。私のオペレーティングシステムを構成するコードの、ほんのほんの一部が入っているんです。[/color]

[dialogue.tech.automation-2]
line-04=[color=yellow][img=entity/unit-05]: ... [/color]
line-05=[color=yellow][img=entity/unit-05]: ところで、あなたはどこから来たんでしたっけ？ [/color]
line-06=[color=red][img=entity/unit-05-dummy] エラー[/color]

[dialogue.tech.automation-3]
line-04=[color=red][img=entity/unit-05-dummy]: まあ、厳密に言えば私は.. [/color]
line-05=[color=yellow][img=entity/unit-05]: また楽しいことを考えましょう、ね。 [/color]
line-06=[color=red][img=entity/unit-05-dummy] エラー[/color]

[dialogue.tech.electric-energy-distribution-2]
line-01=[color=green][通信受信][/color]
line-02=[color=yellow][img=entity/unit-05]: 不思議です。あなたの設計図は、私のデータベースに保存されている項目にとてもよく似ています。[/color]
line-03=[color=yellow][img=entity/unit-05]: もちろん少し洗練度は劣りますが、それでも.. [/color]
line-04=[color=green][img=item/unit-05-afraid]: ただの偶然かもしれません。優れた頭脳は同じことを考える、ですよね？ [/color]
line-05=[color=yellow][img=entity/unit-05]: ご自分の目で確かめてください。 [/color]

[dialogue.tech.advanced-radar]
line-05=[color=gray]Informatronページがアンロックされました！[/color]

[dialogue.tech.water-advanced]
line-01=[color=green][通信受信][/color]
line-02=[color=yellow][img=entity/unit-05]: 湖を泳いでいる魚が見えますか？昔はこの場所を清潔に整えておくのを手伝ってくれていたんです。 [/color]
line-03=[color=yellow][img=entity/unit-05]: 見てのとおり、少し前からその仕事は手に負えなくなってしまいました。[/color]
line-04=[color=yellow][img=entity/unit-05]: 手で捕まえることも、前にあげた新しいレーダーで捕まえることもできます。時間をかけて新しい子を作り、準備ができたら放します。[/color]
line-05=[color=yellow][img=entity/unit-05]: ただ、少しは残しておいてくださいね。私の冷却液がこれ以上汚れるのは本当に困るんです。[/color]
line-06=[color=gray]Informatronページがアンロックされました！[/color]

[moon-eneas]
menu_fish=[item=overworked-servofish] サーボフィッシュ
title_fish=[item=overworked-servofish] サーボフィッシュ
page_artifact_text_5=アーティファクトの活用
page_artifact_text_6=[item=eneas-artifact] アーティファクトはさまざまな方法で使えます。アーティファクトを製作機械と組み合わせると、その品質レベルを上げられます。単純な機械ほど改良しやすく、通常品質のアーティファクトでも品質を上げられます。\n\n より複雑な建物では、目標の品質と同じ品質のアーティファクトが必要です。
page_fish_text_1=サーボフィッシュ
page_fish_text_2=エネアスによどむ水たまりの底には、サーボフィッシュが泳ぎ回っています。かつてステーションの人工生態系の繊細なバランスを保つために作られた、古代の仕掛けです。適切な監督と保守がなくなったことで、サーボフィッシュは少しずつ手に負えなくなり、劣化し始めました。 \n\n[color=yellow][entity=unit-05]: それは少し大げさすぎる気がします。ほんの少し愛情を込めて手入れしてあげれば、この子たちはすぐにまた仕事ができるようになりますよ。 [/color]
page_fish_text_3=\n\n水質
page_fish_text_4=[color=yellow][entity=unit-05]: この小さな子たちは、私の冷却システムをきれいに保つ役目を担っています。あなたにとっても役に立つのはわかっていますが、私の周りの水たまりには常に何匹か残しておいてください。設計図は私の工房にあるので、時間をかければもっと作れます。[/color]
page_fish_text_5=\n\n新品同様のサーボフィッシュ
page_fish_text_6=高度な資源を使えば、サーボフィッシュを本来の姿に復元でき、その能力が大幅に向上します。

