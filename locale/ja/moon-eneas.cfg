[technology-description]
discover-artifact=真の用途は不明のままですが、ナウヴィス各地に散らばる[item=eneas-artifact] アーティファクトは、有用な物資へ解体できます。
artifact-analysis-advanced=アーティファクトをより高いレベルまで改良できるようになります。これにより、より多くの種類の建物を強化でき、さらに高い品質まで改良できます。
artifact-analysis-master=アーティファクトをより高いレベルまで改良できるようになります。これにより、より多くの種類の建物を強化でき、さらに高い品質まで改良できます。
artifact-analysis-grandmaster=作業中です。エネアス パート1はここで終了です。アクィロと終盤要素はエネアス パート2で扱われます。
ancient-core-tech=アーティファクトから[item=ancient-core]を抽出します。コアには重要なデータが含まれており、より高度な建物の燃料として使えます。
engineer-roboport=強化されたロボットステーションです。同じ電力でより広い範囲に供給できます。
tinker-tech-basic=改良したアーティファクトを使って、補給アイテムを別の方法で作れます。
tinker-tech-advanced=改良したアーティファクトを使って、補給アイテムを別の方法で作れます。
gantry-tech=[entity=gantry] ガントリーは、内部に停めたエンティティをアップグレードできます。

[mod-setting-name]
moon-eneas-enable-supply-drops=[color=yellow]没入感[/color] 補給物資の投下を有効化
moon-eneas-enable-tech-messages=[color=yellow]没入感[/color] メッセージを有効化
moon-eneas-unit-05-talks=[color=red]パフォーマンス[/color] プレイヤーが近くにいるとユニット-05が話す
moon-eneas-science-multiplier=[color=blue]バランス[/color] エネアスの研究コスト倍率
tier4-modules=[color=brown]オーバーホール[/color] Tier 4モジュールMODと統合
integrate-lignumis=[color=brown]オーバーホール[/color] 惑星リグヌミスと統合

[mod-setting-description]
moon-eneas-enable-supply-drops=特定の技術の節目を研究したときに、一度きりの贈り物を受け取ります。
moon-eneas-enable-tech-messages=特定の技術の節目を研究したときに、チャットメッセージと映像通信を受け取ります。
moon-eneas-science-multiplier=エネアスの技術は全体の研究コスト倍率の設定の影響を受けないため、独自の倍率を設定します。
moon-eneas-unit-05-talks=プレイヤーが近くにいると、ユニット-05がメッセージを表示します。マルチプレイのサーバーでは負荷が高くなることがあります。
tier4-modules=Tier 4モジュールを解放する技術を、代わりにエネアスの研究の先に配置します。
integrate-lignumis=リグヌミスとエネアスをメカニクス面で結びつけるさまざまな変更を加えます。アーティファクトを解体して金板にできるようになります。アーティファクトには基本のリペアパックを使った復元工程が追加で必要になります。そのほか多くの変更があります。
