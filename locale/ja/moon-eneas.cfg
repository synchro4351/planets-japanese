[item-description]
volatile-nutrients=[color=yellow][img=entity/unit-05]: 小さな空間に大量のエネルギーを蓄えた強力な栄養素です。不安定です。[/color]
volatile-spoilage=[color=red][img=entity/unit-05-dummy]: 腐敗した不安定な栄養素です。今にも激しく「爆発」しそうです。[/color]
rotund-friend=[color=yellow][entity=unit-05]: とってもかわいいんです。飛び回るときの小さな音が大好きです。あなたの設計を使って、少しだけ効率を良くしました。大事にしてくださいね！[/color]
Construction_Drone=[color=yellow][entity=unit-05]: この小さな子たちは、覚えている限りずっと私のそばにいてくれました。この子たちがいなければ、私は今ここにいなかったでしょう。私に与えてくれるのと同じくらいの喜びを、あなたにも与えてくれるといいのですが！ [/color]

