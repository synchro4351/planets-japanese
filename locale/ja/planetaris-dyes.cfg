[mod-setting-name]
dye-secondary-color=[img=cyan-dye-icon][img=magenta-dye-icon][img=yellow-dye-icon] 二次色を有効にする
dye-enable-pipes=[img=red-pipe-icon] 染色したパイプを有効にする
dye-enable-wall=[img=green-stone-wall-icon] 染色した壁を有効にする
dye-enable-stone-path=[img=blue-stone-brick-icon] 染色した石レンガを有効にする
dye-enable-concrete=[img=red-concrete-icon] 染色したコンクリートを有効にする
dye-enable-refined-concrete=[img=blue-refined-concrete-icon] 染色した鉄筋コンクリートを有効にする
dye-enable-hazard-concrete=[img=green-hazard-concrete-icon] 染色した危険表示コンクリートを有効にする
dye-enable-refined-hazard-concrete=[img=red-refined-hazard-concrete-icon] 染色した危険表示鉄筋コンクリートを有効にする
disable-gleba-recipe-surface-conditions=[planet=gleba] グレバのレシピの地表条件を無効にする
dye-early-unlock=[planet=nauvis]の素材だけで染料を解放する
