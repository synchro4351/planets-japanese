moshine_cosmicscanner-construction-stage-1=宇宙スキャナーの基礎。
moshine_cosmicscanner-construct-1=宇宙スキャナーの中央の外縁を建設します。完成させるには、基礎に対して40回実行する必要があります。
moshine_cosmicscanner-construct-2=宇宙スキャナーの基本的な機械を建設します。完成させるには、基礎に対して40回実行する必要があります。
moshine_cosmicscanner-construct-3=宇宙スキャナーのより高度な部品を建設します。完成させるには、基礎に対して40回実行する必要があります。
moshine_cosmicscanner-construct-4=宇宙スキャナーの中央部とドームを建設します。完成させるには、基礎に対して40回実行する必要があります。
