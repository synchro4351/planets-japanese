[technology-description]
moshine-tech-cosmicscanner=はるか遠くの宇宙をスキャンします。送り出した強力な信号への応答から、宇宙とその仕組みについて多くのデータが得られます。
moshine-tech-cosmic-data-outsignal-creation=いずれ[entity=moshine_cosmicscanner]を建てたとき、役に立つデータを記録するには、正確な座標を持つ複雑な信号を作る必要があります。
moshine-tech-cosmicscanner-construction1=[entity=moshine_cosmicscanner]の計画を始めます。宇宙空間に信号を放ち、[font=moshine-data][color=#8086ff]宇宙データ[/color][/font]を集める、大量の電力を食う巨大な宇宙メガストラクチャーです。
moshine-tech-cosmicscanner-construction1_nocolor=[entity=moshine_cosmicscanner]の計画を始めます。宇宙空間に信号を放ち、宇宙データを集める、大量の電力を食う巨大な宇宙メガストラクチャーです。
moshine-tech-opticalfiber-storage-tank=データをデータサーバーに保存できるようになります。
