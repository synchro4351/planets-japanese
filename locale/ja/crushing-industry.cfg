[string-mod-setting]
crushing-industry-recipe-mode-standard=従来
crushing-industry-recipe-mode-remix=リミックス
[mod-setting-description]
crushing-industry-space-crusher=電力消費の増加と新しい技術と引き換えに、Space Age の粉砕機を強化し、基本品質+12.5%という強力な性能を持たせます。
crushing-industry-space-crusher-quality=さらなる電力消費と引き換えに、宇宙粉砕機に基本品質+12.5%を追加します。宇宙粉砕機が有効でない場合は効果がありません。
crushing-industry-big-crusher=ヴルカヌスで解放される、基本生産性+50%の粉砕機です。
crushing-industry-glass=石を粉砕して砂にし、精錬してガラスにします。
crushing-industry-optical-fiber=発展基板などの電子部品に使う新しい中間素材を追加します。
crushing-industry-ore=鉱石を粉砕して、より効率よく生産します。
crushing-industry-smelting-productivity=粉砕鉱石と砂を精錬して板にする工程や、溶融鉱石・ガラスに溶かす工程の生産性研究を追加します。鉱石の粉砕が有効でない場合は何もしません。
crushing-industry-coal=石炭を粉砕して、化学工程をより効率化します。
crushing-industry-concrete-mix=コンクリートに必要な水、砂、粉砕鉄鉱石をひとつの液体材料にまとめます。
crushing-industry-concrete-spoil-amount=生コンクリート1バレルが腐敗したときにできるコンクリートの量です（0=腐敗しない）。
crushing-industry-concrete-machine-ignorelist=レシピのコンクリート材料を生コンクリートに変換するのを妨げない機械を、カンマ区切りで並べたリストです。空白も区別されるので、カンマの前後に空白を入れないでください。例: burner-assembling-machine,assembling-machine-1
crushing-industry-modify-vanilla=重複したレシピを作るのではなく、レシピ内の原材料を粉砕したものに置き換えます。
crushing-industry-byproducts=粉砕レシピに低確率の副産物を追加し、少しだけ複雑なプレイにします。
crushing-industry-hide-player-crafting=材料を先に粉砕するだけで既存のレシピと同じになるレシピを隠します。
crushing-industry-bztin-space=スズ鉱石を小惑星の粉砕の副産物として組み込み、宇宙粉砕機なしでも宇宙で電子基板を作れるようにします（Cupric Asteroids MODとの併用がおすすめです！）。
crushing-industry-bzcarbon-space=鱗状黒鉛と原石ダイヤモンドを小惑星の粉砕の副産物として組み込み、宇宙粉砕機なしでも宇宙で電子基板を作れるようにします。
crushing-industry-k2=Krastorio 2 の砂とガラスを Crushing Industry の砂とガラスに置き換えます（有効な場合）。
