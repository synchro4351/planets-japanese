[entity-name]
wsr-big-assembler=巨大組立機
wsr-big-furnace=巨大電気炉
wsr-big-chemical-plant=巨大化学プラント
[entity-description]
wsr-big-assembler=通常の組立機と同じ機能を、より大きな規模で備えています。
wsr-big-furnace=通常の電気炉と同じ機能を、より大きな規模で備えています。
wsr-big-chemical-plant=通常の化学プラントと同じ機能を、より大きな規模で備えています。
[tile-name]
wsr-foundation=巨大基礎
[mod-setting-name]
wsr-recipe-multiplier=レシピの倍率
wsr-distance-between=機械どうしの最小距離
wsr-spawn-quality-machines=品質付きの機械の出現を許可
wsr-min-distance-from-center-for-quality=品質付きの機械が出現する最小距離
wsr-spawn-only-on-start-surface=開始地表にのみ出現
wsr-allowed-surfaces=出現を許可する地表
wsr-assembler-power-consumption=[entity=wsr-big-assembler] __ENTITY__wsr-big-assembler__の消費電力 (MW)
wsr-furnace-power-consumption=__ENTITY__wsr-big-furnace__の消費電力 (MW)
wsr-assembler-crafting-speed=[entity=wsr-big-assembler] __ENTITY__wsr-big-assembler__の製作速度
wsr-furnace-crafting-speed=[entity=wsr-big-furnace] __ENTITY__wsr-big-furnace__の製作速度
wsr-assembler-module-slots=[entity=wsr-big-assembler] __ENTITY__wsr-big-assembler__のモジュールスロット数
wsr-furnace-module-slots=[entity=wsr-big-furnace] __ENTITY__wsr-big-furnace__のモジュールスロット数
wsr-enable-prod-furnace=[entity=wsr-big-furnace] __ENTITY__wsr-big-furnace__に基本生産性25%を追加
wsr-enable-tags-on-map=[entity=wsr-big-assembler] __ENTITY__wsr-big-assembler__と__ENTITY__wsr-big-furnace__の位置にマップアイコンを表示
wsr-invulnerability=[entity=wsr-big-assembler]と[entity=wsr-big-furnace]を破壊不能にする
[mod-setting-description]
wsr-recipe-multiplier=[entity=wsr-big-assembler] __ENTITY__wsr-big-assembler__と[entity=wsr-big-furnace] __ENTITY__wsr-big-furnace__でのレシピの効率を決めます。通常のレシピが X 2個を消費して Y 1個を作る場合、この値が5なら、[entity=wsr-big-assembler] __ENTITY__wsr-big-assembler__と[entity=wsr-big-furnace] __ENTITY__wsr-big-furnace__では X 10個を消費して Y 5個を作ります。
wsr-distance-between=単位はマスです。値が小さいほど、[entity=wsr-big-assembler] __ENTITY__wsr-big-assembler__と[entity=wsr-big-furnace] __ENTITY__wsr-big-furnace__が頻繁に出現します。
wsr-spawn-quality-machines=より高い品質の機械がワールドに出現するようになります。出現地点に近いほど、高品質な機械が出る確率が高くなります。
wsr-min-distance-from-center-for-quality=単位はマスです。指定した距離より近い場所では、通常品質の機械しか出現しません。
wsr-assembler-crafting-speed=汚染に影響します。
wsr-furnace-crafting-speed=汚染に影響します。
wsr-spawn-only-on-start-surface=有効にすると、プレイヤーが最初に出現した地表にのみ機械が出現します。
wsr-allowed-surfaces=機械が出現できる地表です。「ナウヴィスにのみ出現」が無効のときだけ機能します。\n\n地表の一覧をカンマ区切りで指定してください。
wsr-enable-tags-on-map=ゲームがかなり簡単になる可能性があります。
wsr-invulnerability=敵の難易度を大きく上げている場合や、出現地表の環境が危険すぎる場合におすすめの設定です。ゲームバランスが崩れる可能性があります。
[wsr-alert]
no-furnace-recipes=[WSR] 注意！ [entity=wsr-big-furnace]で使えるレシピカテゴリがありません。有効なMODの一覧を添えて、MOD作者にこの問題を報告してください。
