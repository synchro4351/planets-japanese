mupgrade-disable=[color=255,125,0]警告[/color] Machine Upgrades を無効にすると、Machine Upgrades による技術効果（例: 組立機の生産性+10%）がすべて機能しなくなります。次の場合にだけ使ってください。\n1) ゲームがクラッシュし、クラッシュログでこの設定を有効にするよう指示された\n2) すでに該当MODの開発者にクラッシュを報告し、修正を待っている\n3) かつ、Machine Upgrades がほかのMODの前提MODになっている\nこの手動オーバーライドは緊急用です。デフォルトはオフです。
