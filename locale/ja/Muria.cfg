[technology-description]
planet-discovery-muria=強い温室効果を持つ小さな惑星です。非常に腐食性の高い[fluid=muriatic-solution]の浅い湖から発生するガスが、惑星を暖かく保っています。湖の液体は[entity=offshore-pump]で汲み上げられます。地表には生命が存在するようです。
lichen-cultivation=[item=acidophile-lichen]は、[item=chlorine-salts]から金属が[fluid=chlorine]を取り除かれる際に放出されるエネルギーを糧にしているようです。塩を[tile=acidophile-lichen]の上に置けば、この惑星で安定して金属を得られます。ただし、そのコロニーは大気中に極めて強い腐食性物質を放出するようで、工場にとって危険になります。
eschatotaxite-farming=自らの腐った部分を養分にする、背の高い菌類のコロニーです。炭素と硫黄を非常に豊富に含みます。[entity=metallic-lichen-colony]や[entity=cotunnite-lichen-colony]が放出する腐食性の酸を吸収するようです。
lead-processing=[fluid=muriatic-solution]から取り出した[item=cotunnite]を[tile=acidophile-lichen]の上に置いて、中に含まれる[item=lead]を取り出し、この耐食性金属の処理を始めます。
acidworking=非常に腐食性の高い素材を扱えるようにする新しい工程です。[entity=acidworking-plant]の稼働には[item=chloric-fuel]が必要です。
advanced-lead-processing=[item=chloric-fuel]を使って、専用の[entity=smelting-plant]で[item=lead]のより高度な処理工程を始めます。あわせて鉛ペレットと重ショットガン弾薬を開発します。
acidworking-science-pack=酸や有毒物質のより高度な応用ができるようになります。この技術により、ムリアを離れられるロケットの建造も可能になります。
offworld-chlorine-compounds-production=[planet=muria]以外で[fluid=chlorine]と[fluid=hydrogen-chloride]を入手・処理する工程です。
toxic-rounds-magazine=酸性の弾頭を詰めるよう改造した弾丸です。
hydrogen-chloride-explosives=[fluid=hydrogen-chloride]の性質を利用した、[item=explosives]の代替レシピです。
hydrogen-chloride-lead-battery=[item=lead-plate]を使った、[item=battery]の代替レシピです。
acid-weaponization=高度な化学兵器の開発を始めます。
refined-acid-weaponry=酸を用いた兵器のダメージを上げます。
hydronium-destruction-productivity=より高度な[fluid=hydronium]の分解技術により、より多くの[fluid=oxygen]と[fluid=hydrogen]の分子を回収できます。
oxygenated-bacteria-cultivation=バクテリアの培養環境に酸素を加えることで、培養の収量を増やせます。
holmium-chloride=塩化物塩の研究が進んだことで、塩化ホルミウムを人工的に合成し、ホルミウムの処理工程を延長して、フルゴラでのホルミウムの生産量を増やせるようになります。あわせて、フルゴラの油の海やムリアの塩酸湖の深い場所でも生息できる地衣類のコロニーを人工的に作れるようになります。
shotgun-turret=強力なショットガン弾薬を撃てるように改造したガンタレットの設計です。
advanced-paste-applications=エスカトタキサイトペーストの多様な性質を活かし、重要な工程でプラスチックやユマコマッシュの代わりに使います。
shotgun-turret-damage=ショットガンタレットのダメージを上げます。
murian-oil-processing=[entity=eschatotaxite]から得たバイオマスをムリアのほかの資源と一緒に処理することで、ムリアで石油や石油製品を得られます。
leaded-fuel=鉛ペレットを使い、ロケット燃料の上位版を作ります。速度補正は驚異的ですが、汚染倍率も非常に大きくなります。
air-scrubbing=[fluid=water]とさまざまな触媒を使って各惑星の大気を洗浄し、汚染物質を減らしつつ、大気から微量の資源を得ます。
hydrogen-chloride-from-biter-egg=成長中のバイターやスピッターから酸を作る腺を慎重に取り出すことで、ナウヴィスで手軽に[fluid=hydrogen-chloride]を入手できます。
explosive-shotgun-shell=[fluid=chlorine]-[item=carbon]の爆薬を詰めるよう改造したショットガン弾薬です。宇宙で大型のアステロイドを破壊するのに最適です。
advanced-acid-processing=[fluid=sulfuric-acid]と[fluid=hydrogen-chloride]を利用・生産する、より高度な工程です。
lead-robots=[item=anti-corrosion-cladding]で強化したロボットです。耐性が高く、より多くの荷物を運べ、ムリアの酸にも耐えますが、速度は遅くなります。
pickled-casting=より高度な鋳造方法です。溶融金属と一緒に[fluid=hydrogen-chloride]を使い、不純物を酸洗いして無駄を減らすことで、中間素材の鋳造レシピで使う溶融金属を25%減らせます。

