[tips-and-tricks-item-description]
muria-briefing=[planet=muria]は生命にあふれた、きわめて有毒な世界です。[tile=acidophile-lichen]と[entity=eschatotaxite]の菌類が惑星の乾いた陸地を覆い、残りの地表は[fluid=muriatic-solution]の湖に覆われています。[entity=chlorine-salt-deposit]と[item=cotunnite]は[fluid=chlorine]の塩で、地表でさまざまな形で見つかります。どちらも[entity=fungicultural-tower]と地衣類によって鉱石に精製できます。地衣類が放出する腐食性の空気に注意してください。エスカトタキサイトはその被害から工場を守ってくれます。
acid-immunity-list=[entity=metallic-lichen-colony]や[entity=cotunnite-lichen-colony]を収穫すると、腐食性のガスが放出されます。このガスはほとんどの機械にダメージを与えます。マップの汚染オーバーレイで、どの範囲が機械にとって危険かがわかります。腐食性の大気は、[entity=eschatotaxite]を植えて収穫することで減らせます。\n[planet=muria]の汚染されたタイルにあるプレイヤーが作ったエンティティのほとんどは、腐食性の酸によって継続的にダメージを受けますが、いくつか例外があります。\n耐性のあるエンティティ=\n- [entity=fungicultural-tower]は酸の主な発生源であり主な吸収源でもあるので、当然耐性があります。 \n-[entity=acidworking-plant]と[entity=smelting-plant]（この2つの機械は腐食性の酸を増やすので注意してください）。\n- [entity=biovat]（バイオバットは大気中の酸を一部吸収します）。 \n- [entity=scrubber]（この機械は酸やほかの汚染物質を吸収するよう設計されています）。 \n- すべての電力関連のエンティティ（電柱、発電機、蓄電池）\n- 物流関連のエンティティはロボットを除いてダメージを受けません。ロボットステーションもダメージを受けません。アップグレードした鉛被覆ロボットは酸に耐性があります。 \n- 列車（[entity=locomotive]、[item=rail]など）も耐性があります。\n- [entity=rocket-silo]、[entity=cargo-landing-pad]、[entity=cargo-bay]。 \n- すべての掘削機。 \n- [entity=beacon]。 \n- すべてのパイプ。 \n- すべてのチェスト。

[planet-effect-alert]
muria-corrosive-effect-destroyed-entity=ムリアの腐食性の空気によって機械が破壊されました。ムリアで汚染のあるチャンクでは、ほとんどの機械がダメージを受けます。詳しくはTipsを確認してください。

