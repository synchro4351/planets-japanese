[mod-setting-description]
castra-prime-forge-glow=鍛冶場の発光レイヤーを有効にし、稼働中に光って見えるようにします。
castra-prime-extend-data-spoilage=戦場データパケットの腐敗時間を1分から5分に延ばします。
castra-prime-disable-artillery=敵の拠点が砲台を建設しないようにします。長期のプレイにおすすめです。
castra-prime-buffed-forge=鍛冶場の製作速度を3.0、生産性ボーナスを50%に上げ、消費電力を2.5MWに下げます。
castra-prime-gates-progression=有効な場合（既定）、終盤の進行にカストラの資源が必要になります。レールガンとプロメチウムサイエンスパックの製作にはリチウム電池が、プロメチウムサイエンスと研究効率の研究には戦場サイエンスが必要です。無効にすると、カストラは任意で訪れる惑星になります。
castra-prime-suppress-research-msg=敵の研究の進み具合に関するメッセージを表示しません。絶え間ない通知なしで、より没入感のあるプレイを好む人に便利です。
castra-prime-research-rate-multiplier=敵勢力の研究速度に掛ける倍率です。既定の1.0は元のMODと同じです。1.0より小さいと敵の研究が遅くなり、大きいと速くなります。範囲: 0.01～100。注意: 敵の研究はゲームエンジンによって制限されているため、増やしても意図どおりに動かないことがあります。
castra-prime-nauvis-nukes=有効にすると、原子爆弾の技術から戦場サイエンスパックを取り除き、カストラを訪れなくても研究できるようにします。
castra-prime-buff-equipment=このMODで追加されるエネルギーシールドMK3（HP 450、再生 18/秒、消費電力 300kW）とバッテリーMK3（容量 300MJ）を強化します。チェックを外すと、元のMODの値を使います。
castra-prime-disable-enemy-nukes=敵のタレットが核弾薬を装填しないようにします。対象はロケットタレットの原子爆弾と水素爆弾、砲台の核長距離砲弾（Cerys/Maraxsis）です。装填済みの核弾薬は撃ち尽くすまで残ります。タレットに装填済みの核弾薬は取り除きません。
castra-prime-disable-land-mines=設置済みの地雷は取り除きません。
castra-prime-nerf-enemy-bases=すべての敵のデータ収集装置の体力、耐性、再生速度を50%下げます。
