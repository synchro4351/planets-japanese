[tips-and-tricks-item-description]
castra-lithium-supply=[planet=castra]にはリチウムがありません。[item=lithium-battery]を作るには、ほかの惑星から[item=lithium]を輸入するか、[item=nickel-plate]を輸出してほかの場所で電池を作る必要があります。
