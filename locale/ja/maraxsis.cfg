[console]
maraxsis-2-1-message=[color=orange]Maraxsis:[/color] 古いバージョンの Maraxsis のセーブデータを読み込みました。Factorio 2.1 向けの更新では多くのレシピ、技術、機械が変わっているため、古いセーブは手直しが必要になったり、一部の設備が動かなくなったりすることがあります。\nマップを別名で保存してバックアップを取り、数分かけて[planet=maraxsis]の工場にエラーがないか確認してください。\n2.1 で 2.0 の遊び心地を求めるなら、Kryzeth 氏の [color=orange]Maraxsis Classic[/color] MOD の利用も検討してください。
