[entity-description]
rust-treatment-plant=大型の化学洗浄施設です。錆びた金属の処理に特化しています。
rustara-lava-centrifuge=頑丈な高温遠心分離機です。汲み上げた溶岩を急速に冷却・分離し、溶融石とチタン合金を取り出します。
rustara-lava-pool=地殻の深部に通じる溶岩の噴出口です。無尽蔵の熱エネルギーと希少な鉱物を含みますが、安全に汲み上げるには専用の溶岩ポンプが必要です。
rustara-lava-pump=極端な高温に耐えるよう設計された大型ポンプです。溶岩だまりの上に設置し、[item=insulated-pipe]を燃料として供給すると稼働します。
spent-rust-remover=風化した除錆剤の容器です。時間とともに劣化していますが、リサイクルや処理によって残った薬品を回収できます。
sandstone=ラスタラによく見られる堆積岩です。多孔質なので、砕いて工業用の粗研磨材にできます。
rusted-metal-module=古代文明のひどく酸化したモジュールです。洗浄して分解すると、貴重な金属部品が得られます。
preservation-chest=高度な冷却システムを備えた冷蔵庫です。内部の温度を大きく下げ、アイテムの腐敗を大幅に遅らせます。
acceleration-chest=高温多湿を保つ特殊な培養器です。触媒となる環境を作り、アイテムの腐敗を大幅に早めます。
rustara-industrial-debris=荒野に散らばる大きな工業施設の廃墟です。採掘すると鋼材、レール、コンクリートなどの廃材資材が得られます。
rustara-scrap-metal-pile=雑然と積み上がった金属廃材の山です。まだ基本的な鉄板、銅板、石材を取り出せます。
