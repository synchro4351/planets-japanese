[tips-and-tricks-item-name]
rustara-briefing=ラスタラの概要
[tips-and-tricks-item-description]
rustara-briefing=[planet=rustara]は、むき出しの金属が数分で劣化してしまう過酷な惑星です。[item=rusted-metal-module] → [item=rusted-metal-component] → [item=rusted-metal-powder]と多段階で腐敗していくため、価値がなくなる前に鉱石を掘り出して処理する時間との勝負になります。\n\n豊富にある[item=sandstone]は砕いて[item=refined-abrasive]にできます。[item=contaminated-abrasive]はリサイクルの副産物で、[item=crude-abrasive]に変換でき、さらに焼成すると[item=refined-abrasive]になります。これらの研磨材は、惑星中のさまざまな生産ラインで使われます。\n\n[entity=rustara-lava-pool]は地表のあちこちにある地殻の噴出口で、無尽蔵の[fluid=lava]を含んでいます。[entity=rustara-lava-pump]で溶岩を汲み上げ、[entity=rustara-lava-centrifuge]に送ると、[fluid=molten-stone]（[item=stone-slab]や[item=stone-brick]に鋳造できます）と[item=titanium-alloy]に分離できます。これがラスタラの高度な産業の最終生産ラインです。
