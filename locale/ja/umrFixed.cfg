[entity-description]
umr_interface_entity=UMRの第1段階の入力です。ほとんどの固体燃料と液体燃料をUMR燃料網向けに濃縮します。かなりの電力が必要です。設備一式をそろえると、膨大なエネルギーや熱を生み出したり、エキゾチックな炉や組立機を動かしたりできます。使い道はあなた次第です！ 効率 100%
umr_amplifier_entity=UMRの第2段階の入力です。レシピを設定して工程を進めます。900℃の蒸気が大量に必要です。UMRには少なくとも2基の増幅器が必要です。効率 100%
umr_core_entity=UMRの不安定なコアで、第3段階の入力です。レシピを設定して工程を進めます。動作モード: 38.28GW～3.82TW。効率 100%。ごくわずかながら燃料漏れによるメルトダウンのリスクがあります[img=technology/atomic-bomb]。
umr_output_entity=UMRの第4段階の入力です。レシピを設定して工程を進めます。900℃の蒸気が大量に必要です。UMRには少なくとも2基の出力装置が必要になることがあります。効率 100%
umr_converter_entity=UMRの南向き直接電力の最終段階です。
umr_converter_entity_2=UMRの北向き直接電力の最終段階です。
umr_converter_heat_entity=UMRの南向き熱の最終段階です。UMRは少なくとも8基の熱変換器を動かします。
umr_converter_heat_2_entity=UMRの北向き熱の最終段階です。UMRは少なくとも8基の熱変換器を動かします。
umr_neutronic_heater_entity=輸送されてきたUMRの純粋エネルギーを加熱する装置です。
umr_crafting_entity=UMRのエキゾチック組立機の最終段階です。コアから直接、第3段階のエネルギーを消費します。
umr_crafting_entity_2=UMRのエキゾチック重製造施設の最終段階です。コアから直接、第3段階のエネルギーを消費します。高速で巨大な組立機で、ほかの世界やその先のものまで、膨大な量を生産できます。
umr_furnace_entity=UMRのエキゾチック炉の最終段階です。コアから直接、第3段階のエネルギーを消費します。
umr_furnace_entity_2=UMRのエキゾチック重プレス施設の最終段階です。コアから直接、第3段階のエネルギーを消費します。高速で巨大な自動炉で、ほかの世界のものまで、膨大な量を生産できます。
umr_heavyforge_entity=UMRのエキゾチック重鍛造炉の最終段階です。コアから直接、第3段階のエネルギーを消費します。
umr_chemicalplant_entity=UMRのエキゾチック化学プラントの最終段階です。コアから直接、第3段階のエネルギーを消費します。
umr_oilrefinery_entity=UMRのエキゾチック原油精製所の最終段階です。コアから直接、第3段階のエネルギーを消費します。
umr_lab_entity=UMRのエキゾチック研究所の最終段階です。コアから直接、第3段階のエネルギーを消費します。ほかの世界やその先のものまで、あらゆるサイエンスを研究できます。
umr_lab_entity_2=UMRのエキゾチック研究施設の最終段階です。コアから直接、第3段階のエネルギーを消費します。高速で巨大な研究所で、ほかの世界やその先のものまで、あらゆるサイエンスを大量に研究できます。
umr_robot_logistic_entity=物流用の石棺の間でアイテムを運びます。
umr_robot_construction_entity=味方の建造物を自動で建設・修理します。
umr_roboport_entity=ほかのロボットステーションとつながり、建設ロボットと物流ロボットが使う建設ネットワークと物流ネットワークを作ります。
umr_autocannon-turret_entity=拳銃弾を発射する長射程のタレットです。
umr_autocannon-turret45_entity=拳銃弾を発射する長射程のタレットです。
umr_heavylaser-turret_entity=長射程のレーザータレットです。
umr_heavylaser-turret45_entity=長射程のレーザータレットです。
umr_cannon-turret_entity=戦車砲弾を発射する長射程のタレットです。
umr_cannon-turret45_entity=戦車砲弾を発射する長射程のタレットです。
umr_rocket-turret_entity=ロケット弾を発射する長射程のタレットです。
umr_rocket-turret45_entity=ロケット弾を発射する長射程のタレットです。
umr_flamer-turret_entity=UMRの純粋エネルギーを放つ長射程のタレットです。
umr_flamer-turret45_entity=UMRの純粋エネルギーを放つ長射程のタレットです。
umr_plasma-turret_entity=戦術核ビームを放つ長射程の電気タレットです。
umr_plasma-turret45_entity=戦術核ビームを放つ長射程の電気タレットです。
umr_fortress_entity=UMRのエキゾチックな壁です。
umr_active_provider_sarcophagus_entity=中身を物流ネットワークへ送り出します。
umr_passive_provider_sarcophagus_entity=中身を物流ネットワークで使えるようにします。
umr_storage_sarcophagus_entity=物流ネットワーク用の長期保管場所です。
umr_buffer_sarcophagus_entity=個人用物流と自動建設で使えるように、指定したアイテムを要求します。
umr_requester_sarcophagus_entity=指定したアイテムを物流ネットワークから要求します。
umr_transport_belt_entity=アイテムを自動で運ぶ最も簡単な方法です。
umr_underground_belt_entity=搬送ベルトが別の物体や通れない地形の下をくぐって横切れるようにします。
umr_splitter_entity=搬送ベルト上の荷物を1:1で分配または合流させます。
umr_loader_1x1_entity=搬送ベルトが処理できる速さで、コンテナや機械の中身を積み込んだり取り出したりできます。
umr_locomotive=線路上で列車を動かす究極のエンジンです。装備モジュール用のグリッドを備えており、グリッドには電源モジュールが必要です。外骨格を装備すると編成の移動速度が上がります。
umr_cargo_wagon=線路上でアイテムを運べます。装備モジュール用のグリッドを備えており、グリッドには電源モジュールが必要です。外骨格を装備しても編成の移動速度は上がりません。
umr_fluid_wagon=線路上で液体を運べます。装備モジュール用のグリッドを備えており、グリッドには電源モジュールが必要です。外骨格を装備しても編成の移動速度は上がりません。
umr_quantum_teleporter_entity=量子テレポーターは、同じ設定のほかのテレポーターとインベントリを共有します。チェックボックスにチェックを入れてIDを設定します。チェックの有無がすべて同じテレポーター同士がつながります。1つのサーフェスに同時に設置できるのは1基だけです。
umr_fire-sticker=UMRの炎上です。
umr_fire-flame=UMRの炎です。

