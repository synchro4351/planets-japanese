umr_tech=ほとんどの燃料を消費して電力や熱を生み出す汎用モジュール式反応炉です。強力な炉、組立機、研究所を動かすこともできます。
umr_tech_machine=最先端の汎用自動施設です。ほかの世界やその先のものまで膨大な量を生産でき、アイテム圧縮や大規模な一括レシピと組み合わせれば、通常は使えない生産性ボーナスも得られます。
