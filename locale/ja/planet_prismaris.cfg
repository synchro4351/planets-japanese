[mod-setting-description]
prismaris-entropy-eye-strain-accessibility=エントロピーの海は見た目がテレビの砂嵐に似ており、人によっては不快に感じることがあります。この設定を有効にすると、目に優しい平坦な灰色のテクスチャーに置き換えます。
prismaris-easy-labs-ignore-spoil-percent=通常、サイエンスパックの鮮度によって研究への貢献度が決まります。この設定を有効にすると、研究所は多相サイエンスパックを常に鮮度100%として扱います。
prismaris-lightning-mercy=プリズマリスの雷はロボットに強く引き寄せられ、避雷針の近くにいても落雷することがあります（集雷装置は引き続き完全な保護を提供します）。この設定を有効にすると、雷がロボットを積極的に狙わなくなりますが、代わりにロボットのエネルギー消費が2倍から4倍に増えます。
prismaris-aether-mercy=デフォルトでは、砕けたエーテル結晶の一部の変種は回路/フィルターのUIとファクトリオペディアで非表示になっています。この設定を有効にすると、すべての変種が完全に表示され、読みやすいようにツールチップが調整されます。
prismaris-dust-mode=エントロピー粉塵を燃やしたりレシピで使ったりしたときの挙動を決めます。この設定を変更すると、工場の一部を設計し直す必要が生じることがあります。
prismaris-rock-candy=[item=prismaris-aethric-shard]の特性を決めます。
prismaris-preserve-outputs=有効にすると、腐敗するプリズマリスのアイテムが、それをクラフトした機械の中では腐敗しなくなります。機械のインベントリが複数の腐敗した生産物で埋まるまでより長くクラフトでき、出力は常に新鮮になります。
prismaris-spoil-speed=全体の腐敗速度を変えずに、プリズマリスのすべてのアイテムの腐敗速度を調整します。いつでも安全に変更できます。
prismaris-add-polysci-to-endgame=アクィロ以降の技術に多相サイエンスパックが必要になります。一部のMODパックは互換性のためにこの設定を上書きすることがあります。
prismaris-science-phase=多相サイエンスをエンドゲームのサイエンスにどのように追加するかを決めます。「エンドゲームの研究に多相サイエンスを追加」が無効の場合は効果がありません。一部のMODパックは互換性のためにこの設定を上書きすることがあります。
prismaris-stasis-removal=クロノサイクラーの停滞モードを削除します。コランダムのアイスボックスやアピア・カルノヴァのリンパによる鮮度回復など、別のMODが腐敗するアイテムを保存する独自の方法を追加していて、機能を重複させたくない場合に便利です。
test-stasis-mode=アルファテスト専用です。停滞モードのクロノサイクラーの2つの異なる動作モードを切り替えます。この設定を変更すると、保存されたアイテムが消えることがあります。
test-reversal-mode=アルファテスト専用です。逆行モードのクロノサイクラーの2つの異なる動作モードを切り替えます。ほとんどのアイテムでは効果がなく、腐敗物や同様の腐敗後のアイテムをクロノサイクラーに入れたときの結果だけが変わります。
