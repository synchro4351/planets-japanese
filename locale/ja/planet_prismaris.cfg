[string-mod-setting-description]
prismaris-dust-mode-default-mode=精製されたエントロピー粉塵（+）は、腐敗してマイナスになっても精製されたままですが、燃やすか消費すると未精製に戻ります。
prismaris-dust-mode-collapse-mode=精製されたエントロピー粉塵（+）は、燃やしたり消費したり腐敗したりすると必ず未精製に戻り、常に再精製が必要です。
prismaris-dust-mode-preserve-mode=一度精製すると、精製されたエントロピー粉塵（+）は燃やしたり消費したり腐敗したりしても精製されたままで、それ以上の処理は必要ありません。
prismaris-rock-candy-inedible=[color=#ff3333][難しい][/color] エーテル結晶はただのアイテムです。
prismaris-rock-candy-candy=[color=#ffff33][普通][/color] エーテル結晶をプレイヤーが食べて回復できます。
prismaris-rock-candy-candy-and-nutrients=[color=#33ff33][易しい][/color] エーテル結晶をプレイヤーが食べたり、バイオチャンバーが腐敗しないが低エネルギーの栄養源として使ったりできます。
test-stasis-mode-refresh=リフレッシュモードは、アイテムの腐敗タイマーをリセットしますが、それ以外は変更しません。
test-stasis-mode-freeze=凍結モードは、腐敗タイマーがはるかに長い新しい「凍結」アイテムを作りますが、再び使う前に別の停滞クロノサイクラーで凍結を解除する必要があります。
test-reversal-mode-simple=逆行クロノサイクラーは、バニラのリサイクラーと同じ結果を生み出します。
test-reversal-mode-complex=他のものが腐敗してできたアイテムを与えると、何が腐敗してそのアイテムになりうるかに基づいて、ランダムな組み合わせのアイテムを生産します。たとえば、腐敗物は栄養素、ゼリー、ユマコのマッシュなどに逆行できます。腐敗までの時間が長いアイテムほど返ってきにくくなります。
prismaris-science-phase-randomized=エンドゲームの研究に必要な多相サイエンスパックは1つだけですが、その相は技術ごとにランダムに選ばれるため、研究所の周りに専用のインフラが必要になることがあります。
prismaris-science-phase-all=多相サイエンスの3つの相すべてが必要で、他のサイエンスパックに比べて3倍の多相サイエンスの生産が求められます。
prismaris-science-phase-all-balanced=多相サイエンスパックの3つの相すべてが必要ですが、技術の研究時間とパックの数量が調整され、全体のサイエンスパック消費量は同じに保たれます。他のMODと競合することがあります。
prismaris-science-phase-rainbow=3つの多相サイエンスパックから作られる「虹のサイエンスパック」を1つ追加します。MOD惑星や追加のサイエンスパックが多いセーブに最適です。複数惑星のMODパックでは、進行を簡素化するためにこの選択肢が強制的に有効になることがあります。
[inventory-restriction]
cant-be-separated=__1__は分離できません。
