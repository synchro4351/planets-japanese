prismaris=絶え間ない嵐と、沸騰する液体エントロピーの混沌とした湖に満ちた世界です。資源は無限ですが、絶えず変化しています。風と雷はロボットに対して不自然なほど敵対的なようですが、使うことも不可能ではありません。
