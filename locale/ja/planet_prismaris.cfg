prismaris-shard-obscuring=[color=#ff0000]R[/color][color=#00ff00]G[/color][color=#0000ff]B[/color][color=#ffffff]W[/color]サイクルの[color=#ffffff]白[/color]の欠片を、[color=#00ffff]C[/color][color=#ff00ff]M[/color][color=#ffff00]Y[/color][color=#000000][font=white-border]K[/font][/color]サイクルの[color=#000000][font=white-border]黒[/font][/color]の欠片に変換します。
prismaris-destabilized-aethric-shard=6つの変種はそれぞれ、やがて6つの固有の資源のいずれかに変化します。
prismaris-flux-capacitor=[item=prismaris-charging-flux-capacitor]を生産します。これはしばらくすると自動的に[item=prismaris-active-flux-capacitor]になります。
prismaris-prismatic-shard-separation=常に、互いに反対のサイクルに属するランダムな欠片をちょうど2つ生産します。
prismaris-aethric-shard-separation=常に、サイクル内のランダムな段階にある欠片をちょうど1つ生産します。
