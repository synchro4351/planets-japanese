[technology-description]
planet-discovery-prismaris=異次元のワームホールの向こうに、絶え間ない嵐と、沸騰する液体エントロピーの混沌とした湖に満ちた色鮮やかな世界があります。資源は無限ですが、絶えず変化しています。風と雷はロボットに対して不自然なほど敵対的なようですが、適切な保護があれば使うことも不可能ではありません。
prismatic-separation=[item=prismaris-prismatic-shard]を色とりどりの多くの変種に分離し、後で組み合わせて有用なアイテムにします。
prismatic-synthesis=[item=prismaris-prismatic-shard]から得られる多くの欠片を組み合わせて[item=prismaris-ferric-shard]、[item=prismaris-cupric-shard]、[item=prismaris-lithic-shard]にし、基本資源をクラフトします。
aethric-cultivation=[item=prismaris-aethric-shard]をほぼ同一の多くの変種に分離します。その一部は[entity=agricultural-tower]で植え直して[entity=prismaris-cultivated-aether-crystal]を再び育てられます。
aethric-destabilization=[item=prismaris-aethric-shard]から得られる結晶をさらに不安定化し、さまざまな有機物、鉱物、石油化学材料へ自発的に変成させます。
entropic-sea-filtering=[fluid=prismaris-liquid-entropy]をろ過して、[fluid=water]と、有用な触媒かつ燃料の前駆体である[item=prismaris-raw-entropic-dust-positive]を抽出します。
void-essence-refining=[fluid=prismaris-raw-void-essence]を精製して[fluid=prismaris-concentrated-void-essence]にし、時間を歪める多くの機械を動かします。やがては高い生産性によって無からさらに物質を生み出せるようになります。
void-essence-stabilization=残念ながら、[fluid=prismaris-concentrated-void-essence]は使用後に[fluid=prismaris-distorted-void-essence]になります。[item=prismaris-refined-entropic-dust-positive]を使えば、再び安定化して濃縮できます。ヴォイドエッセンスは通常サイクルごとに失われますが、ループ内の建物の平均生産性が25%を超えると自然に生み出されることがあります。
flux-capacitor=[item=prismaris-active-flux-capacitor]は、時間操作技術に欠かせない部品です。
green-polyphasic-science-pack=グレバの農業サイエンスパックと同様に、[item=prismaris-green-polyphasic-science-pack]は腐敗します……赤と青の変種に。十分な時間が経てば、やがて緑の相に戻ります。[entity=chemical-plant]または[entity=biochamber]でクラフトできます。
red-polyphasic-science-pack=[item=prismaris-red-polyphasic-science-pack]を直接クラフトできるようになり、[entity=biochamber]の代わりに[entity=foundry]でもクラフトできます。赤の変種は緑に比べて流体の消費量が2倍でクラフトも遅いですが、追加のサイエンスパックを無料でクラフトする確率があります。
blue-polyphasic-science-pack=[item=prismaris-blue-polyphasic-science-pack]を直接クラフトできるようになり、[entity=biochamber]の代わりに[entity=electromagnetic-plant]でもクラフトできます。青の変種は流体の消費量が半分ですが、緑の変種よりクラフトが遅くなります。
complete-polyphasic-science=多相科学を完全に習得しました。ここから先には、時間と空間の真の支配が待っています……
entropic-nurturing=[item=prismaris-refined-entropic-dust-positive]を[item=prismaris-entropic-nutrients]に変換して[entity=biochamber]に与えられます。このエントロピー栄養素は、簡単に再処理してさらにエントロピー栄養素に戻せる副産物を生み出すため、太陽系のどこでもバイオチャンバーに無限に自己補充される食料を供給できます。
lunar-panels=時間を歪める処理によって月光に含まれるエネルギーを採取・増幅し、[entity=prismaris-lunar-panel]は昼ではなく夜に電力を生み出します。
chronocycler-core=クロノサイクラーは、コギターに次いで2番目に強力な時間を歪める技術です。残念ながら、追加の工程で設定しなければ、役に立たない金属の塊にすぎません。設定したクロノサイクラーは[fluid=prismaris-concentrated-void-essence]を燃料として使い、副産物として[fluid=prismaris-distorted-void-essence]を生み出します。
chronocycler-acceleration=時間の流れを加速するように設定したクロノサイクラーは、中に入れたアイテムをただちに腐らせ、腐敗させます。グレバではほとんどの場合すぐに腐敗物になりますが、プリズマリスでは多相アイテムがただちにサイクルの次の段階へ進みます。警告: 極めて危険です！ 生物には使用しないでください！
chronocycler-stasis=時間の流れを止めるように設定したクロノサイクラーは、中に入れたアイテムの鮮度をただちに100%に戻します。（注: 今後のアップデートでこの機能は変更される可能性があります。）
chronocycler-reversal=時間の流れを逆転させるように設定したクロノサイクラーは、アイテムを作られる前の状態に戻します。実際には[entity=recycler]と同様に機能しますが、このモードのクロノサイクラーはフルゴラのリサイクラーと比べて、速度が遅い代わりにわずかな品質と生産性のボーナスを持っています。さらに、この設定のクロノサイクラーは、通常は一切リサイクルできないプリズマリス固有のアイテムをリサイクルできる唯一の手段です。
prismaris-bonus-worker-robots-speed=時間への理解が深まったことで、物流ロボットと建設ロボットの飛行速度が大幅に上がります。
prismatic-tesla-turret=時間位相の歪みによって、電気ダメージ以外のダメージ種別を与える[entity=tesla-turret]を建設できます。電気耐性が異常に高い標的に有効です。
prismatic-laser-turret=時間位相の歪みによって、レーザーダメージ以外のダメージ種別を与える[entity=laser-turret]を建設できます。レーザー耐性が異常に高い標的に有効です。
cogitor=コギターは時間操作技術の頂点です。特殊な触媒結晶を使い、あるサイエンスパックを別の種類に変成でき、その過程で品質が上がる確率が非常に高くなります。触媒結晶はこの工程で消費されませんが、使用後の再充電に非常に長い時間がかかります。幸い、それを解決する手段はすでに手元にあります。
cogitor-alien-science=さらなる実験により、コギターでグレバ、フルゴラ、ヴルカヌスの科学的知見を処理できるようになります。
cogitor-promethium-science=さらに進んだ実験により、コギターでアクィロと深宇宙の最も高度な科学的知識を処理できるようになります。
void-beacon=ヴォイドビーコンは[entity=beacon]を大幅に強化したバージョンで、より広い範囲をカバーし、モジュールの効果をさらに増幅できます。品質モジュールと生産性モジュールの効果も送信できます。ただし、エネルギー消費が大幅に高く、建物が同時に効果を受けられるヴォイドビーコンの数には上限があります。ヴォイドビーコンと通常のビーコンは異なる周波数で動作するため、互いの効果は干渉しません。
prismaris-bonus-lab-speed=時間操作の知識を使って研究所の速度を上げます。
prismaris-bonus-lab-productivity=ヴォイドエネルギーを使い、サイエンスパック1個あたりの研究の進み具合をわずかに増やします。
metallurgic-productivity=溶融鉄と溶融銅のレシピの生産性が上がります。
holmium-productivity=ホルミウム溶液の生産性が上がります。
bioflux-productivity=バイオ融剤の生産性が上がります。
thermal-flux=プリズマリスではエネルギーも物質と同じように自由に変化し、他の場所ではさらに自由に変化します。エネルギー変換の力を使い、プリズマリスの資源や太陽系の他の場所の鉱物資源をより効率よく処理できるようになります。
chronopetrochemistry=時間の流れを加速することで、有機物を分解させて[fluid=crude-oil]にできます。
metaphysical-glassworking=ガラス細工は古代の技術です。しかし、ガラスをプリズマリスの現実を歪めるエネルギーにさらすことで、物質やエネルギー、さらには時空そのものを屈折させられるプリズムを作り出せます。
