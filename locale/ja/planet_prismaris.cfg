[entity-description]
prismaris-crystal-separator=プリズム結晶とエーテル結晶を、絶えず変化する多数の破片に分離します。
prismaris-reversal-chronocycler-simple=[entity=recycler]と同様に、逆行クロノサイクラーは製錬と化学を除くほとんどの工程を元に戻します。リサイクラーと比べて、平均してわずかに多くの割合で元の非流体の材料を返し、さらに品質が上がる確率をわずかに持っています。プリズマリスの資源の多くをリサイクルできる唯一の機械です。
prismaris-reversal-chronocycler-complex=[entity=recycler]と同様に、逆行クロノサイクラーは製錬と化学を除くほとんどの工程を元に戻します。リサイクラーと比べて、ボーナス生産物を返す確率と品質が上がる確率がありますが、[item=spoilage]や同様の副産物を投入すると予期しない結果になることがあります。プリズマリスの資源の多くをリサイクルできる唯一の機械です。
prismaris-stasis-chronocycler-refresh=停滞クロノサイクラーは、腐敗するアイテムを受け取り、その鮮度を100%に戻します。
prismaris-stasis-chronocycler-freeze=停滞クロノサイクラーは、腐敗するアイテムを受け取り、その時間の流れを100分の1に遅くします。遅くなったアイテムを再び投入するとこの処理が元に戻り、再び使えるようになります。
prismaris-acceleration-chronocycler=加速クロノサイクラーは、腐敗するアイテムを受け取り、ただちに腐敗させます。加速したアイテムの約20%は消滅します（腐敗生成物は80%しか残りません）が、一部のより複雑なアイテムは危険なく加速できます。
prismaris-lunar-panel=月と星のエネルギーに同調した月光パネルは、昼ではなく夜に電力を生み出します。
prismaris-void-beacon=標準のビーコンより強力なバージョンで、生産性と品質の効果も送信できるようになりました。標準のビーコンより多くの電力を消費します。どの機械も同時に__1__基を超えるヴォイドビーコンの恩恵は受けられません。
prismaris-cogitor=特殊な触媒結晶を使い、コギターはあるサイエンスパックを別の種類に変換できます。その際、サイエンスパックの品質が上がる確率が非常に高くなります。触媒結晶は常に[quality=normal]です。
prismaris-electric-heater=電流から熱を生み出し、接続されたヒートパイプと周囲の広い範囲の両方に放射します。熱の需要に応じて消費電力を調整しますが、内部の非効率により常にわずかなエネルギーを浪費します。
prismaris-fire-laser-turret=火炎ダメージを与えます。
prismaris-explosion-laser-turret=爆発ダメージを与えます。
prismaris-acid-laser-turret=酸ダメージを与えます。
prismaris-poison-laser-turret=毒ダメージを与えます。
prismaris-electric-laser-turret=電気ダメージを与えます。
prismaris-physical-laser-turret=物理ダメージを与えます。
