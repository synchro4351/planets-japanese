[tips-and-tricks-item-description]
planet-prismaris-briefing=[planet=prismaris]は、絶え間ない雷雨と泡立つ液体エントロピーの世界で、小さな陸地の島が点在しています。\n[entity=prismaris-cultivated-aether-crystal]、[entity=prismaris-prismatic-shard]、[entity=prismaris-void-essence-well]、[tile=prismaris-entropic-sea]を組み合わせると、すべての基本資源を無限に供給できます。ただし、すべての工程が循環型の生産チェーンと絶えず変化する資源を伴います。\n\nさらに、[entity=prismaris-prismatic-shard]と[entity=prismaris-void-essence-well]は大きく離れていることがあり、追加の資源を回収するには長距離の物流が必要になります。
hostile-atmosphere=[planet=prismaris]の雷は[planet=fulgora]の雷と似ています。ただし、いくつか注目すべき違いがあります:\n- 雷は昼夜を問わず落ちますが、平均して落ちる頻度が低いため、得られる電力は少なくなります。\n- 雷はときどき[entity=lightning-rod]を無視して[entity=construction-robot]や[entity=logistic-robot]を狙い、[entity=roboport]を増やすたびにさらに敵対的になります（設定で無効にできます）。\n- [entity=lightning-collector]ははるかに優れた保護を提供しますが、フルゴラから輸入する必要があります。\n- [item=personal-roboport-equipment]のロボットも例外ではありませんが、ロボットステーションの近くに立っていなければ狙われません。\n\nさらに、プリズマリスの風の強い大気中では、ロボットの飛行に2倍のエネルギーを消費します。敵対的な雷を無効にすると、このエネルギー消費は代わりに4倍に増えます。
prismatic-shards=[item=prismaris-prismatic-shard]は、[entity=prismaris-crystal-separator]で8種類の欠片に分離でき、常に各サイクルから1つずつ、一度に2つの欠片が生産されます。\n各欠片は、赤・緑・青・白（[color=#ff0000]R[/color][color=#00ff00]G[/color][color=#0000ff]B[/color][color=#ffffff]W[/color]）サイクルか、シアン・黄・マゼンタ・黒（[color=#00ffff]C[/color][color=#ff00ff]M[/color][color=#ffff00]Y[/color][color=#000000][font=white-border]K[/font][/color]）サイクルのいずれかに属します。時間が経つと、各欠片はサイクルの次の段階へと腐敗し、これを繰り返します。\n[recipe=prismaris-shard-illumination]と[recipe=prismaris-shard-obscuring]で、欠片を一方のサイクルからもう一方へ変換できます。\n赤、青、緑、シアン、黄、マゼンタを組み合わせると、最終的に[item=iron-ore]、[item=copper-ore]、[item=stone]を生産できます。
aehtric-shards=[item=prismaris-aethric-shard]は[entity=prismaris-cultivated-aether-crystal]から収穫でき、砕けたエーテル質の欠片に分離できます。これらの欠片は6段階の短いライフサイクルを持ちますが、各段階はほとんど見分けがつかないため、仕分けが困難です。\n各段階は、[entity=prismaris-crystal-separator]、[entity=prismaris-thermal-flux-furnace]、[entity=biochamber]のうち好きなもので処理すると、それぞれ異なる資源を生産できます。サイクルで生産される資源の順序は次のとおりです:\n- [item=calcite]\n- [item=coal]\n- [item=carbon]\n- [item=solid-fuel]\n- [item=jelly]\n- [item=yumako-mash]\n\n[entity=agricultural-tower]で植え直せるのは[item=prismaris-shattered-aethric-shard-f]だけです。\n\nMOD設定に、欠片を見分けやすくする設定があります。
entropic-sea=[tile=prismaris-entropic-sea]は[fluid=prismaris-liquid-entropy]の供給源です。投げ込まれたアイテムを[tile=lava]のように破壊しますが、それ以外は[tile=water]と同じように振る舞います。\n\nエントロピーの海の上には[tile=prismaris-solidified-entropy]を設置できます。\n\nエントロピーの海の見た目が気になる場合は、MOD設定に目の疲れを軽減するアクセシビリティ設定があります。
entropic-dust=[fluid=prismaris-liquid-entropy]は、[entity=chemical-plant]でろ過してエントロピー粉塵と[fluid=water]にできます。\n\nエントロピー粉塵には4つの形態があります:\n[item=prismaris-raw-entropic-dust-positive]と[item=prismaris-raw-entropic-dust-negative]は、時間とともに交互に入れ替わります。\n[item=prismaris-refined-entropic-dust-positive]は炉で作ることができ、腐敗すると[item=prismaris-refined-entropic-dust-negative]に、燃料として燃やすかレシピで消費すると[item=prismaris-raw-entropic-dust-negative]に戻ります。\n\nレシピで役に立つのはプラスの形態だけです。\n\n生産性をうまく活用すると、エントロピー粉塵が無から自然に増殖することがあります。
entropic-nutrients=[item=prismaris-entropic-nutrients]は[entity=biochamber]に与えられます。腐敗すると[item=prismaris-refined-entropic-dust-negative]に、燃えると[item=prismaris-raw-entropic-dust-negative]に戻り、どちらも最終的に再処理してさらにエントロピー栄養素にできるため、自給自足の栄養素供給が可能です。ただし、エントロピー栄養素はクラフトレシピで[item=nutrients]の代わりにはなりません。
void-essence=[fluid=prismaris-raw-void-essence]は精製して[fluid=prismaris-concentrated-void-essence]にできます。\n\nこれを材料として使うすべてのレシピと、燃料として燃やすすべての機械は、体積の80%を[fluid=prismaris-distorted-void-essence]として返します。歪んだヴォイドエッセンスは処理して[fluid=prismaris-stabilized-void-essence]にし、さらに[fluid=prismaris-concentrated-void-essence]に戻せますが、各工程で体積の20%を失います。\n\n各工程の生産性が平均25%を超えると、ヴォイドエッセンスが無から自然に生み出されます。必要に応じて、これは役に立つこともあれば問題になることもあります。
flux-capacitor=フラックスキャパシターは、[planet=prismaris]の多くの技術や、[item=prismaris-red-polyphasic-science-pack]、[item=prismaris-green-polyphasic-science-pack]、[item=prismaris-blue-polyphasic-science-pack]の作成に欠かせない部品です。\n\n[item=prismaris-charging-flux-capacitor]としてクラフトされますが、クラフトに使うには[item=prismaris-active-flux-capacitor]になるまで待つ必要があります。短い時間枠を過ぎると[item=prismaris-discharged-flux-capacitor]になり、使う前に手動で充電状態にリセットする必要があります。\n\nタイミングが重要です。
chronocycling=[item=prismaris-unconfigured-chronocycler]は、[item=prismaris-acceleration-chronocycler]、[item=prismaris-stasis-chronocycler]、[item=prismaris-reversal-chronocycler]に設定できます。設置しないままだと、これらのアイテムはやがて未設定の状態に戻ります。\n\nすべてのバージョンのクロノサイクラーは[fluid=prismaris-concentrated-void-essence]を燃料として消費し、体積の80%を[fluid=distorted-void-essence]として返します。ここでは生産性によってこの比率は変わりません。
chronocycler-stasis=[entity=prismaris-stasis-chronocycler]は腐敗するアイテムを保存します。機能はMOD設定で調整できます。\n- 「リフレッシュ」モードでは、腐敗までの時間を100%に戻します。\n- 「凍結」モードでは、現在の鮮度を維持したまま、アイテムの腐敗までの時間を大幅に延ばします。凍結したアイテムは、使う前に凍結を解除する必要があります。
chronocycler-acceleration=[entity=prismaris-acceleration-chronocycler]は、腐敗するアイテムを強制的にただちに腐敗させます。プリズマリスや、他のMODの循環的に腐敗するアイテムに使うと、アイテムを特定の形態まで早送りできます。
chronocycler-reversal=[entity=prismaris-reversal-chronocycler]は[entity=recycler]の代わりとして機能します。速度は遅いですが、生来の生産性ボーナスがあり、元の材料をより多く回収できます。また、プリズマリス固有のアイテムをリサイクルできる唯一の手段でもあります。\n\nMOD設定には、逆行クロノサイクラーについて2つの選択肢があります:\n- 単純な逆行は、リサイクラーとまったく同じ結果を生み出します。\n- 複雑な逆行はほぼ同じように機能しますが、腐敗によって生じたアイテムを与えると、腐敗の過程を元に戻し、そのアイテムの元になりえたアイテムを生産します。たとえば、[item=spoilage]はランダムに[item=jelly]、[item=jellynut]、[item=yumako-mash]、[item=yumako]、[item=nutrients]、[item=bioflux]、[item=raw-fish]のいずれかになり、その確率は腐敗までの時間の長さに反比例します。これはMODのアイテムでも機能します。サイエンスパックはこの処理から意図的に除外されています。
thermal-flux=[entity=prismaris-thermal-flux-furnace]は[entity=electric-furnace]の上位版で、電気ではなく熱で動作します。また、[item=prismaris-ferric-shard]、[item=prismaris-cupric-shard]、[item=prismaris-lithic-shard]を[entity=assembling-machine-3]よりも効率よく処理できます。25%の生産性ボーナスと6つのモジュールスロットを持っています。\n\n[entity=prismaris-electric-heater]は燃料なしで熱エネルギーを供給でき、[planet=aquilo]のような凍てつく世界では広い範囲に熱を放射できます。エネルギー消費は需要に応じて変わりますが、わずかな非効率があるため、[fluid=steam]から自身を動かすのに十分な電力を生み出すことはできません。
