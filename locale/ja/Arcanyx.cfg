[mod-setting-description]
s6x-arcanyx-voidcraft=ヴォイドクラフトをアルカニクス専用の仕組みにしたい場合、ヴォイドクラフトをアルカニクスに限定します。有効にする場合は、「原子力にミスリルを必要にする」も無効にすることをおすすめします。
s6x-arcanyx-incantation=アルカニクス以外の場所で詠唱を作れないようにします。
s6x-prismite-on-nauvis=有効にすると、アルカニクスを導入していない場合と同じように、Iridescent Industry がナウヴィスにもプリズマイトを生成します。早い段階でプリズマイトが手に入ることに合わせて、技術ツリーも変わります。
s6x-void-ocean-dump=インサータが不要なアイテムをヴォイドの海に捨てられるようにします。
s6x-arcanyx-mythril-nuclear=原子力技術にミスリルが必要かどうかを決めます。Iridescent Industry で「安全な統合」を使っている場合は効果がありません。
s6x-arcanyx-spirits=アルカニクスを汚染したとき、アルカニクスの精霊が報復してくるかどうかを決めます。
s6x-arcanyx-aquilo-requirement=アクイロに到達するために、アルカニクスでの技術の研究が必要かどうかを決めます。
s6x-arcanyx-landfill-cost=埋め立て材を作るのに必要な石の量です。埋め立て材のヴォイドクラフトにかかる時間はこの数値に比例します。
s6x-arcanyx-vulcanus=アルカニクスとヴルカヌスの間に宇宙航路を追加します。
s6x-arcanyx-turbo-belt=ヴルカヌスだけでなくアルカニクスでもターボ搬送ベルトを製造できるようにします。
s6x-arcanyx-prismite-time=プリズマイト鉱石のヴォイドクラフトにかかる時間を決めます。標準の Voidcraft では4秒ですが、プリズマイトの採掘を促すため、アルカニクスでは長くなっています。
s6x-lightning-min=集雷器の建設に必要な最小の磁場です。フルゴラでは初期値で問題ありませんが、ほかのMODとの互換性のために低い値が必要になる場合があります。
s6x-arcanyx-enviromorph=ほかの惑星の固有の特徴を、アルカニクスで部分的に再現できるレシピです。やや強すぎるため初期状態では無効ですが、アルカニクス中心のゲームをしたい場合は楽しめます。
s6x-voidstone-uses-669=ヴォイディウム-669を必要とするヴォイドストーン合成のレシピを復活させます。

