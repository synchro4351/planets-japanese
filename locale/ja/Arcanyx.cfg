[technology-description]
planet-discovery-arcanyx=異様なエネルギーに包まれた謎の惑星です。プリズマイトとヴォイドストーンという希少な物質があり、失われた秘術学の技を探究できます。
s6x-prismite-lava-separation=ヴルカヌスの溶岩から深紅のプリズマイトエッセンスを抽出します。
s6x-prismite-spoilage-melting=グレバの腐敗物から新緑のプリズマイトエッセンスを抽出します。
s6x-prismite-lightning-liquefaction=フルゴラの雷から紺碧のプリズマイトエッセンスを抽出します。
s6x-voidstone-synthesis=放射性同位体を操作することで、ヴォイドストーンを合成できます。
s6x-void-flux-gathering=アルカニクスの地下には、未精製のヴォイドフラックスが豊富に埋蔵されています。
s6x-entropic-creation=魔法の岩同士をぶつけて、何が起こるか見てみましょう。
s6x-voidworks-burner-conversion=ヴォイドフォージを、より一般的な可燃性の燃料で動くように変換できます。速度は上がりますが、汚染を吸収するのではなく生み出すようになります。
s6x-incantation=アルカニクスの魔法にはさまざまな形がありますが、なかでも詠唱は最も直接的であからさまなものです。
s6x-magic-air-purifier=ピュリファクスの詠唱を、時間をかけてゆっくりと発動できるようにします。
s6x-enviro-adapt=アルカニクスの地表には強力な変容性の元素が存在するため、その環境は改変に適しています。
s6x-nauviforming=ヴォイドの海をすばやく変成できるようになり、放射性物質も生産できるようになります。
s6x-vulcanoforming=アルカニクスで溶岩、方解石、タングステンを生産できるようになり、鋳造所も建設できるようになります。
s6x-glebaforming=アルカニクスでグレバの植物を栽培できるようになり、バイオチャンバーも建設できるようになります。
s6x-fulgoraforming=アルカニクスでホルミウムを生産できるようになり、リサイクラーと電磁プラントの建設や、雷による発電もできるようになります。
automation-science-pack-arcanyx=アルカニクスでは、秘術学の技法をより一般的な研究にも応用できます。
logistic-science-pack-arcanyx=アルカニクスでは、秘術学の技法をより一般的な研究にも応用できます。
chemical-science-pack-arcanyx=アルカニクスでは、秘術学の技法をより一般的な研究にも応用できます。

