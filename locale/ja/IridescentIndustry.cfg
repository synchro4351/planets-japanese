[mod-setting-description]
s6x-location-unlock=Space Age の地表の制限をほぼ撤廃し、ほとんどのものをほとんどの場所で建設・クラフトできるようにします。
s6x-ii-overlap-tech=Iridescent Industry と Voidcraft には、技術ツリーに共通の要素がいくつかあります。この設定で、どちらのMODの技術ツリーを優先するかを決めます。Arcanyx でナウヴィスのプリズマイトを有効にしている場合は無視されます。
s6x-ii-krastorio-overlap-tech=Iridescent Industry と Krastorio のどちらの空気浄化技術を使うか、あるいは何らかの理由で両方使うかを決めます。
s6x-ii-overlap-tech-container=Krastorio を使っているときに、Iridescent Industry の大型コンテナのうちどれを有効にするか（または有効にしないか）を決めます。
s6x-centrifuge-tinting=Bluetonium を導入している場合は、そちらが優先されます。
s6x-prismite-ore-scrap=プリズマイトの残滓を出すはずのプリズマイトのレシピが、代わりにプリズマイト鉱石を出すようになります。
s6x-prismite-ore-stone-crush=プリズマイト鉱石の粉砕で出るランダムな副産物を、砂ではなく石にします。
s6x-ii-compatibility-mode=技術とレシピへの変更を最小限にして、進行中のゲームに組み込みやすくします。それでも工場全体が壊れたときのために、セーブデータのバックアップを取っておいてください！ プリズマイトの設備を作り終えたら、この設定は無効にすることをおすすめします。
s6x-ii-promethium=プロメチウムを使う終盤の技術を追加します。
s6x-ii-azoth=加工して再利用できる流体、アゾートを追加します。Space Age のフルオロケトンや Krastorio の汚水に似ています。
s6x-ii-logistics-5=このMODで5段階目のベルトを追加するかどうかを決めます。ほかのMODですでに追加している場合は、無効にするとよいでしょう。
s6x-prismvoidtronics-revert=以前の量子プリズムヴォイドトロニクスのレシピを復活させます。プロメチウムの加工が無効の場合は効果がありません。
s6x-ii-simple-gem-recipes=プリズマのルビー、エメラルド、サファイアに、より簡単なレシピを使います。
s6x-ii-coal-copper-gem-recipes=Iridescent Industry 1.1 で調整される前と同じように、宝石のレシピに必要な銅鉱石と石炭を増やします。簡単な宝石のレシピが有効な場合、この設定は効果がありません。
s6x-ii-lds-prismite=鋳造所で低密度構造体を鋳造するときに、精製プリズマイトも必要にするかどうかを決めます。
s6x-runestone-carbon=ルーンストーンのレシピで、焼けたプリズマイトの代わりに炭素を使います。
s6x-inversion-mix-carbon=反転変換液のレシピで、ルーンストーンの代わりに炭素を使います。
s6x-prismite-rocket-solid-fuel=プリズマイトロケット燃料には通常は精製プリズマイトが必要ですが、このレシピではそれを固形燃料に変えます。Voidcraft の技術ツリーで Voidcraft を使っている場合、この設定は無視されます。
s6x-arcane-glass=Iridescent Industry のレシピで、ただの「ガラス」ではなく新しいアイテムの「結晶ガラス」を使うようにします。ガラスを追加する互換性のないMODがある場合に便利です。
s6x-colored-concrete=色付きコンクリートの技術とレシピを追加します。
s6x-colored-concrete-flatten-transitions=異なる色のコンクリートが、境界の模様なしで直接つながるようにします。色付きコンクリートが無効の場合、この設定は効果がありません。
s6x-ii-prismorphing-mode=旧（0.7以前）と新のどちらのプリズモーフィングのレシピを使うかを決めます。移行モードでは両方のレシピが有効になり、すべてを壊さずに工場を切り替えられますが、バランスは取れておらず、長期のプレイには向いていません。
s6x-old-prismogenesis=Iridescent Industry 1.0 より前のプリズモジェネシスのレシピを復活させます。

