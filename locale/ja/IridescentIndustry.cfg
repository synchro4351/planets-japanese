[technology-description]
s6x-prismite-basic=プリズマイトは非常に有用な物質ですが、直火で精製する方法は非効率で、トラブルも起こりがちです。
s6x-iridescent-illumination=プリズマイトはさまざまな色に明るく光らせることができ、照明に役立ちます。
s6x-prismite-fuel=精製が不完全なプリズマイトには可燃性の成分が多く含まれていて、燃料として使えます。
s6x-mythril=ミスリルは強くて軽い合金で、さまざまな工業用途があります。
s6x-mythril-engine=ミスリルを使うと、効率がよく強力なエンジンを作れます。
s6x-mythril-railway=線路に鋼材の代わりにミスリルを使えます。
s6x-void-mythril=ヴォイドクラフトでミスリルを召喚できるようになります。
s6x-iridescent-science-pack=プリズマイトには、さらに調べる価値のある興味深く有用そうな性質が数多くあります。
s6x-polychromatic-science-pack=プリズマイトの数多くの有用な性質をさらに深く探究します。
s6x-prismite-melting=未加工のプリズマイトは、錬金術の工程で3つの基本的なプリズマ元素に分解できます。
s6x-prismite-melting-ref=プリズメルターで精製プリズマイトを使うと、収量が増え、副産物が出なくなります。
s6x-prismite-electric=プリズマイト鉱石を確実かつ効率よく精製プリズマイトに加工するのに必要な、一定で均一な熱を出せるのは電気炉だけです。
s6x-prismite=ヴォイドクラフトでプリズマイト鉱石を召喚できるようになります。
s6x-prismogenesis=適切な条件の下では、プリズマイトはその特別な性質をよりありふれた物質に広げることができます。
s6x-prismite-melting-vc=ヴォイドフラックスを加えるとプリズメルターの収量が増えますが、反応はエントロピーの影響を受けやすくなります。
s6x-prismite-morphing=プリズマ元素は非常に用途が広く、さまざまな有用な製品に変換できます。
s6x-void-prismite-conv=ヴォイドフラックスのエントロピーのエネルギーを使って、プリズマイト鉱石をさまざまな物質に直接変換することもできます。
s6x-prism-inserter=プリズマ元素から直接インサータを鋳造できます…同じ色である限りは。
s6x-ii-container2=より多くのアイテムを保管できる、大きなコンテナです。
s6x-ii-container3=さらに多くのアイテムを保管できる、さらに大きなコンテナです。
s6x-accumulator-crystal=エネルギーを帯びたプリズマイト結晶は、大量のエネルギーを蓄えられます。
s6x-prismtronics=プリズマ元素の特別な性質を利用して、電子部品を作ることができます。
s6x-prismtronics-processing=より高度なプリズマ電子部品を作れるようになります。
s6x-prismite-crystal=プリズマイトは、有用な結晶に鍛えることができます。
s6x-prismite-crystal-glass=プリズマイト結晶から作ったガラスは透明で丈夫です。
s6x-prismite-gems=純粋なプリズマ元素から宝石を作れるようになります。
s6x-inversion-conversion=適切な触媒があれば、プリズマ元素の色の周波数を反転できます。
s6x-prismite-rocket-fuel=プリズマイト燃料から作る強力なロケット推進剤です。
s6x-prismite-laser-turret=プリズマイトは、ビーム兵器の焦点を合わせたり、発射するエネルギーを供給したりするのに役立ちます。
s6x-vulc-prismite=ヴルカヌスの熱と圧力の中では、時の始まりと同じようにプリズマイトを鍛え上げられる条件が整います。
s6x-bioprismite=プリズマイトそのものは有機物ではありませんが、生物と多くの共通点があるため、有機物から作り出せます。
s6x-fulg-prismite=適切な条件で強力な電磁力にさらすと、フルゴラのさまざまなガラクタが融合してプリズマイトになります。
s6x-prismite-deep-mine=地表にプリズマイトが豊富でなくても、深く掘れば見つかることがよくあります。
s6x-prismite-deep-mine-advanced=惑星の核には、さらに珍しい物質が長く埋もれています。そこに届くには強力な採掘機が必要です。
s6x-prismite-fusion=3つのプリズマ元素は、強力な核融合反応で再結合できます。
s6x-air-purification=プリズマイトを使うと、空気を新鮮できれいに保てます…少なくとも、あからさまに有毒ではない程度には。
s6x-air-purification-green=新緑のエッセンスは、空気をきれいに保つのに特に適しています。
s6x-prismaximizer=プリズマイトを注入すると、粉砕鉱石の収量を増やせます。
s6x-lunar-panel=無料の電気エネルギー源ですが、昼間は役に立ちません。
s6x-void-runestone=ルーンストーンにはさまざまな用途がありますが、最も重要なのは、ヴォイドクラフトを強化する魔法のルーンの鍛造に使われることです。
s6x-void-runestone-novc=ルーンストーンは、主にプリズマイトの焼けた残りかすから作られる、硬くて丈夫な物質です。
s6x-voidworks-prism=無形のヴォイドとプリズマ元素を組み合わせるとアルカノプラズマを作れます。これを使うと、非常に強力なヴォイドワークスを動かせます。
s6x-voidworks-red=深紅のエッセンスは、ヴォイドフォージの動力源として使えます。
s6x-void-promethium=ヴォイドクラフトでプロメチウムの塊を召喚できるようになります。
s6x-void-quantum=プリズムトロニクスとヴォイドトロニクスを組み合わせると、量子コンピューティング装置を作れます。
s6x-colored-concrete=もちろん、鮮やかな色のプリズマ元素は着色料としても使えます。
s6x-cursed-furnace=異界の炉はプリズマイトに秘術のエネルギーを浴びせ、ランダムに変化させます。ミスリルへの効果はもっと予測しやすいものです。
s6x-cursed-furnace-steel=ミスリルで強化した、さらに強力な異界の炉です。
s6x-azoth=いわゆる「万能溶媒」であるアゾートは、さまざまな（錬金）化学の工程に役立ちます。
s6x-hydromorphing=紺碧のエッセンスを純水に変えるのは、それほど難しくありません。
s6x-air-purification-azoth=ほぼ何でも溶かせるアゾートの性質は、浄化に非常に役立ちます。
s6x-void-coherence-azoth=アゾートを使うと、コヒーレンス注入液の生産効率を大幅に高められます。
s6x-iridescent-transport-belt=さらにもっと速い搬送ベルトです。
s6x-void-belts-iridescent=ヴォイドクラフトで虹色のベルトを召喚できるようになります。
s6x-promethium-ammo=装甲を貫く力に優れた、プロメチウム製の非常に高度な弾薬です。
s6x-azoth-prismite-crystal=強酸で不純物を溶かしながら、アゾート溶液の中でプリズマイト結晶を直接育てられます。
s6x-crystal-holder=近くの効果切れ間近のアズリスタルを、内部に蓄えた新しいものと自動で交換します。
s6x-crimsonite-with-filler=同じ量の深紅のエッセンスから、より多くのクリムゾナイトを作る効率的な工程です。
s6x-prismtronics-green=基板は木になりません！ でも、これはそれに近いものです。
s6x-prismtronics-red=クリムゾナイトから発展基板を作れます。
s6x-prismtronics-blue=アズリスタルは、わずかな確率で結晶の制御基板の材料に適したものがあります。残念ながら、試験すると壊れてしまいます。
s6x-crimsonite-crafting=クリムゾナイトでさまざまな有用な製品を作ります。
s6x-verdance-fuel-advanced=さらに強力な、ヴァーダンスの濃縮版です。

