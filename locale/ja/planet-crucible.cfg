[string-mod-setting-description]
planet-crucible-vanilla-change-amount-all=アクィロで解禁されるほとんどのレシピに、クルーシブルの生産チェーンの生産物を追加します。特に単独の惑星として追加する場合は、これがこのMODの想定する遊び方です。惑星を多数追加するプレイには向かないかもしれません。
planet-crucible-vanilla-change-amount-no-recipes=内惑星のサイエンスパックをすべて必要とするほとんどの技術に、高圧サイエンスパックを追加します。
planet-crucible-vanilla-change-amount-no-technologies=プロメチウムサイエンスパックと研究効率の技術にのみ、高圧サイエンスパックを追加します。
planet-crucible-vanilla-change-amount-none=既存のレシピと技術を変更しません。

