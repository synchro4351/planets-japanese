[tips-and-tricks-item-description]
planet-crucible-briefing=[planet=crucible]は高密度の惑星で、[entity=iron-ore]、[entity=copper-ore]、[entity=uranium-ore]、[entity=stone]、[fluid=water]、[entity=crude-oil]がありませんが、必要なアイテムはすべて[entity=planet-crucible-skarn]と[entity=planet-crucible-emulsion]から生産できます。\n[entity=solar-panel]の効率が高くなります。環境は過酷ですが、自然の脅威はありません。\n[tile=planet-crucible-lava]はしばらくの間ポンプで汲み上げられず、埋め立てができるのはずっと後になりますが、高架レールで渡ることはできます。
planet-crucible-gravity=[img=utility/warning_icon]警告[img=utility/warning_icon] [planet=crucible]は重力と大気圧が極めて大きいため、通常の[item=rocket-fuel]では宇宙に到達できません。\n[planet=crucible]に着陸した後は、[item=planet-crucible-science-pack]を使って惑星から脱出する方法を研究する必要があります。
planet-crucible-metallic-hydrogen=[tooltip=金属水素,tips-and-tricks-item-description.planet-crucible-metallic-hydrogen-enum]はエネルギー密度が高く安定性が低いため非常に危険で、製造には予防措置が必要です。\nあらゆる形態の[tooltip=金属水素,tips-and-tricks-item-description.planet-crucible-metallic-hydrogen-enum]は、破壊されると爆発し、リサイクルもできませんが、[entity=planet-crucible-pressure-forge]で安全に再処理できます。また、宇宙の虚空に安全に廃棄することもできます。\n[tooltip=最も不安定な形態,tips-and-tricks-item-description.planet-crucible-metallic-hydrogen-unstable-enum]の金属水素は、適切に再処理または廃棄しないといずれ勝手に爆発するため、備蓄できません。
planet-crucible-metallic-hydrogen-enum=金属水素:\n[item=planet-crucible-denatured-hydrogen] 変性水素\n[item=planet-crucible-denatured-hydrogen-critical] 変性水素（臨界）\n[item=planet-crucible-hydrogen-plate] 水素板（安定）\n[item=planet-crucible-hydrogen-plate-activated] 水素板（活性）\n[item=planet-crucible-hydrogen-plate-unstable] 水素板（不安定）\n[item=planet-crucible-hydrogen-plate-critical] 水素板（臨界）\n[item=planet-crucible-lithium-hydride] 水素化リチウム\n[item=planet-crucible-hydrogen-cable] 水素フィラメント
planet-crucible-metallic-hydrogen-unstable-enum=最も不安定な金属水素:\n[item=planet-crucible-denatured-hydrogen] 変性水素\n[item=planet-crucible-denatured-hydrogen-critical] 変性水素（臨界）\n[item=planet-crucible-hydrogen-plate-activated] 水素板（活性）\n[item=planet-crucible-hydrogen-plate-unstable] 水素板（不安定）\n[item=planet-crucible-hydrogen-plate-critical] 水素板（臨界）
planet-crucible-space-platform=[img=utility/warning_icon]警告[img=utility/warning_icon] [planet=crucible]の重力は極めて大きいため、宇宙プラットフォームが[space-location=crucible-orbit]に到達するには大きな推力が必要です。__1__ km/sを大きく上回る速度を維持できる場合にのみ、宇宙プラットフォームでこの航行に挑んでください。\n[planet=crucible]の近くにはアステロイドがほとんどないため、宇宙で必要な資源を手に入れる別の方法を、[item=planet-crucible-science-pack]を使って研究する必要があるかもしれません。
