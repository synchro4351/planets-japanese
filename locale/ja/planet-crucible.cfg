[technology-description]
planet-discovery-crucible=押しつぶすような重力と大気圧を持つ、大きく高密度な岩石惑星です。重力が強いため、[space-location=crucible]でロケットを建造するには、この惑星の資源を使いこなす必要があります。チャンスは至るところにあります……プレッシャーに耐えられるならの話ですが。
planet-crucible-kiln=熱で直接稼働する大型の炉です。通常の精錬に加えて液体を投入でき、[item=planet-crucible-skarn]の処理に欠かせません。
planet-crucible-emulsion-processing=[fluid=planet-crucible-emulsion]を有用な液体に処理できるようになります。ときどき原石の[item=planet-crucible-diamond]も手に入ります。
planet-crucible-skarn-processing-adv=[item=planet-crucible-skarn]の潜在能力を最大限に引き出します。
planet-crucible-pressure-forge=高圧工程のための製造設備です。
planet-crucible-hydrogen-processing=高度に加圧した水素には多くの有用な性質がありますが、扱いを誤ると暴走します。
planet-crucible-hydrogen-metallization=高圧科学の聖杯である金属水素を作り出します。
planet-crucible-science-pack=さらに高度な高圧技術の応用です。
planet-crucible-rocket-part=[space-location=crucible]の軌道に到達できるロケットを建造します。
planet-crucible-gem-synthesis=[item=planet-crucible-ruby]と[item=planet-crucible-diamond]のより効率的なレシピです。
planet-crucible-thruster=金属水素を使って、[space-location=crucible]の深い重力井戸からより簡単に脱出します。
planet-crucible-military=金属水素を使って、アステロイドなしで宇宙で弾薬を製作します。
planet-crucible-lithium-hydride=水素を金属化するより効率的なレシピです。
planet-crucible-night-vision-mk2=よりコンパクトな[item=night-vision-equipment]です。
planet-crucible-personal-laser-mk2=より強力な[item=personal-laser-defense-equipment]です。
planet-crucible-offshore-pump=[space-location=crucible]の強い重力の下でも稼働できる、改良型の[entity=offshore-pump]です。
planet-crucible-optics=光を集束・制御するための高度な道具です。
planet-crucible-laser=増大したエネルギーを集束させるためにレンズを必要とする、より高度なレーザー兵器です。
planet-crucible-lens-one=[entity=planet-crucible-laser-turret]用の集束レンズで、衝撃ダメージを与えます。
planet-crucible-lens-two=[entity=planet-crucible-laser-turret]用の集束レンズで、酸ダメージを与えます。
planet-crucible-lens-three=[entity=planet-crucible-laser-turret]用の集束レンズで、炎ダメージを与えます。
planet-crucible-lens-four=[entity=planet-crucible-laser-turret]用の集束レンズで、電気ダメージを与えます。
planet-crucible-lens-five=[entity=planet-crucible-laser-turret]用の集束レンズで、毒ダメージを与えます。

