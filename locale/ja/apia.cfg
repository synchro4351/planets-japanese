[tips-and-tricks-item-name]
apia-briefing=アピアの概要
apia-honeycombs=ハニカムの生産
carnova-briefing=カルノヴァの概要
[tips-and-tricks-item-description]
apia-briefing=[planet=apia]は、[planet=apia]-[planet=carnova]連星惑星系の惑星のひとつです。大気が濃いため、[entity=logistic-robot]や[entity=construction-robot]の運用には多くの資源を消費します。厚い雲に覆われているため、[entity=solar-panel]の効率も大きく下がります。\n地表全体は[fluid=royal-jelly]の海に覆われ、[entity=larvae]が棲んでいます。この生物が硬化した残骸は、[item=stone]と[item=phosphorus]に加工できます。\nこの惑星には、[entity=wild-hive]に棲む蜜を作る昆虫もいます。これを使って[item=honeycombs]、[item=honeycombs-iron]、[item=honeycombs-copper]を生産できます。巣が作るハニカムの種類は、設置した土壌によって変わります。ハニカムを処理すると、[item=iron-ore]、[item=copper-ore]、[item=honey]、[item=wax]が得られます。\nこの惑星のもうひとつの重要な資源は、[item=phosphorus]と[fluid=phosphoric-acid]です。
apia-honeycombs=[planet=apia]の地表は、[fluid=royal-jelly]の海に囲まれた肥沃な土壌の島々でできています。[entity=artificial-hive]は、下にある土壌によって異なる種類のハニカムを生産します。[item=honeycombs]には[tile=apia-biome4]、[item=honeycombs-copper]には[tile=apia-biome5]、[item=honeycombs-iron]には[tile=apia-biome6]が必要です。\nさらに、人工土壌（[item=artificial-honey-soil]、[item=artificial-copper-soil]、[item=artificial-iron-soil]）を使って、養蜂に適した土地を広げられます。
carnova-briefing=[planet=carnova]は、[planet=apia]-[planet=carnova]連星惑星系の惑星のひとつです。地表は[fluid=blood]の海に覆われ、現地の生物である[entity=piranha]の産卵場がよく見つかります。\n基本資源の主な供給源は、鉱物とカルシウムでできた[item=bones]です。ここから[item=iron-ore]、[item=copper-ore]、[item=stone]、[item=phosphorus]、[item=calcite]といった基本資源が得られます。\n地表は[item=flesh]でできた無数の島からなり、加工すると[item=proteins]と[item=lipids]が得られます。工業用の酸の代わりの供給源は[fluid=phosphoric-acid]になります。
