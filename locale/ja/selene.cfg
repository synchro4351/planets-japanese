[mod-setting-description]
selene-provide-missing-oxygen-barrels=セレーネでは呼吸のために酸素入りドラム缶が必要です。ほかのMODが酸素のドラム缶詰めを無効にしたりドラム缶を削除したりしている場合、セレーネはエラーで停止します。これを有効にすると、セレーネがドラム缶とそのレシピを自分で追加します。
