[technology-description]
planet-discovery-selene=クレーターと玄武岩の平原に覆われた、大気のない岩石の天体です。\n月面からは希少な鉱物や核融合燃料を採掘できますが、人間の生命を維持するには酸素の供給を輸入する必要があります。
selene-water-splitting=電気分解によって水を分解し、呼吸可能な酸素を得ます。
selene-electrolytic-crucible=高度な電気分解レシピを使えるようにします。
selene-mirrors=アルミニウムとガラスで作る精密ミラーは、より優れた太陽光発電とレーザータレットの製造への道を開きます。
selene-titanium-working=チタン金属を使ってアイテムを作れるようになります。
selene-aluminium-working=アルミニウム粉末と酸素からロケット燃料を製造できるようになります。
selene-aluminium-canning=アルミ缶を使って、腐敗するものを保存できます。
selene-lunar-science-pack=低重力・ほぼ真空の工程を使った実験ができるようになります。
selene-advanced-lunar-ice-ore-processing=高度な精製により、月の氷鉱石の鉱床からヘリウム3を含んだ重い氷を抽出します。
selene-laser-turret-mk2=電力のみを必要とする、非常に高度な防衛施設です。
selene-orbital-reflector-satellites=宇宙に配置したミラーで、より多くの太陽光を惑星の地表に反射します。
selene-advanced-electrolysis=電解るつぼを使って、より多くの化学物質を構成元素に分解します。
selene-air-recycler=アーマーに装着すると、セレーネで空気を継続的に供給します。
selene-asteroid-electrolysis=電解るつぼを使って、アステロイドから最大限の資源を取り出せるようになります。
selene-massive-electric-pole=軽量なアルミニウム製の鉄塔で、さらに遠くまで電力を送れますが、供給範囲はありません。軽いので、陸上だけでなく浅いオイルの海にも設置できます。
selene-propellant-robotics=冷ガススラスターにより、ローターで押す空気がない場所でもロボットが飛べるようになります。
selene-propellant-efficiency=ノズルと飛行経路を改良し、推進剤の無駄を減らします。
[modifier-description]
propellant-robotics-roboport=大気のない地表でも、酸素ガスを消費してロボットステーションが稼働できるようになります。\n------------------------------\n[item=roboport] __1__\n[item=personal-roboport-equipment] __2__\n[item=personal-roboport-mk2-equipment] __3__
propellant-robotics-personal=携帯ロボットステーションの酸素ガス消費量: __1__ [__2__ → __3__]\n------------------------------\n[item=personal-roboport-equipment] __4__\n[item=personal-roboport-mk2-equipment] __5__
propellant-efficiency-roboport=ロボットステーションの酸素ガス消費量: __1__ [__2__ → __3__]\n------------------------------\n[item=roboport] __4__
propellant-efficiency-personal=携帯ロボットステーションの酸素ガス消費量: __1__ [__2__ → __3__]\n------------------------------\n[item=personal-roboport-equipment] __4__\n[item=personal-roboport-mk2-equipment] __5__
propellant-efficiency-roboport-more=ロボットステーションの酸素ガス消費量がさらに減少します。\n------------------------------\n[item=roboport] __1__
propellant-efficiency-personal-more=携帯ロボットステーションの酸素ガス消費量がさらに減少します。\n------------------------------\n[item=personal-roboport-equipment] __1__\n[item=personal-roboport-mk2-equipment] __2__
