[tips-and-tricks-item-description]
selene-briefing=[planet=selene]は、クレーターと玄武岩の平原に覆われた、大気のない岩石の天体です。[entity=solar-panel]の効率がはるかに高く、低重力のため[entity=rocket-silo]の打ち上げに必要な[item=rocket-part]も少なくて済みます。\n[entity=roboport]と[item=personal-roboport-equipment]は、[technology=selene-propellant-robotics]を研究するまでここでは動作しません。研究後は、[entity=roboport]の稼働に[fluid=oxygen]が必要になり、[item=personal-roboport-equipment]は装備グリッド内の[item=selene-air-barrel]か[item=oxygen-barrel]を消費します。\n[entity=anorthite]は月の高地で、[entity=ilmenite]は海で見つかります。これらは[entity=selene-electrolytic-crucible]を使って資源に変換できます。\n[entity=lunar-ice-ore]は高地のクレーター地帯で見つかり、[item=ice]と[fluid=water]に加工し、さらに[fluid=oxygen]にしてレシピ、生命維持、発電に使えます。
selene-solar-energy-2-mechanics=[entity=selene-solar-mirror]は、日中に太陽光を[entity=selene-solar-collector]に反射して、その温度を上げられます。\n[entity=selene-solar-collector]は[entity=heat-pipe]を使ってほかのエンティティに熱を伝えます。\n[entity=selene-solar-mirror]は集光範囲内で最も近い[entity=selene-solar-collector]のほうを向き、[entity=selene-solar-mirror]を増やすほど温度が速く上がります。
selene-oxygen-mechanics=セレーネのエンジニアは、酸素の供給がないと時間とともに窒息します。[item=selene-air-barrel]と[item=oxygen-barrel]を装備グリッドに入れると呼吸可能な空気が供給されますが、時間とともに減っていきます。[item=selene-air-recycler]は、電力が供給されている限り空気を無限に供給します。\nロボットは[technology=selene-propellant-robotics]を研究するまで真空中をまったく飛べず、研究後は[fluid=oxygen]を使って飛びます。[item=personal-roboport-equipment]のロボットの充電には、グリッド内の同じドラム缶が使われ、[item=selene-air-recycler]からは供給できません。[technology=selene-propellant-efficiency-1]で、ロボットと[entity=roboport]の消費量を減らせます。
