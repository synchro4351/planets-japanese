[mod-name]
se-space-trains=SE 宇宙列車
[mod-description]
se-space-trains=Space Exploration 風の、UPS に優しい磁気浮上式の列車を追加します。Krastorio 2 や Space Exploration と一緒に使うのがおすすめですが、バニラだけでも単体のパックとして動きます。Space Age と Elevated Rails にも完全対応しています。
[mod-setting-name]
space-locomotive-speed-setting=磁気浮上機関車の速度
space-cargo-wagon-capacity-setting=磁気浮上貨物車の容量
space-fluid-wagon-capacity-setting=磁気浮上流体車の容量
space-battery-pack-energy-density-setting=磁気浮上バッテリーのエネルギー密度
space-battery-decay-enable-setting=磁気浮上バッテリーの再生
[mod-setting-description]
space-locomotive-speed-setting=磁気浮上機関車の最高速度を指定します。
space-cargo-wagon-capacity-setting=磁気浮上貨物車の最大積載量を指定します。
space-fluid-wagon-capacity-setting=磁気浮上流体車の最大容量を指定します。
space-battery-pack-energy-density-setting=磁気浮上バッテリーの最大エネルギー密度を指定します。
space-battery-decay-enable-setting=磁気浮上バッテリーの劣化と再生を切り替えます。無効にすると、バッテリーは劣化しません。
