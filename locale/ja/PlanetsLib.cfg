[mod-setting-description]
PlanetsLib-enable-entity-replacements=ほかの起動時設定に結び付いていないエンティティ置き換えを有効にします。MOD作者が置き換えを設定に結び付けていなかった場合に、アンインストールを助けるための予備の手段です。
PlanetsLib-disable-all-entity-replacements=すべてのMODのエンティティ置き換えを強制的に無効にします。MODの設定がひどく壊れている場合以外は不要です。
PlanetsLib-enable-runtime-rocket-silo-replacements=惑星がロケットの積載量倍率やロケット部品倍率を設定している場合、ゲーム中にロケットサイロを置き換えます。MODがこの機能を安全でない方法で使っている場合は、この設定を無効にすれば、動作を止めてセーブデータ内の置き換えを元に戻せます。
PlanetsLib-enable-lab-science-pack-preview-size-change=Altモードで研究所に表示されるサイエンスパックのアイコンを、その研究所が受け付けるサイエンスパックの数に応じて縮小します。
