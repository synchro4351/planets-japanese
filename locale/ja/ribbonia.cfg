bulk-barrel-casting=大量生産されたドラム缶です。いらない液体を処分したいときに最適です。あるいは醸造所を始めるときにも。
ribbonia-rocket-part=より文明的な時代のための、優美なロケット部品です。
ribbonia-alien-science-pack=人工衛星を打ち上げて影響力を広げる手伝いをしたお礼に、C.H.A.R.L.E.S.がくれるものです。
