ribbonia=[space-location=ribbonia] リボニアの概要
fluid-recycler=[entity=fluid-recycler] 空気圧プレス
[tips-and-tricks-item-description]
ribbonia=[space-location=ribbonia]は、正気を失ったフルゴラのAI、[entity=ribbonia-charles]が支配する人工のリングワールドです。ここで生き残るには、限られた空間の中で溶融プラスチック、核融合プラズマ、空飛ぶ列車の扱いを極める必要があります。
