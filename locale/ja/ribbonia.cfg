[tile-description]
fulgoran-space-platform=[planet=ribbonia]の露出した基礎です。魔法と見分けがつかないほど高度な技術でできています。
ribbonia-gap=流星雨で大きく損傷したリングワールドの基礎です。C.H.A.R.L.E.S.がここをすぐに修理することはできないでしょう。
ribbonia-water=一見すると水と間違えそうですが、よく見ると誰かが…地面を青く塗っただけ？ 土をこすりつければ、C.H.A.R.L.E.S.はここに建設させてくれます。滑りやすいです。
ribbonia-void=どう見てもただの何もない宇宙ですが、C.H.A.R.L.E.S.はときどき「星の海」「大いなる広がり」「アストラル界」などと呼んでいます。
[item-description]
molten-plastic-barrel=ドラム缶に入った溶融プラスチックです。しばらくするとプラスチックの塊になります。
lava-barrel=ドラム缶に入った溶岩です。しばらくすると石材になります。
thruster-oxidizer-barrel=閉じ込められるほど丈夫な高品質ドラム缶に入ったスラスター酸化剤です。
thruster-fuel-barrel=閉じ込められるほど丈夫な高品質ドラム缶に入ったスラスター燃料です。
steam-barrel=ドラム缶に入った蒸気です。しばらくするとドラム缶から抜け出してしまいます。
molten-iron-barrel=ドラム缶に入った溶融鉄です。しばらくすると鉄の塊になります。
molten-copper-barrel=ドラム缶に入った溶融銅です。しばらくすると銅の塊になります。
ribbonia-beacon=新しい世代の[entity=beacon]よりはるかに強力ですが、ひとつの機械が影響を受けられるベーシックビーコンは1台だけで、それ以上だと悪影響が生じます。
ribbonia-satellite=古いコードですが、問題なく通ります。
ribbonia-rocket-control-unit=最も高度なロケット工学の偉業にだけ必要となる専用の機械部品です。
ribbonia-alien-science-pack=空間把握と液体を使った製作手法を中心とした、まさに異星の研究です。
cake=保存料を容赦なく混ぜ込み、冷凍ユマコをほんの少し加えたケーキです。決して腐りません。
loser-ticket=ミステリーボックスから出たはずれ券です。誰かの顔が描かれています。
burned-loser-ticket=ミステリーボックスから出たはずれ券です。焦げていますが、なぜか燃え尽きてはいません。
crumbled-loser-ticket=ミステリーボックスから出たはずれ券です。くしゃくしゃですが、なぜか壊れてはいません。
