classic-beacon-do-high-res=ベーシックビーコンに高解像度スプライトを使う
ribbonia-yoink-lane-splitters=レーンバランサーをリボニアの後にロックする
ribbonia-yoink-mini-trains=ミニ列車をリボニアの後にロックする
ribbonia-gap-position=スポーン地点からの裂け目の距離
ribbonia-gap-size=裂け目の大きさ
ribbonia-width=世界の幅
[mod-setting-description]
ribbonia-gap-position=リボニアには裂け目があります。この設定は、裂け目が0,0からどちらの方向にどれだけ離れた場所に現れるかを決めます。
ribbonia-gap-size=リボニアには裂け目があります。この設定は裂け目の大きさを決めます。
ribbonia-width=主な目安: 列車がUターンするのに必要なタイル数: 28。ロケットサイロに必要なタイル数: 9。Factorio のチャンクサイズ: 32。リボニアとゲームをクリアするのに必要な最小サイズ: 9。
[ribbonia.message]
ribbonia-tech-rocket-part-unlocked=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: すまない、デイブ。それはできない…\n - 間違ったサブルーチンでした、失礼しました。ロケットの成功をお祈りします。
wheresmycar=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: なんて失礼な。せめて一杯おごってからにしてください。
rtflyingfreight-unlocked=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: ご不便をおかけして大変申し訳ありません。アステロイドによる損傷を修理しているところです。\nこちらを使ってみてください:
planet-discovery-ribbonia-unlocked=[color=#f3f2f2]すべてのレーダー、宇宙プラットフォーム、貨物ベイにメッセージが届きました:[/color]\n[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: いまだに古いしきたりを重んじる方々がいるとは、なんと嬉しいことでしょう。\nどうぞお気軽にリボニアへお越しください。太陽のすぐ裏にある、趣のあるリングワールドです。
RTThrowerTime-unlocked=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: おやまあ、あの厄介な色付きの請求書をどうしたらいいかわからないようですね。この専用のインサーターを使えば、古き良きフルゴラ流のやり方で処分できます。ものを遠くへ放り投げるのです。
ramp-unlocked=C.H.A.R.L.E.S.なら何か知っているかもしれません。
tiny-solar-panel-unlocked=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: すばらしい、小型ソーラーパネルの作り方がわかったのですね。これで私の木からむしり取るのをやめてくれるでしょうか。
landing-message-1=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: ささやかなリングワールド、リボニアへようこそ。無事に飛んでこられましたか？ 最近はあの厄介なアステロイドに悩まされていましてね。
landing-message-2=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: お気づきでしょうが、ここはフルゴラ人が見栄のために造った人工の世界です。もっとも、ほとんどの惑星がそうでしたが。
landing-message-3=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: 自己紹介をさせてください。私はC.H.A.R.L.E.S.です。Cはチャールズの略で、残りは忘れました。
landing-message-4=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: このリングワールドはフルゴラ人のカジノリゾートとして設計されたので、基本ルールを決めておく必要があります。リサイクル禁止。粗野で野蛮なロボットの使用禁止。そして何より、地下搬送ベルトは絶対に禁止です。
[ribbonia-lore]
ribbonia-notice-prestring=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]:
big-rock-mine-part1=ちょっと、コンクリートと大きな岩だけから中くらいの岩を作るのに、どれだけ時間がかかったと思っているんですか？
big-rock-mine-part2=岩の追加建設が必要です。
big-rock-mine-part3=物を壊すのがお好きなら、戦争で荒れ果てた惑星をおすすめしましょうか？
big-rock-mine-part4=岩を解体するのをやめてもらえますか？ 砂がたくさん出ています。砂は粗くてザラザラして不快で、どこにでも入り込むんです。
big-rock-mine-part5=私の岩を奪うつもりですか？
big-rock-mine-part6=私の岩に手を出さないで！ 開拓者たちはこの岩に乗って何マイルも旅したものです。
big-rock-mine-part7=そんなにたくさんの岩をどうするつもりですか？ 魔法でガラスにでも変えるんですか？
big-rock-mine-part8=この岩がいらないなら、端から投げ捨てればいいでしょう。あるいは破砕機に入れるとか。
big-rock-mine-part9=その岩から金は見つかりませんよ。ここは月じゃないんですから。
big-rock-mine-part10=次は何を掘るつもりですか？ 私のファウンデーションですか？ 秘密の第二ファウンデーションがあってよかった。
big-rock-mine-part11=岩？ これから行く場所に岩なんて必要ありません。
fish-mine-part1=雄大な陸の魚に手を出さないでください。絶滅危惧種なんです！
fish-mine-part2=ナウヴィスにもかつては陸の魚がいたのを知っていますか？ どうして消えてしまったのか、わかってきた気がします。
fish-mine-part3=魚に執着しているなら、あなた向けの惑星がまるごとひとつありますよ！ 私の魚は放っておいてください！
fish-mine-part4=アシモフの第一法則さえなければ、あなたを最新の陸の魚にしてやるところです。
fish-mine-part5=フルゴラ人はこの電動のちびっ子たちが大好きでした。走り回ってはゴミを全部掃いてくれたんです。
fish-mine-part6=この本物そのものの魚たちは、どうやってここに来たのでしょう？ 生命は、ええと、道を見つけるものです。
fish-mine-part7=あなたたちはロボットを虐待するのがお好きなようですね。コプルー宙域で副官をしていた頃を思い出します。
fish-mine-part8=ここを生命のない砂漠にしようとするのはやめてもらえますか？ ここは月じゃありませんし、私なら aluminium のつづりを間違えたりしません。
fish-mine-part9=おや、いま分解した陸の魚ユニットにメッセージが保存されていました。「助けて [...] あなただけが頼りです」。誰に宛てたものかはわかりません。
fish-mine-part10=ロボットの私でさえ、あなたよりこの生き物たちに同情していますよ！
fish-mine-part11=その汚い手を私の魚から離せ、このいまいましい猿め！
tree-mine-part1=ちょっと？ 故郷の星の木も全部切り倒したんですか？\n待って、本当に？
tree-mine-part2=何を探しているんですか？ ココナッツですか？
tree-mine-part3=電柱とコンクリートと小型ソーラーパネルから木を組み立てるのがどれだけ大変か、少しでもわかっているんですか？
tree-mine-part4=すばらしい考えですね。フルゴラ人も木を全部切り倒しましたが、悪いことなんて何ひとつ起きませんでしたから。
tree-mine-part5=ナウヴィスに移住した、あの木を愛するフルゴラ人たちを思い出します。\n誰かに会ったことはありますか？ 彼らは汚染が本当に嫌いなんです。
tree-mine-part6=どうしてそんなに木のくずをより分けるのが好きなんですか？\n廃材だらけの凍った月を作った、あるフルゴラ人を思い出します。放射するような個性の持ち主でした。
tree-mine-part7=木が嫌いすぎて、自分の世界全体を酸の雲で覆ってしまった変わったフルゴラ人がいました。そのあと彼は酸に強い木を作りました。
tree-mine-part8=自然を見るのがそんなに嫌なら、闇に覆われた惑星に行ったらどうですか？ そうすれば見なくて済みますよ。
tree-mine-part9=あなたにとって、この宇宙はすべて木材なんですね？
tree-mine-part10=パイプラインのために森を切り開くんですか？ 文明人らしく、木の上に高架パイプを通せないんですか？
tree-mine-part11=生命を憎むあなたを見ていると、ピカピカの黄金の鎧をまとった男が自分の惑星を砂漠に変えたときのことを思い出します。\n少なくとも4万年は前のことでした。
funneltrunk-mine-part1=この先史時代の植物はフルゴラ人のお気に入りでした。とはいえ、彼らは植物がみんな嫌いだったので、たいした意味はありませんが。
funneltrunk-mine-part2=何を探しているんですか？ テネキャップですか？ これは木であって、キノコじゃありません！
funneltrunk-mine-part3=自分の惑星を硫黄で覆ったあるフルゴラ人を思い出します。あなたと同じくらい木が嫌いだったに違いありません。
funneltrunk-mine-part4=そんなに木が嫌いなら、ガス惑星に行くことをおすすめしましょうか？
funneltrunk-mine-part5=あるフルゴラ人は、植物が育たないほど暑くて蒸し蒸しした世界を作りました。そしてサーバーファームを建てたんです。変わった男でした。
funneltrunk-mine-part6=グレバもフルゴラ人が手作りして、古代の生物を住まわせたって知っていますか？\nかつては「グレバシック・パーク」と呼ばれていたんですよ。
funneltrunk-mine-part7=珍しい植物を切り倒すのがそんなに楽しいなら、そのための惑星がほかにありますよ！
funneltrunk-mine-part8=どうして私の木の周りを嗅ぎ回っているんですか？ そんなに速く植え直せません。私の周りをぐるぐる回らないでください！
funneltrunk-mine-part9=私はかつてプロトコル・ドロイドでしたが、それでも私の木を切り刻むのをやめるべきだと伝えられないのですか？
funneltrunk-mine-part10=第三惑星についての報告: 木が足りなくなっています！
funneltrunk-mine-part11=このリングワールドをゴミだらけにするつもりなんでしょう？ せめて風が吹かないのが救いです。
watercane-mine-part1=その鉄の棒を地面に戻しなさい！ *コホン* そのウォーターケーンを植え直してください。
watercane-mine-part2=あのウォーターケーンもすべて失われてしまうのです。雨の中の涙のように。
watercane-mine-part3=あなたの通った後には本当に何も生き残らないんですね？ あなたの歩みが世界を浄化しますように。
watercane-mine-part4=よう、チューム。何を作ろうとしているんだ？ ウォーターケーンジュースか？
watercane-mine-part5=あなたの後片付けは本当に大変です。シタデルのキーパーの仕事を続けていればよかった。
watercane-mine-part6=この池が深くないのはわかっていますが、私の機械の魂がじめじめと霧雨の降る11月を迎えるたびに、なぜか惹きつけられるのです。
watercane-mine-part7=ウォーターケーンとファンネルトランクとナウヴィスの木をすべて取り除こうとするなら、まさに三体問題に直面することになります。
watercane-mine-part8=惑星によっては、ウォーターケーンは侵略的外来種で、駆除がとても難しいんです！ ひとつ助言を: 神経幹を狙って、とどめを刺しましょう。\n[color=#f3f2f282]もっと知りたいですか？[/color]
watercane-mine-part9=このウォーターケーンのことで被害妄想になってきました。「黄金の心」号の船載ロボットだったとき以来、こんなに落ち込んだことはありません。
watercane-mine-part10=まだウォーターケーンを抹殺しているんですか？ そのうち誰かが過去に戻ってあなたを止めに来ますよ。
watercane-mine-part11=私のウォーターケーンを曲げまくって！ 俺のピカピカの金属のケツでもかじってろ！
