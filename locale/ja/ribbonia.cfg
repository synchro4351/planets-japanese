[technology-description]
ribbonia-barrel-recipes=リボニアでのあなたの液体の使い方に触発されたC.H.A.R.L.E.S.が、ドラム缶のとんでもない使い道を考え出しました。新しい液体をドラム缶に詰められるようになります。実用的なものもあれば、そうでないものもあります。
RTThrowerTime=お気に入りのインサーターの投擲版です！
ribbonia-beacon=第一世代のビーコンははるかに強力ですが、干渉が激しくなります。ひとつの機械が同時に影響を受けられる[entity=ribbonia-beacon]は1台だけで、それ以上だとビーコンの効果が悪影響に変わります。
ribbonia-pelagos-throwers=燃焼エンジンと、ものを遠くまで放り投げるという発想を組み合わせます。誰も投げたことのない場所へ投げましょう。
ribbonia-lignumis-throwers=蒸気圧はものを遠くまで投げるのにぴったりの方法だとわかりました。アイテムが半分、あるいは完全に火が通った状態で届くことがあります。
plasma-foundry=質量分析による鉱石分離の用途を広げます。この処理はすべての不純物を取り除くため、[item=calcite]が不要になります。
ribbonia-tech-fluid-mastery-plastic=溶融プラスチックの扱いを極めます。
ribbonia-tech-fluid-mastery-iron=溶融鉄の扱いを極めます。
ribbonia-tech-fluid-mastery-copper=溶融銅の扱いを極めます。
ribbonia-tech-rocket-part=[planet=ribbonia]で学んだことを生かし、このリングワールドと正気を失ったAIから脱出できる船を建造します。
ribbonia-tech-rocket-control-unit=ただの制御基板では、[planet=ribbonia]の一見でたらめなぐらぐら揺れを計算するには速さが足りません。基本に立ち返る必要があります。
ribbonia-tech-lds=3種類の製作用液体すべてを極めた鋳造の達人だけが、液体だけで軽量化素材を鋳造できます。
fluid-recycler=箱の中のガラクタに混じって空気圧プレスを見つけ、すぐにリバースエンジニアリングしました。古代のフルゴラ人はこれで遊んでいたのでしょうか？
ribbonia-tech-melt-iron=十分な熱源が見つかれば、[item=calcite]なしで鉄鉱石やミステリーボックスまで溶かせるかもしれません。
ribbonia-tech-open-box=瓦礫の中からミステリーボックスを見つけました。鍵はありませんが、こじ開けることはできます。
planet-discovery-ribbonia=生魚を宇宙に送って、誰が応えてくれるか確かめるという古くからの伝統に従います。なんだかそうするのが正しい気がします。
ribbonia-tech-lane-splitter=分配器を思いきり絞ると、1本のベルトに収まるほど小さくなり、左右のレーンを均等にできることがわかりました。
