[modifier-description]
ribbonia-tech-rocket-part=あなたの技術的な進歩に満足したC.H.A.R.L.E.S.が、ついに[planet=ribbonia]から出発させてくれます。
fluid-recycler=魚、電池、さらには爆薬など、さまざまな部品から液体の材料を絞り出せるようになります！
[compat]
k2-ribbonia-alien-science-pack=異星の技術カード
outer-rim-manufactory=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: セクレタスに行ってきたんですね？ あの老いぼれのウォーマインドは、まだ宇宙船で遊んでいるんですか？
tiny-solar-matrix=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: ノック、ノック、ネオ。見たこともないほどかわいくて小さなソーラーマトリックスですよ！
diesel-assembling-machine=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: 化石燃料？ 私の惑星で？ まあ、許しましょう。
kr-air-purifier=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: なんですって？ この空気は最高品質のフルゴラ製エアフィルターで手作業でろ過されているんですよ。
cerys-fulgoran-reactor=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: それはあのイカれた月の住人が寄せ集めで作ったものですか？ 私の回路を被曝させないようにしてくださいね。
planetaris-hyper-transport-belt=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: ちょっと、その搬送ベルトはどうしてそんなに砂だらけなんですか？
lumber-mill=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: 製材所？ ヒッピーですね。
big-crusher=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: この破砕機、年々どんどん大きくなっていきますね。
maraxsis-conduit=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: パイロンの追加建設が必要です。
blueprint-deployer2=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: BADチェスト？ あのオタクのL.O.R.A.X.とつるんでいたんですか？ まあ、彼にもやっと友達ができたようで何よりです。
linox-building_mantle-extractor=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: 私の原子炉に穴を開けているんですか？ L.O.R.A.X.にこの償いをさせてやります！
ribbonia-beacon=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: ああ、より文明的な時代のための優美なビーコンですね。新世代のビーコンを持ってきて、アンテナを強化し、安全機能をはぎ取る。気に入りました。
steam-assembling-machine=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: 蒸気で動く機械？ なんですか、第三次産業革命か何かですか？
burner-assembling-machine=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: ここに来るには電気を発見する必要があったはずですよね？
catalytic-chemical-plant=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: それは化学プラントの色を変えただけですか？ 手抜きな気がしますが、まあ許しましょう。
steam-recycler=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: リサイクル禁止だと言ったでしょう！ 待って、これは蒸気で動くんですか？ なぜ？
gold-railgun-turret=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: あなたの黄金銃と、私のワルサーPPKで勝負ですか？
machining-assembler=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: あの組立機は、とても生産性の高いやつに見えますね。
wsr-big-assembler=[color=#be7318][font=default-large-bold]C.H.A.R.L.E.S.[/font][/color]: これは巨大だ！ どの月から盗んできたんですか？
