[entity-description]
ribbonia-beacon=新しい世代の[entity=beacon]よりはるかに強力ですが、干渉が激しくなります。2台以上の[entity=ribbonia-beacon]の影響を受けた機械には悪影響が生じます。
huge-satellite-asteroid=はるか昔に失われた文明の宇宙ゴミです。かなり大きくなることもありますが、とてももろく、普通の銃撃や電気で破壊できます。
big-satellite-asteroid=はるか昔に失われた文明の宇宙ゴミです。かなり大きくなることもありますが、とてももろく、普通の銃撃や電気で破壊できます。
medium-satellite-asteroid=はるか昔に失われた文明の宇宙ゴミです。かなり大きくなることもありますが、とてももろく、普通の銃撃や電気で破壊できます。
small-satellite-asteroid=はるか昔に失われた文明の宇宙ゴミです。かなり大きくなることもありますが、とてももろく、普通の銃撃や電気で破壊できます。
exposed-machinery=何千年もの間に融合してしまったミステリーボックスの山です。[fluid=fusion-plasma]でしか採掘できません。
mystery-box=何千年もの間に融合してしまったミステリーボックスの山です。[fluid=fusion-plasma]でしか採掘できません。
fulgoran-fusion-generator=寄せ集めで作られたこの機械は、変換するより多くのエネルギーを排出してしまいますが、今のところはこれで十分です。
ribbonia-charles=フルゴラ人から[planet=ribbonia]の建設と維持を任されたC.H.A.R.L.E.S.は、あなたがこれまでに出会った中で最も古い存在です。
ribbonia-land-fish=どう見ても[planet=ribbonia]を掃除しているルンバですが、C.H.A.R.L.E.S.は「陸の魚」と呼ぶよう言い張ります。
