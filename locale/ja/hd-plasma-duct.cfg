[mod-setting-description]
pink-plasma=通常、パイプ内のプラズマは濃い青で表示され、酸化剤とよく似ているうえ、プラズマのピンクのアイコンとも合いません。この設定で色をピンクに変更します。
duct-extend=Space Age では、パイプネットワークにはポンプなどが必要になるまでの最大延長があります。パイプのデフォルトは320、プラズマダクトのデフォルトは32です。
super-cheap=プラズマダクトのレシピを非常に安くします: タングステン5個と超伝導体5個でプラズマダクト10個。MOD「plasma duct tweak」から取り込んだ機能です。おすすめしません。
fusion-unlock=核融合の研究でプラズマダクトをアンロックします。「plasma duct tweak」から取り込んだ機能です。プロメチウム嫌いの方におすすめです。
[mod-description]
plasma-duct=より柔軟な核融合設備や、核融合プラズマを使うMODのためのプラズマダクトです。HD版になりました！
[hd-plasma-ducts]
hd-mod=HD-plasma-ducts と旧 plasma-ducts MOD の両方が有効になっているようです！旧プラズマダクトMODは不要で、ほかのMODと互換性の問題を起こすことがあるため、無効にしてかまいません。
