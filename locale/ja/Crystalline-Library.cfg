[mod-name]
Crystalline-Library=○🌐クリスタリン・ライブラリ
[mod-description]
Crystalline-Library=○🌐ムリアとパラセルシンで共有するアセットとコードの内部ライブラリです。
[mod-setting-name]
paracelsin-muria-aqua-regia=王水と、変更された鉛/亜鉛の精製レシピを有効化
[mod-setting-description]
paracelsin-muria-aqua-regia=この設定はムリアとパラセルシンの両方が有効な場合にのみ存在します。有効にすると王水が登場し、鉛と亜鉛の精製技術が1つの技術に統合されます。あわせて精製レシピがより難しく変更され、ムリアとパラセルシンの結びつきがより強くなります。
[technology-name]
zinc-and-lead-refining=亜鉛と鉛の精製
fluorite-processing=蛍石の処理
fluorinated-uranium-processing=フッ素化ウランの処理
petroleum-gas-alkylation=石油ガスのアルキル化
[technology-description]
zinc-and-lead-refining=ムリアとパラセルシンの技術を活用して、[fluid=hydrogen-chloride]と[fluid=nitric-acid]からなる非常に腐食性の高い溶液、王水を作れます。この溶液を使えば、高度なレシピで亜鉛と鉛の品質を高められます。
fluorite-processing=[item=fluorite]の中身を取り出します。
fluorinated-uranium-processing=[fluid=fluorine]を使って、ウラン処理の収量を増やします。
petroleum-gas-alkylation=[fluid=petroleum-gas]を[fluid=heavy-oil]に変える、高度な石油化学プロセスです。
[entity-name]
small-crystalline-asteroid=小型の結晶質アステロイド
medium-crystalline-asteroid=中型の結晶質アステロイド
big-crystalline-asteroid=大型の結晶質アステロイド
huge-crystalline-asteroid=巨大な結晶質アステロイド
[asteroid-chunk-name]
crystalline-asteroid-chunk=結晶質アステロイドの破片
[item-name]
fluorite=蛍石
crystalline-asteroid-chunk=結晶質アステロイドの破片
[item-description]
fluorite=[fluid=hydrogen-fluoride]を含む鉱物です。
crystalline-asteroid-chunk=カルシウムを多く含むアステロイドの破片です。
[fluid-name]
aqua-regia=王水
hydrogen-fluoride=フッ化水素
uranium-hexafluoride=六フッ化ウラン
[fluid-description]
aqua-regia=[fluid=hydrogen-chloride]と[fluid=nitric-acid]からなる、非常に腐食性の高い溶液です。
[recipe-name]
fluorite-processing=蛍石の処理
uranium-fluorination=ウランのフッ素化
uranium-hexafluoride-centrifuging=六フッ化ウランの遠心分離
hydrogen-fluoride-electrolysis=フッ化水素の電気分解
petroleum-gas-alkylation=石油ガスのアルキル化
lubricant-from-fluorine=フッ素から潤滑油
crystalline-asteroid-crushing=結晶質アステロイドの破砕
advanced-crystalline-asteroid-crushing=結晶質アステロイドの高度な破砕
crystalline-asteroid-reprocessing=結晶質アステロイドの再処理
[recipe-description]
fluorite-processing=[item=fluorite]を[fluid=sulfuric-acid]で処理して[fluid=hydrogen-fluoride]を得ます。
uranium-fluorination=[fluid=fluorine]を使って、[item=uranium-ore]を[fluid=uranium-hexafluoride]に変えます。
uranium-hexafluoride-centrifuging=[fluid=uranium-hexafluoride]を遠心分離して、ウラン同位体を分離します。
hydrogen-fluoride-electrolysis=[fluid=hydrogen-fluoride]を成分に分離します。
petroleum-gas-alkylation=[fluid=hydrogen-fluoride]と[fluid=light-oil]を触媒に使い、[fluid=petroleum-gas]をアルキル化して[fluid=heavy-oil]にします。
