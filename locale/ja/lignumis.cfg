[mod-setting-description]
lignumis-nauvis-steam-start=電気を自動化サイエンスパックの前提として解禁する代わりに、自動化サイエンスパックで研究するようにします。ナウヴィスは燃料式・蒸気式の機械で始めることになります。
lignumis-extended-compatibility=このMODをさらにオーバーホール寄りにします。バニラや惑星MODの既存の仕組みを置き換えます。たとえば、ナウヴィスでのウラン採掘やヒアリオンでのジオード採掘に深層採掘機が必要になります。
lignumis-k2so-gold-tech-card=木材サイエンスパックと蒸気サイエンスパックを必要とする終盤の技術が、代わりにリグヌミスの金から作る金の技術カードを必要とするようになります。段階的テクノロジーを有効にする必要があります。
