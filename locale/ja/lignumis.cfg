[technology-description]
planet-discovery-lignumis=ナウヴィスを周回する月で、植生と有用かもしれない金属以外にはあまり価値がありません。
aop-lumber-mill=製材所のレシピを追加します。
tree-seed-productivity=木の種のレシピの生産性を上げます。
basic-circuit-board-productivity=基本回路基板のレシピの生産性を上げます。
lignumobile-basics=個人用の乗り物の作り方を学びます。残念ながら、もっと頑丈な素材が足りません。
lignumobile=適した素材が見つかったので、これまでの知識と新しい素材を組み合わせて、動く乗り物にする研究を続けます。
electricity=電気があれば、集中型の発電で、より効率的でコンパクトな自動化ができます。
basic-roboport=自動で修理や建設を行う、基本的な建設ロボット技術です。
