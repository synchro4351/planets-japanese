[mod-setting-description]
cr-arcane-ore=秘術鉱石を追加します。各プレートのレシピ用の触媒レシピと、このMODの一部の製造機械の燃料・材料も追加されます。
cr-assembling-machine=電磁気のレシピも製造できる、強化された組立機です。
cr-fire-foundry=炉のレシピも製造できる、強化された鋳造所です。
cr-ice-foundry=化学と極低温のレシピを製造できる鋳造所です。
cr-agricultural-tower-blue=稼働速度と栽培範囲が向上した、強化された農業タワーです。
cr-agricultural-tower-black=稼働速度と栽培範囲が向上した、強化された農業タワーです。
cr-biochamber=強化されたバイオチャンバーです。
cr-mixing-station=ミックスドリンクを作る製造機械です。ミックスドリンクは飲むとボーナスが得られるほか、バイオチャンバーやバイオラボの燃料にもなります。
cr-biolab=ミックスドリンク (有効時) と耐性モジュール (速度を大きく上げるバイオラボ専用モジュール) を使う、強化されたバイオラボです。
cr-turret=秘術ダメージを与えるレーザータレットです。稼働時間は10時間です。
cr-logistic-chest=2x2の大きさで250スロットのインベントリを持つ物流チェストです。
cr-bonus-armor=ゲーム開始時に、発電機、ロボットステーション、ロボット、脚を備えたメカアーマーが与えられます。
cr-bonus-weapon=ゲーム開始時にサブマシンガンと劣化ウラン弾200個が与えられます。
cr-bonus-robot=ロボットの基本速度を6倍にします。
cr-bonus-inserter=インサータの最低速度を0.025に引き上げます。(参考: インサータの速度は0.014、高速インサータの速度は0.04です)

