seed-mismatch=警告！MOD設定の銀河のシードがこのセーブデータと一致しません。銀河が変化しています。MOD設定 -> 起動時 を開いてシード __1__ を入力し、ゲームを再起動してください。そうしないとマップが壊れる可能性があります。
seed-default=これは新しいセーブデータで、銀河のシードがまだデフォルトのままです。固有の銀河を生成するには、MOD設定 -> 起動時 を開き、下の文字列を「銀河のシード」に貼り付けてゲームを再起動してください。
opened-system=[ビヨンド・ザ・ギャラクシー] 恒星系 __1__ (__2__、惑星: __3__) を発見しました。惑星の調査技術が利用可能になりました。
all-open=[ビヨンド・ザ・ギャラクシー] 隣接する恒星系はすべて発見済みです。BTGボタンを押して新しい恒星系を含む文字列を取得し、ゲームを再起動してください。
gate-opened=[ビヨンド・ザ・ギャラクシー] 太陽系から銀河間空間への4つの出口が開きました。
bad-index=[ビヨンド・ザ・ギャラクシー] 恒星系 __1__ が見つからないか、すでに発見済みです。
expansion-button-tip=銀河の拡張: 恒星系のタグと再起動用の文字列
expansion-title=銀河の拡張
expansion-summary=発見済み: __1__。未発見: __2__。新規 (再起動待ち): __3__。
expansion-how=ファイルを script-output/__1__ に書き出しました。新しい恒星系を追加するには、ゲームを終了し、MOD設定 -> 起動時 を開いて下の文字列を「銀河の拡張」に貼り付け、Factorio を起動してください。Factorio では、MODが自分で設定を変更したりゲームを再起動したりすることはできません。
expansion-nothing=新しい恒星系はまだありません。新しい恒星系は、銀河の端にある発見済みの恒星系の隣に現れます。
expansion-write=ファイルを再度書き出す
expansion-written=[ビヨンド・ザ・ギャラクシー] 銀河の状態を script-output/__1__ に書き出しました。
expansion-mismatch=警告！起動時設定「銀河の拡張」がこのセーブデータと一致しません。一部の恒星系が欠けているか順序が違っており、それらの惑星に別の名前が付いてしまいます。MOD設定 -> 起動時 を開いて下の文字列を「銀河の拡張」に貼り付け、ゲームを再起動してください。
