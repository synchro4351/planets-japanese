[mod-name]
beyond-the-galaxy=ビヨンド・ザ・ギャラクシー
[mod-description]
beyond-the-galaxy=太陽系の外に広がる、手続き的に生成される恒星系を追加します。起動時のシードから銀河が構築され、プラットフォームは星図上の出口を通って移動します。(！AI使用！)
[mod-setting-name]
btg-galaxy-seed=銀河のシード
btg-galaxy-expansion=銀河の拡張
[mod-setting-description]
btg-galaxy-seed=手続き的に生成される銀河全体のマスターシードです。空欄にするとデフォルトのシードを使います。変更には再起動が必要です。
btg-galaxy-expansion=BTGボタンのウィンドウから取得する文字列です。発見済みの恒星系の周囲にある新しい恒星系とそのタグを保存します。このセーブデータの最新の文字列だけを貼り付けてください。古い文字列や別のセーブデータの文字列を使うと、恒星系の名前が変わります。
[technology-name]
btg-intergalactic-gate=銀河間空間への出口
btg-open-random-system=ランダムな恒星系の発見
[technology-description]
btg-intergalactic-gate=太陽系の周囲にある4つの出口を開きます。
btg-open-random-system=レベルごとに、発見済みの恒星系に隣接するランダムな恒星系を1つ発見します。
[btg]
sol=太陽系
star-yellow_dwarf=黄色矮星
star-red_giant=赤色巨星
star-orange_dwarf=橙色矮星
star-white_dwarf=白色矮星
star-brown_dwarf=褐色矮星
star-black_hole=ブラックホール
