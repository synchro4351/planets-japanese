star-blue_giant=青色巨星
bonus-yellow_dwarf=補正なし。
bonus-red_giant=光度×3、惑星間の距離×5。
bonus-orange_dwarf=光度×0.9、ウランなし、技術由来の廃材の確率15%。
bonus-white_dwarf=光度×0.2、惑星は最大4つ、軌道が密集。
bonus-brown_dwarf=光度は1%で固定、軌道が非常に密集。
bonus-black_hole=光度1%、鉱石の埋蔵量×40、プラットフォームの燃料消費×2、長距離の航行。
bonus-supernova=光度×5、惑星は単一の鉱石でできた直径100の円盤、採掘と精錬×100。
bonus-blue_giant=大きさは通常の惑星の×15～20。惑星間の間隔×20～25。水なし。気温は100 °C以上。資源の大半は液体。炉と鋳造炉: 速度+100%、効率+25%。ウランとそれより重い放射性元素: 確率+20%。光度×10。
