[mod-setting-description]
abacayba_height=進行中のセーブデータでは絶対にこの値を変更しないでください！ リボンワールドが切断されてしまいます。値を小さくするほど、難易度は指数関数的に上がります。アバカイバを変更したい場合は、MODを削除して（アバカイバの進行状況は失われます）セーブし、再インストールしてから新しい設定にしてください。
abacayba_wave=進行中のセーブデータでは絶対にこの値を変更しないでください！ リボンワールドが切断されてしまいます。値を大きくするほど、難易度は指数関数的に上がります。アバカイバを変更したい場合は、MODを削除して（アバカイバの進行状況は失われます）セーブし、再インストールしてから新しい設定にしてください。
