abacayba_itaverax_ore=イタヴェラクス鉱石
abacayba_torbernite_ore=トーバーナイト鉱石
abacayba_oozing_white_goo=にじみ出る白い粘液
abacayba_plants=アバカイバの木
abacayba_ruins=アバカイバの遺跡
abacayba_enemy_base=アバカイバの敵の巣

[entity-description]
abacayba_huge_mining_drill_entity=街区ほどの大きさがあるエキゾチックな採掘機で、採掘範囲が非常に広いです。より硬い鉱石や鉱物も採掘できます。
abacayba_rotary_trommel_entity=回転する斜めの円筒形をしたエキゾチックな機械です。水の噴射と研磨回転で、鉱石に含まれるやわらかい不純物を取り除きます。水を多く含む鉱物からは汚水が出ます。
abacayba_rotary_calciner_entity=回転する傾斜した円筒で、原料を連続して高温に加熱するエキゾチックな機械です。化学的な分解、使用済み触媒の活性化や回収、相変化、水分の除去を起こします。
abacayba_thickener_sedimentation_entity=重力を利用した連続プロセスで液体から懸濁した固形物を分離し、濃い汚泥と澄んだ液体を作るエキゾチックな縦型沈殿槽です。
abacayba_itaverax_ultracapacitor_entity=エキゾチックな超大容量の蓄電池です。
abacayba-itaverax-sassy-wriggler-pentapod-premature=イタヴェラクスを注入された友好的なリグラーです。プレイヤーにはついて来ませんが、寿命が尽きるまで、範囲内に入った敵を攻撃します。
abacayba_glowing_one_biter=アバカイバのボスです！ 非常に遅い遠距離近接型の重装甲ユニットで、効果範囲がとても広いです。
abacayba_pillar=アバカイバのボスです！ 非常に遅い遠距離近接型の飛行重装甲ユニットで、効果範囲は大陸ほどもあります。

