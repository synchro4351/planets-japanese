[technology-description]
planet_discovery_abacayba=生きた寄生惑星で、敵意ある在来種の海と強力な資源に満ちています。触手の一つに着陸し、惑星の核へと進みましょう。高度な文明の遺跡が残っており、この地を手なずけるにはそれが欠かせないようです。そこには、水を多く含む鉱物を多種多様な元素に変えるエキゾチックな技術や、巨大な機械が眠っています。
abacayba_look_for_technologies=エキゾチックな遺跡を探します。長く失われていた鉱石処理技術を利用できるようになります。
abacayba_oozing_white_goo_tech=にじみ出る白い粘液を燃やして石炭にできます。
abacayba_crystal_washing=結晶鉱石を洗浄できるようになります。水和の進んだ鉱物は、その過程で水を放出します。
abacayba_crystal_kiln=素材を高温まで精密に加熱し、分解、酸化、還元を起こします。酸化によって素材を精製・強化したり、触媒表面を整えたりします。素材の化学的な性質を変えます。
abacayba_crystal_sedimentation=汚水が槽の中をゆっくり流れる間に、懸濁した粒子を沈殿させます。槽の底には鉱石の固形物が層になってたまることがあります。
abacayba_itaverax_alloy_tech=イタヴェラクス合金を作れるようになります。金属を原子レベルで組み合わせた、強化された固溶体です。
abacayba_itaverax_coil_tech=イタヴェラクスコイルを作れるようになります。非常に高い電圧を生み出します。
abacayba_itaverax_polymer_tech=イタヴェラクスポリマーを作れるようになります。非常に大きな分子が三次元に架橋した、安定した網目構造です。
abacayba_itaverax_composite_tech=イタヴェラクス複合材を作れるようになります。層を重ね合わせた、超硬質で耐熱性のある板です。
abacayba_itaverax_electromagnet_tech=イタヴェラクス電磁石を作れるようになります。電流によって磁場を生み出す磁石の一種です。
abacayba_itaverax_cpu_tech=イタヴェラクス中央演算装置を作れるようになります。フェッチ、デコード、実行、繰り返しという決まったサイクルで命令を実行する、超高速の計算機です。
abacayba_itaverax_superconductor_tech=イタヴェラクス常温超伝導体を作れるようになります。どんな温度でも電気抵抗がゼロになり、磁場を排除する、きわめてエキゾチックな素材です。
abacayba_ominous_science_pack_tech=イタヴェラクス結晶のエキゾチックな増幅力の研究を続けます。
abacayba_advanced_oozing_white_goo_processing_tech=にじみ出る白い粘液を精製して、鉱石、ミルク、プラスチック、硫黄、燃料の製造に使います。液体の扱いも改善されます。
abacayba_itaverax_ultracapacitor_tech=大量の電気エネルギーを蓄えて後で使えるようにする、エキゾチックな建物です。イタヴェラクスは、増幅可能な生の核エネルギーを宿した、きわめて高エネルギーの結晶です。
itaverax_rail_tech=非常に高密度で、物理的なダメージを受けない金属合金で作られたレールです。
itaverax_xenobiology_tech=イタヴェラクスの力で生物システムを操ることに重点を置いた合成生物学です。
abacayba_itaverax_sassy_wriggler_capsule_tech=腐らない、飼いならされた地球外生命体です。プレイヤーにはついて来ませんが、範囲内に入った敵を攻撃します。
abacayba_infested_personal_roboport_tech=パーソナルロボットステーションの性能をすべて備えた、寄生されたロボットステーションです。電力が供給されると、建設範囲内の地面にあるアイテムに自動で解体の印を付けます。
abacayba_cyst_capsule_tech=アバカイバの嚢胞を逆生物工学で解析し、イタヴェラクスの力で安定させたものです。
abacayba_biomimetic_calcination=硬化した地球外の素材を精密に加熱します。複雑な器官系は失われたままで、基本的な構造細胞だけが残ります。
abacayba_pure_water_calcination_tech=熱処理で結晶水を蒸発させます。熱分解によって方解石ができることがあります。
abacayba_calcite_flotation_tech=表面化学の違いを利用して、タングステン鉱石を廃石から分離します。
abacayba_stone_flotation_tech=表面化学の違いを利用して、鉱石を廃石から分離します。
abacayba_torbernite_productivity=トーバーナイトの生産量が増加します。
abacayba_itaverax_productivity=イタヴェラクスの生産量が増加します。
abacayba_dirty_water_sed_productivity=汚水の生産量が増加します。
abacayba_oozing_white_goo_productivity=にじみ出る白い粘液の生産量が増加します。
abacayba_milk_productivity=アバカイバミルクの生産量が増加します。
abacayba_mining_productivity=すべての採掘機と油井の生産量がさらに増加します。
abacayba_character_itaverax_bonus=体に悪い食べ物で、最強の肉体を。副作用: -検閲済み-
abacayba_research_productivity=消費したサイエンスパック1個あたりの研究の進み具合がさらに増加します。

