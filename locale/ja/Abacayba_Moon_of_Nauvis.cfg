[item-description]
abacayba_itaverax_ore=活性化させると高効率な素材になる、水を多く含むエキゾチックな鉱物です。
abacayba_torbernite_ore=分解すると金属が得られる、水を多く含む放射性の鉱物です。
itaverax-rail=破壊されない直線レールを、手作業またはレールプランナーで敷設するのに使います。\n__CONTROL__build__ で短い経路を直接敷設します。\n__CONTROL__build-ghost__ で長い経路のゴーストを配置します。
abacayba_itaverax_pentapod_egg=イタヴェラクスを注入された友好的なリグラーです。プレイヤーにはついて来ませんが、寿命が尽きるまで、範囲内に入った敵を攻撃します。
abacayba_itaverax_sassy_wriggler_capsule=イタヴェラクスを注入された友好的なリグラーです。プレイヤーにはついて来ませんが、寿命が尽きるまで、範囲内に入った敵を攻撃します。
abacayba_infested_personal_roboport_equipment=寄生されたロボットステーションは、パーソナルロボットステーションの性能をすべて備えています。電力が供給されると、建設範囲内の地面にあるアイテムに自動で解体の印を付けます。[entity=abacayba-itaverax-stomper-shell]、[entity=abacayba_itaverax_skull]、[entity=abacayba_itaverax_cortex]、[entity=abacayba_pillar_shell] のような死骸にも印を付けられます。
abacayba_cyst_capsule=アバカイバの悪夢を生み出す敵の嚢胞が入った、恐ろしいカプセルです。

