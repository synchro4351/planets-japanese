[mod-name]
Abacayba-Moon-of-Nauvis=アバカイバ

[space-location-name]
abacayba=アバカイバ

[space-location-description]
abacayba=生きた寄生惑星で、敵意ある在来種の海と強力な資源に満ちています。触手の一つに着陸し、惑星の核へと進みましょう。高度な文明の遺跡が残っており、この地を手なずけるにはそれが欠かせないようです。そこには、水を多く含む鉱物を多種多様な元素に変えるエキゾチックな技術や、巨大な機械が眠っています。

