[technology-description]
discovery-aegis-outer=グレバの公転軌道の近くで、ある種のハイテクな大規模ポータルが発見されました。元の恒星系のはるか彼方にある別のポータルへ通じているようです。その先には、小さいながら非常に強い重力井戸の周りを回る、ベリリンの小惑星が密集した大きな小惑星帯があります。\nそこへ送る船は、より高い小惑星密度と耐久力に備える必要があります。
discovery-aegis-inner=最も安全な航路を通っても、小惑星帯の内部の小惑星密度は非常に高いです。船が小惑星帯の内側に近づくほど、パルサーと思われる天体の高エネルギーパルスが生み出すイオン化した氷のジェットから守られなくなります。\n通り抜けるつもりなら、船にはより優れた弾薬と、イオン化した氷を蒸発させるレーザーが必要です。
discovery-bellicos=この星系の重力井戸の正確な位置を突き止めました。それはやはりパルサーでした。正確な位置がわかったことで、「安全に」近づいてより多くの素材を集められます。しかし、その周囲ではゆっくりと降着円盤が形成されつつあり、近づきすぎるとすぐに問題が起きるかもしれません。パルサーの軌道に近づくにつれ、小惑星が予測できない動きをし始めることもあります。\nこの旅に挑むのは、最高ランクの武器を備えた船だけにすべきです。
discovery-aegis-warden=イージスを深く探査したことで、巨大なベリリン小惑星の陰にある高密度の小惑星群、ポイント・ウォーデンに行けるようになりました。この区域は大型のベリリン小惑星であふれていますが、ベリコスにはほとんどさらされていないため、イオン化小惑星も太陽光発電も少なくなります。\nそこへ向かう採集船は、大型の小惑星を倒せる武器を備え、太陽光発電に頼りすぎないようにすべきです。
pulsar-science-pack=トリチウムに関連するより高度な応用です。
space-logistic-science-pack=ベリリウムに関連するより高度な応用です。
beryllium-processing=鉄や銅の部品をベリリウムでコーティングできるようになります。
beryllium-solar-panel=ベリリウムを使って作った、より大きく効率の良いソーラーパネルです。かなり頑丈でもあります。
space-beryllium-logistic=従来のベルトの重要な鉄部品をベリリウムでコーティングした部品に置き換え、低重力環境に置くことで、機械の激しい摩耗の心配なくさらに速く動かせます。
lightweight-inserters=機械部品の熱容量が高まったことで、より速いインサータを作れます。ただし、一度に運べる量は少なくなります。
beryllium-LDS=
space-beryllium-underground-pipe=宇宙プラットフォームとより効率よく組み合わさるよう改造した地下パイプです。ベリリウムで延長できます。
beryllium-liquid-tank=ダメです。
lightweight-arsenal=より軽くコンパクトなベリリウム製の弾薬です。従来の弾薬とほぼ同じ殺傷力のまま、より遠くへ、より速く撃てます。
tungsten-lightweight-arsenal=ベリリウム製の弾丸、ロケット弾、キャノン砲弾の先端にタングステン鋼を使うことで、サイズと重量の利点はそのままに、さらに強力になります。
tritium-extraction=イオン化した氷には希少な同位体が含まれており、分離すれば役に立つかもしれません。
the-solution=太陽の力をその手のひらに... あるいは[entity=biter-spawner]の上に。
low-grade-fusion=基本的な核融合の力を解放します。[item=low-grade-fusion-reactor]は一定量の核融合燃料を消費して[fluid=steam]を加熱する核融合炉で、入力する蒸気の温度が低いほど効率が上がります（15°Cの[fluid=steam]で最大80%の効率）。[item=high-temp-steam-turbine]はより高温の[fluid=steam]を扱える蒸気タービンです。
low-grade-fusion-thrust=トリチウムの制御された核融合で、高温の蒸気をプラズマになるまで加熱できます。この高エネルギーのプラズマを噴射すると、大きな推力が生まれます。これには蒸気を500°Cから1200°Cの間に保つ必要があります。
high-grade-fusion-thrust=[entity=steam-thruster-TT]に内部の能動冷却システムと高温に耐える素材を備えることで、より強力な燃料である[fluid=helium-thruster-fuel]を扱えるようになり、より大きな推力を生み出します。スラスターを動かすには、蒸気の温度を800°Cから1000°Cの間に精密に制御する必要があります。
tritium-fusion-fuel=トリチウムから作る基本的な核融合燃料です。どの核融合炉でも使えます。
tritium-RTG=トリチウムの自然な放射性崩壊の力を利用します。
helium-production=トリチウムにエネルギーを与え、ごくゆっくりとほかの物質と核融合させることで、少量のヘリウムを作れます。
circuit-productivity-helium=密閉された雰囲気での精密な組み立てにより、基板をより効率よく、特に複雑なものほど効率よく作れます。
quantum-processor-helium=ヘリウムは量子プロセスが干渉で乱されるのを防ぐ理想的な媒体で、より少ない素材で量子チップを作れます。
space-plateform-productivity=プラットフォームの生産の生産性を上げます。
advanced-thruster-fuel-productivity=トリチウムを使うスラスター燃料の生産性を上げます。
nuclear-isotope-extraction-productivity=ウラン処理とトリチウム抽出の生産性を上げます。
space-beryllium-transport-belt-beltbox=ベリリウム製の宇宙ベルトに合う積載ベルトボックスを解放します。

