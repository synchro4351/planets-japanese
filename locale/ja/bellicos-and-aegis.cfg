stargate-solar-power-very-low-power=非常に少ない太陽光発電
stargate-solar-power-low-power=少ない太陽光発電
stargate-solar-power-location-based=位置に応じた太陽光発電

[mod-setting-description]
make-promethium-require-new-packs=プロメチウムサイエンスと無限の技術の生産性の両方で、軽量サイエンスパックとパルサーサイエンスパックが必要になります。
radioactive-ice-fizzle-out-time=秒単位です。意図的に非常に短くしてあるので、これ以上短くしないほうがよいでしょう。
take-value-from-gleba=小惑星の生産性の研究に、グレバの農業サイエンスパックが不要になります。代わりに軽量サイエンスパックを使います。
ae-alt-pack-sprites=有効にすると、新しいサイエンスパックにQuality Glasswareのスプライトをもとにした、より見分けやすいスプライトを使います。\n現在のスプライト: [img=item/space-logistic-science-pack][img=item/pulsar-science-pack]
make-railgun-upgrades-require-new-packs=レールガンの射撃速度の研究に軽量サイエンスパックが必要になります。/nレールガンのダメージの研究にパルサーサイエンスパックが必要になります。
add-value-to-fulgora=RTGの研究にフルゴラの電磁サイエンスパックが必要になります。さらに、RTGは電磁プラントで製作する必要があります。
stargate-solar-power=スターゲートの近くにとどまるプラットフォームで使える太陽光発電量を設定します。
BA-ae-helium-processor-recipe-fix=「効率的な量子プロセッサ生産」のレシピを、Better Aquilo独自の量子プロセッサのレシピに合わせて調整したものに変更します。

[string-mod-setting-description]
stargate-solar-power-very-low-power=スターゲートの近くとその間の宇宙では、太陽光発電が1%しかありません。最高難易度の選択肢です。\n太陽光発電だけに頼る船は立ち往生することがあります。
stargate-solar-power-low-power=スターゲートの近くとその間の宇宙では、太陽光発電が10%になります。中程度の難易度の選択肢です。
stargate-solar-power-location-based=スターゲート付近の太陽光発電量を、恒星からの距離に応じた値にします。最も簡単な難易度の設定です。\nカリダスのスターゲート付近の太陽光発電: 150%\nベリコスのスターゲート付近の太陽光発電: 40%
