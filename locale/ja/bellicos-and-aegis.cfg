[space-location-description]
bellicos-orbit=形成途中の降着円盤の内側です。到達はほぼ不可能で、環境は過酷を極めます。
aegis-inner-edge=小惑星帯を抜けた先、形成途中の降着円盤の手前にある区域です。そこへ至るまでの旅に比べれば、比較的穏やかです。
aegis-outer-edge=小惑星帯イージスの外縁にある、そこそこ安全な区域です。予想どおりの天体に混じって、ベリリン小惑星がいくつか見つかります。
aegis-warden=イージスの内部にある巨大な小惑星群で、巨大なベリリン小惑星によってベリコスのイオン化ジェットから守られています。小惑星の密度があまりに高く、太陽光発電もほとんどないため、長くとどまるのは危険です。
calidus-bellicos-stargate-bellicos=先駆者の技術です。このワームホールゲートを使うと、宇宙船は離れた場所の間をすばやく移動できます。\nこのゲートはイージスの先、ベリコスから安全な距離にあります。カリダスへ戻る道です。
calidus-bellicos-stargate-calidus=先駆者の技術です。このワームホールゲートを使うと、宇宙船は離れた場所の間をすばやく移動できます。\nこのゲートはカリダスの近くにあり、ナウヴィスやフルゴラから行けます。ベリコスの外縁へ通じています。

