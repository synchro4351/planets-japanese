[technology-description]
carna-aps-a=現地の資源や朽ちたメカから得た残骸を、謎めいたカルナのホスト組立機で溶かして一種の複製ジェルにし、すぐに使える基本的な資源を作り出せます。
carna-aps-c=研究所の周りをモリブデンのフレームで囲むことで寒さから守り、研究所を最高速度で稼働させられます。
carna-aps-d=化学プラントは、多種多様な液体や気体の取り扱いに特化した建物です。
planet-discovery-carna=非常に低温の惑星で、あらゆる機械の処理速度が落ちます。周囲を暖める方法が必要になるでしょう。
carna-interm_1=地上に散らばるカルナの残骸を活用する方法を解禁します。プラズマの塊を利用・生成する初歩的な方法も含まれます。
molybdenum-processing=モリブデンは、この惑星で採掘できる唯一の天然資源です。ほとんど、あるいはすべての天然資源が何らかの方法でこの素材に変換・変成されたようで、このモリブデンが本当に天然のものなのか疑問に思えてきます。より高度な機械の製造に必要なモリブデンコアの生産を完全に自動化できるようになるため、この資源を大量に入手できるようにすることは非常に重要です。
chunk-processing=流体を塊に変えます。蒸気の生成など、限られた用途に役立ちます。
carnalseiver=この建造物は、なじみのある原子の性質を分離・再構成できます。原料を大量に入手できるようになるまでの間、カルナの残骸を鉄や銅、さらには少量のモリブデンに変えて役立てられます。
carnalairprocessing=地表には水がないにもかかわらず、カルナの大気は水分で満ちています。モリブデンの大気分離機は、カルナ産のモリブデンコアを使って大気中の好きな粒子を分離し、使えるガスを作り出せます。
geyser-power=地表のあちこちに、ガスを大気中に噴き出している穴があります。これらのガスは、蒸気を作ったり、別の建造物であるモリブデンの加熱柱で燃やしたりと、さまざまな方法で利用できます。この柱で周囲を暖めると機械が最適な速度で稼働できるようになり、カルナの過酷な環境に対抗する手段になります。
algite-processing=アルジャイトはカルナの機械の内部で見つかる特殊な鉱物です。この希少な資源は、モリブデンのふるい分け機の内部に特別なコアを入れることで、周囲の残骸から分離できます。強力な機械を作るのに欠かせない資源です。
stromatolite-carnabreed=グレバの鉄と銅のストロマトライトの特別な品種を物質化します。金属を含む細菌の詰まったこの興味深い袋を大量に育てて、通常の鉱脈の代わりにできます。農業タワーが必要です。ストロマトライトが育つには栽培可能な土壌の上に置く必要がありますが、カルナは事実上生命のない世界です。その答えがカルナの生命カプセルです。この手榴弾を投げると雲が発生し、周囲をカルナで物質化した特定の植物に適した場所に変えます。
carnal-oil2=カルナのエネルギーを使って石油を得る高度な方法です。
algite-assembler=稼働にカルナのプラズマを必要とする超高速の組立機です。カルナの外ではほとんど使い物になりませんが、ほかの惑星で使うためのよりよい方法があるかもしれません。
carnal-science-pack=カルナの知識の源を瓶に詰めたものです。
slipstack-carnabreed=グレバのスリップスタックのカルナ種です。この植物は栄養豊富な水を生み出すことに特化していて、より高度なバイオチャンバーの燃料として使えます。期限切れにならない燃料の供給源です。エキゾティシアの交配にも欠かせません。
boompuff-carnabreed=カルナには石炭がありません。この植物は、炭素に加工できる代わりのものを生み出します。
feron-processing=特別なコアでカルナの残骸の塊を処理すると、非常に希少な鉱物フェロンが得られます。フェロンによってカルナのエネルギーが使えるようになり、ほかの惑星で使える高度な機械も作れるようになります。
automation-feron=カルナのエネルギーを燃料とする、信じられないほど高速で強力な組立機です。
biochamber-mk2=未加工の栄養素の代わりに富栄養水を燃料として使う、バイオチャンバーの改良版です。
artificial-global-gleba-soil=生命カプセルはカルナの地表でしか効果がありませんが、これらのタイルはどこにでも設置できるため、カルナ系の植物の品種を好きな地表で育てられます。これにより、炭素の鉱山、鉄や銅の鉱山、栄養豊富な水をどこにでも作れるようになります。
carnal-energy-crystal=カルナのエネルギーを物理的な形にしたもので、ほかの惑星への大量輸送に適しています。栽培することもできます。
feron-airpump=モリブデンの大気分離機の超高度版です。この見事な機械は、多くの世界の大気中の原子を分離して、望みのガスを物質化できます。
forging-exotic-material=謎めいた植物エキゾティシアを交配して育てる複雑な工程です。この植物からは利用できるエキゾチック物質が得られます。ロケットを高層大気に打ち上げることで、カルナの電磁場のガスを集め、種をエキゾチックな種に変えるのに使えます。
breeding-exoticia=エキゾチック物質を生み出す植物です。
advanced-materialization=知識と引き換えに、より複雑な資源を物質化します。
carna-reach-equipment=操作できる距離を1タイル延ばします。
carna-craft-equipment=クラフトの速度を上げます。
carna-cache-equipment=保管スペースを増やします。
carnan-spire=供給されたエネルギーを地表全体に送信できる巨大な建造物です！ この見事な機械は、供給される大量のエネルギーとスパイアコアを消費して、あらゆる種類のエネルギーを効率よく分配します。この機械があれば現地の配線はまったく不要になりますが、スパイアコアの燃焼が止まると送信も止まってしまいます。送信が止まったときに備えて、スパイアの稼働に必要な機械はすべて現地の電力網にもつないでおくことをおすすめします。スパイアを動かすには大量のエネルギーが必要です。
stingfrond-carnabreed=スティングフロンドは、ほかのカルナ系の植物を作るのに必要です。この植物から収穫できる実は油分を豊富に含んでいます。
algite-bio-dome=この特別なドームはグレバとまったく同じ大気を局所的に再現でき、ユマコやジェリーナッツなどの果実をほかの惑星で栽培できるようになります。ドームを設置すると、その場所を恒久的なものにするのと引き換えに、局所的な大気を作る選択肢が表示されます。この効果を元に戻す方法はありません。

