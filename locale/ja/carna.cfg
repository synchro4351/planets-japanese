[mod-name]
carna=○🌐カルナ

[space-location-name]
carna=カルナ
carnaEMF=カルナの電磁場

[space-location-description]
carna=非常に低温の惑星です。惑星は非常に活発な電磁場に囲まれていて、ときおり雷が発生し、地表は永遠の暗闇に覆われています。寒冷な大気はほとんどの機械にとって有害で、最高速度で稼働できなくなります。惑星を覆う電磁場は人工的に作られたものとみられ、この荒涼とした雪の惑星にはかつて生命が存在していたと考えられます。スキャンによると、地表には休眠中の機械が散らばっていて、この世界の核は人工的に置き換えられているようです。

