[mod-setting-description]
carna-sciencesphere-mode=このモードでは、カルナの進行がサイエンススフィアを使うものに完全に変わります！ このモードでは、技術ツリーの大部分が、新しいサイエンススフィアを使ってカルナで通常の研究を行う必要があるものに変わります。警告: 惑星での進行が少なくとも3倍に大幅に長くなります。
carna-itemtemp=いくつかのアイテムが「腐敗」、言い換えれば高温から低温へと冷えていくようになります。多くのレシピは、クラフトに高温版のアイテムを必要とします。カルナの物流の難しさが大幅に増します。初期状態では有効です。カルナはもともと物流が複雑な惑星なので、温度のあるアイテムで難しくなりすぎると感じる人のために、無効にできるようにしています。
carna-atmosphere-check=カルナが地表の各チャンクを確認し、エンティティや機械への温度の影響を更新するまでの秒数です。このチェックは決められた秒数ごとに1回実行されます。値を大きくするとカルナでの機械の状態の更新頻度が下がり、小さくすると上がります。
carna-atmosphere=シンプル: カルナの大気は機械に単純な影響を与えます。加熱塔の効果範囲外にある機械は速度が下がります。\n複雑: カルナの大気は機械に複雑な影響を与えます。熱の汚染値が低いと、機械は大きく減速します。汚染が増えるにつれて悪影響は減ります。\n必要に応じて切り替えても問題ないはずです。
carna-roamers-temp=チェックを外すと、カルナを徘徊するボットが自動で消えなくなります。UPSを消費することがあるようなので、初期状態では自然に消えるようにしています。ボットが気に入っていてUPSの消費が気にならない場合は、残しておいてもかまいません。

