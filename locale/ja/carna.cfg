[item-description]
carnan-lab=研究を行う通常の研究所ですが、外部からの影響を受けません。
molybdenum-airpump=周囲の大気中の分子を分離する専用の機械です。
molybdenum-miner=鉱床や資源の溜まりを掘って素材を得ます。
molybdenum-seiver=原料を大きさ、重さ、組成で選り分けて整理します。効率よく稼働するには流体が必要です。
molybdenum-heater=周囲の大気に大量の熱を放出します。カルナの残骸や高密度プラズマの塊を燃やして熱を生み出せます。
algite-assembler=カルナの特性に特化した自動クラフト機械です。
algite-knowledge-chamber=原料から複雑な物質やアイテムを作り出したり、変化させたりします。
feron-airpump=周囲の大気中の分子を分離する、専用の高度な機械です。
feron-assembler=カルナの特性に特化した、高度な自動クラフト機械です。
feron-biochamber=未加工の栄養素の代わりに富栄養水を燃料として使う、バイオチャンバーの改良版です。
carnan-spire=この巨大な建造物はカルナの信号を発します。これは惑星全体に広がるエネルギーの脈動で、地表のあらゆるカルナ系の機械に無線で電力を供給します。継続して稼働させるには膨大なエネルギーが必要です。
carna-cache-equipment=インベントリを拡張します。
carna-craft-equipment=手動クラフトの速度を150%上げます。
carna-reach-equipment=操作できる距離を1タイル延ばします。

