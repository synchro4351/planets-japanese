[space-location-description]
foliax=採掘できる資源がまったくない謎めいた惑星です。植物学と秘術を組み合わせて、どこか見覚えのある素材を生み出しましょう。強力な機械を作り、決して渇きの癒えないバイオラボを見つけ出しましょう。

