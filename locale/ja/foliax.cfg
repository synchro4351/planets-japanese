seed-gambling=腐敗物から役に立つ種子を見つけ出します。
seed-gambling-2=木材から役に立つ種子を見つけ出します。
foliax-ammonia=秘術を生物廃棄物と水に組み合わせて、アンモニアを作ります。
foliax-scrap-creation=秘術をスクラップのインゴットに組み合わせて、リサイクルできる産業スクラップを作ります。
foliax-glass=黒曜石を加工してガラス板にします。
foliax-glass-fibers=ガラスを細かく裂いて繊維にします。回路基板の製造に使います。
foliax-bioresin=腐敗物から樹脂を作ります。回路基板の製造に使います。
