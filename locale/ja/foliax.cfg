foliax-spawner=フォリアックスの植物、魚、秘術を使って、新たな生命の創造に挑みます。
foliax-asteroid-pressing=宇宙の小惑星とプロメテウスの樹皮を圧縮して、ひとつにまとめます。
foliax-promethium-discharge=エネルギーを放出させ、大きな可能性を秘めたものを生み出します。

[entity-description]
iron-farm-tree=加圧されたガス袋を持つフォリアックスの地衣類で、腐った物質を発酵させて鉄の莢を作ります。
copper-farm-tree=加圧されたガス袋を持つフォリアックスの地衣類で、腐った物質を発酵させて銅の莢を作ります。
stone-farm-tree=加圧されたガス袋を持つフォリアックスの地衣類で、腐った物質を発酵させて石を作ります。
coal-farm-tree=加圧されたガス袋を持つフォリアックスの地衣類で、腐った物質を発酵させて石炭を作ります。
uranium-farm-tree=乾いた細い樹冠を持つフォリアックスの地衣類で、ウランのトゲが付いた非常に強いつるを垂らします。
tungsten-farm-tree=タングステンでできたじょうご状の形をした、フォリアックスの菌類です。
holmium-farm-tree=乾いた細い樹冠を持つフォリアックスの地衣類で、ホルミウムのトゲが付いた非常に強いつるを垂らします。
calcite-farm-tree=硬い方解石の樹皮と、毛の生えた棍棒のような傘を持つフォリアックスの菌類です。
scrap-farm-tree=正体不明の物質でできた樹皮を持つフォリアックスの木です。別の木から得た触媒を使えば、役に立つ素材に変えられるかもしれません。
bitumen-farm-tree=ビチューメンでできた奇妙なサンゴの柱が地面から生えています。
obsidian-farm-tree=黒曜石でできた奇妙なサンゴの柱が地面から生えています。
fluorite-farm-tree=蛍石でできた奇妙なサンゴの柱が地面から生えています。
lithium-farm-tree=触手のような根と、カラカラ鳴るリチウムの莢を持つフォリアックスの菌類です。
bauxite-farm-tree=加圧されたガス袋を持つフォリアックスの地衣類で、腐った物質を発酵させてボーキサイトの莢を作ります。
tin-farm-tree=加圧されたガス袋を持つフォリアックスの地衣類で、腐った物質を発酵させてスズの莢を作ります。
lead-farm-tree=加圧されたガス袋を持つフォリアックスの地衣類で、腐った物質を発酵させて鉛の莢を作ります。
zinc-farm-tree=加圧されたガス袋を持つフォリアックスの地衣類で、腐った物質を発酵させて亜鉛の莢を作ります。
raremetals-farm-tree=さまざまなレアメタルでできた樹皮を持つフォリアックスの木です。
imersite-farm-tree=乾いた細い樹冠を持つフォリアックスの地衣類で、イマーサイトのトゲが付いた非常に強いつるを垂らします。
wood-farm-tree=古代の木です。
yumako-farm-tree=おいしくて栄養のある果実を実らせるフォリアックスの木です。
jellystem-farm-tree=ゼリー状の茎と柔らかい肉質のこぶを持ち、しわの寄ったジェリーナッツを実らせるフォリアックスの木です。
sulfur-farm-tree=スポンジのような構造を持ち、ブリムフルーツを実らせるフォリアックスの地衣類です。
arcane-farm-tree=フォリアックスの秘術のエネルギーがこの柳を流れ、秘術のエネルギーのキューブを実らせます。
promethium-farm-tree=根を非常に深くまで張り、惑星の血を吸い上げる、密度が高くエネルギーに満ちたフォリアックスの木です。
foliax-willow=フォリアックスの柳は、種子などの生物標本を捕らえることで悪名高い木です。
foliax-recycler=秘術のエネルギーを使ってアイテムを変成させます。フォリアックスのスクラップを使える製品に変えたり、原料や中間素材の品質を上げたりできます。
foliax-omega-powerplant=もうすぐ起動するはずです。
foliax-spawner=植物から生き物を作り出す、科学の大発見です！
foliax-mixer-machine=さまざまな果物や肉を混ぜ合わせます。自分で一息つくもよし、お腹を空かせたバイオラボにごちそうを与えるもよしです。
foliax-burner-biolab=檻に入ったこの脳は舌が肥えています。働くのは好きですが、ミックスドリンクかおやつのガラス瓶をもらえたときだけです。
foliax-burner-biolab-mk2=檻に入ったこの超強化された脳は舌が肥えています。働くのは好きですが、ミックスドリンクかおやつのガラス瓶をもらえたときだけです。
foliax-arcane-turret=この塔の秘術の構造は、10時間稼働すると劣化します。
foliax-leyline=フォリアックスのレイラインから力を引き出し、[item=foliax-arcane-cube]をゆっくりと蓄える祭壇です。

[technology-description]
foliax-perpectual-motor=秘術の力を利用して、永遠に回り続けるモーターを作ります。
foliax-exodus=農場を片付けて出発する時です。銀河には探検すべき世界が広がっています！
foliax-lumberjack=木をとても強く、とても速く叩きます。
foliax-promethium-one=手順1: インゴットを砕いて粉末にします。
foliax-promethium-two=手順2: 粉末を溶岩とガスに組み合わせます。
foliax-promethium-three=手順3: 流体を有機成分と混ぜて種子を作ります。
foliax-promethium-four=手順5: 宇宙の小惑星とプロメテウスの樹皮を一緒に圧縮します。
