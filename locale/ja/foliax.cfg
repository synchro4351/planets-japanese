[mod-setting-description]
foliax-armor=リアクター、ロボットステーション、たくさんの脚を備えたメカスーツです。
foliax-bots=ロボットの基本速度を6倍にします。
foliax-research-multiplier=フォリアックスの技術ツリーにだけ、研究コストの倍率をかけます。
foliax-decoration=コンクリートを設置したとき、周りの装飾を取り除きます。
foliax-biolab-quality=品質がフォリアックスのバイオラボのサイエンスパック消費量に影響するようにします。
foliax-start-planet=新しいゲームをフォリアックスから始めます。
foliax-enemies=無効にするとフォリアックスから敵がいなくなります。
foliax-winter=ホリデー気分を楽しみましょう！
foliax-k2-cards=Krastorio2 Spaced Out が有効なとき、フォリアックスの研究アイコンを技術カードに置き換えます。
foliax-rain=フォリアックスに雨のエフェクトを表示します。
foliax-fog=フォリアックスの湿地タイルに霧のエフェクトを表示します。
foliax-spoilage=腐敗物の植物を追加します。インサータが運んでいる途中で種子が腐ってしまっても、タワーがそれを投入物として受け取り、出力へ移せるようになります。
foliax-fulgora-route=フォリアックスとフルゴラを結ぶ宇宙航路です。
foliax-edge-route=フォリアックスと太陽系の果てを結ぶ宇宙航路です。
foliax-promethium=プロメチウムの小惑星の塊を作る技術とレシピの製造チェーンを有効にします。フォリアックスの資源の大半と小惑星を使います。
foliax-infuser-speed=秘術の注入機用に生成されるアップサイクルのレシピの製造速度です。

[item-description]
iron-plant-biomass=アルボル・フェレアの莢には鉄が高濃度で含まれています。
copper-plant-biomass=アルボル・クプレアの莢には銅が高濃度で含まれています。
bitumen-plant-biomass=アルボル・ペトロレイのサンゴにはビチューメンが高濃度で含まれています。
uranium-plant-biomass=アルボル・ポテンティウムのトゲにはウランが高濃度で含まれています。
calcite-plant-biomass=アルボル・マルモレアの樹皮には方解石が高濃度で含まれています。
tungsten-plant-biomass=アルボル・ドゥリッシマの樹皮にはタングステンが高濃度で含まれています。
obsidian-plant-biomass=アルボル・イグネウスのサンゴには黒曜石が高濃度で含まれています。
holmium-plant-biomass=アルボル・フルミニスのトゲにはホルミウムが高濃度で含まれています。
lithium-plant-biomass=アルボル・リティオススの莢にはリチウムが高濃度で含まれています。
fluorite-plant-biomass=アルボル・フルオリクスのサンゴには蛍石が高濃度で含まれています。
scrap-plant-biomass=アルボル・プルガメントゥムの樹皮には奇妙な物質が含まれており、加工すると産業スクラップができます。
bauxite-plant-biomass=アルボル・アルギラリスの莢にはアルミナが高濃度で含まれています。
tin-plant-biomass=アルボル・スタンナリスの莢にはスズが高濃度で含まれています。
lead-plant-biomass=アルボル・プルンバリスの莢には鉛が高濃度で含まれています。
zinc-plant-biomass=アルボル・カラミナの莢には亜鉛が高濃度で含まれています。
raremetals-plant-biomass=アルボル・シングラリスの樹皮にはさまざまなレアメタルが含まれています。
imersite-plant-biomass=アルボル・ヴィゴレウムのトゲにはイマーサイトが高濃度で含まれています。
foliax-promethium-biomass=アルボル・プロメテウスの樹皮は、惑星の血に浸かっています。
foliax-arcane-cube=フォリアックスの秘術のエネルギーが、このキューブの中で脈打っています。
foliax-sulfur-fruit=結晶質の芯の中に樹液のような物質が詰まった、刺激臭のある果実です。
foliax-perpectual-motor=秘術の力で永遠に回り続けるモーターです。
foliax-omega-powerplant=下がって、この輝かしい工学の偉業をじっくり眺めましょう。本当に、下がってください。
foliax-charged-promethium-asteroid-chunk=小惑星とプロメテウスの樹皮を組み合わせてできた、高いエネルギーを秘めた新たな塊です。
foliax-arcane-gear-wheel=秘術を注入された歯車です。必要に応じて伸び縮みし、増えることさえあるようです。
foliax-machine-arm=秘術を注入された機械アームです。必要に応じて伸び縮みし、増えることさえあるようです。
foliax-fruit-juice=シンプルで力強く、おいしい一杯です。バイオラボはこれが好きなようで、瓶まで食べてしまいます。
foliax-fish-juice=栄養たっぷりの一杯です。飲んだエンジニアは人間離れした速さを得ます。
foliax-radio-juice=放射線を飲めば、エンジニアはスーパーヒーローになれるかもしれません。少しの間だけですが。
foliax-glass-bottle=地面に投げつけて、まずまずの一杯だったと宣言しましょう。
foliax-research-bottle=地面に投げつけて、まずまずの研究だったと宣言しましょう。
foliax-nutrient-juice=認知反応とエネルギーを高める必須ミネラルです。
pelagos-rum=この上等なラムを敵に投げつけて、交渉を試みましょう。
foliax-tolerance-module-1=人工的に引き起こされたミックスドリンクへの耐性です。
foliax-tolerance-module-2=人工的に引き起こされたミックスドリンクへの耐性です。
foliax-tolerance-module-3=人工的に引き起こされたミックスドリンクへの耐性です。
foliax-material-energy=エネルギーに富む植物から作った素材のサンプルです。
foliax-material-foundation=基礎となる植物から作った素材のサンプルです。

