[mod-name]
title=凝縮農業タワー
[mod-description]
description=植物から液体を収穫できる新しい農業タワーを追加します。液体はタワー内部のタンクに貯められます。
[entity-name]
condensing-agricultural-tower=凝縮農業タワー
hidden-condensing-agricultural-tower-tank=凝縮農業タワーのタンク
[entity-description]
condensing-agricultural-tower=種を植えて収穫し、収穫のたびに液体を凝縮して内部のタンクに貯めます。タンクが満杯になると、あふれた分は貯められません。詳しくはファクトリオペディアを参照してください。
hidden-condensing-agricultural-tower-tank=収穫で得た液体を最大3万まで貯めます。
[factoriopedia-description]
condensing-agricultural-tower=種を植えて収穫し、収穫のたびに液体を凝縮して内部のタンクに貯めます。タンクが満杯になると、あふれた分は貯められません。
condensing-tree=\n[entity=tree-plant]を収穫すると、[fluid=water]が2000凝縮されます（毎秒153.3）
condensing-yumako=\n[entity=yumako-tree]を収穫すると、165 °Cの[fluid=steam]が810凝縮されます（毎秒62.1）
condensing-jellynut=\n[entity=jellystem]を収穫すると、[fluid=lubricant]が420凝縮されます（毎秒32.2）
[mod-setting-name]
enable-tree-condensing-water=木から水を凝縮する
enable-jellynut-condensing-lubricant=ゼリーステムから潤滑油を凝縮する
enable-yumako-condensing-steam=ユマコの木から高温の蒸気を凝縮する
[mod-setting-description]
enable-tree-condensing-water=[entity=tree-plant]を収穫すると、[fluid=water]が2000凝縮されます（毎秒153.3）
enable-jellynut-condensing-lubricant=[entity=jellystem]を収穫すると、[fluid=lubricant]が420凝縮されます（毎秒32.2）
enable-yumako-condensing-steam=[entity=yumako-tree]を収穫すると、165 °Cの[fluid=steam]が810凝縮されます（毎秒62.1）
