[space-location-description]
virentis=現在フルゴラ文明が暮らしている惑星です。作物を育て、料理を作り、現地人と取引しましょう。しかし、この惑星はいまだペンタポッドの侵略を受けており、彼らは以前よりもさらに怒っています。
[technology-description]
fruit-cultivation=グレバの生物学を研究することで、種から木を栽培できるようになります。
space-cultivation=グレバを極めることは、生命そのものを極めることです。宇宙の虚空でも生命を維持できるようになります。
advanced-baking=[item=berry-bliss-cookie]を食べます
virentis-rocket-silo=現地人が民主主義を広めるのを手伝います。そうすれば彼らの経済がより速く成長し、ここでロケットサイロを建設できるようになります。
environment-research-center=現地人と協力して、この惑星の秘密を解き明かします。
tar-processing=[item=pentapod-souffle-omelette]を食べます
frying=現地人に[item=sweet-chili-sauce]と[item=wild-taco]を500個ずつ渡します。秘伝のレシピを教えてくれるかもしれません。
