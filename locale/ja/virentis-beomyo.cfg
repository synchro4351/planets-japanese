[entity-description]
eternal-lantern=光を放ちつつ、周囲の範囲に効率ボーナスを与える装飾用のランタンです。複数設置しても追加のボーナスはありません。ビーコンの上限には数えられません。
windmill=周囲の範囲に生産性ボーナスを与える風車です。初期エリアから離れるほどボーナスが強くなります。最大で生産性+100%です。
rockmalt-tree=殻は岩のように硬いですが、果肉はプリンのように柔らかいです。
redbloom-tree=甘くてほんのり辛い味の赤いベリーです。
mangroove-tree=甘酸っぱい味の柑橘類の果実です。
nyxoleum-tree=非常に油分の多い植物で、タールの水たまりに生えます。その油はとてもきれいで、料理にも使えるほどです。
fishing-dock=この機械は、製作が成功するたびに魚を1匹発生させようとします。利用できる水域が広いほど、魚が発生する確率が高くなります。
spore-tower=決められた場所で、大気中に胞子を放出します。
