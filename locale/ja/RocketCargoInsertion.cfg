rci-silo-recipes=ロケットサイロごとに使うレシピを設定できるようにします。新しい部品は、そのサイロで必要なときだけ使えば済みます。「代理コンテナ」モードでは使われません。
rci-processing-unit=制御基板から作るロケット制御ユニットを追加します。「代理コンテナ」モードでは使われません。
rci-low-density-structure=軽量化素材から作るロケットフレーム部材を追加します。「代理コンテナ」モードでは使われません。
rci-rocket-fuel=ロケット燃料から作る自燃性推進剤を追加します。「代理コンテナ」モードでは使われません。
