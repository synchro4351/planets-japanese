[tips-and-tricks-item-description]
tellus-briefing=[planet=tellus]は、細菌と寄生体に侵された惑星です。大気中の花粉は[entity=small-wasp]の繁殖を助け、一部の素材にも影響を与えます。テルスの技術をさらに研究すれば、解決策が見つかるかもしれません。\n葉緑素と菌糸体は[entity=condensing-agricultural-tower]で栽培でき、[entity=planetaris-bioassembler]で処理できます。\nこの惑星では[entity=iron-ore]、[entity=copper-ore]、[entity=crude-oil]、[entity=coal]、[entity=uranium-ore]が見つかりませんが、植物から必要なアイテムを作る別の方法が得られます。\n農業で得られるアイテムの多くは、時間とともに腐敗するという難点があります。[item=planetaris-bioengineering-science-pack]でさえ寿命があり、ため込むことはできません。さらに病理のアイテムは、腐敗すると敵を生み出すという難点もあります。たとえば[item=planetaris-pathological-science-pack]は、腐敗すると[entity=big-wasp]になって飛び出します。
tellus-bioassembler=[entity=planetaris-bioassembler]を使うと、テルス独自の処理と素材を作り出せます。\n[entity=planetaris-bioassembler]は生きているため、天然の地面に[item=planetaris-bioassembler-seed]を植える必要があります。すべての植物と同じように[entity=planetaris-bioassembler]も枯れます。枯れ始めたら、分解されて完全に枯れてしまう前に、蘇生レシピで[item=nutrients]を与えてください。\n[entity=planetaris-bioassembler]は[entity=construction-robot]で設置できます。
tellus-roots=パイプは花粉ですぐに腐食し、テルスの機械は[entity=pipe]に接続できません。流体を運ぶには[entity=planetaris-root]を作る必要があります。[entity=planetaris-root-filler]を使うと、パイプから来た流体を根に満たしたり、根からパイプへ流体を取り出したりできます。

