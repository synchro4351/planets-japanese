[mod-name]
aai-vehicles-ironclad=AAI ビークル: 装甲艦
[mod-description]
aai-vehicles-ironclad=長射程の迫撃砲と主砲を備えた、重金属装甲のボートです。積載量が大きいので、島から島へアイテムを運べます。武器は迫撃砲弾と戦車の弾薬の両方を使用できます。装甲艦への乗り降りは浅瀬からが最も簡単です (Alien Biomes MOD)。
[item-name]
mortar-bomb=迫撃砲弾
mortar-cluster-bomb=迫撃クラスター弾
ironclad-cannon=主砲
ironclad-mortar=迫撃砲
[item-description]
mortar-bomb=非常に長射程の、弧を描いて飛ぶ爆発物です。
mortar-cluster-bomb=長射程の、弧を描いて飛び分裂する爆発物です。
ironclad-cannon=中射程で低弾道の砲弾を発射します。
ironclad-mortar=長射程で高弾道の迫撃砲弾を発射します。
