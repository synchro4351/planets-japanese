[mod-setting-name]
visible-planets-disable-mp-parallax=マルチプレイでは視差を無効化
visible-planets-vanilla-compat=可能ならバニラのプラットフォーム背景を使う
visible-planets-planetslib-compat=近くの惑星・衛星を描画（PlanetsLib 互換）
visible-planets-planetslib-scale=背景天体の大きさ
visible-planets-planetslib-dist=背景天体の中心からの距離
visible-planets-planetslib-init-angle=背景天体の最初の描画角度
visible-planets-planetslib-spacing-mult=背景天体の間隔の倍率
visible-planets-planetslib-tint=背景描画の色合い
visible-planets-enable-blur=惑星のぼかしを有効化
visible-planets-blur-intensity=ぼかしの強さ
[mod-setting-description]
visible-planets-disable-mp-parallax=マルチプレイでは視差を無効にします。ホスト以外のプレイヤーではおかしな動きになることがあるためです。上の設定より優先されます。
visible-planets-vanilla-compat=Visible Planets はデフォルトで、バニラに新しく入った惑星背景を置き換えます。この設定を有効にすると、背景がすでに用意されている惑星はすべてスキップします（バニラの背景がないMOD惑星はいつもどおり Visible Planets で描画します）。
visible-planets-planetslib-compat=有効にすると、MODで追加された衛星の背後に親天体を表示し、衛星を持つ惑星には同じように衛星を表示します（PlanetsLib の衛星でのみ動作します）。
visible-planets-planetslib-scale=PlanetsLib 互換で描画する天体の、親天体に対する大きさです。
visible-planets-planetslib-x=最初の背景描画のX座標です。複数の衛星を持つ惑星では、この位置を基準に追加の描画を行います。
visible-planets-planetslib-y=最初の背景描画のY座標です。複数の衛星を持つ惑星では、この位置を基準に追加の描画を行います。
visible-planets-planetslib-dist=PlanetsLib 互換の描画での、親天体の中心からの距離です。小さい値にすると、天体がメインの惑星の下に描画されます。
visible-planets-planetslib-init-angle=最初の背景描画の初期角度（度）です。惑星の回転が有効な場合はあまり意味がありませんが、それ以外では役に立ちます。
visible-planets-planetslib-spacing-mult=デフォルトでは親天体の周りに均等に配置します。1より小さい倍率では間隔が狭まり、1より大きい値では間隔が不均等になります。
visible-planets-planetslib-tint=小さい値ほど背景描画が暗くなります。1で通常どおり描画します。
visible-planets-enable-blur=見える惑星のスプライトにぼかし効果をかけます。動作が重くなることがあります。
visible-planets-blur-intensity=ぼかし効果の強さです。値が大きいほど惑星がぼやけます。
