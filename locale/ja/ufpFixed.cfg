[entity-description]
ufp_electric_boiler_entity=UFPの第1段階の入力です。水を高温の重水[fluid=ufp_heavy-water]と蒸気に変えます。
ufp_deuterium_extractor_entity=UFPの第1段階の入力です。水と高温の蒸気を、高温の重水[fluid=ufp_heavy-water]と枯渇水[fluid=ufp_depleted-water]に変えます。
ufp_electrolyser_entity=UFPの第2段階の入力です。重水[fluid=ufp_heavy-water]を電気分解して純粋な重水素ガス[fluid=ufp_deuterium]にし、枯渇水[fluid=ufp_depleted-water]を電気分解して重水[fluid=ufp_heavy-water]にします。
ufp_plasma_heater_entity=UFPの第3段階の入力です。不安定な小型プラズマ炉で、ガス[fluid=ufp_deuterium][fluid=ufp_d-t-mix][fluid=ufp_d-he3-mix]を数十億度もの高温に加熱して核融合を起こします[fluid=ufp_d-d-plasma][fluid=ufp_d-t-plasma][fluid=ufp_he3-he3-plasma][fluid=ufp_d-he3-plasma]。オーバークロック[recipe=ufp_overclock]して、より重い水素同位体[fluid=ufp_tritium][fluid=ufp_helium-3]を消費することもできます。ごくわずかながら燃料漏れによるメルトダウンのリスクがあります[img=technology/atomic-bomb]。
ufp_gas_mixer_entity=UFPの第5段階の入力です。中性子反応で得られたガス[fluid=ufp_deuterium][fluid=ufp_tritium][fluid=ufp_helium-3]を混合します。
ufp_neutronic_reactor_entity=UFPの第4段階の入力です。D-D[recipe=ufp_d-d-fusion_1]またはD-T[recipe=ufp_d-t-fusion_1]の核融合反応でプラズマ流[fluid=ufp_plasma-flux]を生み出します。プラズマ流を受け入れられるのはプラズマドライバーだけです。
ufp_aneutronic_reactor_entity=UFPの第6段階の入力です。HE3-HE3[recipe=ufp_he3-he3-fusion_1]またはD-HE3[recipe=ufp_d-he3-fusion_1]の核融合反応でプラズマ流[fluid=ufp_plasma-flux]を生み出します。プラズマ流を受け入れられるのはプラズマドライバーだけです。
ufp_duct-small=電磁石を使って、数十億度ものガスやプラズマを運ぶUFPの不格好なダクトです。接続できるのはUFPの機械だけです。
ufp_duct-underground=電磁石を使って、数十億度ものガスやプラズマを運ぶUFPの不格好なダクトです。接続できるのはUFPの機械だけです。
ufp_duct-curve=電磁石を使って、数十億度ものガスやプラズマを運ぶUFPの不格好なダクトです。接続できるのはUFPの機械だけです。
ufp_duct-cross=電磁石を使って、数十億度ものガスやプラズマを運ぶUFPの不格好なダクトです。接続できるのはUFPの機械だけです。
ufp_duct-t-junction=電磁石を使って、数十億度ものガスやプラズマを運ぶUFPの不格好なダクトです。接続できるのはUFPの機械だけです。
ufp_4way_generator_entity=プラズマ流[fluid=ufp_plasma-flux]を消費して電気エネルギーを生み出すUFPの発電機です。プラズマ流を通すこともできます。最大効率: [recipe=ufp_d-t-fusion_1]
ufp_8way_generator_entity=プラズマ流[fluid=ufp_plasma-flux]を消費して電気エネルギーを生み出すUFPの発電機です。プラズマ流を通すこともできます。最大効率: [recipe=ufp_d-t-fusion_1]
ufp_16way_generator_entity=プラズマ流[fluid=ufp_plasma-flux]を消費して電気エネルギーを生み出すUFPの発電機です。プラズマ流を通すこともできます。最大効率: [recipe=ufp_d-he3-fusion_1]
ufp_a_gen_entity=プラズマ流[fluid=ufp_plasma-flux]を消費して電気エネルギーを生み出すUFPの発電機です。プラズマ流を通すこともできます。最大効率: [recipe=ufp_d-t-fusion_1]
ufp_b_gen_entity=プラズマ流[fluid=ufp_plasma-flux]を消費して電気エネルギーを生み出すUFPの発電機です。プラズマ流を通すこともできます。最大効率: [recipe=ufp_d-t-fusion_1]
ufp_c_gen_entity=プラズマ流[fluid=ufp_plasma-flux]を消費して電気エネルギーを生み出すUFPの発電機です。プラズマ流を通すこともできます。最大効率: [recipe=ufp_d-he3-fusion_1]
ufp_core-vent_entity=プラズマ流[fluid=ufp_plasma-flux]を扱う設備に欠かせない装置です。温度の異なるプラズマ流を外界へ逃がせます。
ufp_heat_divertor_entity=閉じ込めたプラズマが主チャンバーの壁に直接触れるのを防ぎながら、プラズマ流[fluid=ufp_plasma-flux]から熱を取り出すUFPのセパラトリクスです。最大消費量: 11.76GW
ufp_black_hole_entity=桁外れのエネルギーを費やし、不安定なブラックホールの周囲で起こる混沌とした高エネルギーの衝突から、粒子と反粒子の量子放射の対[fluid=ufp_antiproton][fluid=ufp_positron]を捕らえます。受け入れるのはD-HE3[recipe=ufp_d-he3-fusion_1]の最高温のプラズマ流[fluid=ufp_plasma-flux]だけです。反物質を通すこともできます。
ufp_white_hole_entity=ホワイトホールを通じて、桁外れの量の反物質[fluid=ufp_antiproton][fluid=ufp_positron]のエネルギーをサイエンスや装置に注ぎ込みます。反物質を通すこともできます。
ufp_neutrino_detector=セクターの連続スキャンごとに技術研究を0.1%進めるUFPのレーダーです。セクタースキャンの間隔: 10分。設置できるのは1つのジオスフィアにつき100基までです。

