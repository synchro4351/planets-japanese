[technology-description]
halo-discovery-solar=膨大な日射を受ける太陽近傍軌道への航路を描きます。この宙域にアステロイドはありませんが、通常兵器が効きにくいプラズマフレアが発生します。強い重力と乏しい資源のため、やや危険な宇宙航路です。
halo-discovery-station=基礎を使って、エネルギーを集める恒久的なソーラーステーションを建設します。
halo-compute=高度な計算を使った研究ができるようになります。
halo-terminal=慎重に管理することで、電解液に膨大なエネルギーを充電できます。充電された電解液は腐食性がかなり低く、ドラム缶に詰められます。
halo-nav-computer=デブリ帯を抜ける正確な航路を計算し、アステロイドとの遭遇を減らします。
halo-rocket=精密な気象・物理シミュレーションと電磁コイルを使って、宇宙プラットフォームへ貨物を届けます。ビーコンの効果を受けません。
halo-module=高度なシミュレーションでモジュールを特定の環境に特化させ、しばらくの間効果を2倍にします。
halo-speed=スーパーコンピュータの製作速度を上げます。
halo-heatsink-high=高度な熱管理ができるようになります。
halo-solar=太陽光を集中させ、ソーラーパネルで集められる電力を増やします。すべての勢力の発電量が変わり、稼働中の勢力のうち最も高い研究レベルだけが使われます。
halo-gmo=種子から、繁殖はしないが生産性の高い植物を作ります。
halo-sim=高価なシミュレーションを使ってサイエンスパックを作ります。
