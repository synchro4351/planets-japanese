[tips-and-tricks-item-description]
halo-solar-halo-briefing=太陽にさらに近づくと、ずっと効率よく太陽光発電ができますが、危険も伴います。この宇宙航路にアステロイドはありませんが、通常兵器が効きにくい[entity=halo-flare]が現れます。レーザーや電気兵器の使用をおすすめします。また、太陽に近づくほど引力が強くなります。再生可能な燃料源がない場合は、燃料の残量に応じて移動距離を抑えたほうがよいでしょう。この航路は飛行条件を使うので、宇宙プラットフォームは途中で引き返せます。
halo-solar-station-briefing=熱に耐えるためにステーションの基礎で建設された、恒久的なソーラーステーションです。宇宙プラットフォームはこの航行に耐えられないため、ステーションへはカーゴポッドで降下し、帰りはロケットサイロを使います。ステーションはステーションの基礎で拡張できます。太陽の表面がプラットフォームの裏側にあるため、ソーラーパネルは発電しません。ステーションの基礎はそれぞれ、全体の電力網に電力を供給します。
halo-compute=[entity=halo-computer]など一部のエンティティは、熱くなりすぎると停止します。[entity=heat-pipe]を使って熱を[entity=halo-heatsink]へ逃がし、温度を下げましょう。解放されると、[entity=halo-heatpump]で熱を集中させ、[entity=heat-exchanger]のような高温の用途に使えるようになります。
