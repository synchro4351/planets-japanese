[tips-and-tricks-item-description]
gradus-briefing=[planet=gradus]は5つの段丘からなる惑星です。最下段の盆地から、低地、中段、上段、そして最上段の山頂と続きます。段の間は崖の壁で隔てられています。崖は破壊できないため、峠を通るか、着陸地点の近くですべての段を貫く切れ目「大階段」を通ります。\n崖を下るのは[entity=gradus-chute]と[entity=gradus-aqueduct]で無料です。崖を上るには[entity=gradus-lift]と[entity=gradus-uphill-pump]で電力がかかります。\n資源は段によって異なります。[entity=iron-ore]、[entity=crude-oil]、[entity=gradus-dense-ore]は盆地に、[entity=copper-ore]と森林は低地に、[entity=gradus-ice-deposit]、[entity=gradus-light-crystal]、[entity=gradus-helium-vent]は山頂にあります。[entity=coal]と[entity=stone]は中間の段にあります。\n湖があるのは盆地だけです。それより上では、滝つぼ (そこでは[entity=offshore-pump]が使えます)、[entity=gradus-uphill-pump]による盆地からのパイプ、または山頂の氷を[entity=gradus-vacuum-ice-melter]で溶かして[entity=gradus-aqueduct]で下に送ることで水を得ます。\n[item=gradus-gradient-science-pack]は、原料が採掘される場所では作れない部品から作るため、部品は崖を越えることになります。[entity=gradus-vacuum-kiln]、[entity=gradus-deep-press]、[entity=gradus-calibration-bench]はどの段でも動きます。その段で動かないレシピに設定すると、機械は待機状態になり、理由を表示します。\n敵はいません。滝に[entity=gradus-hydro-turbine]を建設して発電できます。
gradus-terraces=各段には独自の地面と資源があります。着陸地点は真ん中の中段です。そこから下ると盆地、上ると山頂です。Altモードでは段の名前が地面に表示されます。\n[entity=underground-belt]、[entity=pipe-to-ground]、インサーターは崖を越えて届きません。試みると建設は取り消され、アイテムは返却されます。\n峠は普通の地面なので、歩いたり、車で走ったり、線路を敷いたりできます。高架レールはどこでも崖を越えられます。ロボットは崖の上を飛んで越えます。
gradus-vertical-logistics=[entity=gradus-chute]はアイテムを無料で崖の下へ運び、[entity=gradus-aqueduct]は液体で同じことをします。地下搬送ベルトや地下パイプのように、一方の端を上の段に、もう一方を下の段に、最大10タイル離して設置します。導水路の下端は[entity=gradus-cliff-outlet]になります。\n[entity=gradus-lift]はアイテムを崖の上へ運び、ベルトは下から入ります。アイテム1個あたり15kJを使うため、ターボ搬送ベルト満載で900kWが必要で、ベルトが詰まっている間は電力を使いません。[entity=gradus-uphill-pump]は液体を上へ運び、汲み上げ1単位あたり約1kJを使います。どちらも電力がないと停止します。\nどれも一方向にのみ、グラドゥスでのみ動作します。一方の端を回収すると両端とも回収され、設置後は回転できません。\n適切な設備を持った状態でベルトやパイプを崖の上にドラッグすると、その場所に自動で建設され、地下設備は手元に戻ります。
gradus-altitude-machines=[entity=gradus-vacuum-kiln]、[entity=gradus-deep-press]、[entity=gradus-calibration-bench]はどの段でも動きますが、原料が採掘される段ではどのレシピも動きません。その場合、機械は待機状態になり、ステータスに理由が表示されます。\n[item=gradus-gradient-science-pack]は2つの半分から作る水準器です。空の半分は窯で作ります: [item=gradus-light-crystal]と[fluid=helium]から[item=gradus-skyglass] (山頂以外)、スカイガラスと[item=stone]から[item=gradus-glass-vial] (上段と中段以外)、ヘリウムで封じて[item=gradus-sealed-vial] (山頂以外)。深部の半分はプレス機で作ります: [item=gradus-dense-ore]と[fluid=sulfuric-acid]から[item=gradus-dense-plate] (盆地以外)、高密度板と[item=copper-plate]から[item=gradus-level-frame] (低地以外)、[item=plastic-bar]で[item=gradus-trued-frame] (盆地以外)。較正台は、どの段でも[item=electronic-circuit]と合わせて2つの半分を組み立てます。\n高密度鉱石はリフトで盆地から運び出し、硫酸も後からポンプで汲み上げます。軽量結晶とヘリウムはシュートと導水路で山頂から下ろします。プレス機には+50%の生産性が内蔵されています。[technology=gradus-skyglass-productivity]と[technology=gradus-dense-plate-productivity]は、レベルごとに10%を追加します。\n通常の機械も、適切な段に建設すると一部のアイテムで+25%の生産性を得ます。盆地では[item=plastic-bar]と[fluid=sulfuric-acid]、上段では[item=stone-brick]、山頂では[item=processing-unit]と[item=low-density-structure]です。ビーコンの効果を受けられる機械でのみ有効です。\n[entity=gradus-vacuum-ice-melter]はどこでも+25%の生産性で氷を溶かしますが、グラドゥスでは高い場所ほど遅くなります。盆地では最高速度、山頂では40%です。氷を採掘した場所で溶かすか、シュートで下ろしてより速く溶かしましょう。
gradus-waterfalls=一部の崖のふもとには小さな滝つぼがあります。岸に[entity=gradus-hydro-turbine]を取水口を滝つぼに向けて建設すると、常に5MWを発電します。それ以外の場所では撤去され、返却されます。1つの滝つぼには1～4基のタービンを置けます。\n着陸地点の近くには必ず滝が1つあります。滝つぼは埋め立てできません。
gradus-cliffs=グラドゥスの崖は破壊できません。[item=cliff-explosives]は効かずに返却され、解体予定にもできません。原子爆弾で破壊された崖も元に戻ります。\n通り抜けるには峠を使ってください。アイテムと液体は[entity=gradus-chute]、[entity=gradus-lift]、[entity=gradus-aqueduct]、[entity=gradus-uphill-pump]で崖を越えられます。
gradus-rewards=[entity=gradus-vacuum-ice-melter]は「惑星の発見: グラドゥス」で手に入り、すべての惑星と宇宙プラットフォームで+25%の生産性で動作します。\n勾配サイエンスでは、すべての惑星で役立つものが解禁されます:\n[item=gradus-long-span-underground-belt]と[item=gradus-long-span-pipe-to-ground]は、ターボ地下ベルトと地下パイプの2倍の距離に届きます。\n[item=gradus-skyglass-rocket-silo]は、ロケット1機あたりロケット部品が25個で済みます。\n[technology=gradus-electronic-circuit-productivity]は、レベルごとに電子基板の生産性を10%追加します。
