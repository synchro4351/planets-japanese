[factoriopedia-description]
gradus=下から順に各段を紹介します:\n[font=default-semibold]盆地:[/font] [entity=iron-ore]鉄、[entity=crude-oil]原油、[entity=gradus-dense-ore]高密度鉱石、唯一の湖。\n[font=default-semibold]低地:[/font] [entity=copper-ore]銅、[entity=coal]石炭、森林。\n[font=default-semibold]中段:[/font] 着陸地点 (鉄、銅、石炭、石材の小さな鉱床あり)、[entity=stone]石材。\n[font=default-semibold]上段:[/font] [entity=coal]石炭、[entity=stone]石材。\n[font=default-semibold]山頂:[/font] [entity=gradus-ice-deposit]氷、[entity=gradus-light-crystal]軽量結晶、[entity=gradus-helium-vent]ヘリウム。\n水: 盆地の湖、一部の崖のふもとにある滝つぼ、そして[entity=gradus-vacuum-ice-melter]で溶かせる山頂の氷。\nウラン、方解石、魚はなく、敵もいません。帰還用のロケットに必要なものはすべてここで揃います。\nすべての惑星で役立つもの: 真空融氷機 (惑星の発見: グラドゥス)。持ち帰れる報酬 (勾配サイエンス): 長距離地下設備、スカイガラスロケットサイロ、電子基板の生産性。
