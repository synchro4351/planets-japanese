[item-description]
gradus-dense-ore=グラドゥスの盆地で採れる重金属の鉱石です。
gradus-light-crystal=グラドゥスの山頂で採れる、軽くてもろい結晶です。
gradus-dense-plate=盆地の高密度鉱石を少量の硫酸でプレスした重金属の板です。盆地以外の段のディーププレスで作ります。
gradus-skyglass=山頂の軽量結晶を焼いて作る、軽くて透明なガラスです。山頂以外の段の真空窯で作ります。
gradus-gradient-science-pack=水準器です。密封気泡管を調整済みフレームにはめ込み、較正台で較正したものです。
gradus-glass-vial=スカイガラスを石材で研磨して作った曲面のガラス管です。石材のある上段と中段以外の段の真空窯で作ります。
gradus-sealed-vial=ヘリウムの気泡を封じ込めたガラス管です。山頂以外の段の真空窯で作ります。
gradus-level-frame=銅の金具を付けた高密度板のフレームです。低地以外の段のディーププレスで作ります。
gradus-trued-frame=プラスチックの台座と共にプレスして精度を出した水準フレームです。盆地以外の段のディーププレスで作ります。
