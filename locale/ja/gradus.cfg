[entity-description]
gradus-chute=段丘の崖の下へ、アイテムを無料で落とします。地下搬送ベルトのように、上端を崖の上に、下端を崖の下に、最大10タイル離して設置します。下りにのみ動作し、グラドゥスでのみ使えます。
gradus-lift=段丘の崖の上へアイテムを運びます。ベルトは下から入り、上から出ます。地下搬送ベルトのように、一方の端を崖の下に、もう一方を崖の上に、最大10タイル離して設置します。もう一方の端は自動で手に入ります。下端に電力が必要です。アイテム1個を持ち上げるごとに15kJを使うため、ターボ搬送ベルト満載で900kW、詰まっている間は0です。電力がないと停止します。上りにのみ動作し、グラドゥスでのみ使えます。
gradus-lift-motor=リフトに電力を供給します。
gradus-aqueduct=段丘の崖の下へ、液体を無料で一方向にのみ流します。地下パイプのように、一方の端を崖の上に、もう一方を崖の下に、最大10タイル離して設置します。上端が導水路に、下端がその崖の排出口になります。下りにのみ動作し、グラドゥスでのみ使えます。
gradus-cliff-outlet=導水路 (崖の下) または揚水ポンプ (崖の上) の反対側の端です。液体は出てくるだけです。
gradus-uphill-pump=段丘の崖の上へ液体を汲み上げます。地下パイプのように、一方の端を崖の下に、もう一方を崖の上に、最大10タイル離して設置します。下端がポンプに、上端がその崖の排出口になります。パイプが運べる量をすべて汲み上げ、汲み上げ1単位あたり約1kJを使い、停止中は電力を使いません。上りにのみ動作し、グラドゥスでのみ使えます。
gradus-dense-ore=重金属の鉱石です。盆地にしかありません。
gradus-light-crystal=山頂の薄い空気の中で形成された結晶です。
gradus-ice-deposit=凍った水です。湖があるのは盆地だけなので、山頂の水は氷を溶かして得ます。
gradus-helium-vent=山頂の岩からヘリウムが染み出しています。
gradus-vacuum-kiln=軽量結晶を焼いてスカイガラスにし、スカイガラスと石材を研磨してガラス管にし、ヘリウムの気泡を封じ込めます。グラドゥスのどの段でも動きますが、原料が採掘される段ではどのレシピも動きません。山頂ではスカイガラスと密封気泡管を、上段と中段ではガラス管を作れません。その場合、窯は待機状態になり、理由を表示します。
gradus-deep-press=少量の硫酸で高密度鉱石を高密度板に、高密度板と銅で水準フレームに、水準フレームとプラスチックで調整済みフレームにプレスします。すべて+50%の生産性を内蔵しています。グラドゥスのどの段でも動きますが、原料が採掘される段ではどのレシピも動きません。盆地では高密度板と調整済みフレームを、低地では水準フレームを作れません。その場合、プレス機は待機状態になり、理由を表示します。
gradus-calibration-bench=密封気泡管、調整済みフレーム、電子基板から勾配サイエンスパックを作ります。グラドゥスのどの段でも動きます。
gradus-hydro-turbine=滝から昼夜を問わず5MWを発電します。崖のふもとにある滝つぼの岸に、取水口を水に向けて建設します。1つの滝つぼには1～4基のタービンを置けます。湖では回りません。それ以外の場所に建設すると拒否され、返却されます。
gradus-vacuum-ice-melter=密閉された室内で[item=ice]を溶かして[fluid=water]にするため、蒸気として失われる分がありません。+25%の生産性を内蔵しています。すべての惑星と宇宙プラットフォームで使えます。グラドゥスでは、高い場所ほど薄い空気で遅くなります。盆地では最高速度、低地では85%、中段では70%、上段では55%、山頂では40%です。山頂で氷を採掘してそこで溶かすか、シュートで下に送ってより速く溶かしましょう。
gradus-long-span-underground-belt=最大20タイル (ターボ地下ベルトは10) の隙間をつなぐ、ターボ搬送ベルトの速度の地下搬送ベルトです。すべての惑星で使え、溶岩の川、油の海、湖を越えられます。グラドゥスでは、他の地下搬送ベルトと同じく段丘の崖を越えられません。
gradus-long-span-pipe-to-ground=最大20タイル (地下パイプは9) の隙間をつなぐ地下パイプです。他の長距離地下パイプとしか接続できません。すべての惑星で使えます。グラドゥスでは段丘の崖を越えられません。
gradus-skyglass-rocket-silo=スカイガラスの船体でロケットを建造します。ロケット1機に必要なロケット部品が50ではなく25で済み、積載量は同じです。すべての惑星で使えます。通常のロケットサイロと同じくロケットに載せるには重すぎるため、ロケットサイロ、スカイガラス、高密度板から必要な場所で作ってください。
