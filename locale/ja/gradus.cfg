gradus_terraces=頻度: 段が切り替わる頻度です (高いほど段の幅が狭くなります)。
gradus_lakes=湖です。盆地にのみ生成されます。
gradus_forest=低地には森林、中段には木がまばらに生成されます。
gradus_waterfalls=崖のふもとにある滝つぼで、水力タービンで発電できます。頻度: 生成数です。サイズを0にすると生成されません。着陸地点の近くには必ず1つあります。
[gradus-message]
bonus-command-help=カーソル下の機械 (または開いている機械) にグラドゥスの高度ボーナスがあるかどうか、その理由を表示します。
cliff-crossing=__1__は段丘の崖を越えられません。峠を通るか、シュート、リフト、導水路、揚水ポンプを使ってください。
cliff-crossing-needs=__1__は段丘の崖を越えられません。代わりにここに建設するには、__2__を2個持ってください。
crossing-swapped=__1__を崖をまたいで建設しました。地下設備はインベントリに戻りました。
crossing-swapped-ghost=__1__のゴーストを崖をまたいで配置しました。ロボットが建設します。
crossing-swapped-pipe=__1__を崖の縁に建設し、地下パイプがあった場所まで__2__本のパイプでつなぎました。地下パイプはインベントリに戻りました。
down-only=__1__は下りにのみ動作します。上るには__2__を使ってください。
up-only=__1__は上りにのみ動作します。下るには__2__を使ってください。無料です。
needs-level=__1__は、ある段丘の段から隣の段へまたぐ必要があります。
too-far=__1__の両端が10タイル以上離れています。
gradus-only=__1__はグラドゥスの段丘でのみ動作します。
needs-pool=__1__は、崖のふもとで取水口の前に滝つぼが必要です。湖やその他の水では回りません。
turned-back=__1__は差し戻されました: __2__
alert-refused=__1__は建設されませんでした: __2__
alert-repaired=隣接する設備が撤去されたため、__1__を回収しました: __2__
charge-fizzled=__1__は不発に終わりました。グラドゥスの崖は崩れません。峠を通ってください。アイテムは返却されます。
landing=[planet=gradus] グラドゥスには崖で隔てられた5つの段があります。峠を通るか、シュート、リフト、導水路、揚水ポンプを使ってください。下りは無料、上りには電力がかかります。Altキーを押すと段の名前が表示されます。詳しくは「ヒントとコツ」のグラドゥスの項目を確認してください。
[gradus-status]
blocked=__1__は、原料が採れる段 (__3__) では作れません。ここは__2__です。機械を別の段に建設してください。
