[technology-description]
gradus-skyglass-productivity=同じ量の軽量結晶とヘリウムから、より多くのスカイガラスを作れます。
gradus-dense-plate-productivity=ディーププレス自体の+50%に加えて、同じ量の高密度鉱石から、より多くの高密度板を作れます。
planet-discovery-gradus=5つの段からなる段丘の世界、グラドゥスを発見します。段は盆地、低地、中段、上段、山頂です。
gradus-deep-press=高密度鉱石用のプレス機です。高密度板、さらに水準フレームと調整済みフレームを作り、すべて+50%の生産性を内蔵しています。どの段でも動きますが、原料が採掘される段ではどのレシピも動きません。盆地では高密度板と調整済みフレームを、低地では水準フレームを作れません。盆地で高密度鉱石を採掘すると研究できます。
gradus-vacuum-kiln=スカイガラス、ガラス管、密封気泡管を作る窯で、ヘリウムで空気を遮断します。どの段でも動きますが、原料が採掘される段ではどのレシピも動きません。山頂ではスカイガラスと密封気泡管を、上段と中段ではガラス管を作れません。山頂で軽量結晶を採掘すると研究できます。
gradus-gradient-science-pack=勾配サイエンス: 密封気泡管と調整済みフレームから作り、較正台で較正する水準器です。どの部品も原料が採掘される段では作れないため、すべての工程で崖を越えることになります。最初のスカイガラスを作ると研究できます。
gradus-long-span-undergrounds=2倍の距離をつなぐ地下搬送ベルトと地下パイプです。すべての惑星で使え、溶岩の川、油の海、湖を越えられます。
gradus-skyglass-rocket-silo=スカイガラスのロケットに必要なロケット部品が半分で済むロケットサイロです。すべての惑星で使えます。
gradus-electronic-circuit-productivity=中段で学んだ較正の知識です。レベルごとに電子基板の生産性が10%上がります。すべての惑星で有効です。
