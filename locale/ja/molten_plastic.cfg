[technology-description]
molten-plastic-processing-advanced-kr=溶融プラスチック処理の最後のフロンティアです。
molten-polyvinyl-chloride=方解石を使ってPVCを溶融状態に保ちます。
molten-cube-jelly-plastic=キューブに溶融プラスチックの秘密を教えてくれるよう懇願します。
molten-igrys-plastic-bar=溶融プラスチックを合成する方法を見つけます。
molten-plastic-hydrogen-sulfide=スルホン化プラスチックを溶融状態に保つ方法を見つけます。
molten-plastic-processing=プラスチックを溶かして型に流し込む方法を学びます。
molten-bio-plastic-processing=生物由来の製品から直接溶融プラスチックを作ります。
molten-micro-plastic-processing=有害なマイクロプラスチックを溶かします。
molten-pelagos-bio-plastic-processing=生物由来の製品から直接溶融プラスチックを作ります。
molten-planetaris-plastic-processing=プレス機の中で直接溶融プラスチックを作ります。
plasma-molten-plastic=質量分析によるプラスチック分離で、[item=calcite]なしでプラスチックを溶かせるようになります。
molten-corrundum-sulfonated-plastic=この惑星でまた別の液体を作る方法を見つけます。
molten-nitric-acid-plastic=硝酸から直接溶融プラスチックを生産します。
[mod-setting-name]
replace-plastic=プラスチック棒を完全に置き換える
dynamic-recipes=レシピの動的生成
[mod-setting-description]
replace-plastic=通常プラスチック棒がアンロックされる場所で、代わりに溶融プラスチックをアンロックします。すべての惑星とレシピに適用されます。全体または部分的なオーバーホールMODと併用する場合は、この設定とあわせてレシピの動的生成を使うことをおすすめします。
dynamic-recipes=プラスチック棒を使うすべてのレシピについて、溶融プラスチック版のレシピを自動で作成します。大型コンテンツMODや代替レシピMODを使う場合に便利です。
