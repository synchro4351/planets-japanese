[tips-and-tricks-item-description]
hyarion-briefing=[planet=hyarion]は、結晶と溶岩でできた惑星です。光の屈折光線が空から降り注ぎ、地表を破壊します。\n不要なアイテムは、[tile=lava]に直接入れて捨てられます。 \nヒアリオンには、独自のロケットサイロとロケットパーツのレシピがあります。
hyarion-refraction=[planet=hyarion]には、独特なエネルギーの生産方法があります。\n[entity=planetaris-big-refraction-ray-collector]で[fluid=planetaris-refraction-light]を集め、[entity=planetaris-fiber-optics-cable]を敷いて[entity=planetaris-refraction-plant]まで運びます。\nその中で[item=planetaris-fluorite]と[fluid=planetaris-refraction-light]から[fluid=planetaris-pure-light]が作られます。これを[entity=planetaris-refraction-generator]で使うとエネルギーを生み出せます。\nまた、[item=planetaris-charged-fluorite]を作れば、屈折エネルギーの生産をどこへでも移せます。
hyarion-unstable-gem=[item=planetaris-unstable-gem]は、[item=cliff-explosives]より範囲も威力も大きく、よりよい選択肢です。

