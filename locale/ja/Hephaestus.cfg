[item-description]
hephaestus-token=ヘパイストスの迷宮構造の中で見つかる、高エネルギーを帯びた奇妙なトークンです。非常に価値があります。
hephaestus-science-pack=科学の集大成です。
hephaestus-processor=通常のサイエンスパックすべてと推移サイエンスパックを製作できる、高性能な組立・混合装置です。
hephaestus-requisitioner=トークンと引き換えに大量の物資を実体化させる巨大なモノリスです。
hephaestus-planetary-chest=量子リンクされた保管庫です。1つの地表につき2個までしか設置できません。
hephaestus-converter=余った素材をトークンに変換します。
hephaestus-world-converter=地表に埋め込まれた古代の交換装置で、特殊な部品を絶えず生み出します。
speed-assembling-machine=オーバークロックされた組立装置で、もともと速度が+20%されています。
quality-assembling-machine=高度な位置合わせ機構により、製作するすべてのアイテムに基本品質+2%のボーナスが常にかかります。
production-assembling-machine=統合された複製ループにより、基本生産性+20%のボーナスが常にかかります。
efficiency-assembling-machine=環境に配慮した電力網により、消費電力と汚染の発生が20%減ります。
hephaestus-efficiency-beacon=小型でより効率的なビーコンです。モジュールスロットを提供するには、エンティティに接している必要があります。
hephaestus-speed-beacon=大型でより強力なビーコンです。周囲のエンティティに提供できるのは速度モジュールだけです。
