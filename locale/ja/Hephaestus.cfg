[technology-description]
hephaestus-basic-processing=回収した迷宮のトークンを解析して得られた、基礎的な建物を解禁します。
hephaestus-planetary-storage=量子リンクチェストを建設し、惑星全体で在庫をやり取りできるようになります。
hephaestus-requisition=徴発機による、アイテムの実体化交換を自動化できるようになります。
hephaestus-advanced-purchasing=大量の素材を、ほかの用途に使えるより安定したトークンに変換します。
hephaestus-advanced-manufacturing=特化しすぎた組立機の研究を解禁します。
hephaestus-warp-drive=宇宙プラットフォームが局所的な時空を引き裂けるようになり、ヘパイストスからナウヴィスへほぼ一瞬で戻れるようになります。
planet-discovery-hephaestus=深宇宙の遠隔測定データを解析してヘパイストスの座標を特定し、宇宙プラットフォームの航路を描きます。
hephaestus-speed-assembler-overclocking=極めて高い稼働速度を実現する、独自の組立機フレーム規格を解禁します。
hephaestus-quality-assembler-alignment=ミクロン単位の精密な内部筐体キャリブレーションを解禁し、アイテムの品質の生成を最適化します。
hephaestus-production-assembler-processing=組立機の筐体内にカスケードループ機構を組み込み、素材の総収率を最適化します。
hephaestus-efficiency-assembler-regulation=エネルギー経路を最適化し、電力負荷と環境への影響を大幅に減らします。
hephaestus-beacon-framework=ヘパイストス級の特化型ビーコンの設置に必要な構造インターフェースを解禁します。
hephaestus-speed-beacon-compression=大量の電力を消費する代わりに、高速な出力に最適化されたビーコンを建設できるようになります。
hephaestus-efficiency-beacon-regulation=消費電力を安定させ、電力効率を最大化するよう設計されたビーコンを建設できるようになります。
hephaestus-warp-aperture-shortcut=ナウヴィスへの直通ワープ開口部の接続を再起動します。
hephaestus-warp-aperture-4-link=リボニアへのワープ開口部リンクを再起動します。
hephaestus-warp-aperture-5-link=アクイロへのワープ開口部リンクを再起動します。
hephaestus-further-conversion=高度な変換レシピを解禁します
hephaestus-aps-early-processing=石油処理と氷の融解の代替の解禁手段です。[color=orange]Any Planet Start により有効になっています。[/color]
