[mod-setting-description]
hephaestus-inverse-surcharge=変換機で原材料をヘパイストストークンに戻すときに必要な、追加の素材コストの割合です。（デフォルト: 20%） \n[color=green]低いほど簡単[/color]
hephaestus-standalone-mode=重要なインフラに代替のレシピ経路を用意します。ナウヴィスの支援なしにヘパイストスから直接プレイを始めるMODを使う場合は、オンにしてください。\n[color=yellow]Any Planet Start のようなプレイにおすすめです。[/color]
hephaestus-world-convert-surcharge=交換所でアイテムをトークンに交換するときの、コストの増減の割合です。 \n[color=green]低いほど簡単[/color]
hephaestus-warp-factor=ワープ係数の倍率です。小さいほど距離が短くなります。\n[color=green]低いほど簡単[/color]
[gui-title]
hephaestus-requisitioner=徴発するアイテムを選択
hephaestus-converter=変換するアイテムを選択
