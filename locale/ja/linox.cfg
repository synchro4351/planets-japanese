[item-description]
rare-earth-powder=さまざまな鉱物や石が混ざったレアアースの粉末です。
samarium-powder=レアアース粉末から分離した、きれいなサマリウムの粉末です。焼結するとサマリウムが得られます。
samarium=サマリウムは、極めて高い温度でも機能する永久磁石の材料になります。
tungsten-gear-wheel=タングステン製の素材は、非常に高い耐熱温度と優れた耐久性を示します。
tungsten-stick=タングステン製の素材は、非常に高い耐熱温度と優れた耐久性を示します。
dysprosium-powder=ジスプロシウムは永久磁石の性能を高めることで知られ、磁場によって長さが変わる磁歪という性質を持っています。抽出は非常に難しいと言われています。
dysprosium-exoskeleton-equipment=タングステン鋼で補強し、合成ジスプロシウムの筋繊維で駆動します。消費電力を抑えつつ性能を高めています。
neodymium-oxide=果てしない精製工程の末に得られた貴重な酸化ネオジムです。あとは高温で焼いて酸素原子を取り除けば、純粋なネオジムが得られます。
neodymium-powder=ついに純粋なネオジムです。この粉末を鉄とジスプロシウムに混ぜて焼結すれば、ネオジム磁石ができます。なかなか大変でしょう？ おっと、粉に汗を垂らさないよう気をつけてください。
neodymium-permanent-magnet=ネオジムで作った永久磁石です。驚くほど強い磁場を生み出し、高性能な装置に使われます。実のところ、ネオジムが世界で最も多く採掘されるレアアースになったのは、ほぼこの磁石のためです。
erbium-oxide=苦労して手に入れた貴重な酸化エルビウムです。あとは高温で焼けば、純粋なエルビウムが得られます。
erbium-powder=純粋なエルビウムの粉末です。エルビウムは主に光増幅用のドーパントとして使われ、光ファイバーに加えると信号の品質が大きく向上します。目に入らないよう気をつけてください！
linox-item_lava-data-card=リノックスの溶岩には、想像できるほぼすべての物質が溶け込んでいると言われています。溶岩からさえ学べることがあるのです。
linox-item_rare-earth-data-card=レアアースは化学触媒として使われたり、素材の特性を大きく高めたりします。どうしてこの世界には学ぶべきことがこんなに多いのでしょう？
linox-item_samarium-data-card=サマリウムを理解すれば、高温下の電磁場についてより深く理解できると言われています。いったいあとどれだけ学べばいいのでしょう？
linox-item_dysprosium-data-card=ジスプロシウムはネオジム永久磁石の添加剤としてよく使われ、半導体の製造やテルフェノールのような特殊合金にも利用されます。魔法使いが薬の材料として好んで使うという噂もあります。
linox-item_neodymium-data-card=ネオジムは現在知られている中で最も強力な永久磁石の製造に使われ、ほとんどの高級電子機器に入っています。実際、このテキストを読んでいるコンピュータを動かす電気も、ネオジム磁石の力で作られているかもしれません。
linox-item_erbium-data-card=エルビウムは主に光増幅用の添加剤として使われます。光ファイバーに加えると、信号の品質が劇的に向上すると言われています。マルチプレイのサーバーに接続するとき、エルビウム入りの光ファイバーを使っているかもしれません！
linox-item_linox-science-pack=リノックスが提供できるすべてが詰まったサイエンスパックです。
linox-tool_badchest-area-viewer=BADチェストの稼働範囲を表示します。

[mod-name]
linox=○ 惑星リノックス

[mod-description]
linox=リノックスは、ヴルカヌスよりもさらに太陽に近い、とてつもなく破壊的な世界です。太陽のコロナ質量放出とフレアは地表にまで届いてあらゆるものを消し去り、太陽の巨大な重力は惑星全体を絶えずねじり、ゆがめて、極限の過酷な環境を作り出しています。こんな世界に、まだ掘り出す価値のあるものなど本当に残っているのでしょうか？

