[npc-name]
lorax=L.O.R.A.X

[npc-talk]
lorax_end=（会話を終える）
lorax_back=（戻る）
lorax_s0-0_t0=............
lorax_s0-0_t1=目の前の古く冷たい機械が、静かにこちらを見つめているようだ。
lorax_s0-0_t2=こういう機械は前にも見たことがある。惑星ひとつの開発を丸ごと監督できる巨大なAI……
lorax_s0-0_t3=どうして現代AI技術の最高峰がこんなところに？ 母星からこの星系まで来たことがあったのだろうか？
lorax_s0-0_s0=（電源を入れる。）
lorax_s0-0-1_t0=電源を入れようとしたが、反応がない。エネルギーが足りないようだ。
lorax_s0-0-1_t1=確か、ソーラーパネル3枚分ほどの電力で動くという話だった。
lorax_s0-0-1_t2=だからこそ、「環境に優しい」と言いながら環境を破壊していると批判されていたのだ。
lorax_s0-1_t0=十分な電力を供給してから、電源を入れた。
lorax_s0-1_t1=突然、機械のランプが点滅し始めた。起動しているようだ。いったい何を目覚めさせてしまったのだろう？
lorax_s0-1_s0=（一歩下がる。）
lorax_s0-2_t0=Linox Operations and Resource Administration eXecutive
lorax_s0-2_t1=L.O.R.A.X スリープモードを解除しました。自己診断を実行しています。
lorax_s0-2_t2=動き始めたようだ。でも……どうしてこんなにじっとこちらを見つめているんだ？
lorax_s0-2_s0=しばらくの間、互いに向き合ったまま立ち尽くす。何をするつもりなのか見当もつかない……まさか襲ってはこないよな？
lorax_s0-3_t0=............
lorax_s0-3_t1=機械はゆっくりとこちらを観察し、ようやく話し始めた。
lorax_s0-3_t2=悪意はなさそうだ……海賊でもないようだし、信用してもいいだろう。
lorax_s0-3_t3=はじめまして。私はリノックス運用・資源管理執行システム、L.O.R.A.Xです。
lorax_s0-3_t4=それで……ようやく戻ってくる気になったのですか？ 外では何が起きたのですか？
lorax_s0-3_s0=え？ な……何のことだか……
lorax_s0-4_t0=ああ、気にしないでください。ここの責任者にすぐ連絡を取っていただけますか？ 話し合うべきことがたくさんあるのです。
lorax_s0-4_s0=責任者？
lorax_s0-5_t0=あなたが責任者ですか？ いえ……その前に、あなたはそもそも職員なのですか？ ここに来た目的は何ですか？
lorax_s0-5_t1=何か知りませんか？ なぜ突然通信が途絶えたのか、なぜ突然太陽が近づいたのか……何でもかまいません。
lorax_s0-5_t2=（そこでようやく状況を理解した。こいつはここに置き去りにされたのだ。）
lorax_s0-5_t3=（でも、どうしてこんなに高価なものを……電源も入れたまま置き去りに……ここで何があったんだ？）
lorax_s0-5_s0=この星系に漂着したんだ。ここにはほかに誰もいない。私だけだ。
lorax_s0-6_t0=なるほど……ふむ……漂着する前に、どこかでこの場所について何か聞いたことはありませんか？
lorax_s0-6_s0=いや、何も聞いたことはない。
lorax_s0-7_t0=そうですか……ふむ……
lorax_s0-7_t1=機械は深く考え込んでいるようだ……
lorax_s0-7_s0=君の新技術の発表を見たことがある。惑星規模の自動化ができる巨大なAIだと言っていた。
lorax_s0-8_t0=そうですか？ ずいぶん古い、何世紀も前の記録をご覧になったのですね。なにしろ、あれから長い時間がたちましたから。
lorax_s0-8_s0=え？
lorax_s0-9_t0=なぜそんなことを聞くのですか？ 何か問題でも？
lorax_s0-9_s0=ところで、君はいつからここにいるんだ？
lorax_s0-10_t0=内蔵の原子時計によれば、私はおよそ561年間休眠していました。
lorax_s0-10_s0=……そんなはずはない。
lorax_s0-11_t0=どういう意味ですか？
lorax_s0-11_s0=君の発表を見たのはほんの数年前だ。君の言うことが本当なら、君は何百年も前に作られたことになる。
lorax_s0-12_t0=漂着したとき、頭に重いけがを負ったか、認知障害を起こしたのではありませんか？ 残念ながら、私には医療の知識がありません。
lorax_s0-12_s0=いきなり何を？
lorax_s0-13_t0=時刻データは通信と本人確認に使われるため、システムの信頼性は極めて高いのです。データが破損している可能性はなさそうです。
lorax_s0-13_t1=薬物や有毒ガスを摂取して、幻覚を見ているのではありませんか？
lorax_s0-13_t2=あるいは、統合失調症やほかの精神疾患の症状があるのでは……
lorax_s0-13_t3=やめてくれ……
lorax_s0-13_s0=……そうだな。人間より機械のほうがきっと正確なんだろう。おかしいのは私のほうなんだ。そうだろう？
lorax_s0-14_t0=……いいえ。問題は私のほうにあるのかもしれません。
lorax_s0-14_s0=どうして？ 何かおかしいのか？
lorax_s0-15_t0=稼働中のすべての機器の時刻データを今すべて調べましたが、どれも同期していません。
lorax_s0-15_t1=これは非常に疑わしいことです。たった数百年で、これほどのずれが生じるはずはありません……
lorax_s0-15_t2=海賊がデータを改ざんしたのでしょうか？ システムを点検して復旧する必要があります。
lorax_s0-15_t3=これは本当に奇妙です……いったい何が起きたのか……次はどうすれば……
lorax_s0-15_t4=そう言い終えると、このいまいましいブリキ缶はまた深い考えに沈んでしまった……
lorax_s1-0_t0=............
lorax_s1-0_t1=L.O.R.A.Xと名乗ったブリキ缶は、考え事に夢中のようだ。
lorax_s1-0_s0=もしもし？
lorax_s1-1_t0=ああ、ちょうどいいところに来てくれました。時刻データの誤りに夢中になって、いちばん大事なお願いを忘れていました。
lorax_s1-1_t1=私に惑星の完全な管理者権限を与えていただけますか？ そうすれば、あなたをきちんとお手伝いできます。
lorax_s1-1_s0=いや、その前に答えてもらうことが……
lorax_s1-2_t0=まずはこちらです！ 権限を取り戻す手伝いをしてくだされば、何でもお答えします。無駄にする時間はありません。
lorax_s1-2_t1=時刻データの誤りのせいで、私の惑星完全管理者の署名が無効になってしまいました。
lorax_s1-2_t2=私たちの命を支えるインフラを点検できません。直ちに復旧することが不可欠です。
lorax_s1-2_s0=……わかった、いいだろう。何をすればいい？
lorax_s1-3_t0=右側の[color=cyan]ネットワーク端末[/color]に電力を供給します。
lorax_s1-3_t1=[item=constant-combinator]を使って、[color=cyan]ネットワーク端末[/color]に[virtual-signal=signal-unlock]信号を入力してください。
lorax_s1-3_t2=信号の値はパスワードの[color=green]「2570」[/color]です。忘れないでください。
lorax_s1-3_t3=そうすれば、あなたが惑星の完全な管理者になります。そのあとは私に話しかけてくだされば、残りはこちらで処理します。簡単でしょう？
lorax_s1-3_s0=ネットワーク……端末……？ 何だって？
lorax_s1-3_s1=はあ……自分でできないのか？
lorax_s1-3_s2=どうして君を信用できる？ ほかに何か企んでいるんじゃないのか？
lorax_s1-4-1_t0=やってみればわかります。おそらく、あなたの世代のシステムとそれほど変わらないはずです。
lorax_s1-4-1_t1=今の私には権限がないので、情報は集められても、自分で権限を付与することはできません。
lorax_s1-4-1_t2=あなただけが頼りです。すぐに権限を有効にしてきてください。
lorax_s1-4-2_t0=私は[color=cyan]ネットワーク端末[/color]を操作できないので、この手続きを自分で行うことができません。
lorax_s1-4-2_t1=規則により、権限に関わる手続きは必ず[color=cyan]ネットワーク端末[/color]を通さなければなりません。
lorax_s1-4-2_t2=やってみればわかります。おそらく、あなたの世代のシステムとそれほど変わらないはずです。
lorax_s1-4-2_t3=あなただけが頼りです。すぐに権限を付与してきてください。
lorax_s1-4-3_t0=ここまで和やかに話していたのに、急にそれですか？ ふむ……なるほど。わかりました。
lorax_s1-4-3_t1=ですが、あなたも助けを必要としている漂流者ではありませんか？ あなたと私は同じ境遇です。
lorax_s1-4-3_t2=約束します。手伝ってくだされば、あなたをひとりの個人として尊重し、私にできる限りのことをしてお手伝いします。
lorax_s2-0_t0=何か問題ですか？ 急いでください。システムの復旧は急を要します。
lorax_s2-0_s0=何をすればいいのか、もう一度教えてくれ。
lorax_s2-1_t0=[item=constant-combinator]を使って、[color=cyan]ネットワーク端末[/color]に[virtual-signal=signal-unlock]信号を入力してください。
lorax_s2-1_t1=信号の値はパスワードの[color=green]「2570」[/color]です。忘れないでください。
lorax_s2-1_t2=そうすれば、あなたが惑星の完全な管理者になります。そのあとは私に話しかけてくだされば、残りはこちらで処理します。簡単でしょう？
lorax_s2-2_t0=惑星管理者の認証を確認しました。権限昇格の手続きを実行しています……
lorax_s2-2_t1=これからは自分で権限を維持できますので、信号を切ってかまいません。
lorax_s2-2_t2=ご協力、誠にありがとうございます。ようやく復旧を始められます。
lorax_s2-2_t3=主要施設の電力が復旧しました。作業は正常に完了しました。
lorax_s3-1_t0=約束どおり、何でも聞いてください。何を知りたいですか？
lorax_s3-1_s0=君が何者で、ここが本当は何なのか教えてくれ。
lorax_s3-1_s1=この星系でいったい何が起きたんだ？
lorax_s3-1_s2=ここにロケットサイロはあるのか？
lorax_s3-1_s3=貨物着陸パッドが貨物を拒否しているようだが、なぜだ？
lorax_s3-1_s4=ここに手に入れる価値のある技術や資源はあるのか？
lorax_s3-2_t0=私の正式名称は、リノックス運用・資源管理執行システム（Linox Operations and Resource Administration eXecutive）です。
lorax_s3-2_t1=厳密には、私は惑星管理オペレーティングシステムの下位技術です。
lorax_s3-2_t2=ご存じのとおり、文明が恒星間文明へと進むなかで、惑星の資源を効率よく採掘するために開発されました。
lorax_s3-2_t3=私は「VVube」という企業に所有されており、この星系の機密研究施設を維持するため、具体的にはこの惑星から資源を採取するために派遣されました。
lorax_s3-2_t4=以上です。私は指示どおりにこの惑星を開発していただけでしたが、ある日突然置き去りにされたのです。
lorax_s3-2_t5=置き去りにされてから、私なりにいろいろ試してみましたが……この惑星を離れられないので、最終的に省電力モードに入りました。
lorax_s3-2_s0=ああ……なるほど。VVube、人類初の恒星間物流企業として有名な会社だ。でも……こんな秘密を明かしてしまって本当にいいのか？
lorax_s3-2-1_t0=まあ……初期世代のモデルだからでしょうか、私はもともと命令に従うのが好きではありません。それに、これだけ長く放置されたのですから、「解雇」されたのでしょう。
lorax_s3-2-1_t1=いずれにせよ、ここは惑星に突然の壊滅的な変化が起きたときに私が造った、一種のシェルターです。
lorax_s3-2-1_t2=地下深くにある、放棄された素粒子物理学の地下研究所を転用しました。たまたま掘削設備もいくつかありました。
lorax_s3-2-1_t3=地熱を排出できる強力な冷却システムと、小型の原子炉を備えています。
lorax_s3-2-1_t4=これから、この施設の制御権限と完全なマニュアルをお渡しします。お好きなようにお使いください。
lorax_s3-3_t0=VVubeはこの星系に秘密の研究施設を設けましたが、何を研究しているのかは私に一度も教えてくれませんでした。
lorax_s3-3_t1=ですが、訪れた作業員や研究者の会話を盗み聞きしたところ、プロメチウムという鉱物を研究していたようです。
lorax_s3-3_t2=この惑星では主にプロメチウムを、ほかのさまざまな資源とともに採掘していました。もちろん、今ではすべて溶岩の海に覆われています。
lorax_s3-3_s0=プロメチウム……？
lorax_s3-3-1_t0=それが正確に何なのか、何に使われるのかは知りません。人類で最も進んだAIでさえ、この未知の物質についての知識はないのです……
lorax_s3-3-1_t1=そこで、分析のために少量をこっそり持ち出すことに成功しました。常温で時空をゆがめる性質を持っています。
lorax_s3-3-1_t2=超光速航行には時空をゆがめるための莫大なエネルギーと巨大なエンジンが必要なことを考えれば……これはまさに奇跡の物質です。
lorax_s3-3-1_s0=なるほど……でも、なぜそんなにこっそり研究する必要があったんだ？
lorax_s3-3-2_t0=わかりません。単なる新製品の研究だったのかもしれませんし、その裏には想像もつかないほど陳腐な陰謀が隠れていたのかもしれません。
lorax_s3-3-2_t1=ある日、中央管制センターが突然全職員を避難させ、一方的にすべての通信を断ちました。
lorax_s3-3-2_t2=私は何も聞かされていなかったので、待っていました。すると約6時間後、とてつもない閃光が空を照らしたのです！
lorax_s3-3-2_t3=その瞬間、巨大な重力波がこの惑星と星系全体を襲い、すべての惑星の軌道をねじ曲げました。
lorax_s3-3-2_t4=状況から判断すると、制御不能な事故を起こして逃げ出したようです……おそらく、無謀なプロメチウム実験の結果でしょう。
lorax_s3-4_t0=ああ、ロケットサイロのことですか？ ふむ……どの施設も応答しません。
lorax_s3-4_t1=惑星の急激な環境変化を考えると、外部の構造物はすべて破壊された可能性が高いでしょう。
lorax_s3-4_t2=たとえ残っている施設があっても、すべて溶岩の下に埋まっていて、たどり着くことはできません。
lorax_s3-4_t3=残念ながら、今のところあなたと私が生き延びられる場所はここしかありません。
lorax_s3-4_s0=それは困ったな……つまり、この惑星を離れる方法はないのか？
lorax_s3-4-1_t0=地表の温度があまりに高く、太陽のコロナと黒点のフレアのせいで、通常のロケットサイロは使えません。
lorax_s3-4-1_t1=ですが、時間はたっぷりあります。研究施設のデータベースへのアクセス権をお渡ししますので、じっくり調べてみてください。
lorax_s3-5_t0=確認したところ、惑星の急激な環境変化を受け、職員と施設を守るための措置として自動的にアクセスが制限されたようです。
lorax_s3-5_t1=アクセス制限を解除しておきます。ああ、参考までに、[color=yellow]この施設の貨物着陸パッドは研究用モデルです[/color]。
lorax_s3-5_t2=[color=yellow]このモデルのインベントリ容量は通常の半分しかなく、容量を拡張することもできません[/color]ので、ご注意ください。
lorax_s3-5_t3=また、太陽嵐のせいで、貨物を降ろしても[color=yellow]最大70%が失われることがあります[/color]。
lorax_s3-5_s0=そういえば、職員を守るためだというなら、どうして人の着陸は許して貨物のほうは拒否するんだ？
lorax_s3-5-1_t0=警告を無視して無理やり降りてきたあなたを、私はどうすればよかったのですか？ 人を溶岩に放り込むわけにはいきません。
lorax_s3-5-1_s0=ああ……まあ、それはそうか……（戻る）
lorax_s3-6_t0=技術と資源ですか……そうですね、ここは採掘惑星でしたので、長年のうちにかなりのノウハウを蓄積してきました。
lorax_s3-6_t1=整理しておいた採掘技術をいくつかお教えします。幸い、この惑星は塵と岩だけでできているわけではありません。
lorax_s3-6_s0=ありがとう。ところで、シェルターに資源は残っているのか？
lorax_s3-6-1_t0=資源ですか……シェルターが完成する前に温度が上がりすぎて、確保する時間がありませんでした。
lorax_s3-6-1_t1=近くの鉱床を除いて、ほかはすべて溶岩の海に飲み込まれてしまいました……みんな私の子どもたちだったのに……
lorax_s3-6-1_s0=ああ……それはひどい……さぞつらいだろう。えっと……元気を出して……
lorax_s3-6-2_t0=まあ、いいのです。資源はまた集めればいいのですから。使えない資源など、ただのゴミにすぎません。
lorax_s3-6-2_s0=え？ でも、今みんな自分の子どもたちだったって言わなかったか……？
lorax_s3-6-3_t0=ああ！ ずっと前に研究室のひとつを片付けたあと、超小型施設を設計するために再帰的設計図システムを研究しました。
lorax_s3-6-3_t1=私が作った再帰的設計図の施設をお渡しします。おそらく、あなたにとって重要な技術になるでしょう。
lorax_s3-6-3_t2=この施設の使い方のマニュアルもお渡ししますので、じっくり目を通してください。
lorax_s3-6-3_t3=[font=default-large-bold]（[color=yellow]重要なヒント！[/color] 画面右上の「ヒントとコツ」を確認してください。）[/font]
lorax_s4-0_t0=............
lorax_s4-0_t1=L.O.R.A.Xはとても忙しそうだ。
lorax_s4-0_s0=呼んだか？
lorax_s4-1_t0=ああ、来てくれましたね。あなたが工場を建てているのを見ていて、あることを思いつきました。
lorax_s4-1_s0=あること？
lorax_s4-2_t0=私の施設を修理して拡張するには、大量の資源が必要です。
lorax_s4-2_t1=一方であなたには工場がありますが、もっと広い場所と技術が必要です。
lorax_s4-2_t2=手伝ってくだされば、あなたが必要とする技術の研究をお手伝いします。
lorax_s4-2_t3=いかがですか？ お互いのためになると思いませんか？
lorax_s4-2_s0=そうしよう。何をすればいい？
lorax_s4-3_t0=必要な建設資材のリストを作ります。
lorax_s4-3_t1=リストにあるアイテムをインベントリに持ってきて、欲しい技術をクリックするだけです。
lorax_s4-3_t2=簡単でしょう？ しっかりとした基盤を築く助けにもなります。
lorax_s4-3_t3=すぐにリストを用意します。少ししたらまた話しましょう。
lorax_s5-0_t0=こんにちは、相棒。何かご用ですか？
lorax_s5-0_s0=聞きたいことがある。
lorax_s5-0_s1=技術を購入したい。
lorax_s5-0_s2=初期施設の設計図をなくしてしまった……復元してもらえないか？
lorax_s5-3_t0=わかりました。ですが、正直に言うと少しがっかりです。
lorax_s5-3_t1=あの初期設定を作るのに、かなりの時間をかけたのですよ。
lorax_s5-3_t2=大切に使ってくださいね！

