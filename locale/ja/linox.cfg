[entity-description]
linox-npc_lorax=惑星リノックス全体を統括する巨大な人工知能です。
linox-npc_network-terminal=リノックスの惑星ネットワークにアクセスできる端末です。
linox-npc_power-converter=リノックス施設の電力網を管理する巨大な電力制御装置です。
linox-building_advanced-rocket-silo=極めて過酷な環境でも稼働できる高性能なロケットサイロです。通常のロケットサイロの4倍の速さで稼働し、宇宙プラットフォームにも設置できます。
linox-building_cargo-elevator=リノックス施設のターミナルを通してアイテムを運ぶためのベルトコンベアです。
linox-building_cargo-landing-pad=研究用に設計された貨物着陸パッドで、大規模な物流には向いていません。パッドの近くで__CONTROL__toggle-driving__キーを押すと、地下施設へ降りられます。
linox-building_planetary-power-network=惑星リノックス全体をつなぐ電力網です。
linox-building_core-roboport=稼働範囲はごく狭いものの、充電速度が非常に速い小型のロボットステーションです。
linox-building_deep-oil-pumpjack=地下深くにまだ残っている原油を汲み上げます。
linox-building_fluid-elevator=リノックス施設のターミナルを通して液体を運ぶためのパイプです。
linox-building_fluid-elevator-input=リノックス施設のターミナルを通して液体を運ぶためのポンプです。
linox-building_fluid-elevator-output=リノックス施設のターミナルを通して液体を運ぶためのポンプです。
linox-building_mantle-extractor=巨大なドリルで惑星の地殻を掘り抜き、マントルまで到達して溶岩を汲み上げます。どこでも溶岩を得られるようになりますが、膨大なエネルギーを消費し、大量の汚染を発生させます。
linox-building_sulfuric-acid-pumpjack=地下深くにまだ残っている硫酸を汲み上げます。
linox-building_turbo-pump=大量のエネルギーを消費する代わりに、優れた出力を発揮する高性能なポンプです。
linox-building_linox-supercomputer=リノックスの過酷な環境に耐えられる特殊なスーパーコンピュータです。L.O.R.A.Xがひそかに興味を持っているようです。
linox-building_sintering-machine=粉末状の素材を加熱し、高圧で圧縮して固形のブロックにする機械です。
linox-npc_power-converter-circuit-input=ここに回路信号を入力して、電力変換器を制御します。
linox-npc_power-converter-circuit-output=ここで回路出力を読み取り、制御ロジックに使います。
linox-hidden_reactive-power=無効電力は、電力変換器が電力を効率よく管理できないときに発生します。
linox-building_chemical-tank=化学槽では、大量の流体を使った複雑な化学処理を行えます。
linox-building_outlet=排水口を使うと、廃水を海に捨てられます。魚がなんとか食べるか飲むかして、きっときれいにしてくれるでしょう……たぶん。
linox-building_chemical-filter=化学フィルターは、物理的・化学的な処理によって、溶液から目的の物質だけを選んで取り出します。おいしいところだけをつまみ食いする、うるさい偏食家のようなものです。
linox-building_huge-heat-exchanger=威圧感のあるほど巨大な熱交換器です。最大250 MWの熱エネルギーを扱えます。
linox-building_neodymium-permanent-magnet-generator=ネオジム永久磁石を使った発電機です。ネオジムの強力な磁力のおかげで、高効率・大容量の発電機をこの大きさにまで小型化できました。
linox-building_erbium-beacon=エルビウムで信号塔の効率を高めると、2倍のモジュールを装着できるそうです。レアアースのすさまじい力を感じますか？
linox_samarium-construction-robot=サマリウムで強化された建設ロボットです。300%の過負荷運転ができ、火炎への耐性と高い耐久性を備えます。
linox_samarium-logistic-robot=サマリウムで強化された物流ロボットです。300%の過負荷運転ができ、火炎への耐性と高い耐久性を備えます。
linox-building_neodymium-bulk-inserter=ネオジムで強化されたバルクインサータです。トルクが大幅に増し、極めて高速で動作します。
linox-building_neodymium-stack-inserter=ネオジムで強化されたスタックインサータです。トルクが大幅に増し、極めて高速で動作します。
linox-special_circuit-pole=ここに回路ワイヤーをつなぐと、地上と地下の回路ネットワークを接続できます。
linox-special_facility-elevator=エレベーターの近くで__CONTROL__toggle-driving__キーを押すと乗り込めます。
linox-special_emergency-escape-shuttle=[color=yellow]一度解体すると回収できません！[/color]\n\nリノックスが重荷になってしまったなら、すべてを置いて、しばらくどこか別の場所で休んでみてはいかがでしょうか？
linox-special_internel-pipeline=地下の深部掘削施設から資源を受け取るパイプラインです。深部掘削施設は本来研究所と直接つながるように設計されていないため、残念ながらパイプラインを好きな場所に置くことはできません。その代わりに、L.O.R.A.Xが配管を改良し、出力する資源を選べるようにしてくれました。

