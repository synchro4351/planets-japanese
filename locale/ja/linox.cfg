[tips-and-tricks-item-description]
linox-tips-and-tricks_briefing=[planet=linox-planet_linox]は、ヴルカヌスよりもさらに太陽に近い、とてつもなく破壊的な世界です。太陽のコロナ質量放出とフレアは地表にまで届いてあらゆるものを消し去り、太陽の巨大な重力は惑星全体を絶えずねじり、ゆがめて、極限の過酷な環境を作り出しています。こんな世界に、まだ掘り出す価値のあるものなど本当に残っているのでしょうか？
linox-tips-and-tricks_language-settings=リノックスに挑む前に、画像に示した設定を好みの言語に合わせておくことを強くおすすめします。これらの設定は再帰的設計図の例の現地語化に使われ、ゲームを進めるうえで大いに役立ちます。\n\nまた、個人設定で言語を変えてから、L.O.R.A.Xにもう一度例の復元を頼むと、別の言語の例を受け取ることもできます。
linox-tips-and-tricks_exploration-log-1=長距離スキャンによると、巨大な太陽の強烈な熱で地表が溶けており、適切な着陸地点を見つけるのは困難です。惑星を探査するには、まず宇宙プラットフォームで軌道から適切な着陸地点を調査する必要があります。ここに着陸すれば確実に死にます。
linox-tips-and-tricks_exploration-log-2=宇宙船で何度も地表のスキャンを試みた結果、ついにレーダーに何かが映りました。驚いたことに、溶岩の海の真ん中に、正体不明の[entity=cargo-landing-pad]が堂々と置かれていたのです。遠隔アクセスを試みたところ、このパッドはあらゆる種類の着陸を拒否するよう設定されているようです。強力なセキュリティプロトコルのため、この設定はすぐには変更できません。ですが、私たちの文明の傾向を考えれば、有人着陸までは拒否しないでしょう。\n\n有人での強行着陸は可能ですが、注意してください。太陽コロナの激しい活動と、着陸パッドが貨物の投下を受け付けないため、軌道上のプラットフォームから支援を受けることはできません。生き延びられる保証はありません。進みますか？
linox-tips-and-tricks_cargo-loss=[planet=linox-planet_linox]は太陽に非常に近いため、太陽のコロナとフレアが惑星の地表にまで届きます。その結果、貨物ポッドが損傷したり破壊されたりすることがあり、無事に着陸する貨物は約30%しか見込めません。着陸の成功率は「軌道突入の安全性」の研究で高められます。\n\n * プレイヤーが乗っている貨物ポッドは破壊されません。\n * 基本の成功率: 30%\n * 「軌道突入の安全性」の研究レベルごとに、成功率が5ポイント上がります。\n * 成功判定は貨物ポッドのアイテムスロットごとに行われます。失われたアイテムは、それぞれのスロットから取り除かれます。
linox-tips-and-tricks_placement_restriction=[tile=linox-tile_linox-terminal-platform]、[tile=linox-tile_linox-hazard-terminal-platform]、[tile=linox-tile_linox-corridor]、[tile=linox-tile_linox-datacenter]の上には、ごく限られたエンティティしか設置できません。\n特に、[entity=linox-building_cargo-elevator]と[entity=linox-building_fluid-elevator]は、[tile=linox-tile_linox-terminal-platform]と[tile=linox-tile_linox-hazard-terminal-platform]の上にしか設置できません。
linox-tips-and-tricks_planetary-power-network=リノックスには、すでに巨大な惑星電力網が整っています。そのため電柱は不要で、地表と地下の電力網はつながっています。
linox-tips-and-tricks_npc-system=NPCは、ゲームの進行に影響する特別なエンティティで、下部に名前が黄色で表示されます。一部のNPCはクリックすると話しかけられます。
linox-tips-and-tricks_recursive-blueprints=再帰的設計図システムを使うと、設計図の設置と撤去を完全に自動化できます。このシステムがあれば、極めて限られた場所でもさまざまなアイテムの生産を自動化できます。\n以下のヘルプでは、リノックスに含まれる再帰的設計図の例を簡単に紹介し、その機能を説明します。\n\n注意 – このページのシミュレーションは、再帰的設計図システムの標準的な動作をわかりやすく示すよう設定されているため、ゲーム内の実際の例とは少し異なります。
linox-tips-and-tricks_example-turn-on=例を動かすには、2つの手順が必要です。\n\nまず、例の上部で[virtual-signal=signal-green]信号を出力している[item=constant-combinator]を見つけて、オンにします。\n\n次に、下部にある一時停止信号を一度切り替えて（オンにしてからオフにして）、システムをリセットします。そのあとはシステムが正常に動作します。
linox-tips-and-tricks_bad-chest=例の回路が使う設計図は、図に示した[item=blueprint-deployer2]の中に置かれた設計図ブックにあります。このブック内での設計図の並び順は非常に重要です。これについては次のヒントで説明します。
linox-tips-and-tricks_id-box=例の中央に、2つの[item=constant-combinator]があります。このIDボックスは、あるアイテム信号に対して、[item=blueprint-deployer2]の中にある設計図ブックのどの設計図を使うかを決めます。\nたとえば[item=iron-plate]信号の値が4なら、[item=iron-plate]信号が送られたときに設計図ブックの4番目の設計図が使われます。値が小さいほど（ブックの上のほうにある設計図ほど）優先度が高くなります。\n\nでは、なぜ[item=constant-combinator]が2つあるのでしょう？ 次のページで確かめてください！
linox-tips-and-tricks_negative-signal=例の下部に、アイテム信号を出力する4つの[item=constant-combinator]があります。これらのコンビネータは、アイテム信号の出力条件を設定するために使います。左の2つは反転したアイテム信号を出力し、目的のアイテムの在庫を減らす設計図を使うときに役立ちます。\n\n1つ目のコンビネータは、目的のアイテムの在庫が一定量を下回ったときに信号をオフにするよう設定します。例では[item=stone]信号が1500に設定されています。つまり、[item=stone]が1500以下になると信号がオフになります。これはオフにする条件なので、量が1500を超えても信号は再びオンになりません。オンにする条件は2つ目のコンビネータで設定します。\n\n2つ目のコンビネータは、目的のアイテムの在庫が一定量を超えたときに信号をオンにするよう設定します。例では[item=stone]信号が3000に設定されています。つまり、[item=stone]が3000を超えると信号がオンになります。
linox-tips-and-tricks_positive-signal=右の2つもアイテム信号を出力しますが、反転信号とは違い、目的のアイテムの在庫を増やす設計図を使うときに役立ちます。\n\n3つ目のコンビネータは、目的のアイテムの在庫が一定量を下回ったときに信号をオンにするよう設定します。例では[item=iron-plate]信号が500に設定されています。つまり、[item=iron-plate]が500以下になると信号がオンになります。それ以外は反転信号と同じように動作します。\n\n4つ目のコンビネータは、目的のアイテムの在庫が一定量を超えたときに信号をオフにするよう設定します。例では[item=iron-plate]信号が2000に設定されています。つまり、[item=iron-plate]が2000を超えると信号がオフになります。
linox-tips-and-tricks_hover-tips=例のコンビネータには、さまざまな重要な説明が含まれています。必ずコンビネータをクリックするか、カーソルを合わせて詳細を確認してください。
linox-tips-and-tricks_bad-chest-area-viewer=BADチェストの範囲表示は、BADチェストの稼働範囲と中心点の両方を視覚的に表示します。稼働範囲は解体命令が適用される範囲を、中心点は設計図が設置される位置を決めるので、よく確認してください。
linox-tips-and-tricks_adjust-blueprint-origin=赤い強調表示のように、設計図が意図した位置に正確に設置されないことがあります。\nこれを直すには、設計図エディタで設計図の原点（オレンジの強調表示）を調整し、現在6と8に設定されているXとYの値を変更します。\nこれらの値は、設計図の設置の基準点（旗アイコンを含む正方形の左上のタイル）を変更します。\n値を調整すると、緑の強調表示のように設計図が正しく設置されるはずです。
linox-tips-and-tricks_power-converter=電力変換器は、リノックス施設に大きな電力容量を提供するシステムです。この特殊な蓄電池の下部には回路の入出力ポートがあり、回路ワイヤーをつないで電力変換器を直接制御できます。
linox-tips-and-tricks_reactive-power=こんにちは、相棒。L.O.R.A.Xです。電力変換器を使う前に重要なことがあるので、急ぎご連絡しています。\n\n現在、電力変換器の主回路が損傷しています。そのため、[color=yellow]電力変換器をオンにすると「無効電力」が発生し、総消費電力が最大2倍になることがあります[/color]。この問題を解決するには、主回路の動作を回路信号で直接実装しなければなりません。\n[color=yellow]私たちがすべきことは、無効電力を補正するために適切な量の補助電力を供給することです。[/color]心配はいりません。見た目ほど難しくはありませんし、以前と比べて違うのは精度が少し落ちることだけです。\n\n\n電力変換器は次の信号を出力します:\n\n[virtual-signal=signal-P]は、無効電力を除いた現在の総消費電力をワット（W）で示します。\n[virtual-signal=signal-O]は、無効電力を打ち消すために使われる電力変換器の出力をワット（W）で示します。\n\n[color=yellow]目標は、[virtual-signal=signal-O]の値をできるだけ[virtual-signal=signal-P]に近づけることです。[/color]\n[virtual-signal=signal-O]の大きさは直接制御できません。信号入力を通して間接的に影響を与えることしかできません。\n\n\n電力変換器は次の入力信号を受け付けます:\n\n[virtual-signal=signal-E] この信号を0以外の値にすると、電力変換器が起動します。5 GJの電力容量が得られますが、無効電力が発生し始めます。\n無効電力を制御したくない場合は、この信号で電力変換器をオフにできますが、その電力容量は使えなくなります。\n\n[virtual-signal=signal-I]は電力変換器の出力を制御します。\n[virtual-signal=signal-I]を1以上にすると、出力が上がります。\n[virtual-signal=signal-I]を-1以下にすると、出力が下がります。\n\n電力変換器の出力は直接設定できません。正または負の入力値によって上げ下げすることしかできません。\n\n\n車にたとえると、[virtual-signal=signal-I]はアクセルペダルのようなものです。\nペダルを目いっぱい踏み込んでも、車が最高速度に達するまでには時間がかかります。\n\n適切なタイミングで[virtual-signal=signal-I]信号を足したり引いたりすれば、電力変換器の出力を目的の水準に制御できます。\n\n正しく制御できれば、電力統計に占める無効電力の割合は大きく下がります。がんばってください！
linox-tips-and-tricks_placement_restriction_2=[tile=linox-tile_linox-facility-platform]と[tile=linox-tile_linox-hazard-facility-platform]のタイルの上には、チェスト、[item=linox-building_core-roboport]、[item=accumulator]を設置できます。それ以外のものには、設置制限1と同じ制限が適用されます。
