[mod-setting-description]
linox-settings_enable-moshine-neodymium-recipe=有効にすると、惑星モシャインのネオジムからネオジム粉末を得られるようになります。
linox-settings_allow-hopper-launcher=有効にすると、ターミナル床タイルを含め、リノックスにホッパーランチャーを設置できるようになります。
linox-settings_compatibility-aai-signal-transmission=有効にすると、リノックスがこのMODを制御し、ゲームプレイに組み込みます。
linox-settings_compatibility-distribution-request-planner=有効にすると、リノックスがこのMODを制御し、ゲームプレイに組み込みます。
linox-settings_rbp-example-multiplay-language=再帰的設計図の例の説明文を現地語化するための設定で、マルチプレイでのみ使われます。「自動」にすると、最初に検出された言語が自動的に使われます。別の言語を選んでも、現地語化のキャッシュによっては違う言語が表示されることがあります。
linox-settings_rbp-example-local-language=再帰的設計図の例の説明文を現地語化するための設定です。「自動」にすると、現在のゲームの言語が自動的に使われます。別の言語を選んでも、現地語化のキャッシュによっては違う言語が表示されることがあります。
linox-settings_easy-mode_anywhere-mantle-extractor=マントル抽出機の設置制限をなくします。
linox-settings_easy-mode_remove-vanilla-circuit-collision=バニラの回路エンティティの当たり判定をなくし、移動の妨げにならないようにします。「Squeak Through 2」MODを導入している場合、この設定は効果がありません。
linox-settings_hard-mode_no-logistic-system=リノックスの惑星発見の技術から物流システムの研究を前提条件から外し、初期装備から物流関連のアイテムをすべて取り除きます。\n\n[color=yellow]警告: この設定を有効にすると、スターター用の例が正しく機能しなくなります。リノックス内での物流システムへの依存をなくすだけで、ゲームから物流システムの技術そのものを取り除くわけではありません。[/color]
linox-settings_hard-mode_no-starter-pack=工場用地を解放したあとに通常もらえるスターターアイテムをすべてなくします。先へ進むには、すべてのアイテムを自分で手に入れなければなりません。
linox-settings_hard-mode_use-surface-condition=地表制限を有効にし、リノックスのすべての最終製品をリノックスでしかクラフトできないようにします。\n\n[color=yellow]警告: リノックスは場所が限られているため、解決が難しい深刻な物流のボトルネックに直面することがあります。[/color]\n\n[color=red]危険: これは非常につらいです！[/color]
linox-settings_hard-mode_disable-mantle-extractor=マントル抽出機と関連するすべての研究を取り除きます。
linox-settings_hard-mode_enable-science-pack_aquilo=リノックスサイエンスパックのレシピを有効にし、アクイロの技術ツリーで必要にします。\n\n[color=yellow]警告: リノックスは場所が限られているため、解決が難しい深刻な物流のボトルネックに直面することがあります。[/color]
linox-settings_hard-mode_enable-science-pack_promethium=リノックスサイエンスパックのレシピを有効にし、プロメチウムの技術ツリーで必要にします。\n\n[color=yellow]警告: リノックスは場所が限られているため、解決が難しい深刻な物流のボトルネックに直面することがあります。[/color]
linox-settings_hard-mode_enable-science-pack_infinite=アクイロとプロメチウムの技術ツリーでリノックスサイエンスパックを使う場合、無限研究にもリノックスサイエンスパックが必要になります。\n\n[color=yellow]警告: リノックスは場所が非常に限られているため、解決が難しい物流のボトルネックに直面することがあります。[/color]

