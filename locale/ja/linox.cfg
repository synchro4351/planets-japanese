language-code=ja
panel_description_1=機能する設計図を作ってBADシステムに追加する方法:\n\n手順1: コンクリート床の設計図をコピーします。\nこれはBADチェストの中にある設計図ブックに入っています。\n\n手順2: 設計図の名前を、作るものの名前に変えます。
panel_description_1_1=手順3: 新しい設計図に、新しい内容（タイルを含む）を指定します。\n\n手順4: 新しい設計図を設計図ブックに入れます。
panel_description_1_2=手順5: 目標の値と、設計図ブック内での設計図の位置を、定数コンビネータに追加します。
panel_description_2=ヒント: システムをオンにしたまま一時停止ボタンを有効にしておくと、UPSの負荷が軽くなります。設計図を描いたり更新したりするときも、この方法を使うことを想定しています。\n\nヒント: BADチェストの中心を探すには、システムをオフにして「BADチェストの範囲表示」で建設範囲を表示します。
panel_description_2_1=ヒント: 設計図を描いたり更新したりする前に、一時停止ボタンを有効にするのを忘れないでください。\n\n一時停止ボタンが有効になっていると、赤いランプが点灯します。\n\n「テーブルを片付ける」には、一時停止ボタンを一度オフにしてから再びオンにします。
panel_description_2_2=
panel_stage=ステージ表示灯です。現在どのステージが有効かを示します。
panel_request=要求表示灯です。どのステージに要求があるかを示します。
combinator_turn_on=緑 = オン
combinator_parameter=座標とサイズのパラメータです。\n\nこれをオフにする前に、BADチェストへのワイヤーを切ってください。\n\nヒント: 中心の座標を調べるには、ホットバーの「BADチェストの範囲表示」ボタンをクリックします。
combinator_deconstruction=解体信号
combinator_construction=建設信号
combinator_stepper=ステッパー
combinator_signal_converter=信号変換器
combinator_signal_retarder=信号遅延器
combinator_signal_sorter=このコンビネータは、優先度の最も高い製品から順に、どの設計図を選ぶかをシステムに伝えます。
combinator_pause=一時停止ボタン\n\n新しい設計図を描いたり更新したりするときに有効にします。
combinator_signal_filter_1=ステージ1の信号フィルター
combinator_signal_filter_2=ステージ2の信号フィルター
