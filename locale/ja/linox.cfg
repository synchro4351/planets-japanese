[fluid-description]
low-concentration-neodymium-solution=ネオジムを含む溶液ですが、まだごくわずかで、ほとんど感じられません。
high-concentration-neodymium-solution=ネオジムを含む溶液です。今ではかなり濃くなっています。
neodymium-solution=完全に濃縮されたネオジム溶液です。無限の可能性を秘めた子どものように、ポテンシャルに満ちています。
waste-water=工場から排出された役に立たない廃水です。ひどい臭いがします。
low-concentration-erbium-solution=エルビウムの濃度が低い溶液です。エルビウムが入っているのかほとんどわかりません。
high-concentration-erbium-solution=エルビウムの濃度が高い溶液です。今ではエルビウムがはっきりと存在しています。
erbium-solution=エルビウムを抽出する準備が整った溶液です。わくわくする時間の始まりです。

