[technology-description]
linox-technology_planet-discovery-linox=太陽を調べているうちに、極めて近い軌道を回る小さな惑星が発見されました。ですが、これはとても異常なことです。既知の物理学によれば、恒星にこれほど近い惑星は重力に引き込まれるか潮汐力で引き裂かれるはずで、存在できないのです。いったい何なのでしょう？ それより……本当にこの業火の世界を探査するつもりですか？
linox-technology_exploring-linox-landing-site=[color=yellow][font=default-bold]この研究には、リノックスの軌道上に宇宙プラットフォームが必要です。[/font][/color]\n\nインフォマトロンが予測したとおり、この惑星には固い地面がありません。ですが、宇宙プラットフォームで軌道から地表を直接調査すれば、何か見つかるかもしれません……
linox-technology-trigger-description_lorax-talking=L.O.R.A.Xとの会話で解放できます。
linox-technology-trigger-description_lorax-purchase=この技術をL.O.R.A.Xから購入します。
linox-technology_facility-upgrade=リノックスを脱出するには、この窮屈な施設を工業化しなければなりません。あまりに狭くて、駐車場を作る余裕すらありません。
linox-technology_planetary-power-network=この施設には、すでに巨大な惑星電力網が整っています。これを活用できれば、電力網を作り直す必要はありません。つまり、場当たり的に引いた電線の絡まりに苦しまずに済むのです。
linox-technology_planetary-power-network-capacity=惑星電力網の容量を増やします。レベルごとに容量が5 GJ増えます。
linox-technology_facility-factoryizing=施設内の不要な機械をすべて撤去して、工場のための場所を作ります。それでも、まだ十分な広さはなさそうです。
linox-technology_expanding-factory=施設のがらくたをさらに片付けて場所を作ります。家族写真をうっかり捨てないよう気をつけてください。
linox-technology_cargo-elevator=リノックスの地表と地下施設を結ぶ輸送システムを開発します。
linox-technology_rocket-silo-foundation=リノックスの地表は超高温の溶岩の海で、通常の基礎は使えません。さらに、施設の入口はロケットサイロの重さを支えられないため、建設に適した土台がありません。ロケットサイロの荷重を支えられる特殊な浮遊プラットフォームを開発すれば、少なくとも小さな建設場所を確保できます。
linox-technology_laboratory-database=リノックス研究所のデータベースには、私たちの文明の役に立つ技術が入っているかもしれません……あるいは、いかがわしいものしか入っていないかもしれません。
linox-technology_linox-petrochemicals=太陽の莫大なエネルギーを浴びるリノックスでは、その極限環境を利用した独特の石油化学技術が使えます。
linox-technology_recursive-blueprint=リノックスの研究者たちは、限られた場所を最大限に活用するため、施設の設計図まで自動化しました。この技術を使えば、設計図を自動化してマイクロ工場を建設できます。工場が手のひらに収まるなんて、誰が想像したでしょう！
linox-technology_tungsten-processing=タングステンを加工した部品は、耐熱性と耐摩耗性が大きく向上します。フォークに使えば、熱い料理を扱ってもわずかに曲がることがなくなります。
linox-technology_turbo-pump=がらくたを片付けているうちに、新しいポンプの設計図が見つかりました。メモによれば、惑星コンピュータ全体の計算能力を使って、たった1分で設計されたそうです。性能は既存のポンプを上回ります。なぜたかがポンプに惑星コンピュータを使ったのか、何に丸1分もかかったのかは謎のままですが、まあ、動けばいいのです。
linox-technology_core-roboport=充電のためだけにロボットステーションへ群がるロボットたちを見るのにうんざりした研究者たちは、既存のロボットステーションを分解して新しい設計を作りました。このロボットステーションは稼働範囲がごく狭いものの、非常に速い充電速度と多数の充電ポートでそれを補います。
linox-technology_enhanced-space-engineering=リノックスでロケットサイロを運用するには、太陽についての理解と、高品位で高性能な素材が必要です。
linox-technology_advanced-rocket-silo=発展ロケットサイロは通常のサイロの4倍の速さで稼働し、宇宙プラットフォームにも設置できます。従来のサイロは痛々しいほど遅く、極めて非効率でした。不要な手順を省き、高性能なサマリウムモーターを使うことで、打ち上げ時間を最大75%短縮できます。さらに素材の使い方を最適化したことで、宇宙プラットフォームに載せられるほど軽くなりました。これはすごいことです！
linox-technology_safety-of-entering-orbit=軌道突入時に貨物が無事に残る確率を、レベルごとに5%高めます。太陽の容赦ない猛威から大切な貨物を守るには、この研究が欠かせません。
linox-technology_sintering-machine=精製した粉末状の素材を高温で圧縮すると、複雑な加工なしで目的の形の製品を簡単に作れます。必要な量の素材だけを使えて加工コストもかからないため、数字にうるさい上司にもぴったりです。
linox-technology_planetary-mining-technology=リノックスはかつて、研究所の運営に資源を供給する巨大な採掘惑星でした。そこから学べる有用なノウハウがあるかもしれません。
linox-technology_mantle-extraction=基本的な惑星採掘技術です。地下数十キロメートルまで掘り進んでマントルに到達し、溶岩を汲み上げます。どこでも溶岩を得られるようになりますが、膨大なエネルギーを消費し、大量の汚染を発生させます。\n\n注意してください。この施設が稼働した瞬間、環境団体が激怒して、口から泡を吹きながら押し寄せてくるでしょう。でも、便利さが第一ですよね？
linox-technology_stone-extraction=溶岩から直接石を作れます。鉄や銅が得られるなら、石だって得られるはずでしょう？
linox-technology_tungsten-extraction=溶岩から直接タングステンを作れます。鉄や銅が出てくるなら、タングステンだって出てくるはずでしょう？
linox-technology_casting-stone-brick=鋳造所でレンガを作ります。今では電気炉はアクイロでしか見かけません。
linox-technology_rare-earth-refining=溶岩に溶け込んだ微量のレアアースを精製します。この工程は大量の廃棄物と環境汚染を生みますが、無人の惑星ではほとんど問題になりません。
linox-technology_samarium-centrifugation=レアアース鉱石からサマリウムを遠心分離します。サマリウムを使うと、極めて高い温度でも磁力を失わない永久磁石を作れるため、サマリウムを使った機械は過酷な環境でも安定して稼働できます。
linox-technology_ultra-deep-drilling=溶岩の海に覆われた惑星にも、天然資源の名残はまだ残っています。この研究所には、地下深くから資源を汲み上げる掘削施設があります。人間とは本当にしつこい生き物です。
linox-technology_linox-supercomputer=リノックスはコンピュータを動かすのに最悪といえる環境のひとつです。それでも仕事はしなければなりません。タングステンとL.O.R.A.Xの誤り訂正の支援により、リノックスでもスーパーコンピュータを使えるようになりました。
linox-technology_samarium-data-card=実はサマリウムは最も高温で動作する磁石ではありませんが、磁力がずっと強いため、より役に立つと聞きました。世の中には気になることがたくさんあるのに、そのすべてを理解できないのは残念です！
linox-technology_lorax-support=L.O.R.A.Xがあなたを支援できるよう、インターフェースシステムを設置します。今のところL.O.R.A.Xはデータの生産を調整するだけですが、データカード生産の生産性がなんと25%も上がります。結局のところ、計算機は計算に使われてこそ輝くのです。
linox-technology_power-converter=惑星電力網の巨大電力変換器を復旧すると、5 GJという莫大な容量を持つ大容量蓄電システムが使えるようになります。ですが、L.O.R.A.Xはなぜかこのシステムを……明らかに快く思っていないようです。
linox-technology_tungsten-sintering-processing=焼結処理を使うと、タングステン鉱石をすぐに使えるタングステン製品に加工できます。従来の精錬よりはるかに速く効率的で、何より工程がひとつ減るので、生産がずっと楽になります。
linox-technology_froth-flotation-processing=泡沫浮選処理は、疎水性の粒子が水から分離しやすい性質を利用します。スラリーに気泡を送り込むと、疎水性の粒子が泡に付着して表面に浮かび上がるため、簡単に分離できます。\n\n東アジアのある小国には「水は答えを知っている」というミームがあります。水責めを連想してしまいますが、きっとただの偶然でしょう。
linox-technology_dysprosium-extraction=泡沫浮選をはじめとするさまざまな工程を経て、高純度で非常に貴重なジスプロシウムを抽出できます。この粉末はデータカードの生産に使えます。あるいは市場で1キログラムあたり200ドルから1,000ドル以上で売ることもできます。
linox-technology_dysprosium-data-card=ジスプロシウムは永久磁石の「魔法の粉」とも言えますが、2021年の世界の生産量はわずか約3,100トンでした。こんなに希少な金属を、データカードを作るためだけに燃やしてしまっていいのでしょうか？
linox-technology_dysprosium-exoskeleton-equipment=古い外骨格を見てください。今にも折れそうな細い脚、200 kWというばかげた消費電力、死にかけのカタツムリより遅い動き。いらいらしますよね？ そこに魔法のジスプロシウムの粉を少し振りかければ、あら不思議、まるで魔法のように性能が上がります！ しかも、これがたったの39,999ドル！
linox-technology_build-data-catalog=L.O.R.A.Xによれば、私たちの研究成果がかなり蓄積してきたので、体系的に管理する必要があるようです。集めたデータを整理すると、高度なデータカードの生産性が上がり、高度な研究が解放されます。
linox-technology_chemical-particle-filtering=化学的な方法で目的の粒子を選んで分離します。この工程にはかなりの化学知識が必要ですが、おそらくL.O.R.A.Xと機械たちがやってくれるでしょう。新しいことを学ぶのは大変ですからね。
linox-technology_waste-water-treatment=実のところ、「廃水処理」とは捨てることを丁寧に言い換えただけです。マントル抽出機と同じく、この施設はおそらく環境団体に最も嫌われるものでしょう。もっとも、彼らがリノックスまでやってくることはまずないでしょうが。
linox-technology_neodymium-extraction=ネオジムの抽出工程を解放します。レアアースの抽出は手間がかかり、膨大な資源と水を必要とし、莫大な廃棄物を生みます。それでも、ネオジムのためならその価値があります。せっかくリノックスにいるのですから、最後までやり遂げてみませんか？
linox-technology_neodymium-data-card=ネオジムは世界で最も強力な永久磁石の製造に使われ、今では身の回りのちょっと高価な電気機器のほとんどに入っています。実際、このテキストを表示しているコンピュータを動かす電気も、ネオジム磁石から生まれたものかもしれません。
linox-technology_neodymium-permanent-magnet=ネオジム粉末にジスプロシウムと鉄を混ぜて焼結すると、あの有名なネオジム永久磁石ができます。本当はホウ素も加えるべきですが、実装する側にもプレイヤーにも難しいので省きました。要するに、この磁石はとても役に立つということです。
linox-technology_neodymium-permanent-magnet-generator=ついにこの製品をご紹介できます。ネオジム永久磁石を使えば、小さな空間で莫大なエネルギーを扱えます。この発電機は、標準的な蒸気タービンの43倍もの電力を生み出します！ さらにおまけとして、巨大熱交換器も付いてきます。
linox-technology_erbium-extraction=エルビウムの抽出工程を解放します。ネオジムの抽出工程とよく似ていますが、決して手抜きでこうなったわけではありません。実はレアアースはどれもこうやって作られるのです。大半は添加剤を加えて何百倍にも濃縮するだけ。大量の汚染が出るのも当然です。
linox-technology_erbium-data-card=エルビウムは主に光増幅用の添加剤として使われます。光ファイバーに加えると、信号の品質が劇的に向上すると言われています。マルチプレイのサーバーに接続するとき、エルビウム入りの光ファイバーを使っているかもしれません！
linox-technology_erbium-beacon=エルビウムが光信号の損失を減らすのは本当ですが、正直なところ、Factorioのビーコンとどう関係するのかはよくわかりません。とにかく、エルビウムを使うとビーコンの性能が上がり、最大4つのモジュールを装着できるようになります。既存のビーコンからのアップグレードもできます！
linox-technology_rare-earth-powder-productivity=レアアースの生産性を高めます。ちょっとしたおまけとして、汚染も減ります。
linox-technology_get-cargo-landing-pad=L.O.R.A.Xからメインの貨物着陸パッドの制御権を獲得します。これで軌道から貨物を受け取れるようになります。
linox-technology_basic-material-sintering-processing=鉄鉱石と銅鉱石を焼結処理して完成品を作ります。力ずくで素材を思いどおりの形にするのは、石器時代から続く古い伝統です。
linox-technology_sintering-machine-productivity=焼結機の生産性を高めます。入れた素材より多く出てくるような……これは「創造」と呼べるのでしょうか？
linox-technology_ground-platform-expansion=考えてみれば、地下施設はすでに文字どおりの溶岩の海の中にあるのですから、地上のプラットフォームをもっと広げられないはずはありません。そう気づいた私はすぐにL.O.R.A.Xのもとへ走り、なぜ拡張できないのか問い詰めました。返ってきた答えは「あなたが要求しなかったからです」。またしても、どんなに小さなことでも大切だということです。言いたいことは必ず言いましょう。
linox-technology_samarium-robotics=サマリウムの高温特性を活かすことで、飛行ロボットの耐久性と火炎への耐性が高まり、一時的に300%の過負荷運転ができるようになります。「早飯早糞」というやつです。
linox-technology_dysprosium-electric-motor-robot=飛行ロボットのモーターに微量のジスプロシウムを加えると、電力効率を最大25%高められます。ジスプロシウムは本当に魔法の粉のようですが、食べないでください。重金属です。
linox-technology_neodymium-permanent-magnet-inserter=ネオジム永久磁石モーターの莫大なトルクを利用すると、インサータの性能を革命的な水準まで引き上げられます。アームの動きが速すぎて、肉眼で追うのはほぼ不可能です。目が回るかもしれませんので、よい子はまねしないでください。
linox-moshine-technology_neodymium-crushing=モシャインでは、高純度の天然ネオジムを簡単に採掘できます。この天然ネオジムを粉砕するだけで、すぐにネオジム粉末が得られます。こんなに珍しい高純度のレアアースが地面に転がっているなんて、モシャインはまさに磁石マニアの楽園です！
linox-technology_planetary-power-converter-capacity=電力変換器の容量を拡張します。レベルごとに2.5 GJ増えます。\n\n何世紀も放置されてもなお、人類のために働いているのです。少しくらい投資してもいいのではありませんか？ 機械の権利を尊重してください。
linox-technology_outer-corridor-open=施設を囲む外部通路を開放します。この通路はもともと溶岩と岩で完全にふさがれていましたが、私たちがほかの作業で忙しくしている間に、L.O.R.A.Xが片付けてくれました。そういえば、研究者のログにはトイレについての不満はあまりありませんでした。
linox-technology_adding-pipeline=深部掘削施設のパイプラインを新たに追加します。新しく作られたパイプラインは、内部通路の壁のランダムな位置に設置されます。\n\n深部掘削施設はもともと研究所と接続するように設計されていないため、残念ながらパイプラインを好きな場所に置くことはできません。その代わりに、L.O.R.A.Xが配管を改良し、出力する資源を選べるようにしてくれました。なかなか賢いでしょう？
linox-technology_pipeline-productivity=深部掘削施設の生産性を高めます。\n\n実際には、深部掘削施設に直接触れることはできないので、この研究でプレイヤーがすることはあまりありません。改良はすべてL.O.R.A.Xが行います。研究レベルが上がるにつれ、L.O.R.A.Xの作業量はとてつもなく増えるようです。そういえば、最近パイプラインから妙な有毒ガスのようなものが上がってくるのはなぜだろうと思っていたのですが……L.O.R.A.X、まさかあなた――
linox-technology_chemical-tank-productivity=化学槽の基本生産性を高めます。聖書によれば、神はかつて大洪水で世界を洗い流したそうです。その水がすべてどこから来たのか、気になったことはありませんか？
linox-technology_chemical-filter-productivity=化学フィルターの基本生産性を高めます。具の多いスープほどおなかがふくれるのは常識です。鍋の底までしっかりさらわなければなりません。
linox-technology_distribution-request-planner=物流要求チェストの設定を簡単にするツールを追加します。要求チェストごとにアイテムをひとつずつ手作業で設定するのは、あまりに原始的で面倒です。自動化ツールでこの重労働から解放されましょう！
linox-technology_linox-science-pack=リノックスが提供できるすべてが詰まったサイエンスパックです。これを読んでいるということは、ハードモードを有効にしたのですね。人生はこれからも過酷な試練をたくさん投げかけてくるでしょうが、あなたならきっとそのすべてを乗り越えられるはずです。

