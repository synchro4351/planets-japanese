[recipe-description]
linox-recipe_advanced-acid-neutralisation=硫酸を高温の蒸気に変えます。リノックスでは、特殊な方法でこの処理をより効率よく行えます。
linox-recipe_rare-earth-refining=膨大な量の石を化学処理し、驚異の2%という収率でレアアースを抽出します。リノックスの高度な技術を象徴する工程です。
linox-recipe_samarium-centrifugation=遠心分離処理で、レアアース鉱石からサマリウムを分離します。
linox-recipe_rapid-distillation=超高温の溶岩で原油を急速に焼き、貴重な石炭を作ります。効率は悪いものの、この極端な工程はリノックスならではの工夫を表しています。
linox-recipe_lava-based-rocket-fuel=十分に熱い溶岩にわずかなエネルギーを加えると、ロケット燃料として使える超高温のガスが発生します。
linox-recipe_froth-flotation-processing=泡沫浮選処理は、疎水性の物質と親水性の物質を分離するために使います。
linox-moshine-recipe_neodymium-crushing=モシャインで採掘したネオジム鉱石を粉砕すると、純粋なネオジム粉末を簡単に得られます。

