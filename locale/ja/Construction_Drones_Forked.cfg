[mod-setting-name]
throttling=作業探索範囲の分割数
drone_process_other_player_deconstruction=他プレイヤーの解体
drone_process_other_player_construction=他プレイヤーの建設
drone_process_other_player_upgrade=他プレイヤーのアップグレード
drone_process_other_player_proxies=他プレイヤーのプロキシ
construction-drone-search-radius=作業探索半径
force-player-position-search=ローカル探索半径を使う
remote-view-spawn=リモートビューからの出撃を許可
drone-chain-search-radius=連続作業の探索半径

[mod-setting-description]
throttling=値をNとすると、プレイヤーごとの探索範囲を(N*2)^2個に分割します。値を小さくすると反応が良くなり、大きくするとCPU負荷が下がります。
drone_process_other_player_deconstruction=ほかのプレイヤーの解体作業をドローンが行えるようにします。
drone_process_other_player_construction=ほかのプレイヤーの建設作業をドローンが行えるようにします。
drone_process_other_player_upgrade=ほかのプレイヤーの建設作業をドローンが行えるようにします。
drone_process_other_player_proxies=ほかのプレイヤーのプロキシ作業（モジュール、物流要求など）をドローンが行えるようにします。
construction-drone-search-radius=実行可能な作業を探す半径（単位: タイル）です。
force-player-position-search=探索範囲をプレイヤーキャラクターの周囲に限定します。作業がプレイヤーの探索半径内にない限り、ドローンは遠隔では動作しなくなります。
remote-view-spawn=リモートビューからドローンを出撃できるようにします（別の地表をまたいでは動作しません）。警告: プレイヤーのもとへ戻る経路の途中でドローンが動けなくなることがあります。
drone-chain-search-radius=解体を終えたドローンは、この半径（タイル単位）内で、運んでいるアイテムですぐに建設できる近くのゴーストを探します。0にすると連続作業を無効にします。

[controls]
construction-drone-toggle=建設ドローンの切り替え
drone-repair-toggle="ドローンによる修理パック使用の切り替え"

