[item-description]
RTAIZiplineControls=このコントローラーは、電力網上の任意の電柱まで電動ジップラインを操縦できます。ジップラインに乗っている間に電柱にカーソルを合わせてジップラインキーを押すと、そこまで自動で移動します。
RTItemShellItem=電磁アイテムキャノンからアイテムのスタックを発射するのに使います。
[mod-setting-name]
RTStreamSetting=投げたアイテムをプロジェクタイルにする
RTOverflowTimeout=オーバーフローのタイムアウト
RTChestPop=破壊されたチェストや車両からアイテムが飛び散る
RTVehicleCharacterKnockback=車両がぶつかるとプレイヤーを後方に弾き飛ばす
RTPlatformLooseItems=宇宙プラットフォーム上の散らばったアイテムが出発時に漂い去る
RTTrapdoorSetting=トラップドアワゴンを有効化
RTItemCannonSetting=|-アイテムキャノン、リコシェパネル、シュートを有効化
MiningSpeedDebuffTime=重なったオブジェクトの採掘速度低下時間 (秒)
RTZiplineDisablesBotsSetting=ジップライン中はパーソナルロボットステーションを無効化
[mod-setting-description]
RTStreamSetting=投げたアイテムをゲームオブジェクトのプロジェクタイルとして表現し、ラグを抑えます。無効にすると、投げたアイテムは回転するスプライトとして描画されます。こちらのほうが楽しく、ゲームオブジェクトのエンティティ枠も使いませんが、ラグは大きくなります。この設定を変更すると、飛行中のアイテムはすべて消えます。
RTOverflowTimeout=オーバーフロー防止が有効な場合、投擲機が投げ先のインベントリに空きを見つけられなかったとき、次に確認するまで待つ秒数です。空きの確認を繰り返すことによるラグを抑えるためのものです。
RTChestPop=チェストや車両が破壊されると、中のアイテムの半分が飛び散って地面に散らばります。
RTTrapdoorSetting=トレインランプが有効な場合、トラップドアスイッチランプも有効にします。
MiningSpeedDebuffTime=ほかのものと重なることの多いもの (ハッチ、トレインランプ) を撤去したあと、下にあるものを誤って撤去しないよう、この時間だけ採掘速度を下げます。
RTZiplineDisablesBotsSetting=ジップラインに乗ったときにパーソナルロボットステーションを自動で無効にするかどうかです。有効にすると、ジップラインを降りたときにパーソナルロボットステーションの設定が乗る前の状態に戻ります。
