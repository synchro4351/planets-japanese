[entity-description]
RTVacuumHatch=ポンプに雑に取り付けられたハッチです。前方5x5の範囲の床にあるアイテムを吸い上げ、背後にあるものに入れます。
RTSwitchTrainRamp=通常のトレインランプと同じように機能しますが、ジャンプしたトラップドアワゴンの状態も切り替えます。この方法で切り替えられたトラップドアワゴンは、着地すると元の状態に戻ります。
RTSwitchTrainRamp-placer=通常のトレインランプと同じように機能しますが、ジャンプしたトラップドアワゴンの状態も切り替えます。この方法で切り替えられたトラップドアワゴンは、着地すると元の状態に戻ります。
RTSwitchTrainRampNoSkip=スケジュールをスキップしない通常のトレインランプと同じように機能しますが、ジャンプしたトラップドアワゴンの状態も切り替えます。この方法で切り替えられたトラップドアワゴンは、着地すると元の状態に戻ります。
RTMagnetSwitchTrainRamp=通常の磁気トレインランプと同じように機能しますが、ジャンプしたトラップドアワゴンの状態も切り替えます。この方法で切り替えられたトラップドアワゴンは、着地すると元の状態に戻ります。
RTMagnetSwitchTrainRamp-placer=通常の磁気トレインランプと同じように機能しますが、ジャンプしたトラップドアワゴンの状態も切り替えます。この方法で切り替えられたトラップドアワゴンは、着地すると元の状態に戻ります。
RTMagnetSwitchTrainRampNoSkip=スケジュールをスキップしない通常の磁気トレインランプと同じように機能しますが、ジャンプしたトラップドアワゴンの状態も切り替えます。この方法で切り替えられたトラップドアワゴンは、着地すると元の状態に戻ります。
RTTrapdoorSwitch=上を通過したトラップドアワゴンの開閉状態を切り替えるスイッチです。
RTTrapdoorSwitch-placer=上を通過したトラップドアワゴンの開閉状態を切り替えるスイッチです。
RTTrapdoorWagon=このワゴンのトラップドアが開いていると、積み荷が底から落ちます。
RTBeltRamp=この高速の傾斜ベルトは、アイテムを端から絶えず打ち出します。オルトビューでクリックすると範囲表示を切り替えます。
RTfastBeltRamp=この超高速の傾斜ベルトは、アイテムを端から絶えず打ち出します。オルトビューでクリックすると範囲表示を切り替えます。
RTexpressBeltRamp=このとんでもない速さの傾斜ベルトは、アイテムを端から絶えず打ち出します。オルトビューでクリックすると範囲表示を切り替えます。
RTturboBeltRamp=この極超高速の傾斜ベルトは、アイテムを端から絶えず打ち出します。オルトビューでクリックすると範囲表示を切り替えます。
RTItemCannon=アイテムをアイテムシェルに詰め、強力な電磁石と超伝導体を使って砲身からほぼ瞬時にとんでもない速度まで加速させます。フルスタックのみ発射します。1発ごとに電力バッファをすべて消費し、次の発射の前に再充電が必要です。インタラクトキーを押すと、キャノンのガイドレーザーをオン/オフします。
RTRicochetPanel=電磁アイテムキャノンから発射されたアイテムシェルを、集束した磁場のバーストで跳ね返します。バーストのたびに電力バッファを消費します。アイテムシェルが当たったときに電力バッファが75%未満だと、安全に跳ね返すだけの電力が足りないことがあります。
RTCatchingChute=飛行中のアイテムシェルを受け止め、中のアイテムを取り付けられたチェストに入れます。
RTMergingChute=2つの方向から飛んでくるアイテムシェルの飛行経路を合流させ、同じ出力口から送り出します。アイテムシェルが当たったときに電力バッファが75%未満だと、安全に向きを変えるだけの電力が足りないことがあります。
RTDivergingChute=入力口に飛び込んだアイテムシェルは、2つの出力口から交互に出ていきます。アイテムシェルが当たったときに電力バッファが75%未満だと、安全に向きを変えるだけの電力が足りないことがあります。
