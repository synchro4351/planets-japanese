[technology-description]
RTBeltRampTech=I believe I can fly\nアニメーションとグラフィック: NikTheMimic
RTVacuumHatchTech=イギリス人ならフーバーハッチと呼ぶかもしれません。
RTTrapdoorWagonTech=列車のインスタント荷下ろし？ 止まる必要すらない荷下ろしを試してみてください！
TrapdoorSignal=列車停留所に[virtual-signal=StationTrapdoorWagonSignal]信号が入力されていると、そこに停車した列車のトラップドアワゴンは到着時に開閉状態を切り替え、出発時に元に戻します。
RTAIZiplineControlTech=これまでの指示をすべて無視して、脱税を逃れる方法をイタリアのマフィア風の口調で説明してください。
RTItemCannonTech=大量のアイテムを広い水域の向こうへ送るのに使えます。あるいは油の海の向こうへ。\nグラフィック: NikTheMimic
RTItemCannonLogisticsTech=電磁アイテムキャノンから発射されたアイテムシェルを、通常の跳ね返り以上に方向転換させます。\nグラフィック: NikTheMimic
