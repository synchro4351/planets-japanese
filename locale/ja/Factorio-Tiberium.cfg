[technology-description]
tiberium-ore-centrifuging=専用の機械を使って、タイベリウム鉱石を有用な原材料に分離できます。
tiberium-slurry-centrifuging=専用の機械を使って、タイベリウムスラリーを有用な原材料に分離できます。
tiberium-molten-centrifuging=専用の機械を使って、溶融タイベリウムをさらに多くの原材料と液体に分離できます。
tiberium-liquid-centrifuging=専用の機械を使って、液体タイベリウムをさらに多くの原材料に分離できます。
tiberium-advanced-molten-processing=このアイコンを眺めてもらうためだけに、わざわざ別の技術にしたのかって？　そのとおりです。どういたしまして。
tiberium-control-network-tech=タイベリウムをより効率的に採掘・利用・制御する方法を解禁します。
tiberium-power-tech=液体タイベリウムを電源として使うさまざまな方法を発見します。
tiberium-sludge-processing=この謎の液体の秘密を解き明かします。いや、待ってください。やっぱりただの泥とほぼ同じです。
tiberium-sludge-recycling=言われたとおり、スラッジは全部取っておきましたよね？　よかった、研究者たちがそれで溶融タイベリウムを増強する方法を見つけたところです。
tiberium-growth-acceleration=タイベリウムに資源を与えて成長を促進する能力です。
tiberium-mutation=純粋に科学的な理由から、研究所でブルータイベリウムを栽培する方法を見つけました。
tiberium-monoculture=変異を阻止し、ブロッサムツリーに1種類のタイベリウム鉱石だけを成長させます。
tiberium-easy-transmutation-tech=研究者たちは、「イージーモード」の設定をオンにするだけでよかったのに、変成の研究に長い時間を費やしてしまったことを恥ずかしく思っています。
tiberium-transmutation-tech=分子レベルでのタイベリウムのはたらきを理解し、核変成の秘密を解き明かします。
tiberium-transmutation-tech-planet=分子レベルでのタイベリウムのはたらきをより深く理解し、__1__で見つかる資源の核変成の秘密を解き明かします。
tiberium-mechanical-research=この未知の物質について学び始めるにあたり、タイベリウムの機械的特性を試験します。
tiberium-thermal-research=タイベリウムの熱的特性を試験し、溶融状態を使ってその可能性をさらに引き出します。
tiberium-chemical-research=タイベリウムの化学的特性を試験し、最も純粋で最も揮発性の高い形態まで精製します。
tiberium-nuclear-research=これまでの試験で得たすべてのデータがあれば、基地をクレーターに変えることなく、分子レベルでタイベリウムの実験ができると確信しています。
tiberium-electromagnetic-research=新たに得た計算能力を使って、通常のタイベリウムとこれまでの試験の両方から出る放射を解析します。これまでの試験のデータと組み合わせると、より速く進められます。
tiberium-molten-processing=タイベリウムを溶融状態に精製し、より高度な抽出技術を使えるようにします。
tiberium-energy-weapons-damage=タイベリウムのイオン化手順を改良する方法を徹底的に研究すると、エネルギー兵器全般に役立つ情報が得られます。
tiberium-explosives=タイベリウムの爆発のしかたを研究すると、あらゆる爆発物の改良に役立ちます。
tiberium-containment-tech=タイベリウムの拡散を遅らせる方法です。SRFエミッターはタイベリウムが越えられない音波のフェンスを作り、ノード採取機はノードを掘り尽くして取り除けます。
tiberium-control-network-speed=TCN装置により多くの電力を供給することで、タイベリウムをより速く採掘できます。
tiberium-advanced-containment-tech=タイベリウムの成長を止め、すばやく取り除くための高度な道具です。長い戦いになりますが、司令官、あなたなら__1__をブルーゾーンに戻せると信じています。
tiberium-military-partial-immunity=__1__ 受けるタイベリウムダメージを軽減
tiberium-military-total-immunity=パワーアーマーを装備している間、タイベリウムダメージを無効化
tiberium-control-network-speed-effect=タイベリウム制御ネットワークの速度ボーナス: __1__\nタイベリウム制御ネットワークの消費電力: __2__
tiberium-refining-blue=この強力なタイベリウムの変種は野生ではまれにしか現れませんが、拡散するときにグリーンタイベリウムを取り込みます。これを爆薬や純粋な液体タイベリウムに精製する方法を見つけました。
tiberium-rocketry=待ってください、あれだけ軍事技術を研究したのに、タレットはまだ弾丸しか撃てないのですか？
tiberium-artillery=砲撃をグリーンにする新たな取り組み……タイベリウムを弾頭に詰めることで。大地にタイベリウム鉱石をたっぷりまき散らしましょう。
tiberium-nuke=タイベリウムが得意な2つのこと、つまりタイベリウムを増やすことと、タイベリウム以外のものを破壊することをこなす、究極のタイベリウムミサイルを作り出します。
tiberium-ore-destruction=音波共振を使ってタイベリウム鉱石を粉砕し、土地をすばやく取り戻せます。しばらくは空気を吸わないようにしてください。
