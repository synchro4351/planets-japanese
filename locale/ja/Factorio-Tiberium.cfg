tiberium-floor-is-lava=タイベリウム鉱石の上に立ってダメージを受ける
tiberium-before-uranium=ウラン採掘を解禁する前に、タイベリウム鉱石を採掘し、タイベリウムサイエンスパックを使って技術を研究する
tiberium-hot-potato=インベントリにタイベリウム鉱石を入れていてダメージを受ける。もっと安全な運び方を探したほうがよさそうです
tiberium-seed-node=タイベリウムシードミサイルを使って、新しいブロッサムツリーを生み出す
tiberium-spill=タイベリウムの液体を含む建物を破壊して、地面にタイベリウム鉱石をこぼす
tiberium-generator=タイベリウム鉱石の上に立って、タイベリウム放射線吸収発電機を稼働させる
tiberium-forgot-armor=タイベリウム軍事3を研究したのに、パワーアーマーを装備し忘れてタイベリウム鉱石の上でダメージを受ける
tiberium-marv=MARVを使ってタイベリウム鉱石を採取する
tiberium-srf=2つのSRFエミッターを並べて、タイベリウムの成長を封じ込める壁を作る
tiberium-spike=ブロッサムツリーにタイベリウムスパイクを設置して自然成長を止め、代わりに溶融タイベリウムを無限に生み出す
tiberium-escape=唯一の資源がタイベリウムである惑星からロケットを打ち上げる
tiberium-blue-spawn=グリーンタイベリウムがブルータイベリウムに変異し始めるほどの汚染を発生させる
tiberium-substrate=未処理の素材をタイベリウム基質にリサイクルする
tiberium-use-growth-accelerator=タイベリウム成長促進装置でタイベリウム基質を使い、タイベリウムの原野の産出量を増やす
tiberium-power-plant=タイベリウム発電所を使って、液体タイベリウムから電気を生み出す
