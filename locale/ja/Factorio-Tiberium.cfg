[item-description]
tiberium-growth-credit=成長促進装置がタイベリウムノードの産出量を増やすために使います。タイベリウムが欲しがるもの、電解質入りです！
tiberium-primed-reactant=タイベリウムと触媒を凝縮したパックで、どんな鉱石にも変成できます。
tiberium-primed-reactant-blue=タイベリウムと触媒を詰めた高エネルギーのパックです。安全に使うには、タイベリウム起爆反応剤に変換する必要があります。
tiberium-ion-core=イオン兵器用のイオン流を生成する装置です。
tiberium-blue-explosives=扱っても安全な形態のタイベリウムですが、条件がそろうと爆発します。
tiberium-cliff-explosives=タイベリウムのブロッサムツリーに向けて放物線を描くように投げて起爆し、鉱脈を永久に破壊して今後のタイベリウムの成長を止めます。
tiberium-rounds-magazine=タイベリウムを染み込ませた弾丸の弾倉です。
tiberium-rocket=少量の液体タイベリウムを弾頭に積んだミサイルです。
tiberium-artillery-shell=この長距離砲弾にはタイベリウムのちょっとしたサプライズが詰まっていて、着弾するとタイベリウム鉱石が残ります。
tiberium-grenade-all=共振周波数を使って、あらゆるタイベリウム鉱石を粉砕するよう設計された投てき爆弾です。
tiberium-grenade-blue=共振周波数を使って、ブルータイベリウム鉱石を粉砕するよう設計された投てき爆弾です。
tiberium-catalyst-missile-all=着弾時に連鎖反応を起こし、周囲のあらゆるタイベリウム鉱石を破壊するミサイルです。
tiberium-catalyst-missile-blue=着弾時に連鎖反応を起こし、周囲のブルータイベリウム鉱石を破壊するミサイルです。
tiberium-seed=着弾するとグリーンタイベリウムをまき散らす、ダメージのないミサイルです。同じ地点に何発も撃ち込むと、タイベリウム鉱石が__1__に達し、最も近いタイベリウムノードから__2__タイル離れていれば、新しいタイベリウムノードを作れます。
tiberium-seed-blue=着弾するとブルータイベリウムをまき散らす、ダメージのないミサイルです。同じ地点に何発も撃ち込むと、タイベリウム鉱石が__1__に達し、最も近いタイベリウムノードから__2__タイル離れていれば、新しいタイベリウムノードを作れます。
tiberium-chemical-sprayer-ammo=火炎放射器で噴射すると、腐食性のタイベリウムガスの雲が短時間発生します。
tiberium-empty-cell=核燃料を充填できる空の燃料セル容器です。
tiberium-dirty-cell=核利用のための、汚染された液体タイベリウム容器です。再利用する前に洗浄と点検が必要です。
tiberium-fuel-cell=少量の液体タイベリウムを含む燃料セルで、原子力発電に使います。
tiberium-science=研究所で研究に使います。
tiberium-data=タイベリウムの試験で得られたデータです。
