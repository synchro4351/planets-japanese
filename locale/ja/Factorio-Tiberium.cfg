tiberium-sludge-from-slurry=上質なタイベリウムスラリーをなぜ無価値なスラッジに変えるのか、研究者たちにはさっぱりわかりませんが、最近の若者の間で流行っていると聞いたそうです。
tiberium-mixed-science=複数の種類のタイベリウムデータを組み合わせると、タイベリウムサイエンスパックが__1__%多く手に入ります！
tiberium-growth=成長促進装置を使ってブロッサムツリーにタイベリウム基質を与え、周囲のタイベリウム鉱石の原野を加速して成長させます
