[mod-setting-description]
tiberium-description-default=デフォルト
tiberium-description-enabled=有効
tiberium-description-disabled=無効
tiberium-description-template=__1__\n__2__: __3__
tiberium-direct-catalyst=変成レシピのシードとして、目的の資源を少量必要とします。ほかのMODの資源が順番を飛ばして解禁されるのを防ぐのに役立ちます。
tiberium-direct-surface-condition=タイベリウムをほかの資源に変成できるのは、その資源が自然に存在する惑星だけになります。
tiberium-direct-planet-techs=その惑星の資源の変成を解禁するのに、ほかの惑星のサイエンスパックを使う追加の技術が必要になります。
tiberium-easy-recipes=すべての触媒を取り除き、序盤の変成レシピを導入してレシピを簡単にします。遠心分離を扱う必要がなくなります。完全に楽しむには、下にある廃棄物の設定もオフにしてください。
tiberium-byproduct-1=精製レシピでタイベリウムスラッジの廃棄物が出るかどうかです。
tiberium-byproduct-2=精製レシピで硫黄の廃棄物が出るかどうかです。
tiberium-byproduct-direct=直接レシピでタイベリウムスラッジの廃棄物が出るかどうかです。
tiberium-damage=タイベリウムが成長するときに建物に与えるダメージ、その上に立つプレイヤーへのダメージ、インベントリに持つプレイヤーへのダメージの倍率です。
tiberium-radius=ノードからタイベリウムが成長できる距離です。範囲型採掘機とブロッサムツリー同士の距離もこれに合わせて変わります。
tiberium-growth=1タイルに成長できるタイベリウム鉱石の量の倍率です。
tiberium-grow-on-landfill=タイベリウムが埋め立て地のタイルに広がることを許可します。資源や地形を再生成するMODと併用すると、意図しない結果になることがあります。
tiberium-blue-target-evo=ブルータイベリウムが野生で出現し始めると想定する進化係数の目安です
tiberium-blue-saturation-point=グリーンタイベリウムのうち何パーセントがブルータイベリウムに変わったら、完全に飽和したとみなすかです。
tiberium-blue-saturation-slowdown=惑星がブルータイベリウムで完全に飽和した後、グリーンタイベリウムがブルータイベリウムに変わる速さです。
tiberium-debug-text=役に立つけれど煩わしいデバッグメッセージを、ゲーム内に大量に送ります。
tiberium-debug-text-startup=遠心分離などの問題の解決のため、factorio-current.log ファイルに追加の情報を記録します。
tiberium-force-vanilla-centrifuging=動的なタイベリウム遠心分離レシピに関する下の設定をすべて無視し、代わりにバニラの固定のレシピ出力を使います。オンにすると、MODの資源やレシピを考慮せず、遠心分離から銅、鉄、石材、石炭、原油が得られます。
tiberium-centrifuge-override=上級者向けの設定: 自動生成された__1__のレシピ出力を、使っているMODの組み合わせにより適したものに置き換えます。\nレシピから出るアイテム/液体とその量を区切り文字で区切り、"item1-internal-name:item1-amount,item2-internal-name:item2-amount"という正確な形式で入力してください。例: iron-ore:13,crude-oil:32\nアイテムの内部名は、ゲームを読み込んでF4でデバッグ設定を開き、「show-debug-info-in-tooltips」を有効にしてから、目的のアイテムにマウスを合わせて「item-name」の欄を見ると確認できます。液体の場合は、FNEIか樽から取り出すレシピでマウスを合わせてください。\nデフォルト: 空欄にすると、自動生成された__1__のレシピ出力を使います
tiberium-centrifuge-alien-ores=遠心分離レシピの生成に、ナウヴィス以外の惑星の鉱石とレシピを含めるかどうかです。ゆがんだレシピや、進行を壊すレシピになることがあります。
tiberium-resource-inclusions=上級者向けの設定: タイベリウムの遠心分離や変成のレシピで得られる資源として扱うアイテム/液体を列挙します。\nアイテム/液体をカンマで区切り、"item1-internal-name,item2-internal-name"という正確な形式で入力してください。例: uranium-ore,crude-oil\nアイテムの内部名は、ゲームを読み込んでF4でデバッグ設定を開き、「show-debug-info-in-tooltips」を有効にしてから、目的のアイテムにマウスを合わせて「item-name」の欄を見ると確認できます。液体の場合は、FNEIか樽から取り出すレシピでマウスを合わせてください。\nデフォルト: 空欄にすると、採掘機/ポンプジャックで採れる資源だけを遠心分離・変成できます
tiberium-resource-exclusions=上級者向けの設定: タイベリウムの遠心分離や変成のレシピで決して得られないようにする資源を列挙します。\nアイテム/液体をカンマで区切り、"item1-internal-name,item2-internal-name"という正確な形式で入力してください。例: uranium-ore,crude-oil\nアイテムの内部名は、ゲームを読み込んでF4でデバッグ設定を開き、「show-debug-info-in-tooltips」を有効にしてから、目的のアイテムにマウスを合わせて「item-name」の欄を見ると確認できます。液体の場合は、FNEIか樽から取り出すレシピでマウスを合わせてください。\nデフォルト: 空欄にすると、すべての資源を遠心分離・変成できます
tiberium-recipe-category-exclusions=上級者向けの設定: 製作に必要な材料を計算するときに無視するレシピカテゴリを列挙します。\nレシピカテゴリをカンマで区切り、"recipe-category1,recipe-category2"という正確な形式で入力してください。例: recycling,pressing\nデフォルト: 遠心分離レシピのスクリプトは、ループするレシピや何もないところからアイテムを作り出すレシピを除外しようとしますが、目新しいレシピや複雑なレシピチェーンを持つMODでは判断を誤ることがあります。
tiberium-value=タイベリウム鉱石1個から得られる原材料の量の倍率です。値が大きいほどゲームが簡単になります。
tiberium-enemies-take-environmental-damage=バイターがタイベリウムのブロッサムツリーの近くを歩くとダメージを受けるようになります。これまでUPSの問題を起こしたことがあります。
tiberium-pollution-multiplier=タイベリウムの精製と燃焼で余分に出る汚染の倍率です。1にすると、タイベリウムの精製で通常のレシピ以上の汚染が出なくなります。
tiberium-spread-nodes=拡散するタイベリウムが自然に新しいノードを成長させ、やがて惑星全体を覆うかどうかです。
tiberium-starting-area=開始地点の鉱床の1つにタイベリウムを含めます。\nはい、拡散してほかの開始地点の鉱床を飲み込みます。\nはい、ゲームはかなり難しくなります。\n情けは無用、待っているのは苦痛だけです。警告はしましたよ。
tiberium-tier-zero=液体のレシピや電気を解禁する前に使える、遠心分離の段階を1つ追加します。序盤を拡張するほかのMODと組み合わせたタイベリウムのみのプレイで便利です。
tiberium-advanced-start=基本的なタイベリウム精製設備を持った状態で始め、タイベリウムのみのプレイができるようにします。
tiberium-all-planets=タイベリウムをナウヴィスだけでなく、すべての惑星に自然に出現させるオプションです。この設定にかかわらず、どの惑星にも手動でタイベリウムを持ち込めます。
tiberium-ore-removal=「タイベリウムのみ」マップ生成プリセットと一緒に使います。開始地点のタイベリウム鉱石の設定と、タイベリウムの発展スタートの設定を有効にします。
tiberium-item-damage-scale=インベントリにタイベリウムを持っているときのダメージを、スタック数に応じて増やします。タイベリウムでいっぱいのチェストを回収するときは注意してください！
tiberium-auto-scale-performance=終盤のタイベリウムの成長の細かさを下げ、UPSの低下を防ぎます。
tiberium-technology-triggers=一部のタイベリウム技術が、研究所でパックを使う代わりに、タイベリウムの採掘や精製で解禁されるようになります。
