[space-location-description]
tiber=放射性の緑に光る結晶の原野にあらゆる生命を吸い取られた、静かな荒れ地です。レーダーに動くものの気配はありませんが、あの結晶が5分前より近づいている気がしてなりません。すばやく工場を築いて新しい技術を解禁し、緑の潮を押しとどめましょう。さもなければ、あなたも基地も死の抱擁に飲み込まれることになります。
[tiberium-strings]
informatron-reminder=Factorio and Conquer: Tiberian Dawn が初めての方には、MOD「Informatron」のダウンロードをおすすめします。このMODの仕組みやシステムの多くを解説するwikiが含まれています。
growth-accelerator-gains=鉱石が__1__個余分に成長しました
node-placement-error=ほかのタイベリウムのブロッサムツリーにこれほど近い場所には、タイベリウムのブロッサムツリーを芽吹かせられません
wild-blue-notification=__1__ 最初の野生のブルータイベリウムの変異が__2__で発生しました
taking-tiberium-radiation-damage=タイベリウムの放射線ダメージを受けています！
tiber-restart-notice=既存のワールドではタイバーから開始できません。タイバーから開始したい場合は、新しいワールドを始めてください。
reprocessor-input-error=__1__はタイベリウム基質にリサイクルできません
growth-accelerator-input-error=タイベリウムの成長促進に使えるのはタイベリウム基質だけです
[Factorio-Tiberium]
menu_Factorio-Tiberium=Factorio and Conquer
title_Factorio-Tiberium=Factorio and Conquer
mod_page=Factorio and Conquer へようこそ！ \n ここでは、このMODの仕組みと機械を解説します。
menu_tiberium_growth=タイベリウムの成長
title_tiberium_growth=タイベリウムの成長
tiberium_growth=ワールドのタイベリウムは、ほかの鉱石のように静的ではありません。時間とともに成長します。ノードはそれぞれ別のタイマーで、5分ごとに成長します。\nタイベリウム鉱石は、近くにある鉱石のタイル数に応じてプレイヤーにダメージを与えます。半径1.5タイル以内の1タイルごとに0.1ダメージです。
menu_nodes=ノード
title_nodes=ノード
nodes=タイベリウムはワールドにあるノードから成長します。ノードはそれぞれ別のタイマーで、5分ごとに成長します。タイベリウムはプレイヤーにダメージを与え、その配置は建物にダメージを与えるので注意してください。\n新しいノードはタイベリウムの成長によって生まれることがあります。成長時に、タイルに鉱石が加わる代わりにノードができる確率があります。この確率は、対象のタイルにある鉱石が多いほど高くなります。対象のタイルの鉱石がタイベリウムの拡散値を下回っている場合、確率は0です。
menu_growth_accelerator=[item=tiberium-growth-accelerator]成長促進
title_growth_accelerator=成長促進
growth_accelerator=成長促進装置は、余った素材をタイベリウムに与えて原野の成長を速める手段です。鉱石から作るタイベリウム基質を使います。\nノードに設置すると、タイベリウム基質を常に消費してチャージをため、ノードが成長するときにそれを放出します。
menu_harvesting=タイベリウムの採取
title_harvesting=タイベリウムの採取
harvesting=バニラの採掘機に加えて、このMODにはタイベリウムを採取する方法がいくつかあり、中にはより恒久的なものもあります。\nタイベリウムの採掘はかなり簡単です。ベルト、採掘機、電柱はタイベリウムの成長によるダメージを受けないので、自由に設置してタイベリウムを採掘できます。
menu_node_harvester=[item=tiberium-node-harvester]ノード採取機
title_node_harvester=ノード採取機
node_harvester=ノード採取機は、不要なノードを取り除く手段です。ノードを掘り尽くして永久に取り除きます。ノードが豊富だと時間がかかることがあります。
menu_tiberium_spike=[item=tiberium-spike]タイベリウムスパイク
title_tiberium_spike=タイベリウムスパイク
tiberium_spike=タイベリウムスパイクを使うと、タイベリウムを安全に利用できます。ノードの上に設置すると完全に覆って成長を止め、溶融タイベリウムを採取します。
menu_tiberium_control_node=[item=tiberium-network-node]タイベリウムネットワークノード（TNN）
title_tiberium_control_node=タイベリウムネットワークノード（TNN）
tiberium_control_node=TNNはタイベリウムの大量採掘の頂点で、広い範囲を非常にすばやく採掘します。ただし、ノードを掘り尽くすことはありません。
menu_tiberium_seed=[item=tiberium-seed]液体タイベリウムシード
title_tiberium_seed=液体タイベリウムシード
tiberium_seed=液体タイベリウムシードは、タイベリウムをまき散らすミサイルです。ある地点に撃ち込むと、斜めを含む半径2タイルにタイベリウム鉱石が生まれます。離れたタイルほど鉱石は少なくなります。シードによってタイルの鉱石が1タイルあたりの上限（デフォルトでは1000）を超える場合、代わりにノードが生まれ、タイベリウムが成長するようになります。
menu_aoe_node_harvester=[item=tiberium-aoe-node-harvester]範囲型ノード採取機
title_aoe_node_harvester=ノード採取機
aoe_node_harvester=範囲型ノード採取機は、多数の不要なノードを取り除く手段です。ノードを掘り尽くして永久に取り除きます。ノードが豊富だと時間がかかることがあります。
menu_tiberium_control_network=[item=tiberium-control-node]タイベリウム制御ネットワーク
title_tiberium_control_network=タイベリウム制御ネットワーク
tiberium_control_network=タイベリウム制御ネットワークは強力なビーコン施設で、周囲のタイベリウム採取設備の採掘速度を上げます。\n\n1つの建物が影響を受けられるビーコンは最大3つです。ビーコン1つあたりの基本の増加量は、速度+100%、消費電力+200%です。これはタイベリウム制御ネットワークの出力の技術の各レベルにつき、それぞれ25%と40%ずつ増やせます。さらに、少なくとも1つのビーコンの影響を受けるエンティティごとに5MWの電力が必要です。\n\n影響を受けるエンティティは次のとおりです: \n-タイベリウムスパイク \n-タイベリウムノード採取機 \n-タイベリウムネットワークノード \n-範囲型ノード採取機
menu_refining=タイベリウムの精製
title_refining=タイベリウムの精製
refining=タイベリウムの精製は複数の段階からなる工程で、途中でいくつかの副産物が出ます。
menu_tiberium_ore=[item=tiberium-ore]タイベリウム鉱石
title_tiberium_ore=タイベリウム鉱石
tiberium_ore=タイベリウム鉱石は基本の素材です。遠心分離するか、スラリーに精製できます。燃料として燃やすこともできます。\nインベントリに鉱石を持っているとダメージを受けます。これはゴミ箱スロットにある鉱石にも当てはまります。
menu_sludge=[fluid=tiberium-sludge]スラッジ
title_sludge=スラッジ
sludge=スラッジはタイベリウムの精製の主な副産物です。精製の各段階で発生し、直接レシピでは任意です。\n精製したタイベリウムより価値は低いものの、さまざまな使い道があります。
menu_slurry=[fluid=tiberium-slurry]スラリータイベリウム
title_slurry=スラリータイベリウム
slurry=スラリーはタイベリウムの精製の最初の段階です。この段階は組立機で行い、遠心分離に使うか、溶融タイベリウムに精製できます。
menu_molten=[fluid=molten-tiberium]溶融タイベリウム
title_molten=溶融タイベリウム
molten=溶融タイベリウムはタイベリウムの精製の第2段階です。この段階は原油精製所で行います。溶融タイベリウムは、直接レシピで1種類の鉱石を大量に直接生産したり、遠心分離して計算された比率の素材を得たり、液体タイベリウムに精製したりできます。
menu_liquid=[fluid=liquid-tiberium]液体タイベリウム
title_liquid=液体タイベリウム
liquid=液体タイベリウムは精製の最終生成物です。兵器、発電、タイベリウムのさらなる播種に使います。発電には、発電所での直接使用、燃料セルに詰めて原子力発電に使う方法、燃料値を持つ液体としてそのまま燃やす方法があります。\n燃料セルを使って原子炉に供給するのは、複数の段階からなる工程です。まず空のセルを作り、液体タイベリウムを充填します。原子炉で使った後のセルは汚れているので、洗浄が必要です。この工程では、損傷したセルや使えなくなったセルも取り除かれるので、予備を作り続けるようにしてください。
menu_centrifuging=[item=centrifuge]遠心分離
title_centrifuging=遠心分離
centrifuging=遠心分離は鉱石、スラリー、溶融タイベリウム、液体タイベリウムから行え、ゲームのあらかじめ決められた段階に応じて計算された比率の鉱石を生み出します。\n現在の比率は、3つの段階のサイエンスパックの要件によって決まります。石油以前、ロケット以前、そして無限研究に必要なものです。ただし計算は完璧ではないので、おかしいと思うところがあれば報告してください。
menu_containment=封じ込め
title_containment=封じ込め
containment=このMODには、タイベリウムを採取したくないときに封じ込める方法がいくつかあり、タイベリウムから身を守る装備もあります。
menu_armor=[item=power-armor-mk2]アーマー
title_armor=アーマー
armor=このMODには、タイベリウムとの接触ダメージに対する2段階の防護があります。タイベリウム軍事1はタイベリウムから受ける環境ダメージを大幅に減らし、タイベリウム軍事3はパワーアーマーを装備している限り、タイベリウムからの環境ダメージを完全に無効にします。
menu_sonic_fences=[item=tiberium-srf-emitter]音波フェンス
title_sonic_fences=音波フェンス
sonic_fences=音波フェンスはタイベリウムを制御する受動的な方法です。フェンスを最大15タイル離して設置するだけで、その間に音波エネルギーのフェンスが生まれます。このフェンスはタイベリウムがその先へ成長するのを防ぎます。また、成長にも影響し、フェンスに阻まれたタイベリウムは50%減って、元のノードに近い側のタイルに置かれます。
menu_MARV=[item=tiberium-marv]MARV
title_MARV=マンモス装甲回収車両
MARV=MARVはタイベリウムに対する究極の兵器です。鉱石の上を走るだけで地面を一掃し、タイベリウムの一部をインベントリに採取しながら、燃料も補給します。
menu_weaponry=タイベリウム兵器
title_weaponry=タイベリウム兵器
weaponry=このMODには、タイベリウム技術にもとづく兵器がいくつかあります。タイベリウムは爆発性があるのでミサイルに使われ、イオン化しやすいためイオン粒子ビームにも最適です。
menu_ion_projector=[item=tiberium-obelisk-of-light]光のオベリスク
title_ion_projector=光のオベリスク
ion_projector=この高出力レーザーは、長距離の部隊や兵器を効果的に破壊します。ゲーム内で最も強力な固定兵器です。ただし再充電に時間がかかるため、基地を守る唯一の兵器にはできません。発電所が損傷するとオベリスクは停止したままになるので、建設する前に十分な余剰電力を確保してください。
menu_tiberium_missiles=[item=tiberium-rocket]タイベリウムミサイル兵器
title_tiberium_missiles=タイベリウムミサイル兵器
tiberium_missiles=このMODには、タイベリウムの爆発力を利用した2種類のミサイル兵器があります。1つ目は単に強化されたミサイルで、通常のミサイルに加えてタイベリウムダメージを与えます。もう1つは液体タイベリウム爆弾で、バニラの原子爆弾より範囲が広く、ダメージも大きくなっています。
