[entity-description]
tiberium-power-plant=液体タイベリウムを消費して電気エネルギーを生み出します。
tibGrowthNode_infinite=スパイクを打ち込まれ、もうタイベリウムを拡散しなくなったタイベリウムノードです。タイベリウムスパイクを使えば、まだ資源を取り出せます。
tiberium-srf-emitter=2つのハブの間に最大長15の「フェンス」を維持できる音波反発フィールド発生装置です。フィールドの維持には0.5 MWの電力が必要です。
tiberium-srf-wall=タイベリウム以外には無害な音波反発フィールドです。空気中の微量のタイベリウム粒子が分解されるとき、青く光ります。
tiberium-sonic-emitter=共振周波数を使って周囲のタイベリウム鉱石を粉砕する音波砲です。バイターは攻撃しません。
tiberium-sonic-emitter-blue=共振周波数を使って周囲のブルータイベリウム鉱石だけを粉砕する音波砲です。バイターは攻撃しません。
tiberium-spike=自己完結型・自己給電型の溶融タイベリウム抽出装置です。その場で精製し、それ以上の成長を防ぎます。
tiberium-detonation-charge=タイベリウムのブロッサムツリーに設置し、射撃武器で起爆すると、鉱脈を永久に破壊して今後のタイベリウムの成長を止めます。
tiberium-growth-accelerator=タイベリウム基質を少しずつ消費して、設置したタイベリウムノードからのタイベリウムの成長を促進します。
tiberium-growth-accelerator-node=タイベリウム基質を少しずつ消費して、設置したタイベリウムノードからのタイベリウムの成長を促進します。
tiberium-monoculture-green=大型の浄化装置です。タイベリウムノードに設置して電力を供給すると、周囲にはグリーンタイベリウムしか成長しなくなります。
tiberium-monoculture-blue=大型の浄化装置です。タイベリウムノードに設置して電力を供給すると、周囲にはブルータイベリウムしか成長しなくなります。
tiberium-reprocessor=使わない鉱石をタイベリウム基質にリサイクルするための施設です。化学プラントのレシピと同じ比率で動作しますが、すべての鉱石を1つの施設で処理できます。
tiberium-network-node=広い範囲のタイベリウム鉱石をすばやく採取します。
tiberium-node-harvester=タイベリウムノードから直接タイベリウム鉱石をすばやく採取します。枯渇したタイベリウムノードは永久に取り除けます。
tiberium-centrifuge-0=タイベリウムとの接触に耐えるよう強化された、原始的な燃料式の遠心分離機です。タイベリウムを成分に分離します。
tiberium-centrifuge-1=タイベリウムとの接触に耐えるよう強化された遠心分離機です。タイベリウムを成分に分離します。
tiberium-centrifuge-2=タイベリウムとの接触に耐えるよう強化された、改良型の遠心分離機です。タイベリウムを成分に分離します。
tiberium-centrifuge-3=タイベリウムとの接触に耐えるよう強化された、ハイテクな遠心分離機です。タイベリウムを成分に分離します。
tiberium-marv=低速で重装甲の車両です。走り抜けるだけでタイベリウム鉱石の原野を破壊できます。
tiberium-aoe-node-harvester=周囲にある複数のタイベリウムノードから直接タイベリウム鉱石をすばやく採取します。枯渇したタイベリウムノードは永久に取り除けます。
tiberium-control-node=タイベリウム制御ネットワークのノードで、周囲のタイベリウム専用の採掘装置を強化します。採掘機は周囲の最大3つのTCNノードによって強化でき、それぞれ速度と消費電力が上がります。TCNノードの影響を受けた採掘機は、さらに5MWの電力を必要とします。
tiberium-control-node-hidden-beacon=TCNビーコンの影響を受けた採掘機にかかる一定のエネルギーコストです。
tiberium-advanced-guard-tower=トマホークミサイルランチャーから一斉にミサイルを撃ち出す、多用途の防衛施設です。シェパード将軍は原子爆弾を装填しないよう強く求めています。
tiberium-obelisk-of-light=Nod教団の極めて強力なレーザー兵器で、毎回の射撃の前にコンデンサーを充電する時間が必要です。
