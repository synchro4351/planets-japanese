[technology-description]
panglia_planet_discovery_panglia=パングリアはグレバの奇妙で緑豊かな衛星です。植物から得られるエネルギー、増殖する不思議な物質、そして時間が不自然にゆがむ場所が見つかります。
panglia_branbalite_slurry=栄養価の非常に高い植物です。
panglia_branbalite_slurry_to_crudeoil=ブランバライトを原油に変えます。
panglia_panglite_multiplication=パングライトは、加熱すると際限なく膨張する異星の合金です。
panglia_panglite_fiber=熱を加えると自己修復する性質を持つ、非常に頑丈で用途の広い素材です。
panglia_panglite_glass=パングライトとガラスを薄く重ねることで、レーザーの屈折を利用して微細なスケールで作業できるようになります。
panglia_advanced_optics_nanotech=パングライトガラスを使い、ゲノムのような分子レベルの要素を読み取り、書き換えられる機械を作ります。
panglia_dna_manipulation=独自のDNAを作り、新たな生物を誕生させます。
panglia_simulation_chamber=生物を仮死に近い状態で保管します。
panglia_simulation_matrix=生物を完全な仮想現実につなぎ、架空の一生をまるごと送らせます。
panglia_sentient_processor=意識をコンピュータにアップロードします。生物とAIの組み合わせは、最も完成された演算能力かもしれません。

panglia_worker-robots-speed=内部回路を全面的に作り直し、ロボットをさらに速くします。
panglia_worker-robots-storage=アイテムをより賢くつかんで運べるようにし、ロボットの積載量を増やします。
panglia_crusher=あらゆる素材を非常に細かい複合粉末に砕きます。
panglia_igneous_rock_to_lava=火成岩を溶かして溶岩にします。
panglia_tech_timewarp_data=時間歪曲ポケットから[font=moshine-data][color=#d699ff]time_flow.data[/color][/font]を集め、時間の流れに干渉する方法を探ります。
panglia_tech_timewarp_data_nocolor=時間歪曲ポケットからtime_flow.dataを集め、時間の流れに干渉する方法を探ります。

