[tips-and-tricks-item-name]
tenebris-briefing=テネブリスの概要

[tips-and-tricks-item-description]
tenebris-briefing=[planet=tenebris]は永遠の闇に包まれた惑星です。太陽光発電は役に立たず、暗視も効きません。惑星にはムカデがはびこっています。強くて毒を持っていますが、行く手をふさがない限り襲ってはきません。この惑星の動力は[item=luciferin]です。この化合物を使うと、動くのに電力を必要としない発光機械を作れます。カーゴポッドはこの惑星に着陸しようとすると航行に失敗することがあります。ここで研究する技術で何とかできるかもしれません。\n\n[entity=bioinfusor]を使って機械をバイオインフューズし、発光の性質を持たせると、電力なしで動かせるようになります。

