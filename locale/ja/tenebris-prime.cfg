[mod-name]
tenebris-prime=○🌐テネブリス・プライム

[mod-description]
tenebris-prime=○🌐新しい惑星テネブリスを追加します。濃い酸性の大気に包まれた暗い惑星です。元の Tenebris MOD のフォーク版です。

[space-location-name]
tenebris=テネブリス

[space-location-description]
tenebris=光を吸収する濃い大気のせいで、常に影に包まれた謎めいた暗い惑星。日の光がない環境で育つ発光性の動植物が地表をわずかに照らし、紫や深い青に染まった風景にかすかな光を落としている。テネブリスは過酷で不可解な世界であり、果てしない闇の中で生き延びるには技術と光が欠かせない。

