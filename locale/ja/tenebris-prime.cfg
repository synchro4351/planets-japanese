[item-description]
luciferin=やわらかな青緑色の光を放つ発光性の粉末。高度なエネルギーや光の用途に使われる。
lucifunnel=繊細な漏斗状の葉から幻想的な青緑色の光を放つ発光植物。巻きひげと入り組んだ葉の模様が、暗闇の中で海中のサンゴや異星の植物を思わせる魅惑的な光景をつくり出す。ルシファネルは光の少ない環境でよく育ち、ほのかで幽玄な光を放って夜行性の送粉者を引き寄せ、神秘的な輝きで周囲を照らす。
lucifunnel-seed=やわらかな青緑色の光を放つ、希少な光る種。発光植物の栽培に欠かせない。
quartz-ore=ごつごつした土の鉱床で見つかる、光沢のある結晶状の鉱物。クラフトや工業用途で重宝される。
quartz-crystal=鋭い面を持つ透明なガラス質の鉱物。美しさと耐久性から、クラフトや工業で重宝される。
chitin=外骨格から得られる、丈夫な層状の素材。強靭さと耐久性で知られる。
tenecap=くすんだ茶色のキノコ。
tenecap-spore=テネキャップから採れた胞子の小さな束。
chitosan=キチンから精製した軽い素材。柔軟性と耐久性で知られる。
biobeacon=生物発光の力を宿したビーコン。通常のビーコンが受け付けるモジュールに加えて、[item=productivity-module]も受け付ける。

