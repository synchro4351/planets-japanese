[mod-setting-description]
ultimateCoreLib_override=ほかの設定に関係なく、Ultimate Fixed Mods のランタイムステージのコントロールをすべて有効化または無効化します。無効にすると UPS の消費は 0 になり、イベントは発生しなくなります。
umr_quantum_teleporter_meltdown=このコントロールはメッセージがほとんど出ないため、メッセージ表示の設定はありません。サーフェスごとの設置上限を監視します。
umr_show_startup_messages=メッセージがやや多めです。セーブデータの読み込みやMODの更新のあとも UMR のコントロールが動いているか確認するために使います。
umr_detailed_reporting=コアが多いとメッセージが大量に出ることがあります。主にデバッグで、正しく動いているか確認するために使います。
ufp_show_startup_messages=メッセージがやや多めです。セーブデータの読み込みやMODの更新のあとも UFP のコントロールが動いているか確認するために使います。
ufp_detailed_reporting=加熱炉が多いとメッセージが大量に出ることがあります。主にデバッグで、正しく動いているか確認するために使います。
ufp_neutrino_detector_researcher=このコントロールはメッセージがほとんど出ないため、メッセージ表示の設定はありません。サーフェスごとの設置上限を監視します。ニュートリノ研究能力は UPS への負荷が比較的大きく、検出器 1000 基でスキャン完了時にどんな研究でも完了できますが、その負荷はバニラのレーダー[entity=radar]約 500 基分に相当します。電力が供給されていない検出器は UPS を消費しません。
ufp_pocket_dimension=このコントロールはメッセージがほとんど出ないため、メッセージ表示の設定はありません。テレポートの操作と、勢力ごとのサーフェス作成を監視します（チーム系のMODでは各チームにサーフェスが1つずつ作られます）。チーム用のサーフェスは自動で作られます。作成時には大きなラグが発生しますが、その後の UPS 消費はありません。安全な足場は 1500x1500 の広さで、その外側には敵がいることがあります。資源はなく、生産物を出し入れする手段もないため、UMR MOD の併用をおすすめします。
ufp_pocket_dimension_size=この設定を変えると、現在の UFP ポケット次元は破壊され、ゲーム内で間もなく新しいものが作られます。「無効化」を選ぶと現在のサーフェスが削除され、新しいものは作られなくなります。MODをアンインストールする予定があるときに便利です。
abacayba_disable_enemy_friendly_fire=この設定は「enemy」勢力全体に働くため、アバカイバだけが対象ではありません。範囲攻撃による敵同士の攻撃はまれに起きますが、UPS の節約のために有効化をおすすめします。
abacayba_spawn_enemies=不吉なサイエンスパックを研究すると、2秒ごとにすべてのチャンクを調べ、子孫を生み出そうとします。生み出されるのは、プレイヤーの建造物も敵の巣もないチャンクだけです。安全範囲はないため、32x32 のチャンクすべてに建物を最低1つ置いておく必要があります。[entity=small-electric-pole] 1本でもかまいません。UPS 節約のため、マップ化済みのサーフェスだけを1回ずつ調べます。ほかの惑星での攻撃を有効にするには、マップ設定を確認してください。
abacayba_show_startup_messages=メッセージがやや多めです。セーブデータの読み込みやMODの更新のあともアバカイバのコントロールが動いているか確認するために使います。
abacayba_detailed_reporting=メッセージが非常に多く出ます。主にデバッグで、正しく動いているか確認するために使います。
abacayba_deconstructor_detailed_reporting=メッセージはほとんど出ません。どの車両やプレイヤーがアイテムに解体の印を付けられるかを確認するのに便利です。
