[technology-name]
squeeze-coconut=ココナッツの空気圧プレス
asteroid-squeezing=アステロイドの破片の空気圧処理
[technology-description]
squeeze-coconut=ココナッツから油を絞り出し、固形物を残さない方法を学びます。無駄は多いですが、非常に高速です。
asteroid-squeezing=アステロイドの破片処理の最終段階、思いきり絞る方法を習得します。無駄は多いですが、非常に高速です。
[mod-setting-name]
balanced-mode=バランスモード
[mod-setting-description]
balanced-mode=バランスモード: 厳選されたレシピのみ。アンバランスモード: 何でもありの大混乱。大量のレシピが追加され、その多くは非常に強力です。
[tips-and-tricks-item-name]
asteroid-squeezing=[item=carbonic-asteroid-chunk] アステロイドの圧搾
[tips-and-tricks-item-description]
fluid-recycler=[entity=fluid-recycler]を使うと、さまざまな製品から液体の材料を絞り出せます。[item=raw-fish]、[item=explosives]、[item=pentapod-egg]から[fluid=water]を、[item=battery]や[item=processing-unit]から[fluid=sulfuric-acid]を絞り出すことができます。
asteroid-squeezing=[entity=fluid-recycler]を使うと、アステロイドの破片や氷を高圧で液化できます。この処理は高速ですが無駄が多くなります。\n[item=metallic-asteroid-chunk]からは[fluid=molten-iron]が得られます。\n[item=carbonic-asteroid-chunk]からは[fluid=crude-oil]が得られます。\n[item=oxide-asteroid-chunk]と[item=ice]からは[fluid=water]が得られます。
