[technology-name]
squeeze-coconut=ココナッツの空気圧プレス
asteroid-squeezing=小惑星の破片の空気圧処理
fluid-recycler=液体リサイクル
[technology-description]
squeeze-coconut=ココナッツから油を絞り出し、固形物を残さない方法を学びます。無駄は多いですが、非常に高速です。
asteroid-squeezing=小惑星の破片処理の最終段階、思いきり絞る方法を習得します。無駄は多いですが、非常に高速です。
fluid-recycler=フルゴラで何時間もかけて大量のスクラップをふるい分けた多くの教訓から、ものを液体へリサイクルする最も効率的な方法を編み出しました。思いきり絞ることです。液体リサイクルでは、投入した液体の25%が戻り、アイテムはすべて粉砕されます。
[mod-setting-name]
balanced-mode=バランスモード
[mod-setting-description]
balanced-mode=バランスモード: 厳選されたレシピのみ。アンバランスモード: 何でもありの大混乱。大量のレシピが追加され、その多くは非常に強力です。
[tips-and-tricks-item-name]
fluid-recycler=[entity=fluid-recycler] 液体リサイクラー
asteroid-squeezing=[item=carbonic-asteroid-chunk] 小惑星の圧搾
[tips-and-tricks-item-description]
fluid-recycler=[entity=fluid-recycler]を使うと、さまざまな製品から液体の材料を絞り出せます。[item=raw-fish]、[item=explosives]、[item=pentapod-egg]から[fluid=water]を、[item=battery]や[item=processing-unit]から[fluid=sulfuric-acid]を絞り出すことができます。
asteroid-squeezing=[entity=fluid-recycler]を使うと、小惑星の破片や氷を高圧で液化できます。この処理は高速ですが無駄が多くなります。\n[item=metallic-asteroid-chunk]からは[fluid=molten-iron]が得られます。\n[item=carbonic-asteroid-chunk]からは[fluid=crude-oil]が得られます。\n[item=oxide-asteroid-chunk]と[item=ice]からは[fluid=water]が得られます。
